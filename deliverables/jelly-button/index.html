<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>果冻按钮 · Jelly Button</title>
<style>
/* ============================================================
   基础布局：舞台居中，按钮上方是状态机读数，下方是音效开关。
   所有形变都由 JS 写入 CSS 变量，CSS 只负责“材质”。
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  display: grid;
  place-items: center;
  overflow: hidden;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  background:
    radial-gradient(120% 90% at 50% 0%, #fdf3ec 0%, #f6e7ee 45%, #ece2f4 100%);
  color: #5b4a56;
  -webkit-tap-highlight-color: transparent;
}

.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 34px;
  user-select: none;
  -webkit-user-select: none;
}

/* ---------- 状态读数（idle / pressing / charging / releasing / settling） ---------- */
.status {
  display: flex;
  align-items: baseline;
  gap: 12px;
  font-size: 13px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #7d6577;
}
.status b {
  font-family: ui-monospace, Consolas, monospace; /* ignore-value design-system-font "cascadia code" */
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .12em;
  color: #6d5566;
  min-width: 9ch;
  transition: color .2s;
}
.status[data-state="charging"] b { color: #d9548c; }
.status[data-state="releasing"] b { color: #8a5cd6; }
.status .charge-meter {
  width: 64px; height: 4px;
  border-radius: 2px;
  background: rgba(120, 90, 110, .12);
  overflow: hidden;
  align-self: center;
}
.status .charge-meter i {
  display: block; height: 100%; width: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #ff9db8, #c86dd7);
  transform-origin: left center;
  transform: scaleX(var(--charge, 0));
}

/* ---------- 按钮容器：环境阴影、蓄力光环、涟漪都挂在这一层 ---------- */
.jelly-wrap {
  position: relative;
  /* JS 每帧写入的形变通道 */
  --sx: 1;          /* 水平缩放（体积守恒的另一半） */
  --sy: 1;          /* 垂直缩放 */
  --ty: 0px;        /* 下压位移 */
  --skew: 0deg;     /* 余震剪切晃动 */
  --depth: 0;       /* 0..1 挤压深度：颜色变深、高光收缩 */
  --charge: 0;      /* 0..1 蓄力进度 */
  --hx: 50%;        /* 镜面高光位置（跟随指针） */
  --hy: 32%;
  --halo-o: 0;      /* 蓄力光环透明度 */
  --halo-s: .9;     /* 蓄力光环扩散比例 */
  --glow: 0;        /* 释放瞬间的亮度脉冲 */
}

/* 底部柔和环境阴影：随下压收紧变实，随回弹拉宽变虚 */
.jelly-shadow {
  position: absolute;
  left: 50%; bottom: -26px;
  width: 78%; height: 26px;
  transform: translateX(-50%) scaleX(calc(var(--sx) * (1 + var(--depth) * .06)));
  border-radius: 50%;
  background: radial-gradient(50% 50% at 50% 50%,
    rgba(140, 70, 110, calc(.30 + var(--depth) * .18)) 0%,
    rgba(140, 70, 110, 0) 70%);
  filter: blur(6px);
  pointer-events: none;
}

/* 蓄力柔光环：按住期间缓慢扩散呼吸 */
.jelly-halo {
  position: absolute;
  inset: -18px;
  border-radius: 48px;
  opacity: var(--halo-o);
  transform: scale(var(--halo-s));
  background: radial-gradient(60% 60% at 50% 50%,
    rgba(255, 130, 180, .0) 40%,
    rgba(255, 130, 180, .35) 62%,
    rgba(200, 110, 220, .18) 78%,
    rgba(200, 110, 220, 0) 100%);
  filter: blur(10px);
  pointer-events: none;
}

/* ---------- 果冻本体 ---------- */
.jelly {
  position: relative;
  width: 240px;
  height: 96px;
  border: none;
  outline: none;
  cursor: pointer;
  border-radius: 34px;
  touch-action: none;               /* 触摸按压不触发页面滚动/缩放手势 */
  transform-origin: 50% 88%;        /* 以底边为支点：下压像被按在桌面上 */
  transform:
    translateY(var(--ty))
    skewX(var(--skew))
    scale(var(--sx), var(--sy));
  will-change: transform;

  /* 多层渐变模拟胶体：
     ① 顶部线性透光  ② 内部径向折射亮核  ③ 底部深色沉积  ④ 基色 */
  background:
    linear-gradient(180deg,
      rgba(255,255,255,.55) 0%,
      rgba(255,255,255,.12) 26%,
      rgba(255,255,255,0) 46%),
    radial-gradient(90% 120% at 30% 115%,
      hsla(calc(340 - var(--depth) * 14), 85%, calc(58% - var(--depth) * 16%), .85) 0%,
      hsla(340, 85%, 58%, 0) 60%),
    radial-gradient(120% 150% at 72% -30%,
      hsla(22, 100%, calc(82% - var(--depth) * 12%), .9) 0%,
      hsla(22, 100%, 82%, 0) 55%),
    linear-gradient(165deg,
      hsl(calc(18 + var(--charge) * 6), calc(96% + var(--charge) * 4%), calc(76% - var(--depth) * 14%)) 0%,
      hsl(calc(345 - var(--depth) * 10), calc(88% + var(--charge) * 10%), calc(68% - var(--depth) * 16%)) 55%,
      hsl(calc(322 - var(--depth) * 12), calc(80% + var(--charge) * 12%), calc(60% - var(--depth) * 18%)) 100%);
  background-color: hsl(345, 88%, 68%);

  /* 边缘高光描边 + 内发光厚度 + 外投影 */
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.85),           /* 顶缘亮线 */
    inset 0 -3px 6px rgba(160, 30, 90, calc(.35 + var(--depth) * .25)), /* 底缘暗折射 */
    inset 2px 0 4px rgba(255,255,255,.28),
    inset -2px 0 4px rgba(255,255,255,.22),
    inset 0 0 18px rgba(255, 190, 210, calc(.35 + var(--glow) * .5)),   /* 体内透光 */
    0 10px 24px rgba(214, 80, 140, calc(.28 + var(--depth) * .1)),
    0 2px 6px rgba(214, 80, 140, .22);

  font-size: 21px;
  font-weight: 700;
  letter-spacing: .3em;
  text-indent: .3em;
  color: #fff;
  text-shadow: 0 1px 2px rgba(170, 40, 100, .45), 0 0 12px rgba(255,255,255,.35);
}
.jelly:focus-visible {
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.85),
    inset 0 -3px 6px rgba(160,30,90,.35),
    0 0 0 3px rgba(255,255,255,.9),
    0 0 0 6px rgba(214, 80, 140, .5),
    0 10px 24px rgba(214, 80, 140, .28);
}

/* 镜面高光：跟随指针的椭圆亮斑，按压时收缩变亮（--spec-r/--spec-o 由 JS 控制） */
.jelly::before {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 31px;
  pointer-events: none;
  background:
    radial-gradient(
      calc(var(--spec-r, 46%) * 1.15) var(--spec-r, 46%)
      at var(--hx) var(--hy),
      rgba(255,255,255, var(--spec-o, .75)) 0%,
      rgba(255,255,255, calc(var(--spec-o, .75) * .35)) 38%,
      rgba(255,255,255,0) 72%);
  mix-blend-mode: screen;
}

/* 顶部弧形反光条：果冻“表皮”的第二道静态高光，增加厚度感 */
.jelly::after {
  content: "";
  position: absolute;
  left: 12%; right: 12%; top: 7%;
  height: 30%;
  border-radius: 50% 50% 46% 46% / 90% 90% 60% 60%;
  pointer-events: none;
  background: linear-gradient(180deg,
    rgba(255,255,255,.65) 0%,
    rgba(255,255,255,.08) 80%,
    rgba(255,255,255,0) 100%);
  opacity: calc(.9 - var(--depth) * .35);
  transform: scaleY(calc(1 - var(--depth) * .3));
  transform-origin: top center;
}

/* ---------- 释放涟漪环 & 表面波纹（JS 动态创建，动画结束即移除） ---------- */
.ring {
  position: absolute;
  left: 50%; top: 50%;
  width: 250px; height: 110px;
  margin: -55px 0 0 -125px;
  border-radius: 40px;
  border: 3px solid rgba(255, 140, 190, .8);
  pointer-events: none;
  animation: ring-out var(--dur, 620ms) cubic-bezier(.17,.67,.35,1) forwards;
}
@keyframes ring-out {
  0%   { transform: scale(.82); opacity: .9; border-width: 3px; }
  100% { transform: scale(var(--ring-scale, 1.6)); opacity: 0; border-width: 1px; }
}

.particle {
  position: absolute;
  width: 9px; height: 9px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle at 35% 30%, #fff, var(--pc, #ff9dc0) 60%);
  animation: particle-fly var(--dur, 640ms) cubic-bezier(.15,.6,.4,1) forwards;
}
@keyframes particle-fly {
  0%   { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
}

/* 表面晃动波纹：一条掠过的斜向亮带，模拟胶体内部的震荡折射 */
.wobble-wave {
  position: absolute;
  inset: 3px;
  border-radius: 31px;
  overflow: hidden;
  pointer-events: none;
}
.wobble-wave i {
  position: absolute;
  top: -20%; bottom: -20%;
  width: 46%;
  left: -50%;
  background: linear-gradient(100deg,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.5) 50%,
    rgba(255,255,255,0) 100%);
  transform: skewX(-14deg);
  animation: wave-sweep var(--dur, 520ms) ease-out forwards;
}
@keyframes wave-sweep {
  0%   { left: -50%; opacity: .9; }
  100% { left: 110%; opacity: 0; }
}

/* ---------- 音效开关 ---------- */
.sound-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: none;
  background: rgba(255,255,255,.55);
  border-radius: 999px;
  padding: 9px 18px;
  font-size: 14px;
  color: #7c6474;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(160,110,140,.18), 0 2px 8px rgba(160,110,140,.12);
  transition: background .2s;
}
.sound-toggle:hover { background: rgba(255,255,255,.8); }
.sound-toggle .dot {
  width: 30px; height: 17px;
  border-radius: 999px;
  background: #d8c3cf;
  position: relative;
  transition: background .2s;
}
.sound-toggle .dot::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 13px; height: 13px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: transform .2s;
}
.sound-toggle[aria-pressed="true"] .dot { background: #e56aa2; }
.sound-toggle[aria-pressed="true"] .dot::after { transform: translateX(13px); }

.hint { font-size: 12px; color: #7d6577; letter-spacing: .06em; }

/* ---------- prefers-reduced-motion：关掉一切形变与粒子，只留淡入淡出 ---------- */
@media (prefers-reduced-motion: reduce) {
  .jelly { transform: none !important; transition: filter .18s ease, opacity .18s ease; }
  .jelly.rm-active { filter: brightness(.88) saturate(1.15); }
  .jelly-shadow, .jelly-halo, .ring, .particle, .wobble-wave { display: none !important; }
  .status .charge-meter i { transition: transform .18s ease; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="status" id="status" data-state="idle">
    <span>state</span><b id="stateText">idle</b>
    <span class="charge-meter"><i id="chargeMeter"></i></span>
  </div>

  <div class="jelly-wrap" id="wrap">
    <div class="jelly-halo"></div>
    <div class="jelly-shadow"></div>
    <button class="jelly" id="jelly" type="button" aria-label="果冻按钮">啵 一 下</button>
  </div>

  <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true">
    <span class="dot"></span><span id="soundLabel">音效开</span>
  </button>

  <p class="hint">按住蓄力，松开看回弹 · 按得越久弹得越猛</p>
</div>

<script>
"use strict";
/* ============================================================
   全部可调参数集中在这里。
   弹簧单位：x 为归一化形变量，k 刚度 / c 阻尼（临界阻尼 ≈ 2√k）。
   ============================================================ */
const CONFIG = {
  press: {
    squashY: 0.86,        // 按下瞬间垂直压缩到的比例
    stretchX: 1.10,       // 水平拉伸（近似体积守恒 sx*sy≈常数）
    sinkPx: 7,            // 下压位移
    k: 900, c: 42,        // 快速下压弹簧：高刚度、接近临界阻尼 → 干脆利落
  },
  charge: {
    fullMs: 1600,         // 蓄满所需按住时长
    enterMs: 140,         // 按住超过该时长进入 charging 状态
    breathAmp: 0.016,     // 呼吸形变幅度
    breathHz: 2.6,        // 呼吸频率
    jitterAmp: 0.006,     // 高频微抖幅度
    jitterHz: 13,
    extraSquash: 0.05,    // 蓄满时额外压缩量
    haloMaxOpacity: 0.9,
  },
  release: {
    k: 340,               // 回弹弹簧刚度：低刚度 → 明显过冲
    cBase: 11,            // 基础阻尼（欠阻尼 → 振荡）
    cPerCharge: 5,        // 蓄力越久阻尼略增，但初速更大 → 振幅更大
    impulseBase: 5.2,     // 释放冲量（弹簧初速度）
    impulsePerCharge: 9.5,// 蓄力对冲量的加成 —— 0.2s 与 2s 差异的来源
    overshootClamp: 0.42, // 过冲上限（防止极端拉伸穿帮）
    freqDecay: 0.55,      // 振荡频率随时间下降系数（频率略降）
    settleEps: 0.004,     // |x|+|v| 低于此值判定静止
  },
  wobble: {
    shearAmp: 2.4,        // 余震剪切角幅度（度）
    shearHz: 5.2,         // 余震频率
    decay: 6.5,           // 指数衰减率 → ~600ms 内消失
    waves: 2,             // 表面波纹次数
    waveGapMs: 150,       // 两道波纹间隔
  },
  ripple: {
    ringsBase: 1, ringsCharged: 2,   // 涟漪环数量随蓄力增加
    particlesBase: 6, particlesPerCharge: 10,
    scaleBase: 1.45, scalePerCharge: 0.55,
    durBase: 560, durPerCharge: 220,
  },
  spec: {
    idleR: 46, pressR: 24,           // 高光半径：按压收缩
    idleO: 0.72, pressO: 0.98,       // 高光亮度：按压变亮
    lerp: 0.22,                      // 高光跟随指针的平滑系数
  },
  audio: {
    pressFreq: 300, releaseFreqBase: 430, releaseFreqPerCharge: 260,
    gain: 0.22,
  },
};

const wrap   = document.getElementById("wrap");
const jelly  = document.getElementById("jelly");
const statusEl = document.getElementById("status");
const stateText = document.getElementById("stateText");
const chargeMeter = document.getElementById("chargeMeter");
const soundToggle = document.getElementById("soundToggle");
const soundLabel = document.getElementById("soundLabel");

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

/* ============================================================
   状态机：idle → pressing → charging → releasing → settling → idle
   - pressing：pointerdown 后的快速下压段
   - charging：按住超过 enterMs，开始蓄力
   - releasing：松手后的过冲主段（弹簧第一次穿越静止点前后）
   - settling：过冲之后的阻尼余震段
   ============================================================ */
let state = "idle";
let pressStart = 0;          // pointerdown 时间戳
let charge = 0;              // 0..1 蓄力进度
let releaseAt = 0;           // 松手时间戳
let releasedCharge = 0;      // 松手瞬间锁定的蓄力值
let crossedZero = false;     // 弹簧是否已第一次穿越静止点（用于 releasing→settling）

// 主弹簧：x=0 静止；x<0 压缩；x>0 拉伸过冲
let x = 0, v = 0;
let springK = CONFIG.press.k, springC = CONFIG.press.c;
let target = 0;

// 高光平滑跟随
let specX = 50, specY = 32, specTX = 50, specTY = 32;
let specR = CONFIG.spec.idleR, specO = CONFIG.spec.idleO;

// 余震（独立于主弹簧的衰减剪切振荡）
let wobbleT = Infinity;
let wobbleAmp = 0;

let activePointerId = null;
let rafId = null;
let lastT = 0;

function setState(s) {
  if (state === s) return;
  state = s;
  stateText.textContent = s;
  statusEl.dataset.state = s;
}

/* ============================================================
   Web Audio：合成短促「啵」声。
   正弦波音高快速下滑 + 一小段带通噪声做“湿润”的气泡质感。
   按下音低而闷，释放音高随蓄力上扬。
   ============================================================ */
let audioCtx = null;
let soundOn = true;

function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function pop(freq, dur, bright) {
  if (!soundOn || !audioCtx) return;
  const t0 = audioCtx.currentTime;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(CONFIG.audio.gain * (0.7 + bright * 0.5), t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  g.connect(audioCtx.destination);

  // 主体：音高从 freq*1.6 滑落到 freq*0.55 → 「啵」的下坠感
  const osc = audioCtx.createOscillator();
  osc.type = "sine";
  osc.frequency.setValueAtTime(freq * 1.6, t0);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.55, t0 + dur * 0.8);
  osc.connect(g);
  osc.start(t0); osc.stop(t0 + dur);

  // 湿润层：极短带通噪声，模拟气泡破裂的“啪”边缘
  const nLen = Math.floor(audioCtx.sampleRate * 0.03);
  const buf = audioCtx.createBuffer(1, nLen, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < nLen; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / nLen);
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const bp = audioCtx.createBiquadFilter();
  bp.type = "bandpass"; bp.frequency.value = freq * 3; bp.Q.value = 2.5;
  const ng = audioCtx.createGain(); ng.gain.value = 0.10 + bright * 0.12;
  noise.connect(bp); bp.connect(ng); ng.connect(g);
  noise.start(t0);
}

soundToggle.addEventListener("click", () => {
  soundOn = !soundOn;
  soundToggle.setAttribute("aria-pressed", String(soundOn));
  soundLabel.textContent = soundOn ? "音效开" : "音效关";
  if (soundOn) { ensureAudio(); pop(520, 0.09, 0.4); }
});

/* ============================================================
   指针交互（Pointer Events 同时覆盖鼠标 / 触摸 / 触控笔）
   ============================================================ */
function pointerPos(e) {
  const r = jelly.getBoundingClientRect();
  specTX = Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100));
  specTY = Math.min(100, Math.max(0, ((e.clientY - r.top) / r.height) * 100));
}

jelly.addEventListener("pointermove", (e) => {
  pointerPos(e);
  wake();
});
jelly.addEventListener("pointerleave", () => {
  if (activePointerId === null) { specTX = 50; specTY = 32; wake(); }
});

jelly.addEventListener("pointerdown", (e) => {
  if (activePointerId !== null) return;      // 忽略多指
  activePointerId = e.pointerId;
  jelly.setPointerCapture(e.pointerId);
  pointerPos(e);
  ensureAudio();
  pressStart = performance.now();
  charge = 0;
  crossedZero = false;
  wobbleT = Infinity;

  if (reducedMotion.matches) {
    jelly.classList.add("rm-active");
    setState("pressing");
    pop(CONFIG.audio.pressFreq, 0.1, 0.1);
    wake();
    return;
  }

  // 阶段①：切换成快弹簧压向 squash 目标；给一个向下初速让下压更“砸”实
  springK = CONFIG.press.k; springC = CONFIG.press.c;
  target = -(1 - CONFIG.press.squashY);
  v = -2.2;
  setState("pressing");
  pop(CONFIG.audio.pressFreq, 0.1, 0.1);
  wake();
});

function endPress(e, cancelled) {
  if (e.pointerId !== activePointerId) return;
  activePointerId = null;
  const heldMs = performance.now() - pressStart;
  releasedCharge = charge;
  releaseAt = performance.now();
  crossedZero = false;

  if (reducedMotion.matches) {
    jelly.classList.remove("rm-active");
    setState("idle");
    if (!cancelled) pop(CONFIG.audio.releaseFreqBase + releasedCharge * CONFIG.audio.releaseFreqPerCharge, 0.14, releasedCharge);
    charge = 0;
    renderStatic();
    return;
  }

  // 阶段③：换成软弹簧 + 向上冲量。蓄力越久冲量越大 → 过冲越猛。
  const R = CONFIG.release;
  springK = R.k;
  springC = R.cBase + releasedCharge * R.cPerCharge;
  target = 0;
  v = R.impulseBase + releasedCharge * R.impulsePerCharge;

  // 余震剪切振荡启动，幅度随蓄力放大
  wobbleT = 0;
  wobbleAmp = CONFIG.wobble.shearAmp * (0.45 + releasedCharge * 0.9);

  setState("releasing");
  if (!cancelled) {
    pop(CONFIG.audio.releaseFreqBase + releasedCharge * CONFIG.audio.releaseFreqPerCharge,
        0.13 + releasedCharge * 0.08, releasedCharge);
    spawnRipple(releasedCharge);
    spawnWaves(releasedCharge);
  }
  wake();
}
jelly.addEventListener("pointerup", (e) => endPress(e, false));
jelly.addEventListener("pointercancel", (e) => endPress(e, true));

// 键盘可达性：空格/回车模拟一次 0.35s 的按压
let keyHeld = false;
jelly.addEventListener("keydown", (e) => {
  if ((e.key === " " || e.key === "Enter") && !keyHeld && activePointerId === null) {
    keyHeld = true;
    jelly.dispatchEvent(new PointerEvent("pointerdown", { pointerId: -1, clientX: 0, clientY: 0, bubbles: true }));
    // setPointerCapture 对合成 id 会抛错，包一层
  }
});
jelly.addEventListener("keyup", (e) => {
  if ((e.key === " " || e.key === "Enter") && keyHeld) {
    keyHeld = false;
    jelly.dispatchEvent(new PointerEvent("pointerup", { pointerId: -1, bubbles: true }));
  }
});
// 合成 pointerId=-1 时跳过 capture
const origCapture = jelly.setPointerCapture.bind(jelly);
jelly.setPointerCapture = (id) => { if (id >= 0) { try { origCapture(id); } catch (_) {} } };

/* ============================================================
   释放特效：涟漪环 + 糖粒粒子 + 表面波纹。
   DOM 元素挂 animationend 自清理，不占用 rAF 主循环。
   ============================================================ */
function autoRemove(el) {
  el.addEventListener("animationend", () => el.remove(), { once: true });
}

function spawnRipple(c) {
  const P = CONFIG.ripple;
  const rings = c > 0.45 ? P.ringsCharged : P.ringsBase;
  for (let i = 0; i < rings; i++) {
    const ring = document.createElement("div");
    ring.className = "ring";
    ring.style.setProperty("--ring-scale", (P.scaleBase + c * P.scalePerCharge + i * 0.22).toFixed(2));
    ring.style.setProperty("--dur", Math.round(P.durBase + c * P.durPerCharge + i * 120) + "ms");
    ring.style.animationDelay = (i * 90) + "ms";
    ring.style.opacity = "0";
    ring.addEventListener("animationstart", () => ring.style.opacity = "", { once: true });
    wrap.appendChild(ring);
    autoRemove(ring);
  }
  const n = Math.round(P.particlesBase + c * P.particlesPerCharge);
  const colors = ["#ff9dc0", "#ffc46b", "#c99df0", "#9fe6b0"];
  for (let i = 0; i < n; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    const ang = (i / n) * Math.PI * 2 + Math.random() * 0.6;
    const dist = 70 + c * 70 + Math.random() * 34;
    p.style.left = "50%"; p.style.top = "42%";
    p.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "px");
    p.style.setProperty("--dy", (Math.sin(ang) * dist * 0.62 - 18).toFixed(1) + "px");
    p.style.setProperty("--pc", colors[i % colors.length]);
    p.style.setProperty("--dur", Math.round(520 + c * 240 + Math.random() * 140) + "ms");
    wrap.appendChild(p);
    autoRemove(p);
  }
}

function spawnWaves(c) {
  const W = CONFIG.wobble;
  for (let i = 0; i < W.waves; i++) {
    const wave = document.createElement("div");
    wave.className = "wobble-wave";
    const inner = document.createElement("i");
    inner.style.setProperty("--dur", Math.round(460 + c * 160) + "ms");
    inner.style.animationDelay = (i * W.waveGapMs) + "ms";
    inner.style.opacity = "0";
    inner.addEventListener("animationstart", () => inner.style.opacity = "", { once: true });
    wave.appendChild(inner);
    jelly.appendChild(wave);
    inner.addEventListener("animationend", () => wave.remove(), { once: true });
  }
}

/* ============================================================
   主循环：单个 requestAnimationFrame 驱动全部形变。
   弹簧用半隐式欧拉积分，dt 钳制防后台切回时爆炸。
   ============================================================ */
function wake() {
  if (rafId === null) {
    lastT = performance.now();
    rafId = requestAnimationFrame(tick);
  }
}

function tick(now) {
  rafId = null;
  let dt = (now - lastT) / 1000;
  lastT = now;
  // 钳制单帧步长防爆炸；低帧率环境下用子步积分补足真实时间，动画不慢放
  dt = Math.min(dt, 0.25);

  const P = CONFIG.press, C = CONFIG.charge, R = CONFIG.release, S = CONFIG.spec;
  const holding = activePointerId !== null;
  let busy = false;

  /* ---- 蓄力进度与状态推进 ---- */
  if (holding) {
    const heldMs = now - pressStart;
    charge = Math.min(1, heldMs / C.fullMs);
    if (state === "pressing" && heldMs > C.enterMs) setState("charging");
    // 蓄力越久压得越深一点（持续负载感）
    target = -(1 - P.squashY) - charge * C.extraSquash;
    busy = true;
  }

  /* ---- 弹簧积分（子步长提升数值稳定） ---- */
  if (!reducedMotion.matches) {
    const steps = Math.max(2, Math.ceil(dt / (1 / 120))), h = dt / steps;
    for (let i = 0; i < steps; i++) {
      // 释放段频率随时间略降：k 轻微衰减
      let k = springK;
      if (!holding && (state === "releasing" || state === "settling")) {
        const t = (now - releaseAt) / 1000;
        k = springK * Math.max(0.62, 1 - R.freqDecay * t * 0.35);
      }
      const a = -k * (x - target) - springC * v;
      v += a * h;
      x += v * h;
    }
    // 过冲上限保护
    const clamp = R.overshootClamp;
    if (x > clamp) { x = clamp; v = Math.min(v, 0); }

    /* ---- releasing → settling：第一次穿越静止点后进入余震段 ---- */
    if (state === "releasing" && !crossedZero && x > 0.01 && v < 0) {
      crossedZero = true;
      setState("settling");
    }
    /* ---- settling → idle：能量耗尽 ---- */
    if ((state === "releasing" || state === "settling") &&
        Math.abs(x) < R.settleEps && Math.abs(v) < R.settleEps * 8 &&
        wobbleT > 0.7) {
      x = 0; v = 0;
      setState("idle");
    }
    if (state !== "idle" || holding) busy = true;
  }

  /* ---- 派生形变通道 ---- */
  // 主缩放：x<0 压缩（sy↓ sx↑ 体积守恒），x>0 过冲反向拉伸
  let sy = 1 + x;
  let sx = 1 - x * 0.85;
  let ty = -Math.min(0, x) * (P.sinkPx / (1 - P.squashY));
  let depth = Math.min(1, Math.max(0, -x / (1 - P.squashY + C.extraSquash)));
  let glow = 0;

  // 蓄力呼吸 + 微抖：叠加在主形变上
  if (holding && state === "charging" && !reducedMotion.matches) {
    const t = (now - pressStart) / 1000;
    const amp = C.breathAmp * (0.35 + charge * 0.65);
    sy += Math.sin(t * C.breathHz * Math.PI * 2) * amp;
    sx -= Math.sin(t * C.breathHz * Math.PI * 2) * amp * 0.8;
    sy += Math.sin(t * C.jitterHz * Math.PI * 2 + 1.3) * C.jitterAmp * charge;
  }

  // 余震剪切：指数衰减正弦，~600ms 内消失
  let skew = 0;
  if (wobbleT < 0.7 && !reducedMotion.matches) {
    wobbleT += dt;
    const W = CONFIG.wobble;
    skew = wobbleAmp * Math.exp(-W.decay * wobbleT) *
           Math.sin(wobbleT * W.shearHz * Math.PI * 2);
    busy = true;
  }

  // 释放瞬间的体内亮度脉冲
  if (state === "releasing") {
    glow = Math.max(0, 1 - (now - releaseAt) / 260);
  }

  /* ---- 高光：位置平滑跟随指针，半径/亮度随挤压收缩变亮 ---- */
  specX += (specTX - specX) * S.lerp;
  specY += (specTY - specY) * S.lerp;
  const targetR = S.idleR + (S.pressR - S.idleR) * depth;
  const targetO = S.idleO + (S.pressO - S.idleO) * depth;
  specR += (targetR - specR) * 0.3;
  specO += (targetO - specO) * 0.3;
  if (Math.abs(specTX - specX) > 0.1 || Math.abs(specTY - specY) > 0.1) busy = true;

  /* ---- 蓄力光环：呼吸式缓慢扩散 ---- */
  let haloO = 0, haloS = 0.9;
  if (holding && state === "charging") {
    const t = (now - pressStart) / 1000;
    haloO = C.haloMaxOpacity * charge * (0.75 + 0.25 * Math.sin(t * 1.8 * Math.PI * 2));
    haloS = 0.92 + charge * 0.16 + Math.sin(t * 1.8 * Math.PI * 2) * 0.03;
  }

  /* ---- 写回 CSS 变量（每帧一次批量写入） ---- */
  const st = wrap.style;
  st.setProperty("--sx", sx.toFixed(4));
  st.setProperty("--sy", sy.toFixed(4));
  st.setProperty("--ty", ty.toFixed(2) + "px");
  st.setProperty("--skew", skew.toFixed(3) + "deg");
  st.setProperty("--depth", depth.toFixed(3));
  st.setProperty("--charge", charge.toFixed(3));
  st.setProperty("--glow", glow.toFixed(3));
  st.setProperty("--hx", specX.toFixed(1) + "%");
  st.setProperty("--hy", specY.toFixed(1) + "%");
  st.setProperty("--spec-r", specR.toFixed(1) + "%");
  st.setProperty("--spec-o", specO.toFixed(3));
  st.setProperty("--halo-o", haloO.toFixed(3));
  st.setProperty("--halo-s", haloS.toFixed(3));
  chargeMeter.style.setProperty("--charge", charge.toFixed(3));

  // 空闲即停帧，省电；任何交互通过 wake() 重新点火
  if (busy || holding) {
    rafId = requestAnimationFrame(tick);
  } else if (!holding && state === "idle") {
    charge = 0;
    chargeMeter.style.setProperty("--charge", "0");
  }
}

/* reduced-motion 下的静态渲染（无 rAF 形变） */
function renderStatic() {
  chargeMeter.style.setProperty("--charge", "0");
}

reducedMotion.addEventListener?.("change", () => {
  if (reducedMotion.matches) {
    x = 0; v = 0; wobbleT = Infinity;
    jelly.classList.remove("rm-active");
    wrap.style.cssText = "";
    setState("idle");
  }
});
</script>
</body>
