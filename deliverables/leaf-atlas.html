<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf3ed"><title>叶形观察室 · 翻卡图鉴</title>
<style>
*{box-sizing:border-box} :root{color-scheme:light;--ink:#213f39;--quiet:#526c63;--serif:'Songti SC','STSong','SimSun',Georgia,serif}body{margin:0;color:var(--ink);background:#f4f7f2;font:15px/1.5 'PingFang SC','Microsoft YaHei',sans-serif}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #187969;outline-offset:4px}header,main,footer{width:min(1530px,94%);margin:auto}header{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:35px 6px 23px}h1{font:600 clamp(30px,3.5vw,54px)/1.17 var(--serif);letter-spacing:.04em;margin:0}h1 i{font:italic 400 .44em Georgia,serif;color:#527568;letter-spacing:-.02em;display:inline-block;margin-left:12px}header p{color:var(--quiet);margin:8px 0 0;font-size:14px}nav{display:flex;gap:7px;flex-shrink:0}nav button,.fold{border:1px solid #c5d4ca;border-radius:100px;background:#f9fcf7;padding:9px 15px;font-size:13px;font-weight:600}nav button:first-child{background:#345c50;color:#fff;border-color:#345c50}nav button:disabled{opacity:.48;cursor:default}button:not(:disabled):active{filter:brightness(.95)}main{position:relative;border:1px solid #cbd8cd;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 48% 49%,#cfebd970,transparent 56%),radial-gradient(ellipse at 96% 10%,#d8eceb77,transparent 38%),radial-gradient(#809f8e36 .8px,transparent 1px) 0 0/19px 19px,#edf3eb;box-shadow:inset 0 1px 2px white}#map{position:relative;width:100%;height:clamp(492px,68vh,750px);isolation:isolate}#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}.plate,.total{position:absolute;pointer-events:none;color:#476858;font-size:12px;z-index:4}.plate{top:18px;left:22px;font:italic 16px Georgia,serif}.total{bottom:14px;right:20px;font-variant-numeric:tabular-nums}.node{position:absolute;left:0;top:0;--paint:#b4d9ba;--deep:#497e66;z-index:2}.node.leaf{z-index:1}.node.moving,.node:focus-within{z-index:6}.skin{position:relative;width:100%;height:100%;transform:rotate(var(--tilt,0deg)) scale(var(--elong,1),var(--squash,1));transition:transform .12s ease-out}.tile{display:block;position:relative;width:100%;height:100%;border:0;padding:0;background:none;perspective:850px;border-radius:22px;touch-action:none;user-select:none;cursor:grab;outline-offset:5px}.tile:active{cursor:grabbing}.rotor{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .64s cubic-bezier(.25,.77,.24,1.12);border-radius:inherit}.tile[aria-pressed=true] .rotor{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:inherit;border:1px solid color-mix(in srgb,var(--paint),#557565 19%);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;color:#203f37;background:radial-gradient(ellipse at 25% -15%,#ffffffdc 0,transparent 54%),linear-gradient(147deg,color-mix(in srgb,var(--paint),white 32%),var(--paint) 80%);box-shadow:inset 0 2px 2px #fffffff2,inset 2px 0 4px #ffffff70,inset -2px -4px 6px #486e5c19,0 8px 14px -9px #264e3e88,0 2px 3px #35574414;transition:box-shadow .22s}.face:after{content:'';position:absolute;inset:3px;border:1px solid #ffffff60;border-radius:inherit;pointer-events:none}.back{transform:rotateY(180deg);padding:10px 13px;font-size:14px;line-height:1.55;text-align:left;background:linear-gradient(140deg,#fdfef9,color-mix(in srgb,var(--paint),white 50%))}.back strong{font-size:13px;align-self:flex-start;color:var(--deep)}.back span{align-self:stretch}.face b{font:600 23px/1.35 var(--serif);letter-spacing:.05em}.face em{font:italic 12px Georgia,serif;color:#426253}.specimen{width:78px;height:65px;display:block;overflow:visible;color:var(--deep);filter:drop-shadow(0 3px 2px #3f624226)}.branch .front{gap:1px}.branch .tile{border-radius:24px 29px 21px 26px}.root .tile{border-radius:36% 32% 27% 31% / 27% 30% 28% 28%}.root .front{background:radial-gradient(ellipse at 30% 5%,#efffebcf,transparent 54%),linear-gradient(135deg,#c2e5b5,#95c9a4 78%,#83b79b)}.root .specimen{width:105px;height:89px}.root .face b{font-size:26px}.root .front em{margin-top:6px}.leaf .tile{border-radius:17px}.leaf .front{align-items:flex-start;padding-left:18px;background:radial-gradient(ellipse at 15% 0,#fff9,transparent 55%),linear-gradient(135deg,#fafcf5,color-mix(in srgb,var(--paint),#f9fcf5 64%))}.leaf .face b{font-size:18px}.leaf .front em{font-size:11px;color:#53675e;line-height:1.8}.leaf .back{font-size:13px;line-height:1.43}.fold{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;line-height:22px;padding:0 11px;color:#36574a;background:#f8fbf3;z-index:1}.fold:before{content:'';position:absolute;inset:-4px}.node.closed .skin:before{content:'';position:absolute;inset:6px -2px -4px 2px;background:var(--paint);border:1px solid #9caf9d;border-radius:26px;transform:rotate(3deg)}@media(hover:hover){.tile:hover .front,.tile:hover .back{box-shadow:inset 0 2px 3px white,inset 0 -3px 5px #54765620,0 9px 16px -6px #3f68554d}.tile:hover:not(:active){translate:0 -2px}.fold:hover,nav button:not(:disabled):hover{filter:brightness(.96)}}.tile:active .rotor{scale:1.025 .965}.tile{transition:translate .18s}.tile .rotor{transition-property:transform,scale}.glint{position:absolute;inset:0;pointer-events:none;border-radius:inherit;overflow:hidden}.glint:after{content:'';position:absolute;inset:-60%;background:linear-gradient(110deg,transparent 43%,#fff9 50%,transparent 57%);transform:translateX(-80%)}.flash .glint:after{animation:shine .55s ease-out}@keyframes shine{to{transform:translateX(80%)}}footer{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 20px;color:#62766b;font-size:12px}footer i{font:italic 14px Georgia,serif}.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}
@media(max-width:819px){header{align-items:start;flex-wrap:wrap;padding:22px 4px 15px;gap:12px}header p{font-size:13px}main{border-radius:20px}.plate{left:14px;top:12px}.total{right:12px;bottom:8px}.fold{line-height:26px}.leaf .front{padding-left:12px}footer i{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}.tile:hover{translate:none!important}}
</style></head><body><header><div><h1>叶形观察室<i>Leaf atlas</i></h1><p>从一片叶子出发，看看四种不同的生长方式。</p></div><nav aria-label="全部分支"><button id="gather">⊟　收起全部</button><button id="spread">⊞　展开全部</button></nav></header><main aria-label="叶形思维导图"><div class="plate" aria-hidden="true">Fig. 1</div><div id="map"><svg id="lines" aria-hidden="true"></svg></div><div class="total" id="count"></div></main><footer><span>轻点翻面　·　拖动后松手回弹</span><i>Botanical field notes</i></footer><div class="sr" aria-live="polite" id="announce"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), map=$('map'),lines=$('lines'),reduce=matchMedia('(prefers-reduced-motion: reduce)'),ns='http://www.w3.org/2000/svg';
const plants=[['银杏','Ginkgo biloba','#e8dca4','#8a7839','看扇面，也看扇骨。叶脉从叶柄顶端出发，一路分叉到边缘。',['扇形叶','Outline','叶片像一把展开的折扇，外缘宽而缓弯。'],['二歧脉','Venation','一条叶脉分成两条，再各自分叉，像反复张开的手指。']],['鸡爪槭','Acer palmatum','#edc4b1','#9e604e','先数裂片，再找叶脉。掌状伸出的主脉，通向各个裂片的尖端。',['掌状裂','Outline','几枚尖裂片从叶基向外伸，形似张开的手掌。'],['锯齿缘','Margin','沿裂片边缘细看，还排着一串比裂口小得多的尖齿。']],['垂柳','Salix babylonica','#bfdbb9','#527751','沿叶柄向叶尖看去，叶片先略微展开，再慢慢收成一道细尖。',['披针形','Outline','叶片狭长，中段略宽，两端渐窄，像细长的枪头。'],['羽状脉','Venation','从中央主脉向两侧看，较细的侧脉依次伸出。']],['肾蕨','Nephrolepis cordifolia','#bddcdb','#477878','一整片蕨叶由许多羽片组成。顺着中轴看，两侧的羽片排成羽毛状。',['羽状叶','Outline','一片叶有一条长叶轴，小羽片沿着叶轴两侧排列。'],['孢子囊群','Underside','翻看成熟叶背，有时能见到一排排小点，那是孢子囊群。']]];
function art(i){let p='';const path=(d,fill='currentColor',stroke='none',width=1)=>`<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"/>`;
if(i===0){p=path('M49 58 Q20 51 9 30 Q12 24 18 25 Q18 18 25 20 Q29 13 35 16 Q40 9 45 14 L49 24 L52 12 Q59 7 64 13 Q70 9 74 16 Q82 14 83 22 Q90 20 91 29 Q75 48 49 58Z');for(let a=15;a<=85;a+=7)p+=path(`M49 56 Q${(a+49)/2} 40 ${a} ${15+Math.abs(a-49)*.34}`,'none','#f2e9bc',.85);p+=path('M49 56 Q47 65 40 71','none','currentColor',2)}
if(i===1){p=path('M48 61 L18 61 L26 55 L7 43 L31 44 L17 20 L39 35 L43 7 L54 35 L72 13 L66 38 L91 27 L76 46 L94 46 L65 59 L54 59 L48 70Z');for(const [x,y] of [[13,45],[23,26],[44,14],[69,20],[85,31],[85,48]])p+=path(`M49 59 L${x} ${y}`,'none','#f6ddc6',1)}
if(i===2||i===4){p=path('M27 71 Q47 48 61 10','none','currentColor',2);for(const [x,y,a,k] of [[34,62,-37,1],[40,53,40,.87],[46,43,-34,.9],[51,33,40,.8],[56,22,-13,.7]])p+=`<g transform="translate(${x} ${y}) rotate(${a}) scale(${k})">${path('M0 0 Q-13 -8 -9 -33 Q3 -24 0 0Z')}${path('M0 0 Q-5 -13 -8 -29','none','#e0edce',.9)}</g>`}
if(i===3){p=path('M26 70 Q55 44 72 8','none','currentColor',1.7);for(let j=0;j<11;j++){let t=j/11,x=31+39*t,y=65-51*t,l=21*(1-.68*t);p+=path(`M${x} ${y} q${-l*.74} -3 ${-l*.57} ${-l*1.25} q${l*.68} 5 ${l*.57} ${l*1.25} M${x} ${y} q${l*.5} ${-l*.9} ${l*1.24} ${-l*.71} q${-l*.17} ${l*.54} ${-l*1.24} ${l*.71}`)}}return `<svg class="specimen" aria-hidden="true" viewBox="0 0 100 78">${p}</svg>`}
const nodes=[],branches=[];let mobile=false,h=0,w=0,frame=0,last=0,held=null;
function node(kind,title,latin,note,i,parent=null,j=0){const el=document.createElement('div');el.className='node '+kind;let [,,paint,deep]=plants[i]||['','','#b9ddbc','#416f52'];el.style.setProperty('--paint',paint);el.style.setProperty('--deep',deep);const btn=document.createElement('button');btn.className='tile';btn.setAttribute('aria-pressed','false');btn.setAttribute('aria-label',title+'：翻看观察笔记');btn.innerHTML=`<span class="rotor"><span class="face front">${kind==='leaf'?'':art(i)}<b>${title}</b><em lang="en">${latin}</em></span><span class="face back" aria-hidden="true">${kind==='leaf'?'':`<strong>${title}</strong>`}<span>${note}</span><span class="glint"></span></span></span>`;const skin=document.createElement('div');skin.className='skin';skin.append(btn);el.append(skin);map.append(el);const n={el,btn,kind,title,note,i,j,parent,x:0,y:0,vx:0,vy:0,dx:0,dy:0,alpha:1,closed:false,flip:false,children:[]};nodes.push(n);if(parent){parent.children.push(n);n.path=document.createElementNS(ns,'path');n.path.setAttribute('fill','none');n.path.setAttribute('stroke',deep);n.path.setAttribute('stroke-width',kind==='leaf'?'1.4':'2.1');lines.append(n.path)}
if(kind==='branch'){let b=document.createElement('button');b.className='fold';b.textContent='− 收起 2 张';b.setAttribute('aria-expanded','true');b.setAttribute('aria-label','收起'+title+'的两张观察卡');b.onclick=()=>collapse(n,!n.closed);el.append(b);n.fold=b;branches.push(n)}
btn.onclick=e=>{if(e.detail&&n.blockClick){n.blockClick=false;return}if(parent?.closed)return;n.flip=!n.flip;btn.setAttribute('aria-pressed',n.flip);btn.setAttribute('aria-label',n.flip?title+'：'+note+'；返回正面':title+'：翻看观察笔记');btn.querySelector('.front').setAttribute('aria-hidden',n.flip);btn.querySelector('.back').setAttribute('aria-hidden',!n.flip);btn.classList.toggle('flash',n.flip)};
btn.onpointerdown=e=>{if(held||e.button!==0||parent?.closed)return;n.blockClick=false;held={n,id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,drag:false};btn.setPointerCapture(e.pointerId);n.vx=n.vy=0;el.classList.add('moving')};btn.onpointermove=e=>{if(held?.n!==n||e.pointerId!==held.id)return;let a=e.clientX-held.sx,b=e.clientY-held.sy;if(!held.drag&&Math.hypot(a,b)<5)return;held.drag=true;n.x=clamp(held.ox+a,n.w/2+3,w-n.w/2-3);n.y=clamp(held.oy+b,n.h/2+3,h-n.h/2-(n.fold?34:3));el.style.setProperty('--tilt',reduce.matches?'0deg':clamp(a*.09,-6,6)+'deg');el.style.setProperty('--elong',reduce.matches?1:1.035);el.style.setProperty('--squash',reduce.matches?1:.98);wake()};const release=e=>{if(held?.n!==n||held.id!==e.pointerId)return;n.blockClick=held.drag||e.type==='pointercancel';held=null;el.classList.remove('moving');['--tilt','--elong','--squash'].forEach(k=>el.style.removeProperty(k));wake()};btn.onpointerup=btn.onpointercancel=btn.onlostpointercapture=release;return n}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}const root=node('root','一片叶子','Folium','拿起一片叶子，先描出轮廓，再沿叶脉寻找分叉。最后翻到背面，看看正面没有的细节。',4);plants.forEach(([t,l,,,d,...leaves],i)=>{let b=node('branch',t,l,d,i,root);leaves.forEach(([t,l,d],j)=>node('leaf',t,l,d,i,b,j))});
function layout(snap=false){w=map.clientWidth;mobile=w<820;let cy=170;h=mobile?208+branches.reduce((s,b)=>s+(b.closed?169:322),0):clamp(innerHeight*.68,492,750);map.style.height=h+'px';for(const n of nodes){let r=n.kind==='root',b=n.kind==='branch',left=n.i<2,top=n.i%2===0; if(mobile){n.w=r?158:b?152:Math.min(165,(w-36)/2);n.h=r?134:b?112:93;if(r){n.dx=w/2;n.dy=85}else if(b){n.dx=w/2;n.dy=cy+69;cy+=n.closed?169:322}else{n.dx=w/2+(n.j?1:-1)*(n.w/2+6);n.dy=n.parent.dy+166}}else{n.w=r?Math.min(194,w*.164):b?Math.min(180,w*.152):Math.min(166,w*.155);n.h=r?176:b?132:90;n.dx=w*(r?.5:b?(left?.29:.71):(left?.095:.905));n.dy=r?h*.49:h*(top?.28:.71)+(b?0:(n.j?1:-1)*h*.103)}n.el.style.width=n.w+'px';n.el.style.height=n.h+'px';if(snap){n.x=n.dx;n.y=n.dy;n.vx=n.vy=0}}wake()}
function collapse(n,closed,all=false){if(n.closed===closed)return;n.closed=closed;n.el.classList.toggle('closed',closed);n.fold.textContent=closed?'＋ 展开 2 张':'− 收起 2 张';n.fold.setAttribute('aria-expanded',!closed);n.fold.setAttribute('aria-label',(closed?'展开':'收起')+n.title+'的两张观察卡');n.children.forEach(c=>{if(closed&&c.el.contains(document.activeElement))n.fold.focus({preventScroll:true});c.el.inert=closed;c.el.style.pointerEvents=closed?'none':'';c.el.setAttribute('aria-hidden',closed)});if(!all){layout();status()}}
function status(){const open=branches.filter(n=>!n.closed).length;$('count').textContent=`${5+2*open} / 13 张卡片`;$('gather').disabled=!open;$('spread').disabled=open===4;$('announce').textContent=`已展开 ${open} 个分支，当前可见 ${5+2*open} 张卡片。`}
for(const [id,v] of [['gather',true],['spread',false]])$(id).onclick=()=>{branches.forEach(n=>collapse(n,v,true));layout();status()};function wake(){if(!frame){last=performance.now();frame=requestAnimationFrame(draw)}}
function draw(now){let dt=Math.min(.032,Math.max(.001,(now-last)/1000)),again=false;last=now;frame=0;for(const n of nodes){const p=n.parent,hide=p?.closed===true,tx=hide?p.x+(n.j?3:-3):n.dx,ty=hide?p.y+3:n.dy;if(held?.n!==n){if(reduce.matches){n.x=tx;n.y=ty;n.vx=n.vy=0}else{const k=hide?184:n.j?198:240;for(let z=0;z<3;z++){const s=dt/3; n.vx+=((tx-n.x)*k-n.vx*(hide?25:20))*s;n.vy+=((ty-n.y)*k-n.vy*(hide?25:20))*s;n.x+=n.vx*s;n.y+=n.vy*s}if(Math.abs(tx-n.x)+Math.abs(ty-n.y)+Math.abs(n.vx)+Math.abs(n.vy)<.15){n.x=tx;n.y=ty;n.vx=n.vy=0}else again=true}}let goal=hide?0:1;n.alpha=reduce.matches?goal:n.alpha+(goal-n.alpha)*(1-Math.exp(-(hide?8:10)*dt));if(Math.abs(n.alpha-goal)<.006)n.alpha=goal;else again=true;n.el.style.visibility=n.alpha===0?'hidden':'visible';n.el.style.opacity=n.alpha;n.el.style.transform=`translate(${n.x-n.w/2}px,${n.y-n.h/2}px) scale(${.72+.28*n.alpha})`;if(p){let d;if(mobile&&n.kind==='branch'){let edge=w*.055;d=`M ${p.x-p.w*.42} ${p.y} C ${edge} ${p.y},${edge} ${p.y+30},${edge} ${p.y+65} L ${edge} ${n.y-38} Q ${edge} ${n.y},${n.x} ${n.y}`}else if(mobile){let m=(p.y+n.y)/2;d=`M${p.x} ${p.y} C${p.x} ${m+18},${n.x} ${m-15},${n.x} ${n.y}`}else{let m=(p.x+n.x)/2;d=`M${p.x} ${p.y} C${m} ${p.y},${m} ${n.y},${n.x} ${n.y}`}n.path.setAttribute('d',d);n.path.style.opacity=n.alpha*.55}}
if(again)frame=requestAnimationFrame(draw)}
layout(true);status();let resizeId;window.addEventListener('resize',()=>{clearTimeout(resizeId);resizeId=setTimeout(()=>layout(true),60)});reduce.addEventListener?.('change',wake);
</script></body></html>
