<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>随心 · 记忆城邦 — 永动等轴 2.5D 学习城邦</title>
<style>
  :root{
    --bg:#14121d; --panel:#17141f; --card:#1c1927; --line:rgba(255,255,255,.07);
    --text:#f3eefb; --muted:#9a92ae; --dim:#6f6788;
    --purple:#a78bfa; --purple-deep:#8b5cf6; --amber:#f4b860;
    --terracotta:#e86f38; --mustard:#f4d06f; --sage:#7a9a65; --slate:#8fa8be;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  .app{height:100vh;display:grid;grid-template-columns:minmax(350px,34%) 1fr;gap:12px;padding:12px}
  .panel{
    position:relative;min-width:0;display:flex;flex-direction:column;
    padding:16px 15px 10px;border-radius:20px;overflow-y:auto;overflow-x:hidden;
    background:
      radial-gradient(120% 60% at 0% 0%, rgba(124,92,240,.18), transparent 58%),
      radial-gradient(90% 50% at 110% 100%, rgba(232,111,56,.09), transparent 62%),
      var(--panel);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.045);
    scrollbar-width:thin;scrollbar-color:#3a334d transparent;
  }
  .panel::-webkit-scrollbar{width:5px}
  .panel::-webkit-scrollbar-thumb{background:#3a334d;border-radius:4px}
  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:0 2px;flex:none}
  .eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.22em;color:#ab9fc4;text-transform:uppercase}
  .eyebrow .mark{width:6px;height:6px;border-radius:50%;background:var(--purple);box-shadow:0 0 12px var(--purple);animation:pulse 2.4s ease-in-out infinite}
  .tagline{margin:5px 0 0;padding-left:14px;font-size:10px;letter-spacing:.05em;color:#756c90}
  .sound-chip{
    flex:none;appearance:none;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);
    color:#cfc5e6;border-radius:999px;padding:6px 10px;font-size:10.5px;cursor:pointer;
    display:flex;align-items:center;gap:5px;transition:.2s;white-space:nowrap;
  }
  .sound-chip:hover{background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.4)}
  .sound-chip.muted{color:#8b83a3;opacity:.7}
  .panel-core{display:flex;flex-direction:column;justify-content:space-between;gap:10px;flex:1;min-height:0;padding-bottom:2px}
  .group-block{display:flex;flex-direction:column;flex:none}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;flex:none}
  .stat{
    padding:8px 10px 7px;border-radius:11px;border:1px solid rgba(255,255,255,.055);
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008));
    display:flex;flex-direction:column;gap:1px;min-width:0;
  }
  .stat span{font-size:9px;letter-spacing:.06em;color:#837a99;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .num{display:flex;align-items:baseline;gap:4px}
  .stat b{font-size:21px;font-weight:700;line-height:1.05;letter-spacing:-.02em;color:#ddd4f3;font-variant-numeric:tabular-nums}
  .stat i{font-style:normal;font-size:8.5px;color:#6f6788}
  .stat b.pop{animation:counterPop .45s cubic-bezier(.2,.9,.3,1.5)}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .edit-btn{
    position:relative;display:grid;grid-template-columns:22px 1fr;grid-template-rows:auto auto;
    column-gap:7px;align-items:center;text-align:left;padding:7px 8px;border-radius:10px;
    border:1px solid var(--line);background:#1b1825;color:#ece6f8;cursor:pointer;overflow:hidden;
    transition:transform .18s cubic-bezier(.2,.9,.3,1.5),background .2s,box-shadow .2s;
  }
  .edit-btn::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--ec,#a78bfa);opacity:.85}
  .edit-btn:hover{transform:translateY(-2px);background:#231e31;box-shadow:0 10px 20px -12px var(--ec,#a78bfa)}
  .edit-btn:active{transform:scale(.96)}
  .edit-btn .e-ic{
    grid-row:1 / 3;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
    background:color-mix(in srgb,var(--ec,#a78bfa) 15%,transparent);font-size:12px;
  }
  .edit-btn b{font-size:10.5px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .edit-btn small{font-size:8px;color:#817896;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .edit-btn kbd{position:absolute;top:3px;right:4px;font-size:7px;color:#837a99;border:1px solid rgba(255,255,255,.1);border-bottom-width:1px;border-radius:3px;padding:0 3px;line-height:1.3;opacity:.5}
  .flip-btn{
    position:relative;flex:none;margin-top:10px;width:100%;min-height:70px;border:none;border-radius:16px;
    display:flex;align-items:center;gap:12px;padding:11px 13px;text-align:left;cursor:pointer;overflow:hidden;
    color:#fff;background:linear-gradient(118deg,#6d46d8 0%,#9a5bf0 42%,#e86f38 118%);
    box-shadow:0 14px 34px -16px rgba(139,92,246,.95),inset 0 1px 0 rgba(255,255,255,.24);
    transition:transform .18s cubic-bezier(.2,.9,.3,1.5),box-shadow .2s;
  }
  .flip-btn::after{
    content:"";position:absolute;inset:-40% -20% auto auto;width:70%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.28),transparent 66%);pointer-events:none;
  }
  .flip-btn:hover{transform:translateY(-2px);box-shadow:0 20px 40px -16px rgba(139,92,246,1)}
  .flip-btn:active{transform:scale(.982)}
  .flip-btn .f-ic{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
    background:rgba(255,255,255,.17);font-size:19px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  }
  .flip-btn .f-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .flip-btn .f-txt b{font-size:16px;font-weight:700;letter-spacing:.02em}
  .flip-btn .f-txt small{font-size:9.5px;letter-spacing:.04em;color:rgba(255,255,255,.76)}
  .combo{
    margin-left:auto;flex:none;padding:6px 9px;border-radius:999px;font-size:10.5px;font-weight:600;
    letter-spacing:.02em;background:rgba(20,14,28,.32);border:1px solid rgba(255,255,255,.2);
    color:rgba(255,255,255,.7);transition:.2s;font-variant-numeric:tabular-nums;
  }
  .combo.on{background:rgba(255,208,120,.2);border-color:rgba(255,208,120,.7);color:#ffe3ad;box-shadow:0 0 16px rgba(255,190,90,.35)}
  .combo.max{background:rgba(255,180,70,.3);border-color:#ffc35c;color:#fff2cf;box-shadow:0 0 22px rgba(255,180,70,.6);animation:comboPulse 1.3s ease-in-out infinite}
  .flip-btn.pressed{animation:btnJelly .4s cubic-bezier(.2,.9,.3,1.5)}
  .section-title{display:flex;align-items:center;gap:8px;margin:13px 2px 6px;font-size:9.5px;letter-spacing:.18em;color:#7d7494;text-transform:uppercase;flex:none}
  .section-title span{color:#a78bfa;letter-spacing:.05em}
  .section-title::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(255,255,255,.09),transparent)}
  .ratings{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
  .rate{
    position:relative;display:grid;grid-template-columns:24px 1fr;grid-template-rows:auto auto;column-gap:7px;
    align-items:center;text-align:left;padding:8px 9px 7px;border-radius:11px;border:1px solid var(--line);
    background:#1b1825;color:#ece6f8;cursor:pointer;overflow:hidden;
    transition:transform .18s cubic-bezier(.2,.9,.3,1.5),background .2s,box-shadow .2s;
  }
  .rate::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:var(--c);opacity:.9}
  .rate:hover{transform:translateY(-2px);background:#231e31;box-shadow:0 10px 20px -12px var(--c)}
  .rate:active{transform:scale(.96)}
  .rate .r-num{grid-row:1 / 3;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);font-size:14px;font-weight:700}
  .rate .r-main{font-size:11.5px;font-weight:600;line-height:1.15}
  .rate .r-sub{font-size:8.5px;color:#817896;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rate kbd{position:absolute;top:4px;right:5px;font-size:7.5px;color:#837a99;border:1px solid rgba(255,255,255,.1);border-bottom-width:2px;border-radius:4px;padding:0 3px;line-height:1.3;opacity:.55}
  .acts{display:flex;flex-direction:column;gap:6px;flex:none}
  .act{
    display:flex;align-items:center;gap:10px;width:100%;min-height:43px;padding:7px 10px;
    border-radius:11px;border:1px solid var(--line);color:#eee8fa;font-size:12px;text-align:left;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),var(--card);
    transition:transform .18s cubic-bezier(.2,.9,.3,1.5),border-color .2s,background .2s,box-shadow .2s;
  }
  .act:hover{border-color:rgba(167,139,250,.36);transform:translateY(-1px);background:linear-gradient(180deg,rgba(167,139,250,.1),rgba(255,255,255,.015)),#211c2e;box-shadow:0 10px 22px -16px rgba(139,92,246,.9)}
  .act:active{transform:scale(.982)}
  .act .glyph{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;flex:none;background:rgba(167,139,250,.14);color:#cbb8ff;font-size:12px;font-weight:600}
  .act .a-txt{display:flex;flex-direction:column;gap:1px;min-width:0;line-height:1.15}
  .act .a-txt b{font-size:11.5px;font-weight:600}
  .act .a-txt small{font-size:9px;color:#837a99;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .act kbd{font-size:9px;color:#8b83a3;border:1px solid rgba(255,255,255,.1);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:rgba(0,0,0,.18);margin-left:auto;line-height:1.35}
  .act.primary{border:none;background:linear-gradient(135deg,#8b5cf6 0%,#a855f7 46%,#e86f38 120%);box-shadow:0 12px 30px -16px rgba(139,92,246,.95)}
  .act.primary .glyph{background:rgba(255,255,255,.18);color:#fff}
  .act.primary .a-txt small{color:rgba(255,255,255,.72)}
  .act.primary kbd{color:rgba(255,255,255,.78);border-color:rgba(255,255,255,.3);background:rgba(0,0,0,.14)}
  .spacer{flex:1;min-height:8px}
  .panel-foot{flex:none;margin-top:8px;padding:9px 4px 0;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:6px}
  .palette{display:flex;align-items:center;gap:8px}
  .pal-label{font-size:8.5px;letter-spacing:.2em;color:#6f6788;margin-right:2px}
  .sw{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 2px 6px rgba(0,0,0,.4)}
  .log{display:flex;flex-direction:column;gap:3px;min-height:12px}
  .log-item{display:flex;align-items:center;gap:7px;font-size:10px;color:#9c94b1;line-height:1.25}
  .log-dot{width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
  .log-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .log-time{font-size:9px;color:#5c5572;font-variant-numeric:tabular-nums}
  .world-card{
    margin-top:10px;padding:9px 11px;border-radius:11px;border:1px solid rgba(255,255,255,.06);
    background:rgba(255,255,255,.025);display:flex;flex-direction:column;gap:6px;flex:none;
  }
  .wc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:9px;color:#746b8b}
  .wc-head span{letter-spacing:.18em;color:#a78bfa;text-transform:uppercase}
  .wc-head b{font-weight:500;color:#bdb2d6;font-size:9px}
  .wc-row{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:9px;color:#8f86a6}
  .wc-row b{color:#ded4f2;font-weight:600;font-variant-numeric:tabular-nums}
  .wc-row b.pop{animation:counterPop .45s cubic-bezier(.2,.9,.3,1.5)}
  .toasts{position:absolute;left:15px;right:15px;bottom:10px;z-index:20;pointer-events:none}
  .toast{
    --tc:#a78bfa;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;
    background:rgba(29,25,42,.95);border:1px solid rgba(255,255,255,.09);border-left:2px solid var(--tc);
    box-shadow:0 16px 34px -16px rgba(0,0,0,.8);font-size:10.5px;color:#ece6f8;backdrop-filter:blur(14px);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .toast .t-dot{width:6px;height:6px;border-radius:50%;background:var(--tc);box-shadow:0 0 10px var(--tc);flex:none}
  .toast.amber{--tc:#f4b860}
  .toast.good{--tc:#8fbf7a}
  .stage-wrap{min-width:0;min-height:0}
  .stage{
    position:relative;height:100%;border-radius:20px;overflow:hidden;isolation:isolate;background:#61557f;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 34px 80px -34px rgba(0,0,0,.85);
  }
  .sky{position:absolute;inset:0;pointer-events:none;z-index:0;background:linear-gradient(180deg,#61557f 0%,#7d6692 32%,#b47a7f 62%,#e59268 84%,#f3a661 100%)}
  .stage-glow{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(56% 44% at 52% 64%,rgba(255,198,128,.34),rgba(255,150,90,0) 72%);mix-blend-mode:screen}
  .orb{position:absolute;border-radius:50%;pointer-events:none;z-index:2}
  .sun{
    width:min(24vh,215px);aspect-ratio:1;right:7%;top:26%;
    background:radial-gradient(circle at 42% 42%,#fff4d6 0%,#ffd18e 30%,rgba(255,172,102,.55) 54%,rgba(255,150,90,0) 72%);
    filter:blur(1px);opacity:.95;animation:sunBreathe 9s ease-in-out infinite;
  }
  #scene{position:absolute;inset:0;z-index:5;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #scene:active{cursor:grabbing}
  .stage-top{
    position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;
    display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 17px;
    background:linear-gradient(180deg,rgba(13,10,22,.3),rgba(13,10,22,0));
  }
  .stage-title{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(20,16,30,.3);border:1px solid rgba(255,255,255,.14);font-size:11.5px;letter-spacing:.12em;color:rgba(255,255,255,.88);text-shadow:0 1px 10px rgba(0,0,0,.4);backdrop-filter:blur(10px);white-space:nowrap}
  .live-dot{width:6px;height:6px;border-radius:50%;background:#bda6ff;box-shadow:0 0 10px #a78bfa;animation:pulse 2.2s ease-in-out infinite}
  .stage-tools{display:flex;gap:7px;pointer-events:auto}
  .chip{
    appearance:none;border:1px solid rgba(255,255,255,.16);background:rgba(20,16,30,.36);color:#f3eefb;
    padding:7px 12px;border-radius:999px;font-size:11.5px;cursor:pointer;backdrop-filter:blur(12px);
    transition:background .2s,border-color .2s,box-shadow .2s,transform .18s;white-space:nowrap;
  }
  .chip:hover{background:rgba(44,35,64,.62);transform:translateY(-1px)}
  .chip:active{transform:scale(.96)}
  .chip.on{background:rgba(124,92,240,.36);border-color:rgba(167,139,250,.62);box-shadow:0 0 20px rgba(124,92,240,.4);color:#fff}
  .stage-bottom{
    position:absolute;left:0;right:0;bottom:0;z-index:10;pointer-events:none;
    display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:16px 18px;
    background:linear-gradient(0deg,rgba(13,10,22,.3),rgba(13,10,22,0));
  }
  .hint-chip{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:rgba(20,16,30,.3);border:1px solid rgba(255,255,255,.11);font-size:10.5px;letter-spacing:.06em;color:rgba(255,255,255,.72);backdrop-filter:blur(10px);white-space:nowrap}
  .hint-chip .live-dot{width:5px;height:5px;background:#8fbf7a;box-shadow:0 0 9px #8fbf7a}
  .boot{position:absolute;inset:0;z-index:40;display:grid;place-content:center;justify-items:center;gap:12px;background:radial-gradient(circle at 50% 42%,#282236,#14121d 72%);transition:opacity .8s ease}
  .boot.done{opacity:0;pointer-events:none}
  .boot p{margin:0;font-size:14px;color:#ded7ee;letter-spacing:.04em}
  .boot small{font-size:11px;color:#7d7594;line-height:1.7;text-align:center}
  .boot-spinner{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.12);border-top-color:#a78bfa;animation:spin 1s linear infinite}
  .boot.error .boot-spinner{display:none}
  body.loading .panel-core{opacity:.4;pointer-events:none}
  body.demo-lock .panel-core{opacity:.45;pointer-events:none;filter:saturate(.7)}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
  @keyframes counterPop{0%{transform:scale(1)}36%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes comboPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}
  @keyframes btnJelly{0%{transform:scale(1)}30%{transform:scale(1.04,.94)}60%{transform:scale(.98,1.02)}100%{transform:scale(1)}}
  @keyframes sunBreathe{0%,100%{opacity:.82;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  body.embed .panel{display:none}
  body.embed .app{display:block;height:100vh;padding:0}
  body.embed .stage-wrap{height:100vh}
  body.embed .stage{height:100vh;border-radius:0;box-shadow:none}
  body.embed .stage-top,body.embed .stage-bottom{display:none}
  body.embed .toasts{display:none}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}}
  @media (max-height:820px){
    .panel{padding-top:12px}
    .stat{padding:6px 9px}
    .stat b{font-size:18px}
    .flip-btn{min-height:62px;margin-top:8px}
    .section-title{margin-top:9px}
    .act{min-height:39px}
    .rate{padding:6px 8px 5px}
    .tagline{display:none}
  }
  @media (max-width:900px){
    body{overflow:auto}
    .app{height:auto;min-height:100vh;display:flex;flex-direction:column;gap:10px;padding:10px}
    .stage-wrap{order:1;height:56vh;min-height:400px}
    .panel{order:2;padding:14px;overflow:visible}
    .panel-core{display:flex;flex-direction:column}
    .toasts{position:fixed;left:12px;right:12px;bottom:12px}
    .stage-title{letter-spacing:.06em}
    .hint-chip:first-child{display:none}
  }
</style>
</head>
<body class="loading">
<div class="app">
  <aside class="panel">
    <header class="panel-head">
      <div>
        <div class="eyebrow"><span class="mark"></span>随心 · 记忆城邦</div>
        <p class="tagline">永动 · 高低错落的学习小城</p>
      </div>
      <button class="sound-chip" type="button" id="soundBtn" title="音效开关 (M)">🔊 <span>音效</span></button>
    </header>

    <div class="panel-core">
      <section class="stats" aria-label="城邦指标">
        <div class="stat"><span>累计翻卡</span><div class="num"><b id="statFlips">0</b></div></div>
        <div class="stat"><span>复习单元数</span><div class="num"><b id="statUnits">11</b></div></div>
        <div class="stat"><span>重点标记数</span><div class="num"><b id="statHighlights">0</b></div></div>
        <div class="stat"><span>城邦繁荣度</span><div class="num"><b id="statProsperity">0</b></div></div>
      </section>

      <div class="group-block">
        <div class="section-title"><span>01</span>高频核心 · 翻卡回忆</div>
        <button class="flip-btn" type="button" id="flipBtn">
          <span class="f-ic">⏎</span>
          <span class="f-txt"><b>翻卡回忆</b><small>Enter / Space · 五声音阶连击</small></span>
          <span class="combo" id="comboBadge">Combo ×0</span>
        </button>
      </div>

      <div class="group-block">
        <div class="section-title"><span>02</span>初次学习 · 编辑模式</div>
        <div class="edit-grid">
          <button class="edit-btn" type="button" data-act="pin" style="--ec:#F4B860">

  resume() {

  setMuted(m) {

function withTimeout(promise, ms) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('timeout')), ms);
    promise.then((v) => { clearTimeout(timer); resolve(v); }, (e) => { clearTimeout(timer); reject(e); });
  });
}
async function loadGsap() {
  for (const url of CDN.gsap) {
    try {
      await withTimeout(new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url; s.async = true;
        s.onload = resolve;
        s.onerror = () => reject(new Error('load error'));
        document.head.appendChild(s);
      }), 12000);
      if (window.gsap) return window.gsap;
    } catch (e) { /* 尝试下一个源 */ }
  }
  throw new Error('GSAP 加载失败');
}
async function loadThree() {
  for (const url of CDN.three) {
    try { return await withTimeout(import(url), 18000); }
    catch (e) { /* 尝试下一个源 */ }
  }
  throw new Error('Three.js 加载失败');
}

function initControls(canvas) {
  const onDown = (e) => {
    canvas.setPointerCapture?.(e.pointerId);
    ctl.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ctl.pointers.size === 2) {
      const pts = [...ctl.pointers.values()];
      ctl.pinch = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }
  };
  const onMove = (e) => {
    const prev = ctl.pointers.get(e.pointerId);
    if (!prev) return;
    ctl.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ctl.pointers.size === 2) {
      const pts = [...ctl.pointers.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (ctl.pinch > 0) ctl.zoomTarget = clamp(ctl.zoomTarget * (d / ctl.pinch), 0.5, 2.8);
      ctl.pinch = d;
      return;
    }
    ctl.azTarget -= (e.clientX - prev.x) * 0.006;
    ctl.polarTarget = clamp(ctl.polarTarget - (e.clientY - prev.y) * 0.005, 0.3, 1.37);
  };

    ctl.pointers.delete(e.pointerId);
    if (ctl.pointers.size < 2) ctl.pinch = 0;

  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();

    ctl.target.y + ctl.radius * cp,
    ctl.target.z + ctl.radius * sp * Math.cos(ctl.az)

/* ---------------- 地块与道路 ---------------- */
const cellPos = (i) => i * CELL;

function makePlot(k, l, ring = 0) {
  return {
    k, l, ring,
    x: (3 * k + 1.5) * CELL,
    z: (3 * l + 1.5) * CELL,
    used: false,
    id: k + ',' + l,
    jitter: Math.random(),
  };
}
function findPlot(k, l) {
  return state.plots.find((p) => p.k === k && p.l === l) || null;
}
function buildInitialPlots() {
  state.plots = [];
  for (let k = -2; k <= 1; k++) {
    for (let l = -2; l <= 1; l++) state.plots.push(makePlot(k, l, 0));
  }
  state.plotRange = { min: -2, max: 1 };
}

function paveCell(i, j, delay = 0) {
  if (i < -state.halfRoad - 6 || j < -state.halfRoad - 6) return;
  const key = i + '_' + j;
  if (state.paved.has(key)) return;
  state.paved.add(key);
  const tile = new THREE.Mesh(roadGeo, roadMat);
  tile.position.set(cellPos(i), 0.03, cellPos(j));
  tile.receiveShadow = true;
  tile.castShadow = false;
  tile.scale.set(0.01, 1, 0.01);
  city.add(tile);
  gsap.to(tile.scale, { x: 1, z: 1, duration: 0.46, delay, ease: 'back.out(1.9)' });
}
function paveAllRoads(min, max, baseDelay = 0) {
  for (let i = min; i <= max; i++) {
    for (let j = min; j <= max; j++) {
      if (i % 3 !== 0 && j % 3 !== 0) continue;
      const d = baseDelay + Math.min(0.55, (Math.abs(i) + Math.abs(j)) * 0.008);
      paveCell(i, j, d);
    }
  }
}
/* ---------------- 无限扩岛 ---------------- */
function addRingPlots() {
  state.plotRange.min -= 1;
  state.plotRange.max += 1;
  const { min, max } = state.plotRange;
  for (let k = min; k <= max; k++) {
    for (let l = min; l <= max; l++) {
      if (!findPlot(k, l)) state.plots.push(makePlot(k, l, state.ring));
    }
  }
}
function addRingTrees(oldSize, newSize) {
  const e = newSize / 2 - 0.55;
  const spots = [
    [e, 0.2, 0.82], [-e, -0.3, 0.72], [0.3, e, 0.76], [-0.4, -e, 0.68],
  ];
  spots.forEach(([x, z, s], i) => {
    if (i % 2 === 0 && state.ring > 1) return;
    const tree = makeTree(s);
    tree.position.set(x, 0, z);
    tree.scale.setScalar(0.01);
    city.add(tree);
    registerTree(tree);
    gsap.to(tree.scale, {
      x: s, y: s, z: s, duration: 1.05, delay: 1.35 + i * 0.12,
      ease: 'elastic.out(1,0.5)',
    });
  });
}
function expandIsland(auto = false) {
  const oldSize = state.islandSize;
  state.ring += 1;
  state.halfRoad += CFG.expandStep;
  const newSize = oldSize + CFG.grow;
  state.islandSize = newSize;
  const d = (newSize - oldSize) / 2;
  const halfOld = oldSize / 2;

  const arms = [
    { w: newSize, dep: d, x: 0, z: -(halfOld + d / 2) },
    { w: newSize, dep: d, x: 0, z: halfOld + d / 2 },
    { w: d, dep: oldSize, x: -(halfOld + d / 2), z: 0 },
    { w: d, dep: oldSize, x: halfOld + d / 2, z: 0 },
  ];
  arms.forEach((a, idx) => {
    const arm = new THREE.Group();
    const layers = [
      [a.w, 0.55, a.dep, C.grass, -0.275, 0.96],
      [a.w + 0.04, 0.2, a.dep + 0.04, C.soil, -0.66, 0.96],
      [a.w - 0.08, 0.9, a.dep - 0.08, C.rock, -1.2, 0.98],
      [a.w - 0.24, 1.1, a.dep - 0.24, C.dirt, -2.2, 1],
      [a.w - 0.34, 0.08, a.dep - 0.34, C.under, -2.78, 1],
    ];
    layers.forEach(([w, h, dd, col, y, ro]) => {
      const b = box(w, h, dd, col, { rough: ro });
      b.position.y = y;
      arm.add(b);
    });
    arm.position.set(a.x, -8, a.z);
    city.add(arm);
    gsap.to(arm.position, {
      y: 0, duration: 1.45, delay: idx * 0.1,
      ease: 'elastic.out(1,0.55)',
    });
  });

  addRingPlots();
  paveAllRoads(-state.halfRoad, state.halfRoad, 0.9);
  addRingTrees(oldSize, newSize);
  updateShadowBounds();
  fitCameraToIsland(true);
  updateStats2();
  Sound.earth();

  log(auto ? '岛屿自动扩建 · 新街区从云海升起' : '编辑导图 · 岛屿向外扩张一圈', '#a78bfa');
  toast('新地块升起 · 道路延伸 · 版图没有上限', 'soft');
  return true;
}

function makeTree(s = 1, tint = null) {
  const g = new THREE.Group();
  const base = tint || C.sage;
  const trunk = mesh(new THREE.CylinderGeometry(0.045, 0.062, 0.26, 6), mat(C.trunk, { rough: 0.95 }));
  trunk.position.y = 0.13;
  g.add(trunk);
  const blobs = [
    { r: 0.27, x: 0, y: 0.4, z: 0, c: base },
    { r: 0.18, x: 0.13, y: 0.47, z: 0.04, c: shade(base, 0.09) },
    { r: 0.15, x: -0.11, y: 0.5, z: 0.08, c: shade(base, -0.06) },
    { r: 0.13, x: 0.02, y: 0.56, z: -0.1, c: shade(base, 0.05) },
  ];
  blobs.forEach((b) => {
    const m = mesh(new THREE.IcosahedronGeometry(b.r, 0), mat(b.c, { flat: true }));
    m.position.set(b.x, b.y, b.z);
    g.add(m);
  });

function registerTree(g) {
  state.trees.push({ g, phase: rand(0, 6.28), amp: rand(0.025, 0.055), speed: rand(0.8, 1.35) });
}
function addWindows(fg, w, fh, level) {
  const out = [];
  const perFace = w > 0.95 ? 2 : 1;
  const ww = level === 2 ? 0.17 : 0.15;
  const wh = level === 2 ? 0.3 : 0.24;
  const y = fh * (level === 2 ? 0.5 : 0.55);
  const offs = perFace === 2 ? [-w * 0.24, w * 0.24] : [0];
  for (const axis of ['x', 'z']) {
    for (const sign of [1, -1]) {
      for (const o of offs) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(axis === 'x' ? 0.03 : ww, wh, axis === 'x' ? ww : 0.03),
          windowMat(false)
        );
        const p = w / 2 + 0.012;
        if (axis === 'x') m.position.set(sign * p, y, o);
        else m.position.set(o, y, sign * p);
        m.castShadow = false;
        fg.add(m);
        out.push(m);
      }
    }
  }
  return out;
}
function addRailing(parent, side, yLocal, h, color) {
  const t = 0.022;
  const bars = [
    { w: side, d: t, x: 0, z: side / 2 },
    { w: side, d: t, x: 0, z: -side / 2 },
    { w: t, d: side, x: side / 2, z: 0 },
    { w: t, d: side, x: -side / 2, z: 0 },
  ];
  bars.forEach((b) => {
    const m = box(b.w, h, b.d, color, { rough: 0.65 });
    m.position.set(b.x, yLocal + h / 2, b.z);
    parent.add(m);
  });
}
function makeBuilding(level, opts = {}) {
  const g = new THREE.Group();
  const windows = [];
  const floors = [];
  const trees = [];
  const bonus = opts.bonus || 0;
  const rnd = Math.random();
  let bodyColor, trimColor, roofColor;

  if (level === 2) {
    bodyColor = rnd < 0.5 ? C.sage : C.slate;
    trimColor = shade(bodyColor, -0.16);
    roofColor = shade(bodyColor, -0.2);
  } else if (level === 3) {
    bodyColor = rnd < 0.55 ? C.terracotta : C.mustard;
    trimColor = shade(bodyColor, -0.14);
    roofColor = shade(bodyColor, -0.26);
  } else {
    bodyColor = C.terracotta;
    trimColor = shade(bodyColor, -0.16);
    roofColor = shade(bodyColor, -0.26);
  }

  const baseW = level === 2 ? 1.16 : level === 3 ? 1.08 : 1.02;
  const plinth = box(baseW + 0.16, 0.1, baseW + 0.16, C.dark, { rough: 0.92 });
  plinth.position.y = 0.05;
  g.add(plinth);
  const step = box(0.26, 0.05, 0.14, C.slate, { rough: 0.9 });
  step.position.set(0, 0.075, baseW / 2 + 0.12);
  g.add(step);

  const nFloors = level === 2 ? Math.min(2, 1 + bonus)
    : level === 3 ? Math.min(4, 3 + bonus)
    : Math.min(5, 4 + bonus);
  const fh = level === 2 ? 0.72 : level === 3 ? 0.5 : 0.44;
  let y = 0.1;
  let lastFg = null;
  for (let i = 0; i < nFloors; i++) {
    const shrink = level === 4 ? i * 0.032 : 0;
    const w = baseW - shrink;
    const col = i % 2 === 0 ? bodyColor : shade(bodyColor, 0.04);
    const fg = new THREE.Group();
    fg.position.y = y;
    const body = box(w, fh, w, col, { rough: 0.76 });
    body.position.y = fh / 2;
    fg.add(body);
    const band = box(w + 0.045, 0.05, w + 0.045, trimColor, { rough: 0.8 });
    band.position.y = fh - 0.026;
    fg.add(band);
    windows.push(...addWindows(fg, w, fh, level));
    if (i === 0) {
      const door = box(0.18, 0.3, 0.05, shade(bodyColor, -0.42));
      door.position.set(0, 0.15, w / 2 + 0.012);
      fg.add(door);
      const awning = box(0.3, 0.035, 0.14, C.mustard);
      awning.position.set(0, 0.34, w / 2 + 0.05);
      awning.rotation.x = -0.22;
      fg.add(awning);
    }
    floors.push({ group: fg, h: fh });
    g.add(fg);
    lastFg = fg;
    y += fh;
  }

  if (level === 2) {
    const roof = pyramid(baseW + 0.16, 0.34, roofColor);
    roof.position.y = fh + 0.17;
    lastFg.add(roof);
    const chim = box(0.1, 0.24, 0.1, shade(roofColor, -0.12));
    chim.position.set(-0.26, fh + 0.2, 0.2);
    lastFg.add(chim);
    const patio = box(0.52, 0.04, 0.42, C.road, { rough: 0.96 });
    patio.position.set(0.46, 0.02, 0.6);
    g.add(patio);
    for (let i = 0; i < 3; i++) {
      const hedge = mesh(new THREE.IcosahedronGeometry(0.09, 0), mat(C.sage, { flat: true }));
      hedge.position.set(0.22 + i * 0.22, 0.1, 0.8);
      g.add(hedge);
    }
  } else {
    const topW = level === 4 ? baseW - (nFloors - 1) * 0.032 : baseW;
    const slab = box(topW + 0.12, 0.07, topW + 0.12, roofColor);
    slab.position.y = fh + 0.035;
    lastFg.add(slab);
    if (level === 3) {
      const sky = box(0.32, 0.13, 0.24, C.slate, { rough: 0.25, metal: 0.2, emissive: 0x35465c, emissiveIntensity: 0.3 });
      sky.position.set(0.02, fh + 0.14, -0.02);
      sky.rotation.y = 0.35;
      lastFg.add(sky);
      addRailing(lastFg, topW + 0.06, fh + 0.07, 0.1, trimColor);
    } else {
      addRailing(lastFg, topW + 0.04, fh + 0.07, 0.16, shade(C.sage, -0.28));
      for (let b = 0; b < 4; b++) {
        const bush = mesh(new THREE.IcosahedronGeometry(rand(0.075, 0.105), 0), mat(C.sage, { flat: true }));
        bush.position.set((b % 2 ? 1 : -1) * topW * 0.28, fh + 0.12, (b < 2 ? 1 : -1) * topW * 0.28);
        lastFg.add(bush);
      }
      const pole = box(0.02, 0.5, 0.02, 0x8b83a3);
      pole.position.set(-topW * 0.38, fh + 0.3, topW * 0.38);
      lastFg.add(pole);
      const flag = box(0.2, 0.1, 0.02, C.mustard);
      flag.position.set(-topW * 0.38 + 0.1, fh + 0.5, topW * 0.38);
      lastFg.add(flag);
    }
  }

  const treeSpots = level === 4
    ? [[-0.66, 0.62, 0.92], [0.64, -0.6, 0.8]]
    : level === 2 ? [[-0.62, 0.62, 0.78]] : [];
  treeSpots.forEach(([x, z, s]) => {
    const t = makeTree(1);
    t.position.set(x, 0, z);
    t.userData.base = s;
    t.scale.setScalar(0.01);
    g.add(t);
    registerTree(t);
    trees.push(t);
    gsap.to(t.scale, { x: s, y: s, z: s, duration: 0.9, delay: 0.32 + trees.length * 0.12, ease: 'elastic.out(1,0.5)' });
  });

  return { group: g, floors, windows, height: y + (level === 2 ? 0.34 : 0.14), trees };
}

}

function dropModule(site) {

  state.flipGuard = now;

  if (!site) return;

  site.flips += 1;
  state.flips += 1;
  const n = site.flips;

  gsap.to(site.scaffold.scale, { y: Math.min(1.32, 1 + n * 0.022), duration: 0.45, ease: 'elastic.out(1,0.5)' });

function makeRoute(pts) {
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    segs.push({ a, b, len, start: total });
    total += len;
  }
  return { segs, total };
}
const CAR_ROUTE = makeRoute([[-0.4, 0.4], [2.95, 0.4], [2.95, 3.0], [-0.4, 3.0]]);
function routeAt(route, d) {
  d = ((d % route.total) + route.total) % route.total;
  for (const s of route.segs) {
    if (d <= s.len) {
      const u = d / s.len;
      return {
        x: s.a[0] + (s.b[0] - s.a[0]) * u,
        z: s.a[1] + (s.b[1] - s.a[1]) * u,
        dir: Math.atan2(s.b[0] - s.a[0], s.b[1] - s.a[1]),
      };
    }
    d -= s.len;
  }
  return { x: route.segs[0].a[0], z: route.segs[0].a[1], dir: 0 };
}

/* ---------------- 永动循环 ---------------- */
let lastFrame = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const t = now / 1000;
  const dt = Math.min(0.05, (now - lastFrame) / 1000 || 0.016);
  lastFrame = now;

  if (ctl.auto) ctl.azTarget += dt * 0.12;
  const k = 1 - Math.exp(-dt * 9);
  ctl.az += (ctl.azTarget - ctl.az) * k;
  ctl.polar += (ctl.polarTarget - ctl.polar) * k;
  ctl.zoom += (ctl.zoomTarget - ctl.zoom) * k;
  updateCamera();

  city.position.y = Math.sin(t * 0.55) * 0.05;

  clouds.forEach((c, i) => {
    c.g.position.x += c.speed * dt;
    if (c.g.position.x > 13) c.g.position.x = -13;
    c.g.position.y = c.baseY + Math.sin(t * 0.5 + c.phase) * 0.14;
    const sh = cloudShadows[i];
    if (sh) sh.position.set(c.g.position.x, 0.02, c.g.position.z);
  });
  lowClouds.forEach((c) => {
    c.g.position.x += c.speed * dt;
    if (c.g.position.x > 12) c.g.position.x = -12;
    c.g.position.y = c.baseY + Math.sin(t * 0.25 + c.phase) * 0.2;
  });
  if (state.floaters) {
    state.floaters.forEach((f) => {
      f.m.position.y = f.base + Math.sin(t * 0.6 + f.phase) * 0.14;
    });
  }
  state.spinners.forEach((s) => { s.obj.rotation[s.axis] += dt * s.speed; });
  state.wheels.forEach((w) => {
    const { spinner, cabins } = w.userData;
    const boost = state.wheelBoost > 0 ? 2.6 : 1;
    spinner.rotation.z += dt * 0.55 * boost;
    cabins.forEach((cab) => { cab.rotation.z = -spinner.rotation.z; });
  });
  state.wheelBoost = Math.max(0, state.wheelBoost - dt);
  state.windmills.forEach((w) => { w.userData.spinner.rotation.z += dt * 1.1; });
  state.cars.forEach((car) => {
    car.dist += car.speed * dt;
    const p = routeAt(CAR_ROUTE, car.dist);
    car.g.position.set(p.x, 0.075, p.z);
    car.heading = lerpAngle(car.heading, p.dir, 1 - Math.exp(-dt * 12));
    car.g.rotation.y = car.heading;
  });
  state.balloons.forEach((b) => {
    b.angle += b.speed * dt;
    const bc = state.balloonCenter;
    b.g.position.set(
      bc.x + Math.cos(b.angle) * b.radius,
      b.height + Math.sin(t * 0.6 + b.phase) * 0.25,
      bc.z + Math.sin(b.angle) * b.radius
    );
    b.g.rotation.y = -b.angle;
    b.g.rotation.z = Math.sin(t * 0.5 + b.phase) * 0.03;
  });
  state.zeppelins.forEach((z) => {
    z.angle += z.speed * dt;
    z.g.position.set(
      Math.cos(z.angle) * z.radius,
      z.height + Math.sin(t * 0.3) * 0.15,
      Math.sin(z.angle) * z.radius
    );
    z.g.rotation.y = -z.angle - Math.PI / 2;
    z.g.userData.propellers.forEach((p, i) => { p.rotation.z += dt * (6 + i); });
  });
  if (state.rail) {
    const rail = state.rail;
    rail.dist += dt * 0.9;
    rail.cars.forEach((car, i) => {
      const p = routeAt(rail.route, rail.dist - i * 1.05);
      car.position.set(p.x, 0.92, p.z);
      car.rotation.y = p.dir;
    });
  }
  if (state.site && state.site.crane) {
    const c = state.site.crane;
    c.userData.top.rotation.y += dt * 0.18;
    c.userData.tipMat.emissiveIntensity = 1.2 + Math.sin(t * 4) * 0.9;
  }
  if (state.site && state.site.drone) {
    const d = state.site.drone;
    d.position.set(Math.cos(t * 2.1 + 0.4) * 0.95, 1.45 + Math.sin(t * 3.1) * 0.12, Math.sin(t * 2.1 + 0.4) * 0.95);
    d.userData.rotors.forEach((r, i) => { r.rotation.y += dt * (8 + i * 1.5); });
  }
  if (state.site && state.site.energy.length) {
    state.site.energy.forEach((r, i) => {
      r.rotation.z += dt * (0.4 + i * 0.2);
      r.rotation.y += dt * 0.25;
    });
  }
  state.trees.forEach((tr) => {
    tr.g.rotation.z = Math.sin(t * tr.speed + tr.phase) * tr.amp;
    tr.g.rotation.x = Math.cos(t * tr.speed * 0.8 + tr.phase) * tr.amp * 0.7;
  });

  renderer.render(scene, camera);
}

function addWindowsRect(fg, w, d, fh, dense, style) {
  const out = [];
  const ww = dense ? 0.12 : 0.145;
  const wh = style === 'bungalow' ? 0.3 : 0.26;
  const gap = dense ? 0.27 : 0.31;
  const yy = fh * (style === 'bungalow' ? 0.5 : 0.56);
  const faces = [
    { axis: 'z', sign: 1, len: w, span: w },
    { axis: 'z', sign: -1, len: w, span: w },
    { axis: 'x', sign: 1, len: d, span: d },
    { axis: 'x', sign: -1, len: d, span: d },
  ];
  faces.forEach((f) => {
    const n = Math.max(1, Math.floor(f.len / gap));
    for (let i = 0; i < n; i++) {
      const t = -f.len / 2 + (i + 0.5) * (f.len / n);
      const geo = f.axis === 'z'
        ? new THREE.BoxGeometry(ww, wh, 0.03)
        : new THREE.BoxGeometry(0.03, wh, ww);
      const m = new THREE.Mesh(geo, windowMat(false));
      if (f.axis === 'z') m.position.set(t, yy, f.sign * (d / 2 + 0.012));
      else m.position.set(f.sign * (w / 2 + 0.012), yy, t);
      m.castShadow = false;
      fg.add(m);
      out.push(m);
    }
  });
  return out;
}

function makeCityBuilding(o = {}) {
  const opt = Object.assign({
    w: 1.0, d: 1.0, floors: 3, style: 'apartment', color: C.terracotta,
    roof: 'flat', setbacks: 0, balcony: false, dense: false, sign: false, awning: false,
  }, o);
  const { w, d, floors, style, color, roof, setbacks, balcony, dense } = opt;
  const g = new THREE.Group();
  const floorsArr = [];
  const windows = [];
  const trim = shade(color, -0.16);
  const roofCol = shade(color, -0.27);
  const fh = style === 'tower' ? 0.44 : style === 'bungalow' ? 0.7 : 0.5;
  const plinth = box(w + 0.16, 0.1, d + 0.16, C.dark, { rough: 0.92 });
  plinth.position.y = 0.05;
  g.add(plinth);
  let y = 0.1;

  for (let i = 0; i < floors; i++) {
    const isSetback = setbacks > 0 && i >= floors - setbacks;
    const shrink = isSetback ? 0.13 * (i - (floors - setbacks) + 1) : 0;
    const fw = Math.max(0.5, w - shrink);
    const fd = Math.max(0.5, d - shrink);
    const col = i % 2 === 0 ? color : shade(color, 0.03);
    const fg = new THREE.Group();
    fg.position.y = y;
    const body = box(fw, fh, fd, col, { rough: 0.76 });
    body.position.y = fh / 2;
    fg.add(body);
    const band = box(fw + 0.04, 0.05, fd + 0.04, trim, { rough: 0.8 });
    band.position.y = fh - 0.026;
    fg.add(band);
    windows.push(...addWindowsRect(fg, fw, fd, fh, dense, style));
    if (i === 0) {
      const door = box(0.18, 0.3, 0.05, shade(color, -0.42));
      door.position.set(0, 0.15, fd / 2 + 0.012);
      fg.add(door);
      if (opt.awning || style === 'shop') addAwning2(fg, fw, fd, 0.36, C.mustard, C.terracotta);
      if (opt.sign) {
        const sign = box(fw * 0.52, 0.16, 0.04, C.mustard, { emissive: C.glow, emissiveIntensity: 0.3 });
        sign.position.set(0, 0.78, fd / 2 + 0.06);
        fg.add(sign);
      }
    }
    if (balcony && i > 0 && i < floors) addBalcony2(fg, fw, fd, 0.12);
    floorsArr.push({ group: fg, h: fh, w: fw, d: fd });
    g.add(fg);
    y += fh;
  }

  const last = floorsArr[floorsArr.length - 1];
  const tw = last.w, td = last.d;
  const roofGroup = new THREE.Group();
  roofGroup.position.y = y;
  let roofH = 0.24;

  if (roof === 'pitch') {
    const r = hipRoof(tw + 0.16, td + 0.16, 0.38, roofCol);
    roofGroup.add(r);
    const chim = box(0.1, 0.28, 0.1, shade(roofCol, -0.1));
    chim.position.set(-tw * 0.28, 0.2, td * 0.18);
    roofGroup.add(chim);
    const dormer = box(0.2, 0.16, 0.08, C.cream);
    dormer.position.set(tw * 0.2, 0.16, td * 0.28);
    roofGroup.add(dormer);
    roofH = 0.38;
  } else {
    const slab = box(tw + 0.1, 0.06, td + 0.1, roofCol, { rough: 0.8 });
    slab.position.y = 0.03;
    roofGroup.add(slab);
    addParapet(roofGroup, tw, td, 0, trim);
    if (roof === 'garden') {
      const t = 0.022, h = 0.12;
      const bars = [
        [tw, t, 0, td / 2], [tw, t, 0, -td / 2],
        [t, td, tw / 2, 0], [t, td, -tw / 2, 0],
      ];
      bars.forEach(([bw, bd, x, z]) => {
        const b = box(bw, h, bd, shade(C.sage, -0.28), { rough: 0.65 });
        b.position.set(x, 0.12, z);
        roofGroup.add(b);
      });
      for (let i = 0; i < 4; i++) {
        const bush = mesh(new THREE.IcosahedronGeometry(0.075 + (i % 2) * 0.02, 0), mat(C.sage, { flat: true }));
        bush.position.set((i % 2 ? 1 : -1) * tw * 0.25, 0.14, (i < 2 ? 1 : -1) * td * 0.25);
        roofGroup.add(bush);
      }
      const mini = makeTree(0.46);
      mini.position.set(-tw * 0.22, 0.07, td * 0.2);
      roofGroup.add(mini);
      registerTree(mini);
      roofH = 0.5;
    } else if (roof === 'tower') {
      const crown = box(tw * 0.62, 0.34, td * 0.62, shade(color, 0.06), { rough: 0.7 });
      crown.position.y = 0.23;
      roofGroup.add(crown);
      const crownBand = box(tw * 0.65, 0.04, td * 0.65, C.mustard);
      crownBand.position.y = 0.41;
      roofGroup.add(crownBand);
      const spire = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.52, 4), mat(shade(color, -0.1), { flat: true }));
      spire.position.y = 0.72;
      spire.rotation.y = Math.PI / 4;
      spire.castShadow = true;
      roofGroup.add(spire);
      addWaterTank(roofGroup, tw * 0.3, -td * 0.28, 0.06, C.slate);
      const rt = 0.022;
      [[tw, rt, 0, td / 2], [tw, rt, 0, -td / 2], [rt, td, tw / 2, 0], [rt, td, -tw / 2, 0]].forEach(([bw, bd, x, z]) => {
        const b = box(bw, 0.12, bd, shade(C.sage, -0.28), { rough: 0.65 });
        b.position.set(x, 0.12, z);
        roofGroup.add(b);
      });
      for (let i = 0; i < 3; i++) {
        const bush = mesh(new THREE.IcosahedronGeometry(0.075 + (i % 2) * 0.018, 0), mat(C.sage, { flat: true }));
        bush.position.set((i - 1) * tw * 0.26, 0.15, td * 0.24);
        roofGroup.add(bush);
      }
      const mini = makeTree(0.4);
      mini.position.set(-tw * 0.26, 0.07, td * 0.18);
      roofGroup.add(mini);
      registerTree(mini);
      roofH = 0.98;
    } else {
      addWaterTank(roofGroup, tw * 0.3, -td * 0.28, 0.06, style === 'bungalow' ? C.slate : C.terracotta);
      addAC(roofGroup, -tw * 0.26, td * 0.2, 0.06);
      if (style !== 'bungalow') {
        const bulk = box(0.22, 0.18, 0.2, trim, { rough: 0.7 });
        bulk.position.set(-tw * 0.28, 0.15, -td * 0.24);
        roofGroup.add(bulk);
      }
      roofH = 0.4;
    }
  }

  g.add(roofGroup);
  return { group: g, floors: floorsArr, windows, height: y + roofH, roofGroup, w, d, opts: opt, roofH };
}

function addRoadStrip(x, z, w, d) {
  const sidewalk = box(w + 0.2, 0.03, d + 0.2, 0xb8b1a4, { rough: 0.95 });
  sidewalk.position.set(x, 0.015, z);
  sidewalk.receiveShadow = true;
  city.add(sidewalk);
  const asphalt = box(w, 0.07, d, 0x454147, { rough: 0.92 });
  asphalt.position.set(x, 0.035, z);
  asphalt.receiveShadow = true;
  city.add(asphalt);
  const horiz = w > d;
  const span = horiz ? w : d;
  const n = Math.max(2, Math.floor(span / 0.62));
  for (let i = 0; i < n; i++) {
    const t = -span / 2 + (i + 0.5) * (span / n);
    const dash = box(horiz ? 0.2 : 0.035, 0.012, horiz ? 0.035 : 0.2, 0xefe9db, { rough: 0.7 });
    dash.position.set(x + (horiz ? t : 0), 0.075, z + (horiz ? 0 : t));
    dash.castShadow = false;
    city.add(dash);
  }
}
function addInitialUnit(lot, opts, delay) {

function retractRing(plot, strength) {
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffd9a0, transparent: true, opacity: 0.34, side: THREE.DoubleSide,
    depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.46, 0.54, 32), mat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(plot.x, 0.09, plot.z);
  ring.scale.setScalar(2.1 + strength * 0.35);
  city.add(ring);
  gsap.to(ring.scale, { x: 0.18, y: 0.18, duration: 0.78 + strength * 0.04, ease: 'power2.in' });
  gsap.to(mat, { opacity: 0, duration: 0.72, onComplete: () => ring.remove() });
}
function retractNod(plot, strength) {
  const near = state.units.filter((u) => u.group && dist2(u.plot, plot) < 5.2);
  near.forEach((u, i) => {
    gsap.killTweensOf(u.group.position, 'y');
    gsap.fromTo(u.group.position, { y: 0 }, {
      y: -0.055 * strength, duration: 0.18, delay: i * 0.045,
      yoyo: true, repeat: 1, ease: 'sine.inOut',
    });
  });
}
function retract2(count = 1) {
  const n = clamp(Math.round(Number(count) || 1), 1, 24);
  const strength = 1 + Math.min(n - 1, 8) * 0.16;
  const site = state.site;
  const fallback = state.buildings[state.buildings.length - 1] || null;
  const unit = site && site.mode === 'reno' ? site.unit : fallback;
  const plot = site ? site.plot : unit && unit.plot ? unit.plot : { x: 0, z: 0 };
  const body = site ? (site.mode === 'new' ? site.body : site.unit && site.unit.group) : unit && unit.group;

  if (body) {
    gsap.killTweensOf(body.scale);
    gsap.timeline()
      .to(body.scale, {
        x: 1 - 0.055 * strength, z: 1 - 0.055 * strength, y: 1 + 0.045 * strength,
        duration: 0.12, ease: 'power2.out',
      })
      .to(body.scale, {
        x: 1, y: 1, z: 1, duration: 0.8 + Math.min(n, 12) * 0.018,
        ease: 'elastic.out(1,0.45)',
      });
  }

  if (site) {
    const modules = site.modules || [];
    const take = Math.min(modules.length, Math.max(2, Math.ceil(n * 1.5)));
    const pieces = take > 0 ? modules.slice(-take) : [];
    pieces.forEach((piece, i) => {
      const base = { x: piece.position.x, y: piece.position.y, z: piece.position.z };
      gsap.to(piece.position, {
        x: base.x * 0.66, z: base.z * 0.66, y: base.y + 0.06 * strength,
        duration: 0.18, delay: i * 0.02, ease: 'power2.out',
        onComplete: () => {
          gsap.to(piece.position, {
            ...base, duration: 0.62 + n * 0.015, delay: 0.04, ease: 'elastic.out(1,0.5)',
          });
        },
      });
    });
    site.energy.forEach((ring) => {
      const s = ring.scale.x;
      gsap.to(ring.scale, {
        x: s * 0.78, y: s * 0.78, z: s * 0.78,
        duration: 0.22, yoyo: true, repeat: 1, ease: 'power2.inOut',
      });
    });
    if (site.crane) {
      const top = site.crane.userData.top;
      gsap.to(top.rotation, {
        y: top.rotation.y - 0.38 * strength, duration: 0.52, ease: 'power2.inOut',
      });
    }
  }

  retractRing(plot, strength);
  retractNod(plot, strength);

  const baseIndex = Math.min(PENTA.length - 1, 6);
  const echoes = Math.min(3, Math.max(1, Math.ceil(n / 2)));
  for (let i = 0; i < echoes; i++) {
    Sound.tone(PENTA[Math.max(0, baseIndex - i)] * 0.5, {
      type: 'sine', dur: 0.8, gain: 0.032, delay: i * 0.07, attack: 0.006,
    });
  }
}

function buildForSpot(spot, level, bonus = 0) {

  } else {
    opts = { w, d, floors: Math.min(6, 5 + bonus), style: 'tower', color: 0xf0dfc2, roof: 'tower', setbacks: 1, dense: true, lit: 0 };

function upgradeUnit(u, level, bonus = 0) {
  const addFloors = level === 2 ? 1 : 2;
  const n = addFloors + (bonus ? 1 : 0);
  const top = u.floors[u.floors.length - 1];
  const fh = u.opts.style === 'tower' ? 0.44 : u.opts.style === 'bungalow' ? 0.66 : 0.5;
  const color = u.opts.color;
  u.roofGroup.visible = false;
  let y = u.floorsHeight;
  const newFloors = [];
  for (let i = 0; i < n; i++) {
    const fw = Math.max(0.5, top.w - i * 0.05);
    const fd = Math.max(0.5, top.d - i * 0.05);
    const fg = new THREE.Group();
    fg.position.y = y;
    const body = box(fw, fh, fd, i % 2 === 0 ? color : shade(color, 0.03), { rough: 0.76 });
    body.position.y = fh / 2;
    fg.add(body);
    const band = box(fw + 0.04, 0.05, fd + 0.04, shade(color, -0.16), { rough: 0.8 });
    band.position.y = fh - 0.026;
    fg.add(band);
    const wins = addWindowsRect(fg, fw, fd, fh, u.opts.dense, u.opts.style);
    fg.scale.set(0.01, 0.01, 0.01);
    gsap.to(fg.scale, { x: 1, y: 1, z: 1, duration: 0.68, delay: 0.12 + i * 0.07, ease: 'back.out(2)' });
    u.group.add(fg);
    newFloors.push({ group: fg, h: fh, w: fw, d: fd });
    u.windows.push(...wins);
    state.allWindows.push(...wins);
    setTimeout(() => lightWindows(wins, 0.05, 1.8), 500 + i * 100);
    y += fh;
  }

  const last = newFloors[newFloors.length - 1];
  const tw = last.w, td = last.d;
  const roof = new THREE.Group();
  roof.position.y = y;
  const roofCol = shade(color, -0.27);
  const slab = box(tw + 0.1, 0.06, td + 0.1, roofCol, { rough: 0.8 });
  slab.position.y = 0.03;
  roof.add(slab);
  addParapet(roof, tw, td, 0, shade(color, -0.16));
  let roofH = 0.4;

  if (level === 4) {
    const t = 0.022, h = 0.13;
    [[tw, t, 0, td / 2], [tw, t, 0, -td / 2], [t, td, tw / 2, 0], [t, td, -tw / 2, 0]].forEach(([bw, bd, x, z]) => {
      const b = box(bw, h, bd, shade(C.sage, -0.28), { rough: 0.65 });
      b.position.set(x, 0.13, z);
      roof.add(b);
    });
    for (let i = 0; i < 4; i++) {
      const bush = mesh(new THREE.IcosahedronGeometry(0.075 + (i % 2) * 0.02, 0), mat(C.sage, { flat: true }));
      bush.position.set((i % 2 ? 1 : -1) * tw * 0.25, 0.14, (i < 2 ? 1 : -1) * td * 0.25);
      roof.add(bush);
    }
    const crown = box(tw * 0.46, 0.3, td * 0.46, C.cream, { rough: 0.7 });
    crown.position.y = 0.24;
    roof.add(crown);
    const spire = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.46, 4), mat(C.mustard, { flat: true }));
    spire.position.y = 0.62;
    spire.rotation.y = Math.PI / 4;
    roof.add(spire);
    roofH = 0.86;
  } else {
    addWaterTank(roof, tw * 0.28, -td * 0.26, 0.06, C.slate);
    addAC(roof, -tw * 0.26, td * 0.2, 0.06);
    roofH = 0.4;
  }
  roof.scale.setScalar(0.01);
  gsap.to(roof.scale, {
    x: 1, y: 1, z: 1, duration: 0.75, delay: 0.14 + n * 0.07,
    ease: 'elastic.out(1,0.5)',
  });
  u.group.add(roof);
  u.roofGroup = roof;
  u.floors.push(...newFloors);
  u.floorsHeight = y;
  u.height = y + roofH;
  updateStats2();
}

  }
  const star = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.55, 5), mat(0x8b83a3));
  pole.position.y = 0.28;
  star.add(pole);
  const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.18, 0), goldMat);
  gem.scale.set(1, 1.5, 1);
  gem.position.y = 0.66;
  gem.castShadow = true;
  star.add(gem);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.012, 5, 24), goldMat);
  halo.position.y = 0.66;
  halo.rotation.x = Math.PI / 2;
  star.add(halo);
  const glowMat = new THREE.SpriteMaterial({ map: getGlowTex(), color: 0xffd58a, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending, depthWrite: false });
  const glow = new THREE.Sprite(glowMat);
  glow.scale.set(0.7, 0.7, 1);
  glow.position.y = 0.66;
  star.add(glow);
  star.position.y = u.floorsHeight + 0.06;
  u.group.add(star);
  state.spinners.push({ obj: star, axis: 'y', speed: 0.8 });
  gsap.fromTo(star.scale, { x: 0.01, y: 0.01, z: 0.01 }, { x: 1, y: 1, z: 1, duration: 0.9, ease: 'elastic.out(1,0.5)' });
  u.highlighted = true;
  state.highlighted.push(u);
  updateStats2();
  Sound.chime();
  Sound.chord([523.25, 659.25, 783.99, 1046.5], 0.8);
  toast('黄色重点已标记 · 星芒在屋顶旋转', 'good');
  log('标黄色重点 · 核心知识建筑被点亮', '#f4d06f');
}

/* ---------------- 做题、指标与自动演示（紧凑城邦版） ---------------- */
function updateStats2() {
  const units = state.buildings.length + (state.site ? 1 : 0);
  const terraced = state.buildings.filter((u) => u.terraced).length;
  const prosperity = state.cars.length * 2 + state.balloons.length * 3
    + state.trees.length + state.highlighted.length * 3 + terraced * 2
    + (state.site ? 1 : 0) + state.lamps.length + Math.round(state.correct * 0.5);
  setStat('statFlips', state.flips);
  setStat('statUnits', units);
  setStat('statHighlights', state.highlighted.length);
  setStat('statProsperity', prosperity);
  broadcastStats();
}

function quiz2() {
  if (!state.ready) return;
  Sound.resume();
  state.correct += 1;
  const n = state.correct;

  if (state.buildings.length) {
    const u = state.buildings[Math.floor(Math.random() * state.buildings.length)];
    lightWindows(u.windows, 0.04, 2.3);
    setTimeout(() => {
      u.windows.forEach((w) => gsap.to(w.material, { emissiveIntensity: 1.8, duration: 0.5 }));
    }, 1400);
  }
  if (state.cars.length < 6) spawnCar();

  state.wheelBoost = 1.35;
  const wheel = state.wheels[0];
  if (wheel) {
    if (wheel.userData.bulbMat) {
      gsap.to(wheel.userData.bulbMat, { emissiveIntensity: 3.2, duration: 0.18, yoyo: true, repeat: 3 });
    }
    gsap.to(wheel.scale, { x: 0.99, y: 0.99, z: 0.99, duration: 0.24, yoyo: true, repeat: 1 });
  }
  if (n % 2 === 0 && state.balloons.length < 3) spawnBalloon();

  if (n % 2 === 1) Sound.horn();
  else Sound.bell();
  toast('做题检验通过 · 知识节点已点亮（不改复习排期）', 'good');
  log('做题检验 · 城市通电，第 ' + n + ' 次繁荣注入', '#f4d06f');
  updateStats2();
}

function demo2() {
  if (state.demo || !state.ready) return;
  state.demo = true;
  Sound.resume();
  document.body.classList.add('demo-lock');
  const btn = $('#demoBtn');
  const oldHTML = btn.innerHTML;
  btn.innerHTML = '<span class="glyph">●</span><span class="a-txt"><b>沉浸演示中…</b><small>翻卡 · 评分 · 编辑 · 做题</small></span>';
  const tl = gsap.timeline({
    onComplete: () => {
      state.demo = false;
      document.body.classList.remove('demo-lock');
      btn.innerHTML = oldHTML;
      toast('演示完成 · 这座小城会继续呼吸', 'good');
      log('演示结算 · 10x10 城邦越学越精密', '#a78bfa');
    },
  });
  for (let i = 0; i < 6; i++) tl.call(() => flip2(), null, 0.5 + i * 0.22);
  tl.call(() => rate2(4), null, 2.2);
  tl.call(() => pinAction(), null, 2.95);
  for (let i = 0; i < 5; i++) tl.call(() => flip2(), null, 3.35 + i * 0.22);
  tl.call(() => rate2(3), null, 4.8);
  tl.call(() => pinAction(), null, 5.55);
  for (let i = 0; i < 4; i++) tl.call(() => flip2(), null, 5.95 + i * 0.22);
  tl.call(() => rate2(2), null, 7.2);
  tl.call(() => structureAction2(), null, 7.9);
  tl.call(() => detailAction2(), null, 8.5);
  tl.call(() => highlightAction2(), null, 9.1);
  for (let i = 0; i < 5; i++) tl.call(() => quiz2(), null, 9.8 + i * 0.4);
}

function bindEvents2() {
  $('#flipBtn').addEventListener('click', () => {
    if (state.demo) return;
    flip2();
    $('#flipBtn').blur();
  });
  $$('[data-level]').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (state.demo) return;
      rate2(Number(btn.dataset.level));
      btn.blur();
    });
  });
  $$('[data-act]').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (state.demo) return;
      const a = btn.dataset.act;
      if (a === 'pin') pinAction();
      else if (a === 'structure') structureAction2();
      else if (a === 'detail') detailAction2();
      else if (a === 'highlight') highlightAction2();
      else if (a === 'quiz') quiz2();
      else if (a === 'demo') demo2();
      btn.blur();
    });
  });
  $('#soundBtn').addEventListener('click', () => { toggleSound(); $('#soundBtn').blur(); });
  $('#orbitBtn').addEventListener('click', () => { setOrbit(!ctl.auto); $('#orbitBtn').blur(); });
  $('#resetBtn').addEventListener('click', () => { resetView(); $('#resetBtn').blur(); });

  window.addEventListener('keydown', (e) => {
    if (IS_EMBED) return;
    if (!state.ready || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'm') { e.preventDefault(); toggleSound(); return; }
    if (state.demo) return;
    if (k === 'enter' || k === ' ') { e.preventDefault(); flip2(); }
    else if (['1', '2', '3', '4'].includes(k)) { e.preventDefault(); rate2(Number(k)); }
    else if (k === 'p') { e.preventDefault(); pinAction(); }
    else if (k === 'b') { e.preventDefault(); structureAction2(); }
    else if (k === 'c') { e.preventDefault(); detailAction2(); }
    else if (k === 'h') { e.preventDefault(); highlightAction2(); }
    else if (k === 'q') { e.preventDefault(); quiz2(); }
    else if (k === 'd') { e.preventDefault(); demo2(); }
  });
}

/* ---------------- 交互与启动 ---------------- */
function editIsland() {
  if (!state.ready) return;
  Sound.resume();
  expandIsland(false);
  if (!state.site) ensureSite();
}
function intro() {
  ctl.az = ISO_AZ - 0.45;
  ctl.azTarget = ISO_AZ;
  ctl.zoom = 0.94;
  ctl.zoomTarget = 0.94;
  gsap.to(ctl, { zoomTarget: 1, duration: 2.6, delay: 0.2, ease: 'power3.out' });
}
function bindEvents() {
  $('#flipBtn').addEventListener('click', () => {
    if (state.demo) return;
    flip();
    $('#flipBtn').blur();
  });
  $$('[data-level]').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (state.demo) return;
      rate(Number(btn.dataset.level));
      btn.blur();
    });
  });
  $$('[data-act]').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (state.demo) return;
      const a = btn.dataset.act;
      if (a === 'edit') editIsland();
      else if (a === 'quiz') quiz();
      else if (a === 'demo') demo();
      btn.blur();
    });
  });
  $('#soundBtn').addEventListener('click', () => { toggleSound(); $('#soundBtn').blur(); });
  $('#orbitBtn').addEventListener('click', () => { setOrbit(!ctl.auto); $('#orbitBtn').blur(); });
  $('#resetBtn').addEventListener('click', () => { resetView(); $('#resetBtn').blur(); });

  window.addEventListener('keydown', (e) => {
    if (IS_EMBED) return;
    if (!state.ready || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'm') { e.preventDefault(); toggleSound(); return; }
    if (state.demo) return;
    if (k === 'enter' || k === ' ') { e.preventDefault(); flip(); }
    else if (['1', '2', '3', '4'].includes(k)) { e.preventDefault(); rate(Number(k)); }
    else if (k === 'q') { e.preventDefault(); quiz(); }
    else if (k === 'e') { e.preventDefault(); editIsland(); }
    else if (k === 'd') { e.preventDefault(); demo(); }
  });
}

async function boot() {
  const bootEl = $('#boot');
  try {
    gsap = await loadGsap();
    gsap.ticker.lagSmoothing(0);
    THREE = await loadThree();
    initScene();
    buildCompactCity();
    bindEvents2();
    state.ready = true;
    document.body.classList.remove('loading');
    postToParent('ready', { stats: currentStats2() });
    broadcastStats();
    bootEl.classList.add('done');
    setTimeout(() => bootEl.remove(), 1000);
    intro();
    requestAnimationFrame(animate);
    window.__city = {
      state, flip: flip2, retract: retract2, rate: rate2, quiz: quiz2, demo: demo2, pinAction,
      structureAction2, detailAction2, highlightAction2, toggleSound,
      THREE, camera, scene, renderer, ctl, Sound,
    };
  } catch (err) {
    console.error(err);
    bootEl.classList.add('error');
    bootEl.innerHTML = '<p>小城没能点亮</p><small>依赖加载失败，请检查网络后刷新<br>（Three.js / GSAP 通过 CDN 加载）</small>';
  }
}
/* ---------------- 嵌入式（产品浮窗）桥接 ---------------- */
const IS_EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (IS_EMBED) {
  document.body.classList.add('embed');
  CDN.three.unshift('./vendor/three.module.js');
  CDN.gsap.unshift('./vendor/gsap.min.js');
}
function postToParent(type, payload) {
  if (window.parent === window) return;
  try { window.parent.postMessage({ source: 'memory-anki-city', type, payload }, '*'); } catch (e) { /* ignore */ }
}
function currentStats2() {
  const units = state.buildings.length + (state.site ? 1 : 0);
  const terraced = state.buildings.filter((u) => u.terraced).length;
  const prosperity = state.cars.length * 2 + state.balloons.length * 3
    + state.trees.length + state.highlighted.length * 3 + terraced * 2
    + (state.site ? 1 : 0) + state.lamps.length + Math.round(state.correct * 0.5);
  return {
    flips: state.flips, units, highlights: state.highlighted.length, prosperity,
    combo: state.site ? state.site.flips : 0, correct: state.correct,
    buildings: state.buildings.length, balloons: state.balloons.length, cars: state.cars.length,
  };
}
function broadcastStats() {
  if (IS_EMBED) postToParent('stats', currentStats2());
}
function celebrate2() {
  Sound.resume();
  Sound.chord([261.63, 329.63, 392.0, 493.88, 587.33, 783.99], 1.2);
  Sound.chime();
  const ringSite = { plot: { x: 0, z: 0 } };
  rippleRing(ringSite);
  if (state.balloons.length < 4) spawnBalloon();
  broadcastStats();
}
function setCityMuted(m) {
  Sound.resume();
  const next = !!m;
  if (state.muted === next) {
    if (IS_EMBED) postToParent('audio', { state: Sound.ctx ? Sound.ctx.state : 'none', muted: state.muted });
    return;
  }
  state.muted = next;
  Sound.setMuted(next);
  const btn = $('#soundBtn');
  if (btn) {
    btn.classList.toggle('muted', next);
    btn.innerHTML = next ? '🔇 <span>静音</span>' : '🔊 <span>音效</span>';
  }
  if (IS_EMBED) postToParent('audio', { state: Sound.ctx ? Sound.ctx.state : 'none', muted: next });
}
window.addEventListener('message', (e) => {
  const data = e.data;
  if (!data || data.source !== 'memory-anki-host') return;
  if (!state.ready) return;
  const payload = data.payload || {};
  if (data.type === 'flip') flip2();
  else if (data.type === 'retract') retract2(Number(payload.count) || 1);
  else if (data.type === 'rating') rate2(Number(payload.level) || 3);
  else if (data.type === 'quiz') { if (payload.correct === false) { Sound.tone(160, { type: 'sine', dur: 0.3, gain: 0.06 }); } else quiz2(); }
  else if (data.type === 'celebrate') celebrate2();
  else if (data.type === 'mute') setCityMuted(payload.muted);
  else if (data.type === 'orbit') setOrbit(!!payload.on);
  else if (data.type === 'reset') resetView();
  else if (data.type === 'demo') demo2();
  else if (data.type === 'pin') pinAction();
  else if (data.type === 'structure') structureAction2();
  else if (data.type === 'detail') detailAction2();
  else if (data.type === 'highlight') highlightAction2();
});
document.addEventListener('pointerdown', () => {
  if (!state.ready) return;
  Sound.resume();
  setTimeout(() => {
    if (IS_EMBED) postToParent('audio', { state: Sound.ctx ? Sound.ctx.state : 'none', muted: state.muted });
  }, 160);
}, { passive: true });
boot();
</script>
