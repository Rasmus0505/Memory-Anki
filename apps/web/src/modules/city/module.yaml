{
  "name": "city",
  "owns": [
    "learning-city horizon strip in study scenes",
    "today-island plan built from the city-today read model"
  ],
  "forbids": [
    "private cross-module imports",
    "writing learning or scheduling data",
    "calling the progression API"
  ],
  "publicEntry": "src/modules/city/public.ts",
  "workflows": [],
  "ports": [],
  "events": [
    "review-unit:rated",
    "review-state:changed",
    "round-completed",
    "memory-anki:mindmap-card-landed",
    "memory-anki-global-feedback-request"
  ],
  "dependencies": [],
  "invariants": [
    "the Three.js scene lives in the isolated public/city iframe, never in the React bundle",
    "the strip takes its own layout height and ignores pointer input; it never covers study content",
    "the city is a read-only visualization and never writes learning data"
  ],
  "requiredTests": [
    "src/modules/city/model/horizonModel.test.ts"
  ]
}
