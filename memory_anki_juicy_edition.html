<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory-Anki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-zenith: #0b0f17;
      --card-revealed: #151c28;
      --card-pending: #111722;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-zenith);
      color: #f1f5f9;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Clean Obsidian Canvas with Subtle Dot Matrix & Ambient Aura */
    .mindmap-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      background-color: var(--bg-zenith);
      background-image:
        radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.045) 0%, transparent 65%),
        radial-gradient(rgba(148, 163, 184, 0.11) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px;
      transition: box-shadow 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mindmap-viewport.is-panning {
      cursor: grabbing;
    }

    /* Ambient border aura wave triggered by whole-map rating */
    .mindmap-viewport.aura-forgot {
      box-shadow: inset 0 0 90px rgba(251, 113, 133, 0.22);
    }
    .mindmap-viewport.aura-hard {
      box-shadow: inset 0 0 90px rgba(251, 191, 36, 0.22);
    }
    .mindmap-viewport.aura-good {
      box-shadow: inset 0 0 95px rgba(52, 211, 153, 0.24);
    }
    .mindmap-viewport.aura-easy {
      box-shadow: inset 0 0 110px rgba(129, 140, 248, 0.28);
    }

    /* World Container (Only transforms on manual pan/zoom, NEVER jumps on flip) */
    .mindmap-world {
      position: absolute;
      top: 0;
      left: 0;
      width: 4200px;
      height: 3200px;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
    }

    .links-svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 4200px;
      height: 3200px;
      overflow: visible;
      pointer-events: none;
      z-index: 5;
    }

    .nodes-dom-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 4200px;
      height: 3200px;
      pointer-events: none;
      z-index: 10;
    }

    /* SVG Cubic Bezier Connectors */
    .mm-link-glow {
      fill: none;
      stroke-linecap: round;
      filter: blur(4px);
      opacity: 0.35;
      transition: stroke 0.4s ease, opacity 0.4s ease;
    }

    .mm-link-core {
      fill: none;
      stroke-linecap: round;
      transition: stroke 0.4s ease, stroke-width 0.35s ease;
    }

    .mm-link-bead {
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 4 28;
      animation: beadFlow 1.8s linear infinite;
    }

    @keyframes beadFlow {
      from { stroke-dashoffset: 32; }
      to { stroke-dashoffset: 0; }
    }

    /* Mindmap Node Anchor (Deterministic Fixed World Coordinates) */
    .mm-node-anchor {
      position: absolute;
      transform: translate(0, -50%);
      pointer-events: auto;
      perspective: 1000px;
      z-index: 12;
      transition:
        transform 0.46s cubic-bezier(0.22, 1.35, 0.36, 1),
        opacity 0.32s ease;
      will-change: transform, opacity;
    }

    .mm-node-anchor:hover {
      z-index: 25;
    }

    /* Retracting Ghost on Right-Click Collapse */
    .mm-node-ghost-retract {
      position: absolute;
      transform: translate(0, -50%);
      pointer-events: none;
      z-index: 8;
      transition:
        transform 0.34s cubic-bezier(0.55, 0.05, 0.25, 1),
        opacity 0.3s ease;
    }

    /* 3D Spring Flipper */
    .mm-card-flipper {
      position: relative;
      width: 228px;
      min-height: 68px;
      transform-style: preserve-3d;
      transition: transform 0.52s cubic-bezier(0.22, 1.35, 0.36, 1);
      cursor: pointer;
    }

    .mm-node-anchor.is-root .mm-card-flipper {
      width: 244px;
      min-height: 76px;
    }

    .mm-card-flipper.state-revealed {
      transform: rotateY(180deg);
    }

    .mm-card-flipper.tactile-bounce {
      animation: cardSpringBounce 0.36s cubic-bezier(0.22, 1.35, 0.36, 1);
    }

    @keyframes cardSpringBounce {
      0% { transform: rotateY(180deg) scale(1); }
      35% { transform: rotateY(180deg) scale(0.93); }
      75% { transform: rotateY(180deg) scale(1.04); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    /* Card Faces */
    .mm-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      width: 100%;
      min-height: 68px;
      position: relative;
      overflow: hidden;
      transition:
        box-shadow 0.25s ease,
        border-color 0.25s ease,
        transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mm-node-anchor.is-root .mm-face {
      min-height: 76px;
      border-radius: 16px;
    }

    /* Face 1: PENDING (Shows ONLY 「待回忆」) */
    .mm-face-pending {
      transform: rotateY(0deg);
      background: var(--card-pending);
      border: 1.5px solid rgba(245, 158, 11, 0.48);
      box-shadow:
        0 10px 26px -6px rgba(0, 0, 0, 0.65),
        0 0 16px -6px rgba(245, 158, 11, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
    }

    .mm-face-pending:hover {
      border-color: rgba(251, 191, 36, 0.85);
      box-shadow:
        0 14px 30px -6px rgba(0, 0, 0, 0.75),
        0 0 22px -2px rgba(251, 191, 36, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transform: translateY(-1.5px) scale(1.015);
    }

    .mm-face-pending:active {
      transform: scale(0.97);
    }

    /* Subtle Diagonal Shimmer on Pending Card */
    .mm-face-pending::before {
      content: '';
      position: absolute;
      inset: -60%;
      background: linear-gradient(
        115deg,
        transparent 42%,
        rgba(251, 191, 36, 0.07) 49%,
        rgba(255, 255, 255, 0.12) 50%,
        rgba(251, 191, 36, 0.07) 51%,
        transparent 58%
      );
      animation: pendingShimmer 4.2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pendingShimmer {
      0% { transform: translateX(-45%) rotate(10deg); }
      100% { transform: translateX(45%) rotate(10deg); }
    }

    /* Face 2: REVEALED (Shows ONLY original study text 原文) */
    .mm-face-revealed {
      transform: rotateY(180deg);
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--card-revealed);
      border: 1.5px solid rgba(56, 189, 248, 0.45);
      box-shadow:
        0 12px 28px -8px rgba(0, 0, 0, 0.72),
        0 0 18px -6px rgba(56, 189, 248, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      padding: 13px 18px;
    }

    .mm-node-anchor.is-root .mm-face-revealed {
      background: linear-gradient(145deg, #192233 0%, #131a27 100%);
      border: 1.5px solid rgba(56, 189, 248, 0.72);
      box-shadow:
        0 14px 32px -6px rgba(0, 0, 0, 0.78),
        0 0 24px -4px rgba(56, 189, 248, 0.3);
    }

    .mm-face-revealed:hover {
      border-color: rgba(125, 211, 252, 0.82);
      box-shadow:
        0 16px 32px -6px rgba(0, 0, 0, 0.8),
        0 0 24px -3px rgba(56, 189, 248, 0.35);
      transform: translateY(-1px);
    }

    /* Specular light sheen sweep upon reveal */
    .mm-face-revealed::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        105deg,
        transparent 25%,
        rgba(255, 255, 255, 0.16) 50%,
        transparent 75%
      );
      transform: translateX(-120%);
      pointer-events: none;
    }

    .mm-card-flipper.state-revealed .mm-face-revealed::after {
      animation: revealSheen 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes revealSheen {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }

    /* Study Text Typography (Zero Clutter, Crisp Key Concepts) */
    .mm-study-text {
      width: 100%;
      font-size: 15px;
      line-height: 1.52;
      color: #e2e8f0;
      font-weight: 500;
      letter-spacing: 0.01em;
      word-break: break-word;
    }

    .mm-node-anchor.is-root .mm-study-text {
      font-size: 16px;
      font-weight: 600;
      color: #f8fafc;
      text-align: center;
    }

    .mm-study-text strong {
      color: #7dd3fc;
      font-weight: 700;
    }

    /* Purely Visual Right-Edge Connection Socket (No text labels!) */
    .mm-socket-dot {
      position: absolute;
      right: -5.5px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      z-index: 30;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    /* Amber pulse: next click on this parent will spawn hidden children as 待回忆 */
    .mm-socket-dot.next-spawn {
      background: #f59e0b;
      border: 2px solid #fef3c7;
      box-shadow: 0 0 10px #f59e0b;
      animation: socketPulse 1.6s infinite ease-in-out;
    }

    /* Cyan pulse: next click on this parent will flip 待回忆 children to 已翻开 */
    .mm-socket-dot.next-flip {
      background: #38bdf8;
      border: 2px solid #e0f2fe;
      box-shadow: 0 0 10px #38bdf8;
      animation: socketPulse 1.4s infinite ease-in-out;
    }

    /* Calm emerald: all descendants under this parent are revealed */
    .mm-socket-dot.all-complete {
      background: #10b981;
      border: 2px solid #064e3b;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
    }

    @keyframes socketPulse {
      0%, 100% { transform: translateY(-50%) scale(1); }
      50% { transform: translateY(-50%) scale(1.32); }
    }

    /* Bottom Rating Dock Pill Buttons */
    .rating-pill-btn {
      position: relative;
      transition: all 0.22s cubic-bezier(0.22, 1.35, 0.36, 1);
    }

    .rating-pill-btn:hover {
      transform: translateY(-2px);
    }

    .rating-pill-btn:active {
      transform: translateY(1px) scale(0.95);
    }

    .rating-pill-btn.is-selected {
      transform: translateY(-1px);
    }
  </style>
</head>

<body class="relative select-none">
  <!-- Pure Geometric Shockwave & Luminous Dust Canvas (Zero Floating Text) -->
  <canvas id="fx-canvas" class="fixed inset-0 pointer-events-none z-40"></canvas>

  <!-- ULTRA-CLEAN TOP BAR -->
  <header class="fixed top-4 left-0 right-0 z-30 px-4 pointer-events-none flex justify-center">
    <div class="bg-slate-900/85 backdrop-blur-xl border border-slate-800/90 rounded-full px-3.5 py-1.5 shadow-2xl pointer-events-auto flex items-center gap-3 sm:gap-5 max-w-full overflow-x-auto">
      
      <!-- Left: Deck Selector + Custom Mindmap Button -->
      <div class="flex items-center gap-2 shrink-0">
        <select id="mindmap-select" class="bg-slate-950/90 border border-slate-700/80 hover:border-sky-400/60 text-slate-100 text-xs sm:text-sm font-medium rounded-full px-3 py-1 focus:outline-none focus:border-sky-400 transition cursor-pointer">
          <!-- Populated dynamically -->
        </select>
        <button id="btn-open-editor" class="px-3 py-1 rounded-full bg-slate-800/90 hover:bg-slate-700/90 border border-slate-700/80 text-sky-300 text-xs font-medium transition shrink-0">
          + 自定义导图
        </button>
      </div>

      <div class="h-4 w-[1px] bg-slate-800 shrink-0"></div>

      <!-- Right: Minimal Progress + Reset + Center + Sound -->
      <div class="flex items-center gap-3 shrink-0">
        <div class="flex items-center gap-2">
          <span class="text-xs text-slate-300 font-medium tabular-nums">
            已翻开 <strong id="stat-revealed" class="text-sky-300 font-semibold">1</strong> / <span id="stat-total" class="text-slate-400">11</span>
          </span>
          <div class="w-16 sm:w-20 h-1 bg-slate-800 rounded-full overflow-hidden">
            <div id="progress-line-fill" class="h-full bg-gradient-to-r from-sky-400 to-emerald-400 transition-all duration-300" style="width: 9%;"></div>
          </div>
        </div>

        <button id="btn-reset-map" class="px-2.5 py-1 rounded-full bg-slate-800/75 hover:bg-slate-700/80 text-slate-300 hover:text-white text-xs font-medium transition">
          重置
        </button>
        <button id="btn-center-camera" class="px-2.5 py-1 rounded-full bg-slate-800/75 hover:bg-slate-700/80 text-slate-300 hover:text-white text-xs font-medium transition">
          居中
        </button>
        <button id="btn-toggle-sound" class="w-7 h-7 rounded-full bg-slate-800/75 hover:bg-slate-700/80 flex items-center justify-center text-xs transition" title="音效开关">
          <span id="sound-icon">🔊</span>
        </button>
      </div>

    </div>
  </header>

  <!-- INTERACTIVE MINDMAP CANVAS -->
  <main id="mindmap-viewport" class="mindmap-viewport">
    <div id="mindmap-world" class="mindmap-world">
      <!-- SVG Layer for Cubic Bezier Parent-Child Connectors -->
      <svg id="links-svg" class="links-svg-layer" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad-link-pending" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.85" />
          </linearGradient>
          <linearGradient id="grad-link-revealed" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
            <stop offset="100%" stop-color="#34d399" stop-opacity="0.85" />
          </linearGradient>
        </defs>
        <g id="links-group"></g>
      </svg>

      <!-- DOM Layer for Mindmap Cards -->
      <div id="nodes-layer" class="nodes-dom-layer"></div>
    </div>
  </main>

  <!-- ULTRA-CLEAN BOTTOM RATING DOCK (Whole-Map Rating Only) -->
  <footer class="fixed bottom-5 left-0 right-0 z-30 px-4 pointer-events-none flex justify-center">
    <div class="bg-slate-900/85 backdrop-blur-xl border border-slate-800/90 rounded-full p-1.5 shadow-2xl pointer-events-auto flex items-center gap-1.5 sm:gap-2">
      
      <button data-map-score="forgot" class="rating-pill-btn px-4 py-1.5 rounded-full bg-slate-950/80 hover:bg-rose-950/60 border border-rose-500/35 hover:border-rose-400/80 flex items-center gap-1.5">
        <span class="text-xs sm:text-sm font-semibold text-rose-200">忘记</span>
        <span class="text-[10px] text-rose-400/70 font-mono">1</span>
      </button>

      <button data-map-score="hard" class="rating-pill-btn px-4 py-1.5 rounded-full bg-slate-950/80 hover:bg-amber-950/60 border border-amber-500/35 hover:border-amber-400/80 flex items-center gap-1.5">
        <span class="text-xs sm:text-sm font-semibold text-amber-200">困难</span>
        <span class="text-[10px] text-amber-400/70 font-mono">2</span>
      </button>

      <button data-map-score="good" class="rating-pill-btn px-4 py-1.5 rounded-full bg-slate-950/80 hover:bg-emerald-950/60 border border-emerald-500/35 hover:border-emerald-400/80 flex items-center gap-1.5">
        <span class="text-xs sm:text-sm font-semibold text-emerald-200">记得</span>
        <span class="text-[10px] text-emerald-400/70 font-mono">3</span>
      </button>

      <button data-map-score="easy" class="rating-pill-btn px-4 py-1.5 rounded-full bg-slate-950/80 hover:bg-indigo-950/60 border border-indigo-400/40 hover:border-indigo-300/90 flex items-center gap-1.5">
        <span class="text-xs sm:text-sm font-semibold text-indigo-200">轻松</span>
        <span class="text-[10px] text-indigo-300/70 font-mono">4</span>
      </button>

    </div>
  </footer>

  <!-- CUSTOM MINDMAP MODAL -->
  <div id="editor-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-xl w-full p-5 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-sm sm:text-base font-semibold text-slate-100">自定义思维导图</h3>
        <button id="btn-close-editor" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-xs">✕</button>
      </div>

      <div class="space-y-3 my-4 text-xs sm:text-sm">
        <div>
          <label class="block text-slate-400 mb-1">导图标题</label>
          <input id="input-map-title" type="text" value="认知心理学：人类记忆系统" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 focus:border-sky-400 focus:outline-none" />
        </div>
        <div>
          <label class="block text-slate-400 mb-1">
            缩进列表（第一行为根卡，使用 2 个空格或 Tab 缩进代表子层级）
          </label>
          <textarea id="input-map-tree" rows="9" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-200 font-mono text-xs focus:border-sky-400 focus:outline-none leading-relaxed">人类记忆三阶段系统
  感觉记忆
    图像记忆：视觉残像保持约 0.5 秒
    声像记忆：听觉回声保持约 2~4 秒
  工作记忆 (Baddeley)
    语音回路：复述声学信息防止衰退
    视觉空间画板：操纵心理意象
    中央执行系统：分配注意资源
  长时记忆
    外显记忆：情景记忆与语义记忆
    内隐记忆：程序性动作技能与习惯</textarea>
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-800">
        <button id="btn-cancel-editor" class="px-4 py-1.5 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium">取消</button>
        <button id="btn-save-editor" class="px-5 py-1.5 rounded-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-xs transition">
          生成导图
        </button>
      </div>
    </div>
  </div>

  <script>
    class MinimalHarmonicAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        // Warm pentatonic frequencies (C5, D5, E5, G5, A5, C6, D6, E6)
        this.pentatonic = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51];
        this.noteStep = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      // Soft warm marimba/kalimba pluck when spawning 待回忆 cards
      playSpawnPluck(count = 1, depth = 1) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const base = 330 + depth * 45;
        const n = Math.min(count, 5);

        for (let i = 0; i < n; i++) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const t = now + i * 0.032;
          const freq = base + i * 38;
          osc.frequency.setValueAtTime(freq, t);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.18, t + 0.11);
          gain.gain.setValueAtTime(0.075, t);
          gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.14);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.15);
        }
      }

      // Crisp kalimba harmonic chime on single card flip
      playCardFlip(offset = 0) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const freq = this.pentatonic[(this.noteStep + offset) % this.pentatonic.length];
        if (offset === 0) this.noteStep = (this.noteStep + 1) % this.pentatonic.length;

        [freq, freq * 2].forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = idx === 0 ? 'sine' : 'triangle';
          const peak = idx === 0 ? 0.1 : 0.03;
          osc.frequency.setValueAtTime(f, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(peak, now + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.3);
        });
      }

      // Gentle reverse air whoosh when collapsing descendants on right-click
      playCollapseWhoosh() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(480, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.22);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.24);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }

      // Subtle tactile tap when clicking a leaf or completed node
      playSoftTap() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(190, now + 0.065);
        gain.gain.setValueAtTime(0.045, now);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.075);
      }

      // Pleasant harmonic chord for whole-mindmap rating
      playRatingChord(scoreKey) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const chords = {
          forgot: [261.63, 311.13, 392.0],
          hard: [293.66, 369.99, 440.0],
          good: [392.0, 493.88, 587.33, 783.99],
          easy: [523.25, 659.25, 783.99, 987.77, 1174.66]
        };
        const notes = chords[scoreKey] || chords.good;
        notes.forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const t = now + i * 0.04;
          osc.frequency.setValueAtTime(f, t);
          gain.gain.setValueAtTime(0.075, t);
          gain.gain.exponentialRampToValueAtTime(0.0008, t + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.47);
        });
      }
    }

    class PureMinimalVFX {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.motes = [];
        this.rings = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        requestAnimationFrame(() => this.loop());
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      // 8-12 tiny luminous dust motes (NO floating text!)
      spawnLuminousMotes(x, y, count = 10, colors = ['#38bdf8', '#7dd3fc', '#34d399', '#f8fafc']) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.2 + Math.random() * 4.2;
          this.motes.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 0.4,
            drag: 0.94,
            radius: 1.6 + Math.random() * 2.2,
            color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 0.92,
            decay: 0.028 + Math.random() * 0.015
          });
        }
      }

      // Smooth geometric circle expanding and fading
      spawnGeometricRing(x, y, color = '#38bdf8', maxRadius = 115) {
        this.rings.push({
          x,
          y,
          radius: 10,
          maxRadius,
          color,
          alpha: 0.65,
          lineWidth: 2.5
        });
      }

      loop() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        for (let i = this.rings.length - 1; i >= 0; i--) {
          const r = this.rings[i];
          r.radius += (r.maxRadius - r.radius) * 0.15;
          r.alpha -= 0.032;
          r.lineWidth *= 0.96;
          if (r.alpha <= 0.01) {
            this.rings.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
          ctx.strokeStyle = r.color;
          ctx.globalAlpha = Math.max(0, r.alpha);
          ctx.lineWidth = r.lineWidth;
          ctx.stroke();
          ctx.restore();
        }

        for (let i = this.motes.length - 1; i >= 0; i--) {
          const m = this.motes[i];
          m.vx *= m.drag;
          m.vy *= m.drag;
          m.x += m.vx;
          m.y += m.vy;
          m.alpha -= m.decay;
          if (m.alpha <= 0.01) {
            this.motes.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
          ctx.fillStyle = m.color;
          ctx.shadowColor = m.color;
          ctx.shadowBlur = 6;
          ctx.globalAlpha = Math.max(0, m.alpha);
          ctx.fill();
          ctx.restore();
        }

        requestAnimationFrame(() => this.loop());
      }
    }

    // Format plain custom text to auto-highlight phrase before colon if no <strong> present
    function formatStudyHTML(rawText) {
      if (rawText.includes('<strong>')) return rawText;
      const colonIdx = rawText.search(/[：:]/);
      if (colonIdx > 0 && colonIdx <= 14) {
        return `<strong>${rawText.slice(0, colonIdx)}</strong>${rawText.slice(colonIdx)}`;
      }
      return rawText;

    /**
     * Pre-calculate deterministic (x, y) coordinates for every node in the tree.
     * Coordinates remain 100% fixed during flipping, spawning, or collapsing.
     */
    function buildMindmapLayout(rawRoot) {
      appState.nodesById.clear();
      let idSeq = 1;

      function hydrate(raw, depth = 0, parent = null) {
        const node = {
          id: 'node-' + idSeq++,
          htmlText: formatStudyHTML(raw.text),
          depth,
          parent,
          children: [],
          // Initial state: ONLY Root is 'revealed', all other nodes are 'hidden'
          state: depth === 0 ? 'revealed' : 'hidden',
          x: 0,
          y: 0,
          leafCount: 1,
          spawnOrigin: null
        };
        appState.nodesById.set(node.id, node);
        if (raw.children && raw.children.length > 0) {
          node.children = raw.children.map((ch) => hydrate(ch, depth + 1, node));
        }
        return node;
      }

      const root = hydrate(rawRoot, 0, null);

      function computeLeaves(n) {
        if (n.children.length === 0) {
          n.leafCount = 1;
          return 1;
        }
        let sum = 0;
        n.children.forEach((c) => {
          sum += computeLeaves(c);
        });
        n.leafCount = sum;
        return sum;
      }
      computeLeaves(root);

      const H_GAP = 300;
      const V_UNIT = 92;

      function assignCoordinates(n, topLeafIndex) {
        n.x = 60 + n.depth * H_GAP;
        const centerLeaf = topLeafIndex + n.leafCount / 2;
        n.y = centerLeaf * V_UNIT;

        let cursor = topLeafIndex;
        n.children.forEach((c) => {
          assignCoordinates(c, cursor);
          cursor += c.leafCount;
        });
      }

      assignCoordinates(root, 0);

      const rootOffsetY = root.y;
      appState.nodesById.forEach((n) => {
        n.y = n.y - rootOffsetY;
      });

      appState.rootNode = root;
    }

    /**
     * Inspect what the NEXT left-click on a `revealed` parent card `node` will do:
     * Returns:
     *  - { action: 'spawn', targetNodes: [...], depth } if shallowest incomplete reachable depth has `hidden` nodes
     *  - { action: 'flip', targetNodes: [...], depth } if shallowest incomplete reachable depth has `pending` nodes (and no `hidden`)
     *  - { action: 'none', targetNodes: [] } if all reachable levels are complete or node is a leaf
     */
    function inspectNextParentAction(node) {
      if (node.state !== 'revealed' || node.children.length === 0) {
        return { action: 'none', targetNodes: [] };
      }

      let currentRevealedParents = [node];

      while (currentRevealedParents.length > 0) {
        const reachableAtDepth = [];
        currentRevealedParents.forEach((p) => {
          p.children.forEach((ch) => reachableAtDepth.push(ch));
        });

        if (reachableAtDepth.length === 0) break;

        const hiddenNodes = reachableAtDepth.filter((c) => c.state === 'hidden');
        const pendingNodes = reachableAtDepth.filter((c) => c.state === 'pending');

        // Case A: At least one reachable node at this depth is `hidden` -> Spawn all `hidden` nodes at this depth as `pending`
        if (hiddenNodes.length > 0) {
          return {
            action: 'spawn',
            targetNodes: hiddenNodes,
            depth: hiddenNodes[0].depth
          };
        }

        // Case B: No `hidden` nodes at this depth, and at least one is `pending` -> Flip all `pending` nodes at this depth to `revealed`
        if (pendingNodes.length > 0) {
          return {
            action: 'flip',
            targetNodes: pendingNodes,
            depth: pendingNodes[0].depth
          };
        }

        // All reachable nodes at this depth are already `revealed` -> traverse deeper through them
        currentRevealedParents = reachableAtDepth.filter((c) => c.state === 'revealed');
      }

      return { action: 'none', targetNodes: [] };
    }

    function handleNodeLeftClick(node) {
      if (node.state === 'hidden') return;

      // 1. Left-click a `pending` (待回忆) card:
      // ONLY this card flips in-place to `revealed`. Does NOT expand any child nodes.
      if (node.state === 'pending') {
        node.state = 'revealed';
        soundFX.playCardFlip(0);

        const pt = worldToScreen(node.x + 114, node.y);
        vfx.spawnLuminousMotes(pt.x, pt.y, 10, ['#38bdf8', '#7dd3fc', '#34d399', '#f8fafc']);
        vfx.spawnGeometricRing(pt.x, pt.y, '#38bdf8', 110);

        updateProgressUI();
        syncMindmapDOM();
        return;
      }

      // 2. Left-click a `revealed` (已翻开) parent card:
      // Advance the first incomplete descendant level under this clicked parent card
      if (node.state === 'revealed') {
        const plan = inspectNextParentAction(node);

        if (plan.action === 'none') {
          soundFX.playSoftTap();
          pulseCardDOM(node.id);
          return;
        }

        if (plan.action === 'spawn') {
          plan.targetNodes.forEach((c) => {
            c.state = 'pending';
            c.spawnOrigin = { x: c.parent.x, y: c.parent.y };
          });

          soundFX.playSpawnPluck(plan.targetNodes.length, plan.depth);

          plan.targetNodes.forEach((c) => {
            const pt = worldToScreen(c.x + 114, c.y);
            vfx.spawnLuminousMotes(pt.x, pt.y, 7, ['#f59e0b', '#fcd34d', '#38bdf8']);
          });

          updateProgressUI();
          syncMindmapDOM();
          return;
        }

        if (plan.action === 'flip') {
          // Staggered 35ms harmonic cascade for batch layer reveal
          plan.targetNodes.forEach((c, idx) => {
            setTimeout(() => {
              if (c.state !== 'pending') return;
              c.state = 'revealed';
              soundFX.playCardFlip(idx);

              const pt = worldToScreen(c.x + 114, c.y);
              vfx.spawnLuminousMotes(pt.x, pt.y, 9, ['#34d399', '#38bdf8', '#7dd3fc', '#ffffff']);
              vfx.spawnGeometricRing(pt.x, pt.y, '#34d399', 115);

              updateProgressUI();
              syncMindmapDOM();
            }, idx * 35);
          });
        }
      }
    }

    /**
     * Right-Click Flow (收卡流程 - 右键):
     * Right-clicking a `revealed` parent card keeps the clicked card itself `revealed` on canvas,
     * while sucking all visible descendants in its subtree back into this parent and resetting them to `hidden`.
     */
    function handleNodeRightClick(node) {
      if (node.state !== 'revealed') return;
      if (!node.children || node.children.length === 0) return;

      const visibleDescendants = [];
      function collectVisible(curr) {
        curr.children.forEach((ch) => {
          if (ch.state !== 'hidden') {
            visibleDescendants.push(ch);
          }
          collectVisible(ch);
        });
      }
      collectVisible(node);

      if (visibleDescendants.length === 0) return;

      const parentPt = worldToScreen(node.x + 114, node.y);
      visibleDescendants.forEach((desc) => {
        spawnRetractingGhost(desc, node);
        desc.state = 'hidden';
        desc.spawnOrigin = null;
      });

      soundFX.playCollapseWhoosh();
      vfx.spawnGeometricRing(parentPt.x, parentPt.y, '#38bdf8', 95);
      vfx.spawnLuminousMotes(parentPt.x, parentPt.y, 8, ['#38bdf8', '#94a3b8']);

      updateProgressUI();
      syncMindmapDOM();
    }

    function spawnRetractingGhost(descNode, targetParentNode) {
      const ghost = document.createElement('div');
      ghost.className = 'mm-node-ghost-retract';
      ghost.style.left = `${descNode.x}px`;
      ghost.style.top = `${descNode.y}px`;
      ghost.style.opacity = '0.85';
      ghost.innerHTML = `
        <div class="w-[228px] min-h-[64px] rounded-[14px] border ${
          descNode.state === 'revealed'
            ? 'border-sky-400/50 bg-[#151c28]'
            : 'border-amber-500/50 bg-[#111722]'
        }"></div>
      `;
      elNodesLayer.appendChild(ghost);

      const dx = targetParentNode.x - descNode.x;
      const dy = targetParentNode.y - descNode.y;

      requestAnimationFrame(() => {
        ghost.style.transform = `translate(${dx}px, calc(-50% + ${dy}px)) scale(0.2)`;
        ghost.style.opacity = '0';
      });

      setTimeout(() => {
        ghost.remove();
      }, 340);
    }

    function pulseCardDOM(nodeId) {
      const anchor = elNodesLayer.querySelector(`[data-node-id="${nodeId}"]`);
      if (!anchor) return;
      const flipper = anchor.querySelector('.mm-card-flipper');
      if (!flipper) return;
      flipper.classList.remove('tactile-bounce');
      void flipper.offsetWidth;
      flipper.classList.add('tactile-bounce');

    function syncMindmapDOM() {
      const activeLinkIds = new Set();

      // 1. Sync SVG Cubic Bezier Connectors
      appState.nodesById.forEach((node) => {
        if (node.parent && node.state !== 'hidden' && node.parent.state !== 'hidden') {
          const linkId = `link-${node.parent.id}-${node.id}`;
          activeLinkIds.add(linkId);

          const parentWidth = node.parent.depth === 0 ? 244 : 228;
          const x1 = node.parent.x + parentWidth;
          const y1 = node.parent.y;
          const x2 = node.x;
          const y2 = node.y;
          const cpx1 = x1 + (x2 - x1) * 0.46;
          const cpx2 = x1 + (x2 - x1) * 0.54;
          const dPath = `M ${x1} ${y1} C ${cpx1} ${y1}, ${cpx2} ${y2}, ${x2} ${y2}`;

          const isRevealed = node.state === 'revealed';
          const strokeGrad = isRevealed ? 'url(#grad-link-revealed)' : 'url(#grad-link-pending)';
          const glowColor = isRevealed ? '#34d399' : '#f59e0b';

          let gLink = document.getElementById(linkId);
          if (!gLink) {
            gLink = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            gLink.setAttribute('id', linkId);
            gLink.innerHTML = `
              <path class="mm-link-glow" stroke-width="5" />
              <path class="mm-link-core" stroke-width="2" />
              <path class="mm-link-bead" stroke-width="2" stroke="#e0f2fe" opacity="0.65" />
            `;
            elLinksGroup.appendChild(gLink);
          }

          const [pGlow, pCore, pBead] = gLink.querySelectorAll('path');
          pGlow.setAttribute('d', dPath);
          pGlow.setAttribute('stroke', glowColor);
          pCore.setAttribute('d', dPath);
          pCore.setAttribute('stroke', strokeGrad);
          pBead.setAttribute('d', dPath);
        }
      });

      Array.from(elLinksGroup.children).forEach((child) => {
        if (!activeLinkIds.has(child.id)) {
          child.remove();
        }
      });

      // 2. Sync Zero-Clutter Card DOM Elements
      appState.nodesById.forEach((node) => {
        let anchor = elNodesLayer.querySelector(`[data-node-id="${node.id}"]`);

        if (node.state === 'hidden') {
          if (anchor) anchor.remove();
          return;
        }

        if (!anchor) {
          anchor = document.createElement('div');
          anchor.dataset.nodeId = node.id;
          anchor.className = `mm-node-anchor ${node.depth === 0 ? 'is-root' : ''}`;
          anchor.style.left = `${node.x}px`;
          anchor.style.top = `${node.y}px`;

          // STRICT ZERO-CLUTTER CARD MARKUP:
          // Pending face has ONLY 「待回忆」
          // Revealed face has ONLY original study text (原文)
          anchor.innerHTML = `
            <div class="mm-card-flipper ${node.state === 'revealed' ? 'state-revealed' : ''}">
              <div class="mm-face mm-face-pending">
                <span class="text-[15px] font-semibold tracking-widest text-amber-300/95">待回忆</span>
              </div>
              <div class="mm-face mm-face-revealed">
                <div class="mm-study-text">${node.htmlText}</div>
              </div>
            </div>
            <div class="mm-socket-dot hidden"></div>
          `;

          anchor.addEventListener('click', (e) => {
            e.stopPropagation();
            handleNodeLeftClick(node);
          });

          anchor.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            handleNodeRightClick(node);
          });

          elNodesLayer.appendChild(anchor);

          // Spring slide-out from parent's right edge
          if (node.spawnOrigin) {
            const dx = node.spawnOrigin.x - node.x;
            const dy = node.spawnOrigin.y - node.y;
            anchor.style.transition = 'none';
            anchor.style.opacity = '0.15';
            anchor.style.transform = `translate(${dx}px, calc(-50% + ${dy}px)) scale(0.35)`;
            void anchor.offsetWidth;
            anchor.style.transition =
              'transform 0.46s cubic-bezier(0.22, 1.35, 0.36, 1), opacity 0.32s ease';
            anchor.style.opacity = '1';
            anchor.style.transform = 'translate(0px, -50%) scale(1)';
            node.spawnOrigin = null;
          }
        }

        const flipper = anchor.querySelector('.mm-card-flipper');
        if (node.state === 'revealed') {
          flipper.classList.add('state-revealed');
        } else {
          flipper.classList.remove('state-revealed');
        }

        // Update purely visual right-edge connection socket dot
        const socket = anchor.querySelector('.mm-socket-dot');
        if (node.children.length > 0) {
          socket.classList.remove('hidden', 'next-spawn', 'next-flip', 'all-complete');
          if (node.state === 'pending') {
            socket.classList.add('next-spawn');
          } else {
            const nextPlan = inspectNextParentAction(node);
            if (nextPlan.action === 'spawn') {
              socket.classList.add('next-spawn');
            } else if (nextPlan.action === 'flip') {
              socket.classList.add('next-flip');
            } else {
              socket.classList.add('all-complete');
            }
          }
        } else {
          socket.classList.add('hidden');
        }
      });
    }

    function updateProgressUI() {
      let revealedCount = 0;
      const totalCount = appState.nodesById.size;
      appState.nodesById.forEach((n) => {
        if (n.state === 'revealed') revealedCount++;
      });

      document.getElementById('stat-revealed').textContent = revealedCount;
      document.getElementById('stat-total').textContent = totalCount;
      const pct = totalCount > 0 ? (revealedCount / totalCount) * 100 : 0;
      document.getElementById('progress-line-fill').style.width = `${pct.toFixed(1)}%`;
    }

    function rateWholeMindmap(scoreKey, btnElement) {
      // Strictly affects ONLY the whole-map rating state & ambient feedback.
      // Never flips, spawns, collapses, or switches the mindmap!
      const currentMap = appState.maps[appState.currentMapIndex];
      appState.selectedRatingByMap[currentMap.id] = scoreKey;

      soundFX.playRatingChord(scoreKey);

      const auraMap = {
        forgot: { cls: 'aura-forgot', color: '#fb7185' },
        hard: { cls: 'aura-hard', color: '#fbbf24' },
        good: { cls: 'aura-good', color: '#34d399' },
        easy: { cls: 'aura-easy', color: '#818cf8' }
      }[scoreKey];

      if (auraMap) {
        elViewport.classList.remove('aura-forgot', 'aura-hard', 'aura-good', 'aura-easy');
        elViewport.classList.add(auraMap.cls);
        setTimeout(() => {
          elViewport.classList.remove(auraMap.cls);
        }, 700);

        if (btnElement) {
          const rect = btnElement.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          vfx.spawnGeometricRing(cx, cy, auraMap.color, 90);
          vfx.spawnLuminousMotes(cx, cy, 10, [auraMap.color, '#f8fafc']);
        }
      }

      refreshRatingDockSelection();
    }

    function refreshRatingDockSelection() {
      const currentMap = appState.maps[appState.currentMapIndex];
      const activeKey = appState.selectedRatingByMap[currentMap.id];

      document.querySelectorAll('[data-map-score]').forEach((btn) => {
        const key = btn.dataset.mapScore;
        btn.classList.remove('is-selected', 'ring-2', 'ring-rose-400', 'ring-amber-400', 'ring-emerald-400', 'ring-indigo-400');
        if (key === activeKey) {
          btn.classList.add('is-selected', 'ring-2');
          if (key === 'forgot') btn.classList.add('ring-rose-400');
          if (key === 'hard') btn.classList.add('ring-amber-400');
          if (key === 'good') btn.classList.add('ring-emerald-400');
          if (key === 'easy') btn.classList.add('ring-indigo-400');
        }
      });
    }

    function loadMindmapByIndex(index, resetCamera = false) {
      appState.currentMapIndex = (index + appState.maps.length) % appState.maps.length;
      const mapObj = appState.maps[appState.currentMapIndex];

      elLinksGroup.innerHTML = '';
      elNodesLayer.innerHTML = '';

      buildMindmapLayout(mapObj.tree);

      if (resetCamera) {
        centerCameraOnRoot();
      }

      updateProgressUI();
      refreshRatingDockSelection();
      syncMindmapDOM();
    }

    function centerCameraOnRoot() {
      const vh = window.innerHeight;
      appState.camScale = window.innerWidth < 768 ? 0.8 : 0.96;
      appState.camX = 72;
      appState.camY = vh * 0.48;
      applyCameraTransform();
    }

    function renderMindmapSelectOptions() {
      const sel = document.getElementById('mindmap-select');
      sel.innerHTML = '';
      appState.maps.forEach((m, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = m.title;
        if (idx === appState.currentMapIndex) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    function parseIndentedTextToTree(rawText) {
      const lines = rawText
        .split('\n')
        .map((line) => line.replace(/\t/g, '  '))
        .filter((line) => line.trim().length > 0);

      if (lines.length === 0) {
        return { text: '核心概念', children: [{ text: '分支要点 A' }, { text: '分支要点 B' }] };
      }

      const root = {
        text: lines[0].trim().replace(/^[-*•]\s*/, ''),
        children: []
      };

      const stack = [{ node: root, indent: -1 }];

      for (let i = 1; i < lines.length; i++) {
        const rawLine = lines[i];
        const indent = rawLine.search(/\S/);
        const cleanText = rawLine.trim().replace(/^[-*•]\s*/, '');
        const newNode = { text: cleanText, children: [] };

        while (stack.length > 1 && stack[stack.length - 1].indent >= indent) {
          stack.pop();
        }

        stack[stack.length - 1].node.children.push(newNode);
        stack.push({ node: newNode, indent });
      }

      return root;
    }

    elViewport.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('.mm-node-anchor')) return;
      appState.isDraggingCanvas = true;
      appState.dragStartX = e.clientX - appState.camX;
      appState.dragStartY = e.clientY - appState.camY;
      elViewport.classList.add('is-panning');
    });

    window.addEventListener('mousemove', (e) => {
      if (!appState.isDraggingCanvas) return;
      appState.camX = e.clientX - appState.dragStartX;
      appState.camY = e.clientY - appState.dragStartY;
      applyCameraTransform();
    });

    window.addEventListener('mouseup', () => {
      appState.isDraggingCanvas = false;
      elViewport.classList.remove('is-panning');
    });

    elViewport.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    elViewport.addEventListener(
      'wheel',
      (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
        const nextScale = Math.min(1.6, Math.max(0.45, appState.camScale * zoomFactor));

        const rect = elViewport.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        appState.camX = mx - ((mx - appState.camX) / appState.camScale) * nextScale;
        appState.camY = my - ((my - appState.camY) / appState.camScale) * nextScale;
        appState.camScale = nextScale;
        applyCameraTransform();
      },
      { passive: false }
    );

    document.getElementById('mindmap-select').addEventListener('change', (e) => {
      loadMindmapByIndex(parseInt(e.target.value, 10), false);
    });

    document.getElementById('btn-reset-map').addEventListener('click', () => {
      soundFX.playCollapseWhoosh();
      loadMindmapByIndex(appState.currentMapIndex, false);
    });

    document.getElementById('btn-center-camera').addEventListener('click', () => {
      soundFX.playSoftTap();
      centerCameraOnRoot();
    });

    document.getElementById('btn-toggle-sound').addEventListener('click', () => {
      soundFX.enabled = !soundFX.enabled;
      document.getElementById('sound-icon').textContent = soundFX.enabled ? '🔊' : '🔇';
    });

    document.querySelectorAll('[data-map-score]').forEach((btn) => {
      btn.addEventListener('click', () => {
        rateWholeMindmap(btn.dataset.mapScore, btn);
      });
    });

    const elEditorModal = document.getElementById('editor-modal');
    const openEditor = () => elEditorModal.classList.remove('hidden');
    const closeEditor = () => elEditorModal.classList.add('hidden');

    document.getElementById('btn-open-editor').addEventListener('click', openEditor);
    document.getElementById('btn-close-editor').addEventListener('click', closeEditor);
    document.getElementById('btn-cancel-editor').addEventListener('click', closeEditor);

    document.getElementById('btn-save-editor').addEventListener('click', () => {
      const title = document.getElementById('input-map-title').value.trim() || '自定义导图';
      const rawTreeText = document.getElementById('input-map-tree').value;
      const parsedTree = parseIndentedTextToTree(rawTreeText);

      const newMap = {
        id: 'custom-map-' + Date.now(),
        title,
        tree: parsedTree
      };

      appState.maps.unshift(newMap);
      renderMindmapSelectOptions();
      closeEditor();
      loadMindmapByIndex(0, true);
      soundFX.playRatingChord('good');
    });

    window.addEventListener('keydown', (e) => {
      if (!elEditorModal.classList.contains('hidden')) {
        if (e.key === 'Escape') closeEditor();
        return;
      }
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;

      const keyMap = { '1': 'forgot', '2': 'hard', '3': 'good', '4': 'easy' };
      if (keyMap[e.key]) {
        const btn = document.querySelector(`[data-map-score="${keyMap[e.key]}"]`);
        rateWholeMindmap(keyMap[e.key], btn);
      }
    });

    window.onload = function () {
      renderMindmapSelectOptions();
      loadMindmapByIndex(0, true);
    };
  </script>
</body>
</html>
