<script>
(function () {
  'use strict';

  /* =========================================================
   * 0. GameFeel Tokens
   * ========================================================= */
  const GF = {
    easing: {
      hover:   'cubic-bezier(0.34,1.56,0.64,1)',
      press:   'cubic-bezier(0.55,0.06,0.68,0.19)',
      release: 'cubic-bezier(0.22,1.61,0.36,1)',
      settle:  'cubic-bezier(0.25,0.46,0.45,0.94)',
      float:   'cubic-bezier(0.16,1,0.3,1)'
    },
    duration: {
      hover: 180, press: 80, freeze: 80,
      release: 340, settle: 280, cooldown: 180
    },
    particle: {
      count: { small: 9, medium: 15, large: 22 },
      speedMin: 42, speedMax: 105, life: 540
    },
    // 事件层级参数
    tiers: {
      small: { freeze: 80,  particles: 9,  ring: true,  shake: 1,  sound: 0.6 },
      medium:{ freeze: 100, particles: 15, ring: true,  shake: 2,  sound: 0.8 },
      large: { freeze: 130, particles: 22, ring: true,  shake: 3.5, sound: 1.0 }
    }
  };

  const CARD_W = 170;
  const CARD_H = 72;
  const H_GAP  = 70;
  const V_GAP  = 90;

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const rand  = (min, max) => min + Math.random() * (max - min);

  /* =========================================================
   * 1. 导图数据
   * ========================================================= */
  const nodesData = [
    { id: 'root',    parentId: null,    text: '记忆宫殿 · 核心', children: ['l1-1', 'l1-2', 'l1-3'] },

    { id: 'l1-1',    parentId: 'root',  text: '一、工作记忆',      children: ['l2-1', 'l2-2'] },
    { id: 'l1-2',    parentId: 'root',  text: '二、长期记忆',      children: ['l2-3', 'l2-4', 'l2-5'] },
    { id: 'l1-3',    parentId: 'root',  text: '三、提取练习',      children: ['l2-6'] },

    { id: 'l2-1',    parentId: 'l1-1',  text: '语音环路',          children: ['leaf-1'] },
    { id: 'l2-2',    parentId: 'l1-1',  text: '视空间模板',        children: ['leaf-2'] },
    { id: 'l2-3',    parentId: 'l1-2',  text: '语义记忆',          children: [] },
    { id: 'l2-4',    parentId: 'l1-2',  text: '情景记忆',          children: [] },
    { id: 'l2-5',    parentId: 'l1-2',  text: '程序记忆',          children: ['leaf-3'] },
    { id: 'l2-6',    parentId: 'l1-3',  text: '间隔重复',          children: [] },

    { id: 'leaf-1',  parentId: 'l2-1',  text: '复述可增强',        children: [] },
    { id: 'leaf-2',  parentId: 'l2-2',  text: '心理旋转',          children: [] },
    { id: 'leaf-3',  parentId: 'l2-5',  text: '骑自行车',          children: [] }
  ];

  const nodeMap = new Map();
  nodesData.forEach(n => nodeMap.set(n.id, { ...n, children: [...n.children] }));

  /* 状态: 'unborn' | 'cover' | 'revealed' */
  const state = new Map();
  nodeMap.forEach((_, id) => state.set(id, 'unborn'));
  state.set('root', 'revealed');

  /* 撤销栈：保存每次收卡操作前的状态快照 */
  const undoStack = [];

  /* =========================================================
   * 2. 布局
   * ========================================================= */
  function computeLayout() {
    const UNIT = CARD_W + H_GAP;
    const widthUnits = new Map();

    (function calc(id) {
      const node = nodeMap.get(id);
      if (!node.children.length) { widthUnits.set(id, 1); return 1; }
      let sum = 0;
      node.children.forEach(c => { sum += calc(c); });
      widthUnits.set(id, sum);
      return sum;
    })('root');

    const positions = new Map();

    (function assign(id, leftX, y) {
      const node = nodeMap.get(id);
      const w = widthUnits.get(id) * UNIT;
      positions.set(id, { x: leftX + w / 2 - CARD_W / 2, y });

      let childX = leftX;
      node.children.forEach(c => {
        const cw = widthUnits.get(c) * UNIT;
        assign(c, childX, y + CARD_H + V_GAP);
        childX += cw;
      });
    })('root', 1000 - (widthUnits.get('root') * UNIT) / 2, 200);

    return positions;
  }

  /* =========================================================
   * 3. DOM 引用
   * ========================================================= */
  const container = document.getElementById('canvas-container');
  const world     = document.getElementById('world');
  const svg       = document.getElementById('lines-svg');

  let layoutPositions = computeLayout();
  const cardElements  = new Map();
  const lineBaseMap   = new Map();
  const lineFlowMap   = new Map();
  /* childId -> 当前连线几何，供回缩动画取用 */
  const lineGeomMap   = new Map();
  /* childId -> 该连线当前的 p 采样点，p=0 父卡端 / p=1 子卡端 */
  const linePointFn   = new Map();
  const isAnimating   = new Set();

  /* =========================================================
   * 4. 音效引擎（多层 WebAudio 合成）
   * ========================================================= */
  let audioCtx = null;

  /* 共享音频总线：dry 主路 + 混响湿路 + 压缩限幅
     所有声音都经过同一条链路，保证叠加时不削波、音色统一 */
  const BUS = {
    master: null,   // 总输出（含限制器）
    dry: null,      // 直达声
    wet: null,      // 混响湿声
    verb: null,     // 卷积混响
    comp: null      // 动态压缩
  };

  /* 生成一段衰减噪声脉冲响应，用于合成混响尾巴 */
  function buildImpulse(ctx, seconds, decay) {
    const rate = ctx.sampleRate;
    const len = Math.max(1, Math.floor(rate * seconds));
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        const p = i / len;
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - p, decay);
      }
    }
    return buf;
  }

  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return; }

    const ctx = audioCtx;

    /* 限幅：防止快速连点时叠加削波 */
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 24;
    comp.ratio.value = 5;
    comp.attack.value = 0.004;
    comp.release.value = 0.16;
    comp.connect(ctx.destination);

    const master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(comp);

    /* 直达声：整体略收，给混响留头room */
    const dry = ctx.createGain();
    dry.gain.value = 0.82;
    dry.connect(master);

    /* 混响湿路 */
    const verb = ctx.createConvolver();
    verb.buffer = buildImpulse(ctx, 1.6, 2.6);
    const wet = ctx.createGain();
    wet.gain.value = 0.24;
    verb.connect(wet);
    wet.connect(master);

    /* 湿路前置低通，避免混响发亮刺耳 */
    const damp = ctx.createBiquadFilter();
    damp.type = 'lowpass';
    damp.frequency.value = 3200;
    damp.connect(verb);

    BUS.comp = comp;
    BUS.master = master;
    BUS.dry = dry;
    BUS.wet = damp;   // 送入 damp 即进入混响

    /* 切回前台自动恢复（移动端常见挂起） */
    ctx.onstatechange = () => {
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    };
  }

  /* 发声节流：同一音效在极短时间内重复触发时略降音量，避免爆音 */
  const soundGuard = new Map();
  function allowSound(type) {
    const now = performance.now();
    const last = soundGuard.get(type) || 0;
    soundGuard.set(type, now);
    const gap = now - last;
    return gap < 45 ? 0.55 : 1;
  }

  /* ---- 基础音色构件 ---- */

  /* 单振荡器音层 */
  function tone(opt) {
    const ctx = audioCtx;
    const t0 = opt.at;
    const o = ctx.createOscillator();
    o.type = opt.type || 'sine';
    o.frequency.setValueAtTime(opt.f0, t0);
    if (opt.f1 != null) {
      o.frequency.exponentialRampToValueAtTime(Math.max(1, opt.f1), t0 + (opt.sweep || opt.dur));
    }

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(opt.peak, t0 + (opt.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + opt.dur);

    let node = o;
    /* 可选的逐层滤波 */
    if (opt.filter) {
      const f = ctx.createBiquadFilter();
      f.type = opt.filter.type;
      f.frequency.setValueAtTime(opt.filter.f0, t0);
      if (opt.filter.f1 != null) {
        f.frequency.exponentialRampToValueAtTime(opt.filter.f1, t0 + opt.dur);
      }
      if (opt.filter.q != null) f.Q.value = opt.filter.q;
      node.connect(f);
      node = f;
    }

    node.connect(g);

    /* 声像定位 */
    let tail = g;
    if (opt.pan != null && ctx.createStereoPanner) {
      const p = ctx.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, opt.pan));
      tail.connect(p);
      tail = p;
    }

    /* 路由：直达 / 混响 */
    tail.connect(opt.bus || BUS.dry);
    if (opt.wetMix) {
      const wg = ctx.createGain();
      wg.gain.value = opt.wetMix;
      tail.connect(wg);
      wg.connect(BUS.wet);
    }

    o.start(t0);
    o.stop(t0 + opt.dur + 0.02);
    return o;
  }

  /* 噪声脉冲（用于瞬态"啪"感） */
  function noiseHit(opt) {
    const ctx = audioCtx;
    const t0 = opt.at;
    const len = Math.max(1, Math.floor(ctx.sampleRate * opt.dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, opt.decay || 3);
    }
    const s = ctx.createBufferSource();
    s.buffer = buf;

    const f = ctx.createBiquadFilter();
    f.type = opt.filter || 'bandpass';
    f.frequency.setValueAtTime(opt.f0, t0);
    if (opt.f1 != null) f.frequency.exponentialRampToValueAtTime(opt.f1, t0 + opt.dur);
    f.Q.value = opt.q != null ? opt.q : 1.2;

    const g = ctx.createGain();
    g.gain.setValueAtTime(opt.peak, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + opt.dur);

    s.connect(f); f.connect(g);
    g.connect(opt.bus || BUS.dry);
    if (opt.wetMix) {
      const wg = ctx.createGain();
      wg.gain.value = opt.wetMix;
      g.connect(wg);
      wg.connect(BUS.wet);
    }

    s.start(t0);
    s.stop(t0 + opt.dur + 0.02);
  }

  function playSound(type, volume = 1) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

    const grad = allowSound(type);
    const vol = volume * grad;
    const t = audioCtx.currentTime;
    const wet = BUS.wet ? 1 : 0;

    switch (type) {
      case 'hoverTick': {
        // 极轻的一粒高频点触 + 一声几乎不可闻的空气感
        tone({
          at: t, type: 'sine', f0: 1850, f1: 1420,
          dur: 0.055, attack: 0.003, peak: 0.012 * vol,
          pan: rand(-0.22, 0.22)
        });
        noiseHit({
          at: t, dur: 0.03, f0: 5200, f1: 3400, q: 0.9,
          peak: 0.0045 * vol, decay: 5
        });
        break;
      }
      case 'tapLight': {
        /* 三层：低频身体 + 中频主体 + 高频细节 */

        // 1) 低频身体感：给"按下"一个重量
        tone({
          at: t, type: 'sine', f0: 150, f1: 92,
          dur: 0.11, attack: 0.004, peak: 0.05 * vol
        });

        // 2) 中频主体（三角波，带 downward 扫频）
        tone({
          at: t, type: 'triangle', f0: 430, f1: 178,
          dur: 0.085, attack: 0.003, peak: 0.058 * vol
        });

        // 3) 高频泛音：木质敲击的"齿音"
        tone({
          at: t, type: 'sine', f0: 1320, f1: 980,
          dur: 0.05, attack: 0.002, peak: 0.016 * vol,
          pan: rand(-0.15, 0.15)
        });

        // 4) 极短噪声瞬态：让触感更"实体"
        noiseHit({
          at: t, dur: 0.024, f0: 2600, f1: 1500, q: 1.1,
          peak: 0.014 * vol, decay: 4
        });
        break;
      }
      case 'flipPop': {
        /* 翻开：明亮上行 + 五度泛音 + 空气噪声扫频 + 混响尾巴 */

        // 1) 上行基音（主体）
        tone({
          at: t, type: 'sine', f0: 540, f1: 1290,
          dur: 0.22, attack: 0.008, peak: 0.075 * vol,
          wetMix: wet * 0.30
        });

        // 2) 高八度微层：增加"闪亮"质感
        tone({
          at: t, type: 'sine', f0: 1080, f1: 2200,
          dur: 0.16, attack: 0.005, peak: 0.021 * vol,
          pan: 0.18
        });

        // 3) 上方五度：让音色变成"和弦感"而非单音
        tone({
          at: t + 0.012, type: 'sine', f0: 810, f1: 1935,
          dur: 0.18, attack: 0.006, peak: 0.018 * vol,
          pan: -0.18
        });

        // 4) 低频支撑：翻开瞬间的"厚度"
        tone({
          at: t, type: 'sine', f0: 175, f1: 120,
          dur: 0.14, attack: 0.006, peak: 0.032 * vol
        });

        // 5) 空气噪声扫频：翻页的"shh"
        noiseHit({
          at: t, dur: 0.16, f0: 900, f1: 3200, q: 0.8,
          peak: 0.013 * vol, decay: 2.2, wetMix: wet * 0.35
        });
        break;
      }
      case 'expandWhoosh': {
        /* 展开：上升扫频 + 噪声层 + 低频推动 + 长混响 */

        // 1) 上升正弦扫频（主体）
        tone({
          at: t, type: 'sine', f0: 250, f1: 760,
          dur: 0.28, attack: 0.012, peak: 0.048 * vol,
          wetMix: wet * 0.40
        });

        // 2) 低频推力：让"展开"有向下的重量
        tone({
          at: t, type: 'sine', f0: 120, f1: 190,
          dur: 0.24, attack: 0.02, peak: 0.038 * vol
        });

        // 3) 带通噪声扫频：风感
        noiseHit({
          at: t, dur: 0.3, f0: 420, f1: 2100, q: 0.7,
          peak: 0.019 * vol, decay: 1.8, wetMix: wet * 0.45
        });

        // 4) 高处泛音闪光
        tone({
          at: t + 0.03, type: 'sine', f0: 1520, f1: 2600,
          dur: 0.2, attack: 0.02, peak: 0.012 * vol,
          pan: rand(-0.3, 0.3)
        });
        break;
      }
      case 'collapseWhoosh': {
        /* 收卡：下降锯齿 + 低频下坠 + 噪声 + 混响 */

        // 1) 下降锯齿（主体，带低通让高频不刺）
        tone({
          at: t, type: 'sawtooth', f0: 780, f1: 138,
          dur: 0.32, attack: 0.008, peak: 0.042 * vol,
          filter: { type: 'lowpass', f0: 2600, f1: 700, q: 0.9 },
          wetMix: wet * 0.35
        });

        // 2) 低频下坠：坠落感
        tone({
          at: t, type: 'sine', f0: 185, f1: 76,
          dur: 0.3, attack: 0.01, peak: 0.052 * vol
        });

        // 3) 空气噪声下坠
        noiseHit({
          at: t, dur: 0.28, f0: 2400, f1: 380, q: 0.7,
          peak: 0.017 * vol, decay: 2, wetMix: wet * 0.4
        });

        // 4) 收束时的一点低频"闷响"
        tone({
          at: t + 0.16, type: 'sine', f0: 96, f1: 62,
          dur: 0.16, attack: 0.008, peak: 0.03 * vol
        });
        break;
      }
      case 'settleSoft': {
        // 落定：柔和下行 + 一层轻微五度
        tone({
          at: t, type: 'sine', f0: 355, f1: 218,
          dur: 0.16, attack: 0.006, peak: 0.025 * vol,
          wetMix: wet * 0.25
        });
        tone({
          at: t + 0.01, type: 'sine', f0: 532, f1: 330,
          dur: 0.12, attack: 0.008, peak: 0.011 * vol,
          pan: rand(-0.2, 0.2)
        });
        break;
      }
      case 'orbAscend': {
        /* 经验球上升：清晰的上行琶音滑音 + 明亮闪光 + 短混响 */
        tone({
          at: t, type: 'sine', f0: 620, f1: 1180,
          dur: 0.2, attack: 0.006, peak: 0.03 * vol,
          wetMix: wet * 0.45
        });
        tone({
          at: t + 0.04, type: 'sine', f0: 930, f1: 1760,
          dur: 0.18, attack: 0.008, peak: 0.016 * vol,
          pan: rand(-0.25, 0.25)
        });
        noiseHit({
          at: t, dur: 0.1, f0: 2200, f1: 4600, q: 1.4,
          peak: 0.006 * vol, decay: 2.4
        });
        break;
      }
      case 'orbAbsorb': {
        /* 经验球抵达父卡：温暖的吸收"叮" + 低频落入 */
        tone({
          at: t, type: 'sine', f0: 880, f1: 660,
          dur: 0.26, attack: 0.005, peak: 0.034 * vol,
          wetMix: wet * 0.5
        });
        tone({
          at: t + 0.015, type: 'sine', f0: 1320,
          dur: 0.2, attack: 0.008, peak: 0.013 * vol,
          pan: rand(-0.2, 0.2)
        });
        tone({
          at: t, type: 'sine', f0: 210, f1: 150,
          dur: 0.18, attack: 0.008, peak: 0.03 * vol
        });
        break;
      }
      case 'largeChime': {
        /* 大事件：大调和弦铺底 + 高八度闪光 + 低音支撑 + 长混响 */

        // 1) 和弦主体（C 大三和弦，依次进入，更宽的时间铺展）
        [523.25, 659.25, 783.99].forEach((freq, i) => {
          tone({
            at: t + i * 0.055, type: 'sine',
            f0: freq, dur: 0.72, attack: 0.02,
            peak: 0.046 * vol,
            pan: (i - 1) * 0.22,
            wetMix: wet * 0.55
          });
        });

        // 2) 十二度上方闪光层：增加明亮度
        tone({
          at: t + 0.12, type: 'sine', f0: 1567.98,
          dur: 0.5, attack: 0.03, peak: 0.014 * vol,
          pan: 0.3
        });

        // 3) 低八度支撑：让和弦有底盘
        tone({
          at: t, type: 'sine', f0: 130.81, f1: 130.81,
          dur: 0.8, attack: 0.015, peak: 0.05 * vol,
          wetMix: wet * 0.4
        });

        // 4) 混响空间的"空气"初始瞬态
        noiseHit({
          at: t, dur: 0.2, f0: 1400, f1: 3200, q: 0.6,
          peak: 0.008 * vol, decay: 2.5, wetMix: wet * 0.6
        });
        break;
      }
      case 'rateForgot': {
        /* 评分·忘记：下沉、钝、失落。
           刻意不给 wetMix——干燥、贴近、闷，与"记得"的开阔感形成对比。 */

        // 1) 锯齿下行主体：低通一路收窄，制造"塌下去"的暗色
        tone({
          at: t, type: 'sawtooth', f0: 320, f1: 96,
          dur: 0.3, attack: 0.01, peak: 0.038 * vol,
          filter: { type: 'lowpass', f0: 1400, f1: 320, q: 1.3 }
        });

        // 2) 低频下坠层：给"忘记"一个坠落的重量感
        tone({
          at: t, type: 'sine', f0: 120, f1: 58,
          dur: 0.34, attack: 0.008, peak: 0.047 * vol
        });

        // 本档无混响，总峰值 0.038 + 0.047 = 0.085（四档最低，语义上"忘记"就该最弱）
        break;
      }
      case 'rateHard': {
        /* 评分·困难：紧绷、勉强上行。
           窄音程小幅度爬升，带着"费力"的摩擦噪声，混响极轻以保持干涩。 */

        // 1) 三角波小幅上行：紧绷的"挤上去"感
        tone({
          at: t, type: 'triangle', f0: 240, f1: 330,
          dur: 0.16, attack: 0.006, peak: 0.052 * vol
        });

        // 2) 上方五度微层：偏左，制造不稳定的悬置感
        tone({
          at: t, type: 'sine', f0: 480, f1: 610,
          dur: 0.14, attack: 0.008, peak: 0.034 * vol,
          pan: -0.16
        });

        // 3) 上行摩擦噪声：困难档特有的"卡顿/吃力"质地
        noiseHit({
          at: t, dur: 0.09, f0: 700, f1: 1500, q: 1.2,
          peak: 0.018 * vol, decay: 3
        });

        // 极低混响：保持近场、不舒展
        // 总峰值 0.052 + 0.034 + 0.018 = 0.104，明显高于 rateForgot 的 0.085
        break;
      }
      case 'rateGood': {
        /* 评分·记得：明亮、干净、有确认感。
           用纯五度上行（392→587.33 = G4→D5）与既有 flipPop 的大跳音程区分，
           避免听感重复；低频支撑让它"稳"而不是"飘"。 */

        // 1) 纯五度根音上行（主体）：明确的"对了"确认
        tone({
          at: t, type: 'sine', f0: 392.00, f1: 587.33,
          dur: 0.2, attack: 0.006, peak: 0.055 * vol,
          wetMix: wet * 0.30
        });

        // 2) 五度上方继续上行（587.33→880 = D5→A5）：把"确认"推亮
        tone({
          at: t + 0.02, type: 'sine', f0: 587.33, f1: 880,
          dur: 0.18, attack: 0.008, peak: 0.030 * vol,
          pan: 0.15
        });

        // 3) 低频支撑：稳定的底盘，避免整体显得轻浮
        tone({
          at: t, type: 'sine', f0: 110,
          dur: 0.18, attack: 0.008, peak: 0.04 * vol
        });

        // 4) 高频空气瞬态：干净的"清亮"收尾
        noiseHit({
          at: t, dur: 0.12, f0: 2400, f1: 4200, q: 1.0,
          peak: 0.009 * vol, decay: 2.6, wetMix: wet * 0.25
        });

        // 总峰值 0.134，高于 rateHard 的 0.104
        break;
      }
      case 'rateEasy': {
        /* 评分·轻松：最大、最亮、带奖励感。
           大六和弦（F6）依次铺开 + 高八度飞升闪光 + 低音底盘 + 明亮长混响。
           刻意避开既有 largeChime 的 C 大三和弦（C-E-G），改用 F 大六（F-A-C），
           在音高上明确分开，听感更"明亮开阔"，契合"轻松"。 */

        // 1) 大六和弦 F6 [F5, A5, C6]：愉悦的"奖励"感，依次进入拉开空间
        [698.46, 880.00, 1046.50].forEach((freq, i) => {
          tone({
            at: t + i * 0.06, type: 'sine',
            f0: freq, dur: 0.62, attack: 0.018,
            peak: 0.048 * vol,
            pan: (i - 1) * 0.2,
            wetMix: wet * 0.5
          });
        });

        // 2) 高八度飞升层（F6→C7）：奖励感的"闪耀上冲"
        tone({
          at: t + 0.08, type: 'sine', f0: 1396.91, f1: 2093.00,
          dur: 0.3, attack: 0.02, peak: 0.022 * vol
        });

        // 3) 低八度底盘（F3）：让和弦有厚度，撑住最大的能量
        tone({
          at: t, type: 'sine', f0: 174.61,
          dur: 0.7, attack: 0.015, peak: 0.05 * vol,
          wetMix: wet * 0.4
        });

        // 4) 明亮宽带噪声：闪光的"空气感"，混响充足
        noiseHit({
          at: t, dur: 0.26, f0: 1800, f1: 6800, q: 0.7,
          peak: 0.012 * vol, decay: 3, wetMix: wet * 0.45
        });

        // 总峰值 0.048*3 + 0.022 + 0.05 + 0.012 = 0.228（四档最高）
        break;
      }
      case 'quizCard': {
        /* 做题·推进下一题：轻快、短促、干净，不抢判定的风头。
           与 expandWhoosh（长、厚）/ settleSoft（低、柔）在音区与时长上完全错开。 */

        // 1) 快速上行八度（440→880）：轻快的"翻到下一张"
        tone({
          at: t, type: 'sine', f0: 440, f1: 880,
          dur: 0.13, attack: 0.004, peak: 0.04 * vol,
          wetMix: wet * 0.26
        });

        // 2) 高八度微层：偏右，增加一点跳跃的灵气
        tone({
          at: t + 0.015, type: 'sine', f0: 880, f1: 1320,
          dur: 0.1, attack: 0.005, peak: 0.014 * vol,
          pan: 0.14
        });

        // 3) 极短高频噪声：纸卡掠过的一点点"沙"
        noiseHit({
          at: t, dur: 0.07, f0: 1600, f1: 3600, q: 1.3,
          peak: 0.006 * vol, decay: 3
        });
        break;
      }
    }
  }

  /* =========================================================
   * 5. 视觉反馈工具
   * ========================================================= */

  /* 5.1 粒子（多种形状） */
  function spawnParticles(cardEl, count, angle, kind) {
    const cx = cardEl.offsetLeft + CARD_W / 2;
    const cy = cardEl.offsetTop  + CARD_H / 2;

    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle ' + (kind || (Math.random() < 0.65 ? 'dot' : 'chip'));

      const size = rand(5, 9);
      p.style.width  = size + 'px';
      p.style.height = size + 'px';
      p.style.left = cx + 'px';
      p.style.top  = cy + 'px';

      const a = (angle === undefined)
        ? Math.random() * Math.PI * 2
        : angle + rand(-0.95, 0.95);
      const dist = rand(GF.particle.speedMin, GF.particle.speedMax);

      p.style.setProperty('--dx', (Math.cos(a) * dist) + 'px');
      p.style.setProperty('--dy', (Math.sin(a) * dist) + 'px');
      p.style.animationDelay = (i * 10) + 'ms';

      world.appendChild(p);
      setTimeout(() => p.remove(), GF.particle.life + i * 10 + 80);
    }
  }

  /* 5.2 涟漪环 */
  function spawnRing(cardEl, size, kind) {
    const r = document.createElement('div');
    r.className = 'ring' + (kind === 'rose' ? ' rose' : '');
    const w = size || 120;
    r.style.width  = w + 'px';
    r.style.height = w + 'px';
    r.style.left = (cardEl.offsetLeft + CARD_W / 2) + 'px';
    r.style.top  = (cardEl.offsetTop  + CARD_H / 2) + 'px';
    world.appendChild(r);
    setTimeout(() => r.remove(), 620);
  }

  /* 5.3 经验球：从子卡飞向父卡，抵达时父卡吸收反馈 */
  function spawnExpOrbs(childEl, parentEl, count) {
    if (!childEl || !parentEl) return;

    const cx = childEl.offsetLeft + CARD_W / 2;
    const cy = childEl.offsetTop  + CARD_H / 2;
    const px = parentEl.offsetLeft + CARD_W / 2;
    const py = parentEl.offsetTop  + CARD_H / 2;

    const total = count || 3;
    const DUR = 620;

    playSound('orbAscend', 0.9);

    for (let i = 0; i < total; i++) {
      const delay = i * 70;

      /* 球体：多球时略微散开，形成一束 */
      const orb = document.createElement('div');
      orb.className = 'orb';

      const size = rand(9, 15);
      orb.style.width  = size + 'px';
      orb.style.height = size + 'px';
      orb.style.left = cx + 'px';
      orb.style.top  = cy + 'px';

      /* 主终点 = 父卡中心，加一点随机偏移避免完全重叠 */
      const spread = total > 1 ? rand(-11, 11) : rand(-4, 4);
      const ex = px + spread;
      const ey = py + rand(-9, 9);

      /* 关键帧控制点：先上抛离开子卡，再飞向父卡 */
      const dx = ex - cx;
      const dy = ey - cy;
      const liftAt = 0.16;

      orb.style.setProperty('--o1x', (dx * liftAt) + 'px');
      orb.style.setProperty('--o1y', (dy * liftAt - rand(10, 22)) + 'px');
      orb.style.setProperty('--o2x', (dx * 0.66) + 'px');
      orb.style.setProperty('--o2y', (dy * 0.66 - rand(4, 12)) + 'px');
      orb.style.setProperty('--oex', dx + 'px');
      orb.style.setProperty('--oey', dy + 'px');
      orb.style.setProperty('--orb-dur', DUR + 'ms');
      orb.style.animationDelay = delay + 'ms';

      world.appendChild(orb);
      setTimeout(() => orb.remove(), DUR + delay + 90);

      /* 尾迹球：滞后一点，制造飞行轨迹 */
      const trail = document.createElement('div');
      trail.className = 'orb trail';
      const tSize = size * 0.62;
      trail.style.width  = tSize + 'px';
      trail.style.height = tSize + 'px';
      trail.style.left = cx + 'px';
      trail.style.top  = cy + 'px';
      trail.style.setProperty('--o1x', (dx * liftAt) + 'px');
      trail.style.setProperty('--o1y', (dy * liftAt) + 'px');
      trail.style.setProperty('--o2x', (dx * 0.6) + 'px');
      trail.style.setProperty('--o2y', (dy * 0.6) + 'px');
      trail.style.setProperty('--oex', dx + 'px');
      trail.style.setProperty('--oey', dy + 'px');
      trail.style.setProperty('--orb-dur', DUR + 'ms');
      trail.style.animationDelay = (delay + 55) + 'ms';
      world.appendChild(trail);
      setTimeout(() => trail.remove(), DUR + delay + 150);

      /* 抵达父卡：吸收反馈 + 扩散环 */
      setTimeout(() => {
        absorbAtParent(parentEl, ex, ey, size);
      }, delay + DUR - 40);
    }
  }

  /* 5.3.1 父卡吸收反馈 */
  function absorbAtParent(parentEl, x, y, size) {
    playSound('orbAbsorb', 0.75);

    /* 卡片高亮脉冲 */
    parentEl.classList.remove('absorbing');
    void parentEl.offsetWidth;
    parentEl.classList.add('absorbing');
    setTimeout(() => parentEl.classList.remove('absorbing'), 440);

    /* 命中扩散环 */
    const ring = document.createElement('div');
    ring.className = 'orb-impact';
    const rSize = size * 7;
    ring.style.width  = rSize + 'px';
    ring.style.height = rSize + 'px';
    ring.style.left = x + 'px';
    ring.style.top  = y + 'px';
    world.appendChild(ring);
    setTimeout(() => ring.remove(), 520);

    /* 父卡位置的小粒子吸收 */
    spawnParticlesAt(x, y, 5, Math.PI * 1.5, 'chip');
  }

  /* 5.3.2 指定坐标的粒子（吸收反馈用） */
  function spawnParticlesAt(x, y, count, angle, kind) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle ' + (kind || 'chip');
      const size = rand(4, 7);
      p.style.width  = size + 'px';
      p.style.height = size + 'px';
      p.style.left = x + 'px';
      p.style.top  = y + 'px';

      const a = angle + rand(-0.7, 0.7);
      const dist = rand(28, 58);
      p.style.setProperty('--dx', (Math.cos(a) * dist) + 'px');
      p.style.setProperty('--dy', (Math.sin(a) * dist) + 'px');
      p.style.animationDelay = (i * 12) + 'ms';
      p.style.animationDuration = '420ms';

      world.appendChild(p);
      setTimeout(() => p.remove(), 500 + i * 12);
    }
  }

  /* 5.4 飘字 */
  function floatText(cardEl, text, color) {
    const x = cardEl.offsetLeft + CARD_W / 2;
    const y = cardEl.offsetTop;

    const t = document.createElement('div');
    t.className = 'float-text';
    t.textContent = text;
    t.style.left = x + 'px';
    t.style.top  = y + 'px';
    t.style.color = color;
    t.style.borderColor = color + '66';
    t.style.background  = color + '22';

    world.appendChild(t);
    setTimeout(() => t.remove(), 860);
  }

  /* 5.4 镜头微震 */
  let shakeTimeout = null;
  function shakeCamera(intensity) {
    if (shakeTimeout) clearTimeout(shakeTimeout);
    const start = performance.now();
    const dur = 220;
    const amp = intensity;
    (function tick(now) {
      const p = Math.min(1, (now - start) / dur);
      const decay = 1 - p;
      const dx = (Math.random() - 0.5) * amp * 2 * decay;
      const dy = (Math.random() - 0.5) * amp * 2 * decay;
      world.style.setProperty('--shake-x', dx + 'px');
      world.style.setProperty('--shake-y', dy + 'px');
      applyTransform();
      if (p < 1) requestAnimationFrame(tick);
      else {
        world.style.setProperty('--shake-x', '0px');
        world.style.setProperty('--shake-y', '0px');
        applyTransform();
      }
    })(start);
  }

  /* 5.5 连线同步 */
  function syncLines() {
    nodeMap.forEach((node, id) => {
      if (!node.parentId) return;

      const ps = state.get(node.parentId);
      const cs = state.get(id);
      const visible = ps !== 'unborn' && cs !== 'unborn';

      let base = lineBaseMap.get(id);
      if (!base) {
        base = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        base.setAttribute('class', 'line-base');
        svg.appendChild(base);
        lineBaseMap.set(id, base);
      }
      let flow = lineFlowMap.get(id);
      if (!flow) {
        flow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        flow.setAttribute('class', 'line-flow');
        svg.appendChild(flow);
        lineFlowMap.set(id, flow);
      }

      const p = layoutPositions.get(node.parentId);
      const c = layoutPositions.get(id);
      const x1 = p.x + CARD_W / 2, y1 = p.y + CARD_H;
      const x2 = c.x + CARD_W / 2, y2 = c.y;
      const midY = (y1 + y2) / 2;
      const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;

      base.setAttribute('d', d);
      flow.setAttribute('d', d);

      /* 记录几何，供回缩动画随时重建塌陷路径 */
      lineGeomMap.set(id, { x1, y1, x2, y2, midY });
      /* 三次贝塞尔求点：p=0 在父卡端、p=1 在子卡端 */
      linePointFn.set(id, (t) => {
        const mt = 1 - t;
        const a = mt * mt * mt, b = 3 * mt * mt * t, cc = 3 * mt * t * t, dd = t * t * t;
        return {
          x: a * x1 + b * x1 + cc * x2 + dd * x2,
          y: a * y1 + b * midY + cc * midY + dd * y2,
        };
      });

      /* 可见性归零时顺手清掉回缩残留的临时样式 */
      if (!visible) {
        flow.removeAttribute('stroke');
        flow.style.removeProperty('stroke');
      }

      base.classList.toggle('visible', visible);
      flow.classList.toggle('visible', visible);
    });
  }

  /* 5.5.1 连线塌陷：把子卡到父卡的连线"吸"回父卡
     childEl 主要用于语义清晰，回吸粒子按几何采样生成 */
  function retractLine(parentId, childId, delay, childEl) {
    const base = lineBaseMap.get(childId);
    const flow = lineFlowMap.get(childId);
    const geom = lineGeomMap.get(childId);
    if (!base || !flow || !geom) return;

    const DUR = 520;
    const { x1, y1, x2, y2, midY } = geom;
    const pt = linePointFn.get(childId);
    if (!pt) return;

    const startD = flow.getAttribute('d');

    /* 长度收回：起点固定在子卡端，终点沿曲线一路抽回父卡。
       p = 1 是"完整长度"（未收回），p = 0 是"完全收进父卡"。 */
    const buildPath = (p) => {
      /* p 从 1 衰减到 0：终点 t 从 1（子卡端）走到 0（父卡端） */
      const head = pt(1);              // 固定不动的子卡端
      const tail = pt(1 - p);          // 一路抽回的活端
      /* 控制点按收缩后的比例重新取，保持原有弧度不塌成直线 */
      const c1 = pt(1 - p * (1 / 3));
      const c2 = pt(1 - p * (2 / 3));
      return `M ${head.x} ${head.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ` +
             `${tail.x} ${tail.y}`;
    };

    /* 收回进度：raw 从 0 走到 1 表示"已收回的比例"，
       buildPath 收的是"剩余长度" p = 1 - eased */
    const ease = (t) => {
      /* cubic-bezier(0.55,0.06,0.68,0.19) 的近似求值：
         前段慢（线还挂着）、后段猛地抽走 */
      const mt = 1 - t;
      return mt * mt * mt * 0.0 + 3 * mt * mt * t * 0.06 +
             3 * mt * t * t * 0.68 + t * t * t * 1.0;
    };

    setTimeout(() => {
      base.classList.add('retracting');
      flow.classList.add('retracting');
      /* 收回时虚线流动太乱，暂停掉，专注"长度在缩短"这件事 */
      flow.style.animationPlayState = 'paused';

      const steps = 42;
      const frames = [{ d: buildPath(1), offset: 0 }];
      for (let s = 1; s < steps; s++) {
        const raw = s / steps;
        frames.push({ d: buildPath(1 - ease(raw)), offset: raw });
      }
      frames.push({ d: buildPath(1 - ease(1)), offset: 1 });

      let a1 = null, a2 = null;
      if (typeof flow.animate === 'function') {
        const opts = { duration: DUR, easing: 'linear', fill: 'forwards' };
        try {
          a1 = base.animate(frames, opts);
          a2 = flow.animate(frames, opts);
        } catch (err) { a1 = null; a2 = null; }
      }

      /* 线头亮点：跟着收回的进度从子卡端滑向父卡，是"收回感"的支点 */
      const dot = document.createElement('div');
      dot.className = 'line-head';
      const startPt = pt(1);
      dot.style.left = startPt.x + 'px';
      dot.style.top  = startPt.y + 'px';
      world.appendChild(dot);

      let rafId = null;
      let headTimer = null;
      const t0 = performance.now();

      const tick = () => {
        const raw = Math.min(1, (performance.now() - t0) / DUR);
        /* 线头跟着"活端"走：raw=0 在子卡端，raw=1 抵达父卡端 */
        const at = pt(1 - ease(raw));
        dot.style.left = at.x + 'px';
        dot.style.top  = at.y + 'px';
        /* 越收越快，线头也越缩越小 */
        const sc = 1 - ease(raw) * 0.5;
        dot.style.transform = `scale(${sc})`;
        if (raw < 1) {
          rafId = requestAnimationFrame(tick);
        } else {
          dot.classList.add('burst');
          headTimer = setTimeout(() => dot.remove(), 240);
        }
      };

      if (typeof requestAnimationFrame === 'function') {
        rafId = requestAnimationFrame(tick);
      } else {
        headTimer = setTimeout(() => dot.remove(), DUR);
      }

      setTimeout(() => {
        if (rafId !== null && typeof cancelAnimationFrame === 'function') {
          cancelAnimationFrame(rafId);
        }
        if (headTimer) clearTimeout(headTimer);
        if (dot.parentNode) dot.remove();

        if (a1) a1.cancel();
        if (a2) a2.cancel();
        base.classList.remove('retracting');
        flow.classList.remove('retracting');
        flow.style.removeProperty('animation-play-state');
        flow.removeAttribute('stroke');
        flow.style.removeProperty('stroke');
        /* 把路径交还给状态判定，避免留在收回态 */
        syncLines();
      }, DUR + 60);
    }, delay);
  }

  /* 5.6 连线脉冲 */
  function pulseLine(parentId, childId) {
    const flow = lineFlowMap.get(childId);
    if (!flow) return;
    flow.classList.remove('pulse');
    void flow.offsetWidth;
    flow.classList.add('pulse');
    setTimeout(() => flow.classList.remove('pulse'), 700);
  }

  /* =========================================================
   * 6. 卡片创建与应用状态
   * ========================================================= */
  function createCardElement(id) {
    const node = nodeMap.get(id);
    const pos  = layoutPositions.get(id);

    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = id;
    el.style.left = pos.x + 'px';
    el.style.top  = pos.y + 'px';

    const content = document.createElement('span');
    content.className = 'card-content';
    content.textContent = node.text;
    el.appendChild(content);

    el.addEventListener('pointerdown',   onCardPointerDown);
    el.addEventListener('click',         onCardClick);
    el.addEventListener('contextmenu',   onCardContextMenu);
    el.addEventListener('mouseenter',    onCardMouseEnter);
    el.addEventListener('touchstart',    onCardTouchStart, { passive: true });

    world.appendChild(el);
    cardElements.set(id, el);
    return el;
  }

  function applyState(id) {
    const el = cardElements.get(id);
    const node = nodeMap.get(id);
    if (!el || !node) return;

    const s = state.get(id);
    const content = el.querySelector('.card-content');

    if (s === 'unborn') {
      el.classList.remove('visible', 'cover', 'revealed');
      return;
    }

    el.classList.add('visible');

    if (s === 'cover') {
      el.classList.remove('revealed');
      el.classList.add('cover');
      content.textContent = '待回忆';
    } else {
      el.classList.remove('cover');
      el.classList.add('revealed');
      content.textContent = node.text;
    }
  }

  /* =========================================================
   * 7. 交互阶段
   * ========================================================= */

  function onCardPointerDown(e) {
    initAudio();
    const el = e.currentTarget;
    if (isAnimating.has(el.dataset.id)) return;
    el.classList.add('pressing');
    playSound('tapLight');

    const clear = () => {
      el.classList.remove('pressing');
      window.removeEventListener('pointerup', clear);
      window.removeEventListener('pointercancel', clear);
    };
    window.addEventListener('pointerup', clear);
    window.addEventListener('pointercancel', clear);
  }

  function onCardMouseEnter(e) {
    if (state.get(e.currentTarget.dataset.id) === 'unborn') return;
    playSound('hoverTick', 0.5);
  }

  /* ---- 移动端长按触发右键 ---- */
  let touchTimer = null;
  let touchTriggered = false;
  function onCardTouchStart(e) {
    const el = e.currentTarget;
    const id = el.dataset.id;
    if (state.get(id) === 'unborn') return;
    touchTriggered = false;
    clearTimeout(touchTimer);
    touchTimer = setTimeout(() => {
      touchTriggered = true;
      const desc = collectDescendants(id);
      if (desc.length) {
        // 触发轻微震动
        if (navigator.vibrate) navigator.vibrate(18);
        collapseDescendants(id, desc);
      }
    }, 480);
  }
  document.addEventListener('touchend', () => clearTimeout(touchTimer), true);
  document.addEventListener('touchmove', () => clearTimeout(touchTimer), true);

  /* ---- 左键主逻辑 ---- */
  function onCardClick(e) {
    if (touchTriggered) { touchTriggered = false; return; }
    e.stopPropagation();
    const id = e.currentTarget.dataset.id;
    const s = state.get(id);
    if (s === 'unborn') return;

    // 待回忆 → 翻开这一张
    if (s === 'cover') {
      flipCard(id, 'small');
      return;
    }

    // 已翻开 → 推进下一层
    const node = nodeMap.get(id);
    if (!node.children.length) return;

    const children = node.children;

    // 情况 1：还有未出现的兄弟 → 一起变待回忆
    const unborn = children.filter(c => state.get(c) === 'unborn');
    if (unborn.length) {
      expandLayer(id, unborn);
      return;
    }

    // 情况 2：这一层都是待回忆 → 一起翻开
    const covers = children.filter(c => state.get(c) === 'cover');
    if (covers.length) {
      const tier = covers.length >= 3 ? 'medium' : 'small';
      revealLayer(id, covers, tier);
      return;
    }

    // 情况 3：向下推进第一个未完成分支
    for (const c of children) {
      if (hasUnfinished(c)) {
        onCardClick({ currentTarget: cardElements.get(c), stopPropagation(){} });
        return;
      }
    }
  }

  /* ---- 右键收卡 ---- */
  function onCardContextMenu(e) {
    e.preventDefault();
    e.stopPropagation();
    const id = e.currentTarget.dataset.id;
    if (state.get(id) === 'unborn') return;

    const desc = collectDescendants(id);
    if (!desc.length) return;

    // 保存撤销快照
    const snapshot = new Map();
    state.forEach((v, k) => snapshot.set(k, v));
    undoStack.push({ type: 'collapse', parentId: id, snapshot, descIds: [...desc] });

    collapseDescendants(id, desc);
    showUndoToast(desc.length);
  }

  /* =========================================================
   * 8. 动作流程
   * ========================================================= */

  /* ---- 翻开单张 ---- */
  async function flipCard(nodeId, tier = 'small') {
    if (isAnimating.has(nodeId)) return;
    if (state.get(nodeId) !== 'cover') return;

    const el = cardElements.get(nodeId);
    if (!el) return;

    const T = GF.tiers[tier] || GF.tiers.small;
    isAnimating.add(nodeId);
    el.classList.remove('pressing');

    /* 阶段 3：判定定格 */
    el.classList.add('freezing');
    await sleep(T.freeze);
    el.classList.remove('freezing');

    /* 阶段 4：爆发扩散 */
    el.classList.add('bursting', 'flipping');
    playSound('flipPop', T.sound);
    spawnParticles(el, T.particles);
    if (T.ring) spawnRing(el, 130);
    floatText(el, '已翻开', '#7FE0A0');
    if (T.shake > 1) shakeCamera(T.shake);

    // 在爆发动画峰值处切换内容
    setTimeout(() => {
      state.set(nodeId, 'revealed');
      applyState(nodeId);
      // 父连线脉冲
      const node = nodeMap.get(nodeId);
      if (node && node.parentId) {
        pulseLine(node.parentId, nodeId);
        // 经验球：从这张子卡飞向父卡
        spawnExpOrbs(el, cardElements.get(node.parentId), T.particles >= 15 ? 4 : 3);
      }
      syncLines();
    }, 110);

    await sleep(GF.duration.release);
    el.classList.remove('bursting', 'flipping');

    /* 阶段 5：惯性吸收 */
    el.classList.add('settling');
    playSound('settleSoft', 0.7);
    await sleep(GF.duration.settle);
    el.classList.remove('settling');

    /* 阶段 6：结果结算 */
    isAnimating.delete(nodeId);
    checkAllRevealed();
  }

  /* ---- 展开一层（未出现 → 待回忆）---- */
  function expandLayer(parentId, unbornIds) {
    const parentEl = cardElements.get(parentId);
    if (parentEl) {
      parentEl.classList.add('pushing');
      setTimeout(() => parentEl.classList.remove('pushing'), 440);
    }

    const T = GF.tiers[unbornIds.length >= 3 ? 'medium' : 'small'];
    playSound('expandWhoosh', T.sound);
    if (parentEl) {
      spawnParticles(parentEl, T.particles, Math.PI / 2);
      if (T.ring) spawnRing(parentEl, 110);
    }

    unbornIds.forEach((id, i) => {
      state.set(id, 'cover');
      const el = cardElements.get(id);
      if (!el) return;

      const pPos = layoutPositions.get(parentId);
      const cPos = layoutPositions.get(id);
      const fromX = (pPos.x + CARD_W / 2) - (cPos.x + CARD_W / 2);
      const fromY = (pPos.y + CARD_H / 2) - (cPos.y + CARD_H / 2);

      el.style.setProperty('--from-x', fromX + 'px');
      el.style.setProperty('--from-y', fromY + 'px');
      el.style.animationDelay = (i * 55) + 'ms';

      el.classList.add('spawning');
      applyState(id);

      setTimeout(() => {
        el.classList.remove('spawning');
        el.style.animationDelay = '';
        el.style.removeProperty('--from-x');
        el.style.removeProperty('--from-y');
      }, 500 + i * 55);
    });

    setTimeout(syncLines, 60);
  }

  /* ---- 翻开一层（待回忆 → 已翻开）---- */
  function revealLayer(parentId, coverIds, tier) {
    const parentEl = cardElements.get(parentId);
    if (parentEl) {
      parentEl.classList.add('pushing');
      setTimeout(() => parentEl.classList.remove('pushing'), 440);
    }

    playSound('expandWhoosh', tier === 'medium' ? 0.9 : 0.6);

    coverIds.forEach((id, i) => {
      setTimeout(() => flipCard(id, tier), i * 70);
    });

    if (tier === 'medium') {
      setTimeout(() => shakeCamera(1.6), 90);
    }
  }

  /* ---- 收卡 ---- */
  async function collapseDescendants(parentId, descIds) {
    const parentEl = cardElements.get(parentId);
    const pPos = layoutPositions.get(parentId);
    const targetX = pPos.x + CARD_W / 2;
    const targetY = pPos.y + CARD_H / 2;

    const T = GF.tiers[descIds.length >= 3 ? 'medium' : 'small'];

    /* 动画时长与卡片数相关：牌少时更从容，牌多时略快以免拖沓 */
    const DUR = descIds.length >= 6 ? 520 : (descIds.length >= 3 ? 560 : 600);
    /* 交错：用平方根曲线，近处的牌先走、远处的牌稍后跟上，节奏自然 */
    const stepFor = (i, n) => Math.round(38 * Math.sqrt(i) + (n > 4 ? i * 9 : i * 14));

    /* 父卡接收：预备 → 吞入 → 回弹落定（与第一张牌抵达时刻同步） */
    if (parentEl) {
      parentEl.classList.remove('receiving');
      void parentEl.offsetWidth;
      parentEl.classList.add('receiving');
      setTimeout(() => parentEl.classList.remove('receiving'), DUR + 120);
    }

    playSound('collapseWhoosh', T.sound);

    if (parentEl) {
      floatText(parentEl, `收回 ${descIds.length} 张`, '#FF8A8A');
      /* 吸入汇聚光晕：把注意力引向父卡 */
      const sink = document.createElement('div');
      sink.className = 'collapse-sink';
      const sinkSize = 150;
      sink.style.width  = sinkSize + 'px';
      sink.style.height = sinkSize + 'px';
      sink.style.left = targetX + 'px';
      sink.style.top  = targetY + 'px';
      world.appendChild(sink);
      setTimeout(() => sink.remove(), 680);

      spawnParticles(parentEl, T.particles, -Math.PI / 2, 'rose');
      if (T.ring) spawnRing(parentEl, 140, 'rose');
    }
    if (T.shake > 1) shakeCamera(T.shake);

    /* 逐张吸入 */
    let lastLandAt = 0;

    descIds.forEach((id, i) => {
      const el = cardElements.get(id);
      if (!el) return;

      const cPos = layoutPositions.get(id);
      const dx = targetX - (cPos.x + CARD_W / 2);
      const dy = targetY - (cPos.y + CARD_H / 2);
      const delay = stepFor(i, descIds.length);

      el.style.setProperty('--collapse-x', dx + 'px');
      el.style.setProperty('--collapse-y', dy + 'px');
      el.style.setProperty('--collapse-dur', DUR + 'ms');
      el.style.animationDelay = delay + 'ms';
      el.classList.add('collapsing');

      const landAt = delay + DUR;
      lastLandAt = Math.max(lastLandAt, landAt);

      /* 每张牌抵达父卡时，补一小撮粒子，强化"被吞进去"的触感 */
      setTimeout(() => {
        spawnParticlesAt(targetX, targetY, 3, -Math.PI / 2, 'rose');
      }, landAt - 90);

      /* 结算：时长与 CSS 动画严格一致，避免闪烁或提前消失 */
      setTimeout(() => {
        /* 连线先塌回父卡：必须在 syncLines() 之前触发，
           否则 syncLines 会把线条直接置为不可见，塌陷动画就没得看了 */
        retractLine(parentId, id, 0, el);

        /* 等连线塌陷跑完再结算，卡片消失与连线回缩同步收束 */
        setTimeout(() => {
          el.classList.remove('collapsing', 'visible', 'cover', 'revealed');
          el.style.animationDelay = '';
          el.style.removeProperty('--collapse-x');
          el.style.removeProperty('--collapse-y');
          el.style.removeProperty('--collapse-dur');
          state.set(id, 'unborn');
          applyState(id);
          syncLines();
        }, 560);

      }, landAt - 40);
    });

    /* 全部吸完后给父卡一个轻柔的落定音 */

    const result = [];
    (function walk(nid) {

        if (state.get(c) !== 'unborn') {
          result.push(c);
          walk(c);
        }

    })(id);
    return result;

    const node = nodeMap.get(id);
    for (const c of node.children) {
      const s = state.get(c);
      if (s === 'unborn' || s === 'cover') return true;
      if (hasUnfinished(c)) return true;
    }
    return false;

  /* =========================================================
   * 11. 画布拖拽 + 缩放
   * ========================================================= */
  let panX = 0, panY = 0, zoom = 1;
  let dragging = false;
  let dragStartX = 0, dragStartY = 0;
  let panStartX = 0, panStartY = 0;

  function applyTransform() {
    const sx = world.style.getPropertyValue('--shake-x') || '0px';
    const sy = world.style.getPropertyValue('--shake-y') || '0px';
    world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom}) translate(${sx}, ${sy})`;
  }

  container.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.card')) return;
    if (e.target.closest('.rating-panel')) return;
    if (e.target.closest('.undo-toast')) return;
    initAudio();
    dragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    panStartX = panX;       panStartY = panY;
    container.classList.add('dragging');
  });

  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    panX = panStartX + (e.clientX - dragStartX);
    panY = panStartY + (e.clientY - dragStartY);
    applyTransform();
  });

  window.addEventListener('pointerup', () => {
    dragging = false;
    container.classList.remove('dragging');
  });

  /* 滚轮缩放 */
  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const oldZoom = zoom;
    const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
    const newZoom = Math.min(1.8, Math.max(0.45, zoom * factor));
    if (newZoom === oldZoom) return;

    // 以鼠标位置为锚点
    const wx = (mx - panX) / oldZoom;
    const wy = (my - panY) / oldZoom;
    panX = mx - wx * newZoom;
    panY = my - wy * newZoom;
    zoom = newZoom;
    applyTransform();
  }, { passive: false });

  /* 在屏幕坐标生成一个 fixed 定位的评分涟漪环 */
  function ratingRingAt(cx, cy, size, kind, cls) {
    const r = document.createElement('div');
    r.className = 'ring rating-ring' + (kind ? ' ' + kind : '') + (cls ? ' ' + cls : '');
    r.style.left = cx + 'px';
    r.style.top  = cy + 'px';

  }

  function ratingFloatAt(cx, cy, text, color) {
    const f = document.createElement('div');
    f.className = 'float-text rating-float';
    f.textContent = text;
    f.style.left = cx + 'px';
    f.style.top  = cy + 'px';

  document.getElementById('ratingPanel').addEventListener('click', (e) => {
    const btn = e.target.closest('.rating-btn');

    const rating = btn.getAttribute('data-rating');
    const fx = RATING_FX[rating];
    if (!fx) return;

    initAudio();

    // 按钮脉冲：幅度与颜色随档位（forgot 1.1 → easy 1.3）
    const activeCls = 'active-' + rating;
    btn.classList.remove('pulse', activeCls);
    void btn.offsetWidth;
    btn.classList.add(activeCls);
    setTimeout(() => btn.classList.remove(activeCls), 580);

    // 分档音效：rateForgot / rateHard / rateGood / rateEasy，音量逐级递增
    playSound(fx.sound, fx.vol);

    // 分档全屏光晕：rose 暗红 / warm 琥珀与金 / green 绿
    const flash = document.createElement('div');
    flash.className = 'flash ' + fx.flash;
    flash.style.animationDuration = '700ms';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 720);

    // 分档震屏：忘记最重（3.5），轻松最轻（1.2）
    shakeCamera(fx.shake);

    // 涟漪生成在按钮自身的屏幕位置（不再是屏幕中心）
    const rect = btn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    ratingRingAt(cx, cy, fx.ring, fx.ringKind);

    // 轻松档：延迟 120ms 的第二环，更大更淡，制造"扩散开"的余韵
    if (rating === 'easy') {
      setTimeout(() => ratingRingAt(cx, cy, 340, 'gold', 'thin'), 120);
    }

    // 粒子：朝上（-PI/2）喷射，数量与形状随档位
    spawnParticlesAt(cx, cy, fx.particles, -Math.PI / 2, fx.particleKind);

    // 飘字：按钮上方 12px
    ratingFloatAt(cx, rect.top - 12, fx.label, fx.color);

    // 轻松档专属：3 个环绕光点从按钮中心飞出
    if (rating === 'easy') {
      for (let i = 0; i < 3; i++) {
        const d = document.createElement('div');
        d.className = 'orbit-dot';
        d.style.left = cx + 'px';
        d.style.top  = cy + 'px';
        const a = -Math.PI / 2 + (i - 1) * 0.9;   // 偏上方扇形展开
        const dist = 62 + i * 10;
        d.style.setProperty('--ox', (Math.cos(a) * dist) + 'px');
        d.style.setProperty('--oy', (Math.sin(a) * dist) + 'px');
        d.style.animationDelay = (i * 45) + 'ms';
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 700 + i * 45);
      }
    }
  });

      var size = rand(4, 9);
      var ang  = rand(0, Math.PI * 2);
      var dist = rand(38, 96);
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = x + 'px';
      p.style.top  = y + 'px';
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      p.style.background = 'radial-gradient(circle, #fff 0%, ' + color + ' 55%, transparent 78%)';
      p.style.boxShadow = '0 0 10px ' + color;
      document.body.appendChild(p);
      setTimeout(function (el) { return function () { el.remove(); }; }(p), 660);
    }
  }

  function qRingAt(x, y, size, color) {
    var r = document.createElement('div');
    r.className = 'q-ripple';
    r.style.width = size + 'px';
    r.style.height = size + 'px';
    r.style.left = x + 'px';
    r.style.top  = y + 'px';
    r.style.borderColor = color;
    document.body.appendChild(r);
    setTimeout(function () { r.remove(); }, 560);
  }

  function qFloatAt(x, y, text, color) {
    var el = document.createElement('div');
    el.className = 'q-float-text';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.color = color;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 940);
  }

  function qFlashScreen(color) {
    var f = document.createElement('div');
    f.className = 'q-flash';
    f.style.background = 'radial-gradient(ellipse at center, ' + color + ' 0%, transparent 72%)';
    document.body.appendChild(f);
    setTimeout(function () { f.remove(); }, 660);
  }

  function qShake(kind) {
    if (!kind) return;
    stage.classList.remove('shake-sm', 'shake-md');
    void stage.offsetWidth;
    stage.classList.add(kind);
    setTimeout(function () { stage.classList.remove(kind); }, 340);
  }

  function qCenterOf(el) {
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  /* =========================================================
   * 14.5 渲染
   * ========================================================= */
  function currentQuestion() { return QUESTIONS[S.idx]; }

  function updateHud() {
    var total = QUESTIONS.length;
    okNum.textContent  = S.ok;
    badNum.textContent = S.bad;
    bar.style.width = (S.idx / total * 100) + '%';
  }

  function renderQuestion() {
    var q = currentQuestion();
    S.locked = false;
    S.picked = -1;

    qtag.textContent = q.tag;
    qidx.textContent = (S.idx + 1) + ' / ' + QUESTIONS.length;
    qtext.textContent = q.q;

    comboEl.classList.remove('show', 'break');
    explainEl.className = '';
    explainEl.innerHTML = '';

    optionsEl.innerHTML = '';
    q.options.forEach(function (text, i) {
      var btn = document.createElement('button');
      btn.className = 'opt';
      btn.type = 'button';
      btn.dataset.i = i;
      btn.innerHTML = '<span class="key">' + (i + 1) + '</span><span class="label"></span>';
      btn.querySelector('.label').textContent = text;

      btn.addEventListener('mouseenter', function () {
        if (!S.locked) play('hover');
      });
      btn.addEventListener('click', function () { pick(i, btn); });
      optionsEl.appendChild(btn);

      setTimeout(function () { btn.classList.add('shown'); }, 60 + i * 55);
    });

    qcard.classList.remove('correct', 'wrong', 'leave', 'enter');
    void qcard.offsetWidth;
    qcard.classList.add('enter');

    actionsEl.innerHTML = '';
    updateHud();
  }

  /* =========================================================
   * 14.6 判定
   * ========================================================= */
  var TIERS = {
    small:  { particles: 9,  ring: true, shake: 'shake-sm', sound: 0.6 },
    medium: { particles: 15, ring: true, shake: 'shake-sm', sound: 0.8 },
    large:  { particles: 22, ring: true, shake: 'shake-md', sound: 1.0 }
  };

  function pick(i, btn) {
    if (S.locked) return;
    S.locked = true;
    S.picked = i;

    var q = currentQuestion();
    var correct = (i === q.answer);
    var optEls = Array.prototype.slice.call(optionsEl.querySelectorAll('.opt'));

    btn.classList.add('pressing');
    play('tap');
    setTimeout(function () { btn.classList.remove('pressing'); }, 130);

    optEls.forEach(function (o) { o.disabled = true; });

    if (correct) {
      S.ok++;
      S.combo++;
      S.maxCombo = Math.max(S.maxCombo, S.combo);
    } else {
      S.bad++;
      S.combo = 0;
    }

    S.records.push({ idx: S.idx, tag: q.tag, q: q.q, picked: i, answer: q.answer, correct: correct });

    var tier = correct
      ? (S.combo >= 3 ? TIERS.large : (S.combo >= 2 ? TIERS.medium : TIERS.small))
      : TIERS.medium;

    setTimeout(function () {
      var c;
      if (correct) {
        btn.classList.add('correct');
        optEls.forEach(function (o) { if (o !== btn) o.classList.add('dimmed'); });

        qcard.classList.add('correct');
        qFlashScreen('rgba(127,224,160,0.55)');

        c = qCenterOf(btn);
        qParticlesAt(c.x, c.y, tier.particles, '#7fe0a0');
        if (tier.ring) qRingAt(c.x, c.y, 120, 'rgba(127,224,160,0.8)');

        var gain = 10 + Math.min(5, S.combo) * 2;
        qFloatAt(c.x, c.y - 20, '+' + gain, '#7fe0a0');

        play('correct', tier.sound);

        if (S.combo >= 2) {
          comboEl.textContent = S.combo + ' 连击';
          comboEl.classList.add('show');
          play('combo', 0.8);
        }
      } else {
        btn.classList.add('wrong');
        var rightBtn = optEls[q.answer];
        if (rightBtn) rightBtn.classList.add('reveal');
        optEls.forEach(function (o) { if (o !== btn && o !== rightBtn) o.classList.add('dimmed'); });

        qcard.classList.add('wrong');
        qFlashScreen('rgba(255,90,90,0.42)');
        qShake(tier.shake);

        c = qCenterOf(btn);
        qParticlesAt(c.x, c.y, tier.particles, '#ff8a8a');
        qFloatAt(c.x, c.y - 20, '✕', '#ff8a8a');

        if (comboEl.classList.contains('show')) {
          comboEl.classList.add('break');
          setTimeout(function () { comboEl.classList.remove('show', 'break'); }, 260);
        }

        play('wrong', tier.sound);
      }

      updateHud();

      var rightText = q.options[q.answer];
      explainEl.innerHTML = correct
        ? '<b>回答正确。</b>' + q.explain
        : '<b>正确答案：' + escapeHtml(rightText) + '</b><br>' + q.explain;
      explainEl.classList.add('show', correct ? 'ok' : 'bad');

      actionsEl.innerHTML = '';
      var last = (S.idx === QUESTIONS.length - 1);
      var next = document.createElement('button');
      next.className = 'q-btn';
      next.type = 'button';
      next.textContent = last ? '查看结果' : '下一题';
      next.addEventListener('click', advance);
      actionsEl.appendChild(next);
      next.focus({ preventScroll: true });
    }, 170);
  }

  function advance() {
    if (S.idx >= QUESTIONS.length - 1) { showResult(); return; }

    play('advance');
    comboEl.classList.remove('show');

    qcard.classList.remove('enter', 'correct', 'wrong');
    qcard.classList.add('leave');

    setTimeout(function () {
      qcard.classList.remove('leave');
      S.idx++;
      renderQuestion();
    }, 300);
  }

  /* =========================================================
   * 14.7 结算
   * ========================================================= */
  function showResult() {
    S.running = false;
    var total = QUESTIONS.length;
    var pct = Math.round(S.ok / total * 100);

    bar.style.width = '100%';
    play('finish');
    qFlashScreen('rgba(160,190,255,0.5)');

    $('resultTitle').textContent =
      pct === 100 ? '全对！' : (pct >= 80 ? '非常不错' : (pct >= 60 ? '继续加油' : '需要再练'));
    $('resultSub').textContent =
      '共 ' + total + ' 题 · 对 ' + S.ok + ' · 错 ' + S.bad + ' · 最高连击 ' + S.maxCombo;

    var list = $('reviewList');
    list.innerHTML = '';
    $('reviewHead').innerHTML =
      '<span>逐题复盘</span><span>' + S.records.length + ' 题 · 向下滚动查看全部</span>';
    S.records.forEach(function (r) {
      var item = document.createElement('div');
      item.className = 'revItem ' + (r.correct ? 'ok' : 'bad');
      item.innerHTML =
        '<span class="mark">' + (r.correct ? '✓' : '✕') + '</span>' +
        '<span><span class="q">' + escapeHtml(r.q) + '</span>' +
        '<div class="a">' + (r.correct
            ? '你的答案：<em>' + escapeHtml(QUESTIONS[r.idx].options[r.picked]) + '</em>'
            : '你选了 ' + escapeHtml(QUESTIONS[r.idx].options[r.picked]) +
              ' · 正确：<em>' + escapeHtml(QUESTIONS[r.idx].options[r.answer]) + '</em>') + '</div>' +
        '</span>';
      list.appendChild(item);
    });

    resultEl.classList.add('show');

    var C = 2 * Math.PI * 82;
    var ringFg = $('ringFg');
    ringFg.setAttribute('stroke-dasharray', C.toFixed(1));
    ringFg.setAttribute('stroke-dashoffset', C.toFixed(1));

    var numEl = $('scoreNum');
    numEl.textContent = '0';

    setTimeout(function () {
      ringFg.setAttribute('stroke-dashoffset', (C * (1 - pct / 100)).toFixed(1));
      var dur = 900;
      var t0 = performance.now();
      var tick = function () {
        var raw = Math.min(1, (performance.now() - t0) / dur);
        var e = 1 - Math.pow(1 - raw, 3);
        numEl.textContent = Math.round(pct * e) + '%';
        if (raw < 1) requestAnimationFrame(tick);
      };
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
      else numEl.textContent = pct + '%';
    }, 120);
  }

  function restart() {
    S.idx = 0; S.ok = 0; S.bad = 0; S.combo = 0; S.maxCombo = 0;
    S.locked = false; S.picked = -1; S.records = []; S.running = true;

    resultEl.classList.remove('show');
    comboEl.classList.remove('show');
    okNum.textContent = '0';
    badNum.textContent = '0';
    bar.style.width = '0%';

    renderQuestion();
  }

  /* =========================================================
   * 14.8 视图切换（不销毁导图状态）
   * ========================================================= */
  var inQuiz = false;
  function setView(on) {
    inQuiz = on;
    viewEl.classList.toggle('on', on);
    document.body.classList.toggle('quiz-mode', on);
    toggleBtn.textContent = on ? '返回导图' : '做题';
    if (on) {
      AUDIO.initAudio();
      /* 进入时清掉上一次的可能残留（切换过程不销毁导图，只重置做题态） */
      startEl.classList.remove('hide');
      resultEl.classList.remove('show');
      S.running = false;
      updateHud();
    }
  }
  toggleBtn.addEventListener('click', function () { setView(!inQuiz); });

  /* =========================================================
   * 14.9 键盘（仅在做题视图内生效，避免与导图快捷键冲突）
   * ========================================================= */
  document.addEventListener('keydown', function (e) {
    if (!inQuiz || !S.running) return;

    var k = e.key;
    if (k >= '1' && k <= '4') {
      var i = parseInt(k, 10) - 1;
      var btn = optionsEl.querySelector('.opt[data-i="' + i + '"]');
      if (btn && !S.locked) pick(i, btn);
    } else if (k === 'Enter' || k === ' ') {
      if (S.locked) {
        var nb = actionsEl.querySelector('.q-btn');
        if (nb) { e.preventDefault(); advance(); }
      }
    }
  });

  /* 答题过程中按 Esc 回到导图 */
  document.addEventListener('keydown', function (e) {
    if (inQuiz && e.key === 'Escape') setView(false);
  });

  /* =========================================================
   * 14.10 启动
   * ========================================================= */
  $('startBtn').addEventListener('click', function () {
    AUDIO.initAudio();
    play('advance');
    startEl.classList.add('hide');
    restart();
  });

  $('againBtn').addEventListener('click', function () {
    play('advance');
    restart();
  });

  /* 接受外部（含测试脚本）驱动视图切换 */
  window.__DSH_QUIZ__ = {
    setView: setView,
    isOn: function () { return inQuiz; },
    state: S,
    questions: QUESTIONS,
    restart: restart,
    showResult: showResult
  };

  renderQuestion();
  updateHud();
})();

})();
</script>
</body>
</html>
