<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>思维导图 · 果冻翻卡 v2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d1017;
    font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    color: #eef3ff;
  }

  /* ========== 背景 ========== */
  #canvas-container {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
    cursor: grab;
    background:
      radial-gradient(ellipse 60% 50% at 25% 15%, rgba(64,82,130,0.35), transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 85%, rgba(90,60,140,0.28), transparent 70%),
      linear-gradient(180deg, #141a26 0%, #0d1017 100%);
  }
  #canvas-container.dragging { cursor: grabbing; }

  /* 微妙的网格 */
  #canvas-container::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,140,200,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,140,200,0.045) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 45%, #000 30%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 45%, #000 30%, transparent 90%);
  }

  #world {
    position: absolute;
    top: 0; left: 0;
    width: 3000px; height: 2000px;
    will-change: transform;
    transform-origin: 0 0;
    z-index: 1;
  }

  /* ========== 连线层 ========== */
  #lines-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
    z-index: 1;
  }

  .line-base {
    fill: none;
    stroke: #4a5778;
    stroke-width: 2.4;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .line-base.visible { opacity: 0.7; }

  .line-flow {
    fill: none;
    stroke: url(#lineGradient);
    stroke-width: 2.4;
    stroke-linecap: round;
    opacity: 0;
    stroke-dasharray: 8 14;
    animation: lineFlow 2.6s linear infinite;
    transition: opacity 0.4s ease;
    filter: drop-shadow(0 0 6px rgba(140,170,255,0.55));
  }
  .line-flow.visible { opacity: 0.95; }

  @keyframes lineFlow {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -44; }
  }

  .line-flow.pulse {
    animation: lineFlow 2.6s linear infinite,
               linePulse 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes linePulse {
    0%   { stroke-width: 2.4; }
    40%  { stroke-width: 4.2; }
    100% { stroke-width: 2.4; }
  }

  /* ===== 收卡：线条收回 =====
     核心是"长度"本身在缩短，而不是淡出：
     起点锚在子卡端不动，终点沿着曲线一路抽回父卡，
     线尾带一个亮点头部（像线头被拽着走），最后整条线缩进父卡里。
     收得越短越细，走加速曲线——被拽住后猛地抽走。 */
  .line-base.retracting {
    opacity: 1 !important;
    pointer-events: none;
    stroke: #6f7ea8;
  }

  .line-flow.retracting {
    opacity: 1 !important;
    pointer-events: none;
    /* 收线路上辉光逐步收敛 */
    animation: lineRetract 1ms linear forwards;
  }

  @keyframes lineRetract {
    from { filter: drop-shadow(0 0 8px rgba(160,190,255,0.75)); }
    to   { filter: drop-shadow(0 0 3px rgba(160,190,255,0.25)); }
  }

  /* 线头亮点：随收回一起从子卡端滑向父卡，是"收回感"的视觉支点 */
  .line-head {
    position: absolute;
    width: 13px; height: 13px;
    margin: -6.5px 0 0 -6.5px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 27;
    background: radial-gradient(circle, #ffffff 0%, #cfe0ff 40%,
                                rgba(150,180,255,0.5) 62%, rgba(150,180,255,0) 78%);
    box-shadow: 0 0 12px rgba(160,190,255,0.9);
    animation: lineHeadFade 90ms linear forwards;
  }
  @keyframes lineHeadFade {
    from { opacity: 1; }
    to   { opacity: 1; }
  }

  /* 线头抵达父卡时的小爆点 */
  .line-head.burst {
    animation: lineHeadBurst 220ms cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes lineHeadBurst {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(2.4); }
  }

  /* ========== 卡片 ========== */
  .card {
    position: absolute;
    width: 170px;
    height: 72px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    line-height: 1.25;
    text-align: center;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    transform: scale(1);
    will-change: transform, opacity, box-shadow, filter;
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1),
                box-shadow 0.25s ease,
                background 0.2s ease,
                opacity 0.28s ease,
                border-color 0.2s ease;
    -webkit-font-smoothing: antialiased;
  }
  .card.visible { opacity: 1; pointer-events: auto; }

  .card-content {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    width: 100%;
    word-break: break-word;
  }

  /* 状态小圆点 */
  .card::after {
    content: '';
    position: absolute;
    top: 8px; right: 10px;
    width: 6px; height: 6px;
    border-radius: 50%;
    transition: all 0.3s ease;
  }

  /* 待回忆封面 */
  .card.cover {
    background: linear-gradient(180deg, #3d4459 0%, #333a4c 100%);
    color: #b8c7e0;
    font-weight: 500;
    letter-spacing: 1.2px;
    border: 1px solid rgba(210,220,255,0.18);
    box-shadow:
      0 2px 0 rgba(255,255,255,0.04) inset,
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 10px 20px -8px rgba(0,0,0,0.85),
      0 0 0 1px rgba(255,255,255,0.03);
    text-shadow: 0 1px 2px rgba(0,0,0,0.45);
  }
  .card.cover::after {
    background: #8fa2cc;
    box-shadow: 0 0 6px #8fa2cc, 0 0 0 2px rgba(143,162,204,0.15);
    animation: dotPulse 1.6s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 1;    transform: scale(1.35); }
  }

  /* 已翻开 */
  .card.revealed {
    background: linear-gradient(180deg, #57658c 0%, #4a5578 100%);
    color: #ffffff;
    border: 1px solid rgba(160,180,255,0.35);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.18) inset,
      0 -1px 0 rgba(0,0,0,0.3) inset,
      0 12px 26px -10px rgba(0,0,0,0.8),
      0 0 24px rgba(140,170,255,0.22),
      0 0 0 1px rgba(160,180,255,0.15);
  }
  .card.revealed::after {
    background: #7fe0a0;
    box-shadow: 0 0 6px #7fe0a0, 0 0 0 2px rgba(127,224,160,0.18);
  }

  /* ===== 悬停 / 预备 ===== */
  .card.visible:hover {
    transform: scale(1.04) translateY(-2px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.2) inset,
      0 22px 34px -14px rgba(0,0,0,0.9),
      0 0 0 1.6px rgba(155,180,255,0.55),
      0 0 34px rgba(120,155,255,0.5);
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1),
                box-shadow 0.22s ease;
  }

  /* ===== 敲击瞬间 ===== */
  .card.pressing {
    transform: scale(0.93) scaleY(0.95) scaleX(1.05);
    transition: transform 0.08s cubic-bezier(0.55,0.06,0.68,0.19);
    filter: brightness(0.94);
  }

  /* ===== 判定定格 ===== */
  .card.freezing {
    transform: scale(0.93) scaleY(0.95) scaleX(1.05);
    filter: brightness(0.9) saturate(1.15);
    pointer-events: none;
  }

  /* ===== 爆发扩散 ===== */
  .card.bursting {
    animation: burstRelease 340ms cubic-bezier(0.22,1.61,0.36,1) forwards;
    pointer-events: none;
    z-index: 20;
  }
  @keyframes burstRelease {
    0%   { transform: scale(0.93) scaleY(0.95); }
    35%  { transform: scale(1.12) scaleY(1.06) rotate(-1.2deg); }
    65%  { transform: scale(0.97) rotate(0.6deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* ===== 惯性吸收 ===== */
  .card.settling {
    animation: settleBack 280ms cubic-bezier(0.25,0.46,0.45,0.94) forwards;
  }
  @keyframes settleBack {
    0%   { transform: scale(1.02); }
    55%  { transform: scale(0.985); }
    100% { transform: scale(1); }
  }

  /* ===== 生成（从父卡抽出） ===== */
  .card.spawning {
    animation: spawnIn 460ms cubic-bezier(0.34,1.56,0.64,1) backwards;
  }
  @keyframes spawnIn {
    0% {
      opacity: 0;
      transform: translate(var(--from-x,0px), var(--from-y,0px))
                 scale(0.25) rotate(-8deg);
    }
    50% { opacity: 1; }
    100% {
      opacity: 1;
      transform: translate(0,0) scale(1) rotate(0deg);
    }
  }

  /* ===== 父卡推进推挤 ===== */
  .card.pushing {
    animation: pushOut 420ms cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes pushOut {
    0%   { transform: scale(1); }
    22%  { transform: scale(1.07) rotate(-1deg); }
    52%  { transform: scale(0.96) rotate(0.7deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  /* ===== 收卡：父卡接收（预备 → 吞入 → 回弹落定） ===== */
  .card.receiving {
    animation: receiveJiggle 620ms cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  @keyframes receiveJiggle {
    /* 预备：先向远离收束方向微仰，制造"准备接住"的预期 */
    0%   { transform: rotate(0deg) scale(1); filter: brightness(1); }
    10%  { transform: rotate(1.6deg) scale(1.03); filter: brightness(1.05); }
    /* 吞入峰值：后代抵达时被"压"一下 */
    26%  { transform: rotate(1.2deg) scale(1.085); filter: brightness(1.2) saturate(1.1); }
    42%  { transform: rotate(-2.4deg) scale(0.955); filter: brightness(1.1); }
    /* 回弹余振：幅度递减、间隔拉长，像果冻慢慢停住 */
    58%  { transform: rotate(1.3deg) scale(1.032); }
    72%  { transform: rotate(-0.7deg) scale(0.99); }
    85%  { transform: rotate(0.3deg) scale(1.008); }
    100% { transform: rotate(0deg) scale(1); filter: brightness(1); }
  }

  /* ===== 收卡：后代收缩（吸附吸入） ===== */
  .card.collapsing {
    animation: collapseTo var(--collapse-dur, 560ms)
               cubic-bezier(0.42, 0, 0.18, 1) forwards;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes collapseTo {
    /* 起点：被"吸住"前的一瞬挺起，给吸入一个反向势能 */
    0% {
      opacity: 1;
      transform: translate(0, 0) scale(1) rotate(0deg);
      filter: brightness(1) saturate(1);
    }
    12% {
      opacity: 1;
      transform: translate(calc(var(--collapse-x, 0px) * 0.03),
                           calc(var(--collapse-y, 0px) * 0.03 - 8px))
                 scale(1.045) rotate(-2deg);
      filter: brightness(1.18) saturate(1.12);
    }
    /* 加速吸入：路径带向上偏置，形成弧线而非直线 */
    45% {
      opacity: 1;
      transform: translate(calc(var(--collapse-x, 0px) * 0.38),
                           calc(var(--collapse-y, 0px) * 0.38 - 14px))
                 scale(0.78) rotate(6deg);
      filter: brightness(1.24) saturate(1.15);
    }
    /* 贴近父卡：急剧缩小并微微过冲，像被吸入口 */
    78% {
      opacity: 0.85;
      transform: translate(calc(var(--collapse-x, 0px) * 0.88),
                           calc(var(--collapse-y, 0px) * 0.88 - 4px))
                 scale(0.3) rotate(13deg);
      filter: brightness(1.1) saturate(1.1);
    }
    /* 消失：几乎归零，避免"啪"地消失 */
    100% {
      opacity: 0;
      transform: translate(var(--collapse-x, 0px), var(--collapse-y, 0px))
                 scale(0.06) rotate(18deg);
      filter: brightness(1) saturate(1);
    }
  }

  /* ===== 收卡：父卡位置的吸入汇聚光晕 ===== */
  .collapse-sink {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 24;
    transform: translate(-50%, -50%) scale(0.5);
    background: radial-gradient(circle, rgba(255,150,175,0.42) 0%,
                                        rgba(200,140,255,0.22) 45%, transparent 72%);
    opacity: 0;
    animation: collapseSink 620ms cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes collapseSink {
    0%   { opacity: 0;    transform: translate(-50%,-50%) scale(0.5); }
    38%  { opacity: 0.95; transform: translate(-50%,-50%) scale(1.25); }
    100% { opacity: 0;    transform: translate(-50%,-50%) scale(0.42); }
  }

  /* ===== 卡片状态切换：翻开瞬间的封面卡内光扫 ===== */
  .card.flipping {
    animation: flipShine 260ms ease-out;
  }
  @keyframes flipShine {
    0%   { box-shadow: 0 0 0 0 rgba(255,255,255,0.55), 0 12px 26px -10px rgba(0,0,0,0.8); }
    40%  { box-shadow: 0 0 40px 8px rgba(180,210,255,0.45), 0 12px 26px -10px rgba(0,0,0,0.8); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0), 0 12px 26px -10px rgba(0,0,0,0.8); }
  }

  /* ===== 粒子 ===== */
  .particle {
    position: absolute;
    pointer-events: none;
    z-index: 30;
    transform: translate(-50%, -50%);
    will-change: transform, opacity;
  }
  .particle.dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #ffd966 60%, #ff9e2c);
    box-shadow: 0 0 12px #ffb347, 0 0 4px #fff inset;
    animation: particleOut 520ms cubic-bezier(0.2,0.9,0.4,1) forwards;
  }
  .particle.chip {
    width: 8px; height: 8px; border-radius: 2px;
    background: linear-gradient(135deg, #c9d8ff, #7f95d8);
    box-shadow: 0 0 8px rgba(160,190,255,0.85);
    animation: particleOut 480ms cubic-bezier(0.2,0.9,0.4,1) forwards;
  }
  .particle.rose {
    width: 7px; height: 7px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #ffb3c8 60%, #ff5f8d);
    box-shadow: 0 0 12px #ff7ba0, 0 0 4px #fff inset;
    animation: particleOut 500ms cubic-bezier(0.2,0.9,0.4,1) forwards;
  }
  @keyframes particleOut {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
    }
    60% { opacity: 1; }
    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--dx,0px)), calc(-50% + var(--dy,0px)))
                 scale(1.4) rotate(200deg);
    }
  }

  /* ===== 经验球（子卡 → 父卡） ===== */
  .orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 32;
    transform: translate(-50%, -50%);
    will-change: transform, opacity;
    background: radial-gradient(circle at 34% 30%, #ffffff 0%, #d8e6ff 28%, #7fa4ff 62%, #4a6bd8 100%);
    box-shadow:
      0 0 10px rgba(150,185,255,0.95),
      0 0 22px rgba(110,150,255,0.6),
      0 0 3px rgba(255,255,255,0.9) inset;
    animation: orbFly var(--orb-dur, 620ms)
               cubic-bezier(0.37, 0, 0.28, 1) forwards;
  }
  .orb::after {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(150,185,255,0.35), transparent 70%);
    animation: orbHalo 620ms ease-out forwards;
  }
  /* 尾迹：拖在球体后方，沿运动方向拉伸 */
  .orb.trail {
    opacity: 0.55;
    filter: blur(2.5px);
    box-shadow: 0 0 14px rgba(140,175,255,0.7);
  }

  @keyframes orbFly {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.3);
    }
    16% {
      opacity: 1;
      transform: translate(calc(-50% + var(--o1x, 0px)), calc(-50% + var(--o1y, 0px)))
                 scale(1.18);
    }
    62% {
      opacity: 1;
      transform: translate(calc(-50% + var(--o2x, 0px)), calc(-50% + var(--o2y, 0px)))
                 scale(0.95);
    }
    100% {
      opacity: 0;
      transform: translate(calc(-50% + var(--oex, 0px)), calc(-50% + var(--oey, 0px)))
                 scale(0.34);
    }
  }

  @keyframes orbHalo {
    0%   { opacity: 0.9; transform: scale(0.6); }
    100% { opacity: 0;   transform: scale(1.9); }
  }

  /* 父卡吸收经验球的瞬时反馈 */
  .card.absorbing {
    animation: absorbPulse 420ms cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes absorbPulse {
    0%   { filter: brightness(1) saturate(1); }
    22%  { filter: brightness(1.32) saturate(1.25); }
    58%  { filter: brightness(1.06) saturate(1.05); }
    100% { filter: brightness(1) saturate(1); }
  }

  /* 抵达父卡的吸收扩散环 */
  .orb-impact {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 31;
    transform: translate(-50%, -50%) scale(0.4);
    border: 2px solid rgba(190,215,255,0.9);
    box-shadow: 0 0 18px rgba(140,180,255,0.75);
    opacity: 0;
    animation: orbImpact 460ms cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes orbImpact {
    0%   { opacity: 0.95; transform: translate(-50%,-50%) scale(0.4); }
    100% { opacity: 0;    transform: translate(-50%,-50%) scale(1.75); }
  }

  /* ===== 涟漪环 ===== */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(180,205,255,0.75);
    pointer-events: none;
    z-index: 25;
    transform: translate(-50%, -50%) scale(0.3);
    opacity: 0;
    animation: ringOut 520ms cubic-bezier(0.16,1,0.3,1) forwards;
    box-shadow: 0 0 20px rgba(140,170,255,0.5);
  }
  .ring.rose { border-color: rgba(255,150,180,0.8); box-shadow: 0 0 22px rgba(255,120,160,0.55); }
  @keyframes ringOut {
    0%   { opacity: 0.9; transform: translate(-50%,-50%) scale(0.3); }
    100% { opacity: 0;   transform: translate(-50%,-50%) scale(2.6); }
  }

  /* ===== 飘字 ===== */
  .float-text {
    position: absolute;
    transform: translate(-50%, -100%);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    border: 1px solid;
    white-space: nowrap;
    pointer-events: none;
    z-index: 40;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    animation: floatUp 780ms cubic-bezier(0.16,1,0.3,1) forwards;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
  }
  @keyframes floatUp {
    0% {
      opacity: 0;
      transform: translate(-50%, -100%) scale(0.75);
    }
    18% {
      opacity: 1;
      transform: translate(-50%, -118%) scale(1.12);
    }
    52% {
      opacity: 1;
      transform: translate(-50%, -140%) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -170%) scale(1);
    }
  }

  /* ===== 全屏光晕（大事件） ===== */
  .flash {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 3000;
    background: radial-gradient(circle at 50% 55%, rgba(180,210,255,0.4), transparent 65%);
    opacity: 0;
    animation: flashOut 700ms ease-out forwards;
  }
  @keyframes flashOut {
    0%   { opacity: 0; }
    18%  { opacity: 0.9; }
    100% { opacity: 0; }
  }

  /* ===== 评分面板 ===== */
  .rating-panel {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    background: rgba(18,22,32,0.82);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 10px 14px;
    border-radius: 80px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.55),
                0 0 0 1px rgba(127,141,187,0.3),
                0 0 30px rgba(120,150,255,0.12);
    z-index: 2000;
    border: 1px solid rgba(170,184,255,0.18);
    pointer-events: auto;
  }
  .rating-btn {
    background: transparent;
    border: none;
    color: #bbc9f0;
    font-weight: 600;
    font-size: 15px;
    padding: 8px 18px;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.22s cubic-bezier(0.34,1.56,0.64,1);
    letter-spacing: 0.5px;
    font-family: inherit;
  }
  .rating-btn:hover {
    background: rgba(255,255,255,0.09);
    color: #ffffff;
    transform: scale(1.06) translateY(-1px);
    box-shadow: 0 0 22px rgba(127,141,187,0.45);
  }
  .rating-btn:active {
    transform: scale(0.92);
    transition-duration: 0.08s;
  }
  .rating-btn.pulse {
    animation: btnPulse 560ms cubic-bezier(0.22,1.61,0.36,1);
  }
  @keyframes btnPulse {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.2); background: rgba(255,255,255,0.2); box-shadow: 0 0 30px rgba(180,210,255,0.6); }
    100% { transform: scale(1); }
  }

  /* ===== 评分分档（忘记/困难/记得/轻松 四档强度递增） ===== */
  /* 四档常态色：越"忘记"越沉，越"轻松"越亮 */
  .rating-btn[data-rating="forgot"] { color: #ff9e9e; }
  .rating-btn[data-rating="hard"]   { color: #ffcb7d; }
  .rating-btn[data-rating="good"]   { color: #9be8b6; }
  .rating-btn[data-rating="easy"]   { color: #b9e0ff; }
  /* 四档 hover：颜色与辉光都换成该档主色，让"选的是哪一档"一眼可辨 */
  .rating-btn[data-rating="forgot"]:hover { color: #ff7a7a; box-shadow: 0 0 22px rgba(255,122,122,0.5); }
  .rating-btn[data-rating="hard"]:hover   { color: #ffb454; box-shadow: 0 0 22px rgba(255,180,84,0.5); }
  .rating-btn[data-rating="good"]:hover   { color: #7fe0a0; box-shadow: 0 0 22px rgba(127,224,160,0.5); }
  .rating-btn[data-rating="easy"]:hover   { color: #a8d8ff; box-shadow: 0 0 26px rgba(168,216,255,0.6); }

  /* 四档脉冲：缩放幅度逐级递增（forgot 1.1 → hard 1.16 → good 1.22 → easy 1.3）。
     幅度随档位走 CSS 变量，颜色/辉光也随档位，一个 keyframes 覆盖全部四档。 */
  .rating-btn.active-forgot,
  .rating-btn.active-hard,
  .rating-btn.active-good,
  .rating-btn.active-easy {
    animation: btnBurst 560ms cubic-bezier(0.22,1.61,0.36,1);
  }
  .rating-btn.active-forgot { --pulse-scale: 1.1;  --pulse-glow: rgba(255,122,122,0.55); background: rgba(255,122,122,0.16); }
  .rating-btn.active-hard   { --pulse-scale: 1.16; --pulse-glow: rgba(255,180,84,0.55);  background: rgba(255,180,84,0.16); }
  .rating-btn.active-good   { --pulse-scale: 1.22; --pulse-glow: rgba(127,224,160,0.55); background: rgba(127,224,160,0.16); }
  .rating-btn.active-easy   { --pulse-scale: 1.3;  --pulse-glow: rgba(168,216,255,0.6);  background: rgba(168,216,255,0.18); }
  @keyframes btnBurst {
    0%   { transform: scale(1); }
    30%  { transform: scale(var(--pulse-scale, 1.2)); box-shadow: 0 0 30px var(--pulse-glow, rgba(180,210,255,0.6)); }
    100% { transform: scale(1); }
  }

  /* 全屏光晕分档修饰类：覆盖 .flash 的径向渐变底色 */
  .flash.warm {
    background: radial-gradient(circle at 50% 55%, rgba(255,190,110,0.46), transparent 66%);
  }
  .flash.rose {
    background: radial-gradient(circle at 50% 55%, rgba(255,90,90,0.30), transparent 64%);
  }
  .flash.green {
    background: radial-gradient(circle at 50% 55%, rgba(127,224,160,0.34), transparent 64%);
  }

  /* 涟漪分档修饰类（.ring.rose 已存在，此处只补 .ring.gold） */
  .ring.gold {
    border-color: rgba(255,217,138,0.85);
    box-shadow: 0 0 26px rgba(255,200,120,0.65), 0 0 60px rgba(255,217,138,0.35);
  }
  /* 评分环：涟漪生成在按钮自身的屏幕位置（fixed），故尺寸即视觉直径 */
  .ring.rating-ring {
    position: fixed;
    border-width: 3px;
    z-index: 2600;
  }
  .ring.rating-ring.thin { border-width: 2px; opacity: 0.85; }

  /* 轻松档环绕光点：从按钮中心飞出绕一圈 */
  .orbit-dot {
    position: fixed;
    width: 7px; height: 7px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2600;
    background: radial-gradient(circle at 35% 35%, #fff, #ffe9a8 60%, #ffc44d);
    box-shadow: 0 0 14px rgba(255,214,120,0.95), 0 0 4px #fff inset;
    transform: translate(-50%, -50%);
    animation: orbitOut 620ms cubic-bezier(0.22,1.2,0.36,1) forwards;
  }
  @keyframes orbitOut {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.4); }
    14%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--ox,0px)), calc(-50% + var(--oy,0px))) scale(1.15); }
  }

  /* 评分飘字：fixed 定位（既有 floatText 只接受 cardEl，不适合按钮） */
  .float-text.rating-float {
    position: fixed;
    z-index: 2700;
    font-size: 14px;
    padding: 6px 14px;
  }

  /* ===== 底部提示 ===== */
  .hint {
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    color: #a6b3d9;
    font-size: 12px;
    background: rgba(31,37,56,0.8);
    backdrop-filter: blur(8px);
    padding: 6px 18px;
    border-radius: 40px;
    border: 1px solid rgba(79,91,124,0.5);
    pointer-events: none;
    white-space: nowrap;
    z-index: 1500;
    opacity: 0.78;
    letter-spacing: 0.3px;
    transition: opacity 0.4s ease;
  }
  .hint b { color: #cdd8ff; font-weight: 600; }

  /* ===== 撤销气泡 ===== */
  .undo-toast {
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: rgba(20,26,40,0.95);
    color: #d5e0ff;
    padding: 8px 14px 8px 18px;
    border-radius: 40px;
    border: 1px solid rgba(140,170,255,0.4);
    font-size: 13px;
    font-weight: 500;
    z-index: 2200;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.6),
                0 0 26px rgba(120,150,255,0.2);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
  }
  .undo-toast.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .undo-toast button {
    background: linear-gradient(180deg, #6f86c9, #556ab0);
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.4px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 0 12px rgba(140,170,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    font-family: inherit;
  }
  .undo-toast button:hover { transform: scale(1.05); box-shadow: 0 4px 0 rgba(0,0,0,0.25), 0 0 18px rgba(140,170,255,0.6); }
  .undo-toast button:active { transform: scale(0.94); }

  /* =========================================================
     ===== 做题视图（由 quiz.html 并入，全部限定在 #quizView 内）=====
     命名约定：与导图侧冲突的动画一律加 q 前缀；
     与导图侧冲突的 class 一律改 .q-* ；id 全页唯一故保持原名。
     ========================================================= */
  #quizView {
    position: fixed; inset: 0;
    display: none;
    overflow: hidden;
    z-index: 5000;
    background:
      radial-gradient(ellipse 60% 50% at 25% 15%, rgba(64,82,130,0.35), transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 85%, rgba(90,60,140,0.28), transparent 70%),
      linear-gradient(180deg, #141a26 0%, #0d1017 100%);
  }
  #quizView.on { display: block; }

  /* 进入做题视图时隐藏导图层，但保留其在 DOM 中的状态（不销毁导图） */
  body.quiz-mode #canvas-container { visibility: hidden; }

  /* 切视图按钮：右上角，避开 bottom:30px 的 .rating-panel */
  #viewToggleBtn {
    position: fixed; top: 16px; right: 16px;
    z-index: 6000;
    border: none;
    font-family: inherit;
    font-weight: 700;
    font-size: 13.5px;
    letter-spacing: 0.4px;
    padding: 9px 20px;
    border-radius: 40px;
    cursor: pointer;
    color: #eef3ff;
    background: linear-gradient(180deg, #5b6f9e 0%, #4a5578 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.16) inset,
      0 12px 24px -12px rgba(0,0,0,0.85),
      0 0 0 1px rgba(160,180,255,0.22);
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1),
                box-shadow 0.22s ease, filter 0.2s ease;
  }
  #viewToggleBtn:hover {
    transform: translateY(-2px) scale(1.035);
    filter: brightness(1.1);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.2) inset,
      0 18px 30px -14px rgba(0,0,0,0.9),
      0 0 30px rgba(120,155,255,0.5);
  }
  #viewToggleBtn:active { transform: scale(0.95); transition-duration: 0.08s; }

  #quizView #stage {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #quizView #stage::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,140,200,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,140,200,0.045) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 45%, #000 30%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 45%, #000 30%, transparent 90%);
  }

  /* ========== 顶部进度 ========== */
  #quizView #hud {
    position: absolute;
    top: 66px; left: 0; right: 0;
    padding: 0 26px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 100;
  }
  #quizView #hudTitle {
    font-size: 13px; font-weight: 600; letter-spacing: 0.6px;
    color: #a6b3d9; white-space: nowrap;
  }
  #quizView #barWrap {
    flex: 1; height: 6px; border-radius: 4px;
    background: rgba(90,105,150,0.28);
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(140,160,220,0.12) inset;
  }
  #quizView #bar {
    height: 100%; width: 0%; border-radius: 4px;
    background: linear-gradient(90deg, #6d84d8, #9db4ff);
    box-shadow: 0 0 12px rgba(150,180,255,0.6);
    transition: width 0.5s cubic-bezier(0.34,1.2,0.5,1);
  }
  #quizView #hudStat {
    font-size: 13px; font-weight: 700; color: #cfd9f5;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #quizView #hudStat b { color: #7fe0a0; }
  #quizView #hudStat i { color: #ff8a8a; font-style: normal; }

  /* ========== 题目卡片 ========== */
  #quizView #cardStage {
    position: relative;
    width: min(680px, 92vw);
    z-index: 10;
    perspective: 1400px;
  }
  #quizView .qcard {
    position: relative;
    width: 100%;
    border-radius: 26px;
    padding: 34px 34px 30px;
    background: linear-gradient(180deg, #2c3346 0%, #232936 100%);
    border: 1px solid rgba(150,170,230,0.2);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.07) inset,
      0 30px 60px -24px rgba(0,0,0,0.9),
      0 0 40px rgba(120,150,255,0.1);
    will-change: transform, opacity;
    transform-origin: 50% 50%;
  }
  #quizView .qcard.enter { animation: qCardEnter 520ms cubic-bezier(0.22,1.4,0.42,1) both; }
  @keyframes qCardEnter {
    0%   { opacity: 0; transform: translateY(26px) scale(0.92); }
    60%  { opacity: 1; transform: translateY(-4px) scale(1.015); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  #quizView .qcard.correct { animation: qCardCorrect 560ms cubic-bezier(0.34,1.56,0.64,1) both; }
  @keyframes qCardCorrect {
    0%   { transform: translateY(0) scale(1); }
    26%  { transform: translateY(-8px) scale(1.028); }
    54%  { transform: translateY(2px) scale(0.994); }
    100% { transform: translateY(0) scale(1); }
  }
  #quizView .qcard.wrong { animation: qCardWrong 520ms cubic-bezier(0.36,0.07,0.19,0.97) both; }
  @keyframes qCardWrong {
    0%   { transform: translateX(0) rotate(0deg); }
    14%  { transform: translateX(-11px) rotate(-1.1deg); }
    32%  { transform: translateX(9px) rotate(0.9deg); }
    50%  { transform: translateX(-6px) rotate(-0.6deg); }
    70%  { transform: translateX(4px) rotate(0.4deg); }
    100% { transform: translateX(0) rotate(0deg); }
  }
  #quizView .qcard.leave {
    animation: qCardLeave 300ms cubic-bezier(0.55,0.06,0.68,0.19) both;
    pointer-events: none;
  }
  @keyframes qCardLeave {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-34px) scale(0.94); }
  }
  /* 题卡边框随判定染色：追加 !important 防止导图侧 .flash 之外的同名规则干扰 */
  #quizView .qcard.correct { border-color: rgba(127,224,160,0.6); }
  #quizView .qcard.wrong   { border-color: rgba(255,138,138,0.6); }

  #quizView .qmeta {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  #quizView .qtag {
    font-size: 11.5px; font-weight: 700; letter-spacing: 1.1px;
    text-transform: uppercase; color: #8fa2cc;
    background: rgba(120,145,215,0.14);
    border: 1px solid rgba(143,162,204,0.22);
    padding: 5px 12px; border-radius: 30px;
  }
  #quizView .qidx {
    font-size: 12.5px; font-weight: 600; color: #7c88ab;
    font-variant-numeric: tabular-nums;
  }
  #quizView .qtext {
    font-size: clamp(19px, 3.4vw, 25px);
    font-weight: 700; line-height: 1.45; letter-spacing: 0.2px;
    color: #ffffff; margin-bottom: 26px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }

  /* ========== 选项 ========== */
  #quizView #options { display: flex; flex-direction: column; gap: 11px; }
  #quizView .opt {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 15px 18px;
    border-radius: 16px;
    background: linear-gradient(180deg, #333b52 0%, #2b3145 100%);
    border: 1px solid rgba(150,170,230,0.16);
    color: #dbe4fb;
    font-size: 15.5px; font-weight: 600; line-height: 1.35;
    text-align: left; font-family: inherit; cursor: pointer;
    opacity: 0; transform: translateY(14px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 10px 20px -12px rgba(0,0,0,0.8);
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1),
                background 0.2s ease, border-color 0.2s ease,
                box-shadow 0.24s ease, opacity 0.3s ease;
    will-change: transform;
  }
  #quizView .opt.shown { opacity: 1; transform: translateY(0); }
  #quizView .opt .key {
    flex: 0 0 auto; width: 26px; height: 26px;
    border-radius: 9px; display: grid; place-items: center;
    font-size: 12.5px; font-weight: 800; color: #b8c7e0;
    background: rgba(140,165,230,0.16);
    border: 1px solid rgba(160,185,255,0.24);
    transition: all 0.2s ease;
  }
  #quizView .opt .label { flex: 1; }
  #quizView .opt:not(:disabled):hover {
    transform: translateY(-2px) scale(1.012);
    background: linear-gradient(180deg, #3d4765 0%, #333b52 100%);
    border-color: rgba(160,185,255,0.45);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.1) inset,
      0 18px 30px -14px rgba(0,0,0,0.9),
      0 0 26px rgba(120,155,255,0.34);
  }
  #quizView .opt:not(:disabled):active { transform: scale(0.975); transition-duration: 0.08s; }
  #quizView .opt:disabled { cursor: default; }
  #quizView .opt.pressing { transform: scale(0.972); transition-duration: 0.08s; }

  #quizView .opt.correct {
    background: linear-gradient(180deg, #2f6b4c 0%, #275a41 100%);
    border-color: rgba(127,224,160,0.7);
    color: #ffffff;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.14) inset,
      0 0 28px rgba(127,224,160,0.45),
      0 12px 26px -12px rgba(0,0,0,0.8);
    animation: qOptPop 520ms cubic-bezier(0.34,1.56,0.64,1);
  }
  #quizView .opt.correct .key {
    background: rgba(127,224,160,0.32);
    border-color: rgba(127,224,160,0.8);
    color: #eafff2;
  }
  @keyframes qOptPop {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.045); }
    60%  { transform: scale(0.988); }
    100% { transform: scale(1); }
  }

  #quizView .opt.wrong {
    background: linear-gradient(180deg, #6e3540 0%, #5a2b35 100%);
    border-color: rgba(255,138,138,0.7);
    color: #ffffff;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.1) inset,
      0 0 26px rgba(255,120,120,0.4),
      0 12px 26px -12px rgba(0,0,0,0.8);
    animation: qOptShake 420ms cubic-bezier(0.36,0.07,0.19,0.97);
  }
  #quizView .opt.wrong .key {
    background: rgba(255,138,138,0.3);
    border-color: rgba(255,138,138,0.8);
    color: #fff0f0;
  }
  @keyframes qOptShake {
    0%   { transform: translateX(0); }
    18%  { transform: translateX(-7px); }
    42%  { transform: translateX(6px); }
    66%  { transform: translateX(-3px); }
    100% { transform: translateX(0); }
  }

  #quizView .opt.reveal {
    border-color: rgba(127,224,160,0.5);
    background: linear-gradient(180deg, #2c4a3c 0%, #263c33 100%);
    box-shadow:
      0 0 20px rgba(127,224,160,0.25),
      0 10px 22px -14px rgba(0,0,0,0.8);
    animation: qRevealGlow 900ms ease-out;
  }
  @keyframes qRevealGlow {
    0%   { box-shadow: 0 0 0 rgba(127,224,160,0); }
    35%  { box-shadow: 0 0 30px rgba(127,224,160,0.7); }
    100% { box-shadow: 0 0 20px rgba(127,224,160,0.25); }
  }
  #quizView .opt.dimmed { opacity: 0.34; filter: saturate(0.5); }

  /* ========== 解析条 ========== */
  #quizView #explain {
    margin-top: 18px; padding: 15px 17px;
    border-radius: 14px; font-size: 14px; line-height: 1.6;
    color: #c3cee8;
    background: rgba(120,145,215,0.1);
    border: 1px solid rgba(143,162,204,0.2);
    border-left: 3px solid #8fa2cc;
    max-height: 0; opacity: 0; overflow: hidden;
    padding-top: 0; padding-bottom: 0;
    transition: max-height 0.36s cubic-bezier(0.34,1.2,0.5,1),
                opacity 0.28s ease, padding 0.36s ease, margin 0.36s ease;
  }
  #quizView #explain.show {
    max-height: 260px; opacity: 1;
    padding-top: 15px; padding-bottom: 15px;
  }
  #quizView #explain.ok  { border-left-color: #7fe0a0; }
  #quizView #explain.bad { border-left-color: #ff8a8a; }
  #quizView #explain b { color: #ffffff; }

  /* ========== 底部按钮 ========== */
  #quizView #actions {
    display: flex; justify-content: center; gap: 10px;
    margin-top: 22px; min-height: 44px;
  }
  #quizView .q-btn {
    border: none; font-family: inherit;
    font-weight: 700; font-size: 15px; letter-spacing: 0.4px;
    padding: 11px 30px; border-radius: 40px; cursor: pointer;
    background: linear-gradient(180deg, #5b6f9e 0%, #4a5578 100%);
    color: #ffffff;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.16) inset,
      0 12px 24px -12px rgba(0,0,0,0.85),
      0 0 0 1px rgba(160,180,255,0.22);
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1),
                box-shadow 0.22s ease, filter 0.2s ease;
  }
  #quizView .q-btn:hover {
    transform: translateY(-2px) scale(1.035);
    filter: brightness(1.1);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.2) inset,
      0 18px 30px -14px rgba(0,0,0,0.9),
      0 0 30px rgba(120,155,255,0.5);
  }
  #quizView .q-btn:active { transform: scale(0.95); transition-duration: 0.08s; }
  #quizView .q-btn.ghost {
    background: transparent; color: #a6b3d9;
    box-shadow: 0 0 0 1px rgba(143,162,204,0.3);
  }
  #quizView .q-btn.ghost:hover { background: rgba(255,255,255,0.06); color: #ffffff; }
  #quizView .q-btn.hidden { display: none; }

  /* ========== 结算页 ========== */
  #quizView #result {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    z-index: 500;
    background: rgba(13,16,23,0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #quizView #result.show { display: flex; animation: qFadeIn 0.4s ease both; }
  @keyframes qFadeIn { from { opacity: 0; } to { opacity: 1; } }

  #quizView #scoreRing { width: 190px; height: 190px; position: relative; margin-bottom: 6px; }
  #quizView #scoreRing svg { transform: rotate(-90deg); }
  #quizView #ringBg { stroke: rgba(90,105,150,0.28); }
  #quizView #ringFg {
    stroke: url(#ringGrad);

  #quizView #scoreText {

  #quizView #scoreNum {

  #quizView #reviewHead {

  #quizView #reviewList {

  #quizView #reviewList::-webkit-scrollbar { width: 6px; }
  #quizView #reviewList::-webkit-scrollbar-thumb {

  #quizView .revItem {

  #quizView .revItem.ok  .mark { background: rgba(127,224,160,0.24); color: #7fe0a0; }
  #quizView .revItem.bad .mark { background: rgba(255,138,138,0.24); color: #ff8a8a; }

  #quizView .revItem .a { color: #8fa2cc; font-size: 12.5px; margin-top: 3px; }
  #quizView .revItem .a em { color: #7fe0a0; font-style: normal; font-weight: 600; }

  /* ========== 反馈数字 / 连击（改 .q- 前缀 + qFloatUp 避让） ========== */
  #quizView .q-float-text {
    position: fixed; pointer-events: none;
    font-weight: 800; font-size: 20px; z-index: 5500;

  }
  @keyframes qFloatUp {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
    18%  { opacity: 1; transform: translate(-50%, -14px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -74px) scale(1); }
  }
  #quizView #combo {
    position: absolute; top: 108px; left: 50%;
    transform: translateX(-50%) scale(0.7);

  #quizView #combo.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #quizView #combo.break {

  /* 全屏判定闪光（qFlashOut 避让 ds 侧既有 flashOut） */
  #quizView .q-flash {
    position: fixed; inset: 0; pointer-events: none; z-index: 5500;

  @keyframes qFlashOut {

  /* 粒子（.q-particle 避让 ds 侧 .particle） */
  #quizView .q-particle {

  /* 震动 */
  #quizView #stage.shake-sm { animation: qShakeSm 240ms cubic-bezier(0.36,0.07,0.19,0.97); }
  #quizView #stage.shake-md { animation: qShakeMd 300ms cubic-bezier(0.36,0.07,0.19,0.97); }
  @keyframes qShakeSm {

  @keyframes qShakeMd {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-7px, 3px); }
    40% { transform: translate(6px, -3px); }

  /* ========== 起始页 ========== */
  #quizView #start {

  /* 无障碍：尊重系统减弱动效设置（做题视图专属） */
  @media (prefers-reduced-motion: reduce) {

  /* ===== 无障碍 ===== */

    }

  }
</style>
</head>
<body>

<div id="canvas-container">

  </div>

<!-- ===== 做题视图（由 quiz.html 并入）===== -->
<button id="viewToggleBtn" type="button">做题</button>

<div id="quizView">
  <div id="stage">
    <div id="hud">

        <div class="qmeta">
          <span class="qtag" id="qtag">工作记忆</span>
          <span class="qidx" id="qidx">1 / 10</span>
        </div>

      <button class="q-btn" id="startBtn">开始答题</button>

            </linearGradient>
          </defs>
          <circle id="ringBg" cx="95" cy="95" r="82" fill="none" stroke-width="11"/>
          <circle id="ringFg" cx="95" cy="95" r="82" fill="none" stroke-width="11"
                  stroke-dasharray="515" stroke-dashoffset="515"/>

          <span id="scoreNum">0</span>

      </div>

      <div id="resultSub"></div>
