<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>翻卡 × 评分 · 动效与视觉决策沙盒 v3</title>
<style>
/* =====================================================================
   Memory Anki · 动效与视觉决策沙盒 (Flip & Rating Motion Lab)
   基准(线上现状忠实复刻) + 纸墨金章 + 暖灯燃系 + 玻璃极光 + 水墨写意
   单文件 · 无外部依赖 · 键盘 Space/1-4/U/C/R · 鼠标悬停即接管
   ===================================================================== */
:root{
  --sans:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --serif:"STZhongsong","Noto Serif SC","SimSun",serif;
  --kai:"STKaiti","KaiTi","楷体","DFKai-SB",var(--serif);
  --mono:ui-monospace,Consolas,"Cascadia Mono",monospace;
  --bg:#0b0a09; --fg:#e9e2d8; --dim:#8d8578;
  --gold-h:40; --gold-s:96%; --gold-l:62%;
  --gold:hsl(var(--gold-h) var(--gold-s) var(--gold-l));
  --amber:hsl(30 90% 56%);
  --line:hsl(40 30% 100% / .08);
  --flip-ms:560ms;            /* 全局翻卡时长（决策看板可调） */
  --overshoot:14;             /* 弹性过冲角度 */
  --intensity:1;              /* 全局强度 */
  --r-again:hsl(8 76% 62%); --r-hard:hsl(38 92% 56%); --r-good:hsl(104 44% 54%); --r-easy:hsl(190 56% 54%);
  --ease-spring:cubic-bezier(.3,1.5,.5,1);
  --ease-expo:cubic-bezier(.16,1,.3,1);
  --ease-card:cubic-bezier(.22,1.2,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:#3a332b #141210}
body{
  font-family:var(--sans);background:
    radial-gradient(120% 80% at 50% -10%,hsl(30 40% 12% / .9),transparent 60%),
    var(--bg);
  color:var(--fg);min-height:100vh;overflow-x:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font-family:inherit}
::selection{background:hsl(40 90% 55% / .35)}

/* ---------- 顶栏 ---------- */
header.top{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 22px;
  background:linear-gradient(180deg,hsl(28 20% 6% / .92),hsl(28 20% 6% / .78));
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.logo{display:flex;align-items:baseline;gap:10px;min-width:0}
.logo h1{font-size:17px;font-weight:800;letter-spacing:.06em;
  background:linear-gradient(110deg,hsl(36 90% 74%),hsl(46 100% 86%),hsl(32 90% 62%));
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.logo small{color:var(--dim);font-size:11px;letter-spacing:.14em;white-space:nowrap}
.top .spacer{flex:1}
.tbtn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:600;
  border:1px solid var(--line);background:hsl(40 20% 100% / .045);color:var(--fg);
  transition:transform .12s var(--ease-spring),box-shadow .2s,background .2s,border-color .2s;
  position:relative;overflow:hidden;
}
.tbtn::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 100% at 50% 120%,hsl(44 100% 70% / .18),transparent 70%);opacity:0;transition:opacity .2s}
.tbtn:hover{transform:translateY(-1.5px);border-color:hsl(44 80% 70% / .35);box-shadow:0 6px 18px -8px hsl(40 90% 50% / .4)}
.tbtn:hover::after{opacity:1}
.tbtn:active{transform:translateY(.5px) scale(.97);transition-duration:.06s}
.tbtn[aria-pressed="true"]{background:hsl(40 90% 55% / .16);border-color:hsl(44 90% 62% / .55);color:hsl(44 100% 82%)}
.tbtn .ic{font-size:14px;line-height:1}
kbd{
  font:600 10.5px/1 var(--mono);padding:3px 6px;border-radius:5px;
  background:hsl(40 20% 100% / .09);border:1px solid var(--line);border-bottom-width:2px;color:hsl(44 60% 80%);
}
.hint{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--dim);flex-wrap:wrap}

/* ---------- 主区布局 ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:0;align-items:start}
main#stages{
  padding:20px 22px 120px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:20px;
  align-items:stretch;
}
@media (max-width:1180px){.layout{grid-template-columns:1fr}aside#rail{display:none}aside#rail.open{display:block;position:fixed;inset:56px 0 0 0;z-index:45;background:#12100d;padding:18px;overflow:auto}#railToggle{display:inline-flex !important}}
@media (min-width:1181px){#railToggle{display:none}}

/* ---------- 舞台通用 ---------- */
.stage{
  position:relative;border-radius:22px;overflow:hidden;
  min-height:640px;display:flex;flex-direction:column;
  border:1px solid var(--line);
  transition:box-shadow .35s,transform .35s var(--ease-expo),border-color .35s;
  isolation:isolate;
}
.stage:hover{transform:translateY(-2px)}
.stage.armed{border-color:hsl(44 90% 62% / .5)}
.stage.armed::before{
  content:"⌨ 已接管";position:absolute;top:15px;left:50%;transform:translateX(-50%);z-index:6;
  font-size:10px;font-weight:700;letter-spacing:.12em;color:hsl(44 100% 78%);
  background:hsl(40 90% 50% / .12);padding:3px 8px;border-radius:6px;
  animation:armedPulse 1.6s ease-in-out infinite;pointer-events:none;
}
@keyframes armedPulse{0%,100%{opacity:.65}50%{opacity:1}}
.stg-head{display:flex;align-items:center;gap:8px;padding:13px 16px 8px;position:relative;z-index:5}
.stg-name{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800;letter-spacing:.03em}
.stg-name .dot{width:9px;height:9px;border-radius:50%;background:var(--tone,--gold);box-shadow:0 0 10px currentColor}
.stg-name em{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.14em;padding:2px 7px;border-radius:5px;background:hsl(40 20% 100% / .08);color:var(--dim)}
.stg-tools{margin-left:auto;display:flex;gap:6px}
.tool{
  font-size:11px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);
  color:var(--dim);background:hsl(40 20% 100% / .04);
  transition:all .15s var(--ease-spring);
}
.tool:hover{color:var(--fg);border-color:hsl(44 80% 70% / .4);transform:translateY(-1px);box-shadow:0 4px 12px -6px #000}
.tool:active{transform:translateY(1px) scale(.96);transition-duration:.06s}
.tool.pinned{color:hsl(44 100% 75%);border-color:hsl(44 90% 62% / .6);background:hsl(40 90% 55% / .15)}

/* HUD：进度轨 + XP + 连击 */
.hud{display:flex;align-items:center;gap:12px;padding:6px 16px 10px;position:relative;z-index:5}
.rail{flex:1;display:flex;gap:4px;align-items:center}
.rail .seg{
  height:7px;flex:1;border-radius:4px;background:hsl(40 20% 100% / .07);
  position:relative;overflow:hidden;transition:transform .15s var(--ease-spring),box-shadow .2s;
}
.rail .seg i{position:absolute;inset:0;transform:scaleX(0);transform-origin:left;border-radius:inherit;
  background:linear-gradient(90deg,var(--amber),var(--gold));
  transition:transform .45s var(--ease-expo)}
.rail .seg.on i{transform:scaleX(1)}
.rail .seg.hit{animation:segHit .5s var(--ease-spring)}
@keyframes segHit{30%{transform:scaleY(1.9);box-shadow:0 0 14px hsl(44 100% 65% / .8)}}
.xpchip{
  font:700 12px/1 var(--mono);min-width:86px;text-align:right;color:hsl(44 85% 72%);
  padding:5px 9px;border-radius:8px;background:hsl(40 20% 100% / .05);border:1px solid var(--line);
}
.xpchip b{display:inline-block;transition:none}
.xpchip.roll b{animation:xpRoll .38s var(--ease-spring)}
@keyframes xpRoll{0%{transform:translateY(70%) scale(1.15);opacity:0;color:hsl(46 100% 84%)}100%{transform:none;opacity:1}}
.feverchip{font:700 10px/1 var(--mono);letter-spacing:.1em;padding:5px 8px;border-radius:8px;
  color:#0c0805;background:linear-gradient(120deg,var(--amber),hsl(44 100% 70%));display:none}
.stage[data-style="burn"] .feverchip.on{display:block;animation:feverPulse .9s ease-in-out infinite}
@keyframes feverPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}

/* 卡片区 */
.cardwrap{flex:1;display:flex;align-items:center;justify-content:center;perspective:1100px;padding:6px 16px;position:relative;z-index:4}
.cardslot{position:relative;width:min(330px,92%);height:210px}
.card{
  position:absolute;inset:0;transform-style:preserve-3d;border-radius:16px;cursor:pointer;
  transition:box-shadow .3s;
}
.face{
  position:absolute;inset:0;border-radius:inherit;padding:16px 18px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;gap:8px;overflow:hidden;
}
.face .tag{font-size:10px;font-weight:800;letter-spacing:.18em;opacity:.55}
.face .q{font-size:16.5px;font-weight:700;line-height:1.5;margin:auto 0}
.face .a{font-size:15.5px;font-weight:700;line-height:1.65;margin:auto 0}
.face .meta{font-size:10.5px;opacity:.5;letter-spacing:.04em}
.face .keyhint{position:absolute;right:12px;bottom:10px;font-size:10px;opacity:.4;letter-spacing:.08em}
.face.back{transform:rotateX(180deg)}
.stage[data-style="glass"] .face.back{transform:rotateY(180deg)}
.card:hover{box-shadow:0 20px 46px -18px rgb(0 0 0 / .55)}

/* 键帽 */
.dock{padding:10px 16px 8px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:5}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.key{
  position:relative;border-radius:13px;padding:9px 6px 11px;text-align:center;cursor:pointer;
  --tone:var(--r-good);
  transition:transform .13s var(--ease-spring),box-shadow .18s,border-color .18s,background .18s;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.key .lab{display:block;font-size:13.5px;font-weight:800;letter-spacing:.05em}
.key .sub{display:block;font-size:9.5px;margin-top:2px;opacity:.65;letter-spacing:.02em}
.key .kh{position:absolute;left:7px;top:5px;font:600 9px/1 var(--mono);opacity:.55}
.key:hover{transform:translateY(-2px)}
.key:active,.key.down{transform:translateY(3px);transition-duration:.05s}
.key.sel{animation:keySel .4s var(--ease-spring)}
@keyframes keySel{40%{transform:translateY(3px) scale(1.04)}}
.undorow{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--dim)}
.undorow .btn-u{font-size:11px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);transition:all .15s}
.undorow .btn-u:hover{color:var(--fg);border-color:hsl(44 80% 70% / .45);background:hsl(40 90% 55% / .08)}
.stg-foot{padding:7px 16px 12px;font-size:11px;display:flex;gap:10px;align-items:center;position:relative;z-index:5}
.stg-foot .surprise{font-weight:700;letter-spacing:.02em;opacity:0;transition:opacity .3s}
.stg-foot .surprise.show{opacity:.85;animation:surpIn .5s var(--ease-expo)}
@keyframes surpIn{0%{transform:translateY(6px)}100%{transform:none}}

/* 连击飘字层 */
.floats{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden;border-radius:inherit}
.fnum{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);
  font-weight:900;font-family:var(--mono);letter-spacing:-.02em;
  animation:fnumIn .55s var(--ease-card) both;will-change:transform,opacity;white-space:nowrap}
@keyframes fnumIn{0%{transform:translate(-50%,-50%) scale(.5) rotate(-4deg);opacity:0}
  55%{transform:translate(-50%,-50%) scale(1.14);opacity:1}100%{transform:translate(-50%,-52%) scale(1);opacity:1}}
.fnum.out{transition:opacity .5s,transform .5s ease-in;opacity:0;transform:translate(-50%,-120%) scale(.92)}
.fsub{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);font-size:11.5px;font-weight:700;letter-spacing:.24em;
  animation:fsubIn .5s .1s var(--ease-expo) both;white-space:nowrap}
@keyframes fsubIn{0%{opacity:0;transform:translate(-50%,10px)}100%{opacity:.9;transform:translate(-50%,-50%)}}
.fsub.out{transition:opacity .4s;opacity:0}
.mstamp{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);
  font-size:13px;font-weight:800;letter-spacing:.3em;padding:8px 16px;border-radius:10px;
  border:1px solid hsl(44 90% 62% / .5);background:hsl(40 90% 50% / .14);color:hsl(46 100% 80%);
  box-shadow:0 0 34px hsl(40 96% 55% / .45);animation:mstampIn 1.15s var(--ease-card) both;white-space:nowrap}
@keyframes mstampIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(.96)}}

/* 卡片闪光 / 微光罩 */
.glowveil{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;border-radius:inherit;
  background:radial-gradient(120% 90% at 50% 118%,var(--vcolor,hsl(40 96% 60% / .22)),transparent 62%);
  transition:opacity .5s}
.stage.flash .glowveil{opacity:1;transition-duration:.08s}
.stage.fever .glowveil{opacity:1;animation:feverBreath 1.8s ease-in-out infinite}
@keyframes feverBreath{0%,100%{opacity:.45}50%{opacity:.95}}

/* 反应类：按评分的动作在 .cardslot 上播放(WAAPI 或 class) */


/* =====================================================================
   皮肤 0 · 基准（线上 freestyle 舞台复刻：暖炭台灯 + 键帽 + 金尘）
   ===================================================================== */
.stage[data-style="base"]{
  --tone-glow:hsl(30 90% 50% / .14);
  background:
    radial-gradient(90% 38% at 50% 104%,hsl(30 90% 50% / .14),transparent 70%),
    radial-gradient(60% 30% at 0% 0%,hsl(24 60% 40% / .08),transparent 70%),
    hsl(24 16% 9%);
  color:#f3ead9;
}
.stage[data-style="base"] .stg-name .dot{color:var(--gold)}
.stage[data-style="base"] .face{
  background:linear-gradient(180deg,hsl(38 80% 96% / .07),transparent 46%),
    linear-gradient(160deg,hsl(26 22% 16%),hsl(24 20% 12%));
  border:1px solid hsl(38 60% 90% / .1);
  box-shadow:inset 0 1px 0 hsl(38 70% 88% / .08);
}
.stage[data-style="base"] .key{
  --cap-depth:4px;color:#f3ead9;
  border:1px solid color-mix(in oklab,var(--tone) 34%,transparent);
  background:
    linear-gradient(180deg,hsl(38 80% 96% / .10),transparent 46%),
    radial-gradient(120% 90% at 50% 0%,color-mix(in oklab,var(--tone) 22%,transparent),transparent 70%),
    color-mix(in oklab,var(--tone) 10%,hsl(25 18% 14%));
  box-shadow:
    inset 0 1px 0 hsl(38 80% 94% / .16),
    inset 0 calc(var(--cap-depth) * -1) 0 color-mix(in oklab,var(--tone) 30%,hsl(24 30% 6%)),
    0 2px 0 hsl(24 30% 3% / .6),
    0 8px 16px -8px rgb(0 0 0 / .6);
  padding-bottom:calc(9px + var(--cap-depth));
}
.stage[data-style="base"] .key:hover{
  border-color:color-mix(in oklab,var(--tone) 56%,transparent);
  box-shadow:
    inset 0 1px 0 hsl(38 80% 94% / .2),
    inset 0 calc(var(--cap-depth) * -1) 0 color-mix(in oklab,var(--tone) 40%,hsl(24 30% 6%)),
    0 2px 0 hsl(24 30% 3% / .6),
    0 12px 24px -10px color-mix(in oklab,var(--tone) 75%,transparent);
}
.stage[data-style="base"] .key:active,.stage[data-style="base"] .key.down{
  box-shadow:
    inset 0 1px 0 hsl(38 80% 94% / .1),
    inset 0 -1px 0 color-mix(in oklab,var(--tone) 30%,hsl(24 30% 6%)),
    0 0 0 hsl(24 30% 3% / .6),
    0 3px 8px -6px rgb(0 0 0 / .6);
}
.stage[data-style="base"] .key[data-r="1"]{--tone:var(--r-again)}
.stage[data-style="base"] .key[data-r="2"]{--tone:var(--r-hard)}
.stage[data-style="base"] .key[data-r="3"]{--tone:var(--r-good)}
.stage[data-style="base"] .key[data-r="4"]{--tone:var(--r-easy)}
.stage[data-style="base"] .fnum{color:var(--gold);text-shadow:0 0 22px hsl(40 96% 60% / .8),0 2px 0 hsl(30 60% 30% / .4);font-size:34px}
.stage[data-style="base"] .stg-foot{color:hsl(40 20% 100% / .45)}

/* =====================================================================
   皮肤 A · 纸墨金章（暖纸信笺 + 印章键 + 金箔纸屑 + 竹简进度）
   ===================================================================== */
.stage[data-style="paper"]{
  background:
    repeating-linear-gradient(97deg,hsl(36 40% 30% / .035) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(8deg,hsl(36 40% 30% / .025) 0 1px,transparent 1px 11px),
    radial-gradient(120% 90% at 12% 0%,hsl(42 80% 96%),transparent 58%),
    linear-gradient(160deg,hsl(40 55% 92%),hsl(32 42% 86%));
  color:hsl(28 35% 16%);border-color:hsl(30 40% 40% / .25);
}
.stage[data-style="paper"]::after{ /* 书签绦带（从底边垂出） */
  content:"";position:absolute;bottom:0;right:140px;width:15px;height:40px;z-index:2;
  background:linear-gradient(0deg,hsl(6 72% 46%),hsl(6 62% 38%) 82%,transparent 82%,transparent 88%,hsl(6 62% 38%) 88%);
  clip-path:polygon(0 0,50% 16%,100% 0,100% 100%,0 100%);
  box-shadow:0 -3px 10px -4px hsl(6 60% 30% / .5);
  transform:rotate(-1.2deg);
}
.stage[data-style="paper"] .stg-name em{background:hsl(30 40% 30% / .1);color:hsl(28 30% 34%)}
.stage[data-style="paper"] .stg-name{font-family:var(--serif)}
.stage[data-style="paper"] .face{
  font-family:var(--serif);
  background:linear-gradient(180deg,hsl(43 100% 100% / .9),hsl(43 100% 100% / 0) 26%),
    linear-gradient(160deg,hsl(44 85% 97%),hsl(38 65% 92%));
  border:1px solid hsl(32 45% 55% / .4);
  box-shadow:
    inset 0 1px 0 hsl(43 100% 100% / .95),
    0 1px 2px hsl(24 50% 20% / .18),
    0 14px 30px -14px hsl(28 60% 30% / .35);
}
.stage[data-style="paper"] .face.back{background-image:linear-gradient(160deg,hsl(40 72% 93%),hsl(33 58% 88%))}
.stage[data-style="paper"] .face .q,.stage[data-style="paper"] .face .a{letter-spacing:.02em}
.stage[data-style="paper"] .rail .seg{background:hsl(30 35% 30% / .12);border-radius:3.5px;height:13px;width:14px;flex:0 0 auto;
  border:1px solid hsl(30 40% 40% / .25);box-shadow:inset 0 1px 0 hsl(40 60% 100% / .5)}
.stage[data-style="paper"] .rail .seg i{background:linear-gradient(180deg,hsl(36 85% 58%),hsl(28 82% 44%))}
.stage[data-style="paper"] .xpchip{background:hsl(35 50% 40% / .08);border-color:hsl(30 40% 40% / .25);color:hsl(28 70% 34%);font-family:var(--serif)}
.stage[data-style="paper"] .key{
  --tone:var(--r-good);
  font-family:var(--serif);color:hsl(30 30% 20%);
  border:1.5px solid color-mix(in oklab,var(--tone) 62%,hsl(28 40% 20%));
  border-radius:10px;
  background:
    radial-gradient(120% 120% at 30% 20%,hsl(0 0% 100% / .5),transparent 45%),
    color-mix(in oklab,var(--tone) 30%,hsl(40 45% 88%));
  box-shadow:
    inset 0 1px 0 hsl(0 0% 100% / .6),
    0 3px 0 color-mix(in oklab,var(--tone) 45%,hsl(28 40% 22%)),
    0 8px 16px -8px hsl(20 50% 20% / .45);
}
.stage[data-style="paper"] .key:hover{
  transform:translateY(-2px) rotate(-.6deg);
  box-shadow:
    inset 0 1px 0 hsl(0 0% 100% / .7),
    0 5px 0 color-mix(in oklab,var(--tone) 45%,hsl(28 40% 22%)),
    0 14px 24px -10px color-mix(in oklab,var(--tone) 70%,transparent);
}
.stage[data-style="paper"] .key:active,.stage[data-style="paper"] .key.down{
  transform:translateY(3px) scale(.98) rotate(.4deg);
  box-shadow:inset 0 2px 6px color-mix(in oklab,var(--tone) 50%,hsl(28 40% 18%));
}
.stage[data-style="paper"] .key[data-r="1"]{--tone:hsl(14 60% 52%)}
.stage[data-style="paper"] .key[data-r="2"]{--tone:hsl(34 82% 52%)}
.stage[data-style="paper"] .key[data-r="3"]{--tone:hsl(104 42% 40%)}
.stage[data-style="paper"] .key[data-r="4"]{--tone:hsl(200 45% 42%)}
.stage[data-style="paper"] .fnum{
  font-family:var(--serif);font-size:32px;font-weight:900;color:hsl(8 72% 44%);
  text-shadow:0 1px 0 hsl(40 90% 100% / .8),0 0 18px hsl(6 70% 50% / .35);
}
.stage[data-style="paper"] .fsub{color:hsl(28 45% 32%);font-family:var(--serif)}
.stage[data-style="paper"] .mstamp{
  background:hsl(6 70% 46%);color:hsl(40 90% 96%);border:2px solid hsl(6 60% 34%);border-radius:8px;
  font-family:var(--serif);letter-spacing:.34em;box-shadow:0 6px 22px -8px hsl(6 70% 40% / .7),inset 0 0 0 1px hsl(40 80% 90% / .35);
  transform:translate(-50%,-50%) rotate(-2deg);
}
.stage[data-style="paper"] .glowveil{background:radial-gradient(120% 90% at 50% 118%,hsl(38 90% 55% / .2),transparent 62%)}
.stage[data-style="paper"] .undorow,.stage[data-style="paper"] .stg-foot{color:hsl(28 25% 40%)}
.stamp-mark{
  position:absolute;right:14px;bottom:14px;z-index:2;width:52px;height:52px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font:900 19px/1 var(--serif);letter-spacing:0;writing-mode:vertical-rl;
  color:hsl(40 90% 96%);background:hsl(6 70% 46% / .88);border:2px solid hsl(40 90% 96% / .4);
  box-shadow:0 4px 14px -6px hsl(6 60% 30% / .6);pointer-events:none;
}
/* =====================================================================
   皮肤 B · 暖灯燃系（熔炉暗场 + 霓虹键 + 火焰连击 + FEVER 光环）
   ===================================================================== */
.stage[data-style="burn"]{
  background:
    radial-gradient(140% 60% at 50% 118%,hsl(18 95% 32% / .5),transparent 62%),
    radial-gradient(70% 30% at 8% -4%,hsl(40 90% 40% / .18),transparent 60%),
    linear-gradient(180deg,hsl(26 45% 6%),hsl(20 55% 9%));
  color:#ffe9c9;border-color:hsl(30 80% 50% / .28);
}
.stage[data-style="burn"]::before{ /* 炭火呼吸层 */
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 26% at 50% 106%,hsl(24 100% 55% / .32),transparent 70%);
  animation:emberBreath 2.8s ease-in-out infinite;
}
@keyframes emberBreath{0%,100%{opacity:.5}50%{opacity:1}}
.stage[data-style="burn"].fever::before{animation-duration:.9s}
.stage[data-style="burn"] .stg-name{font-family:var(--sans)}
.stage[data-style="burn"] .stg-name em{background:hsl(350 90% 55% / .18);color:hsl(350 95% 75%)}
.stage[data-style="burn"] .face{
  background:linear-gradient(165deg,hsl(26 40% 13%),hsl(22 45% 8%));
  border:1px solid hsl(35 90% 60% / .25);
  box-shadow:inset 0 1px 0 hsl(40 90% 80% / .12),0 0 0 1px hsl(24 60% 20% / .6),0 18px 40px -16px hsl(0 0% 0% / .8);
}
.stage[data-style="burn"] .face.back{border-color:hsl(350 85% 60% / .3)}
.stage[data-style="burn"] .rail .seg{height:9px;background:hsl(30 60% 100% / .06);border:1px solid hsl(35 80% 60% / .12)}
.stage[data-style="burn"] .rail .seg i{background:linear-gradient(90deg,hsl(350 90% 55%),hsl(28 95% 55%),hsl(46 100% 65%));box-shadow:0 0 12px hsl(32 100% 60% / .8)}
.stage[data-style="burn"] .xpchip{color:hsl(40 100% 72%);border-color:hsl(35 80% 60% / .3);text-shadow:0 0 12px hsl(38 100% 60% / .6)}
.stage[data-style="burn"] .key{
  --tone:var(--r-good);color:#1a0d04;font-weight:900;
  border:1px solid color-mix(in oklab,var(--tone) 70%,white 15%);
  background:
    linear-gradient(180deg,hsl(0 0% 100% / .3),transparent 40%),
    repeating-linear-gradient(-45deg,hsl(0 0% 100% / .05) 0 4px,transparent 4px 9px),
    color-mix(in oklab,var(--tone) 80%,black 4%);
  box-shadow:
    0 0 0 1px hsl(0 0% 0% / .35),
    0 4px 0 color-mix(in oklab,var(--tone) 55%,black 30%),
    0 10px 22px -8px color-mix(in oklab,var(--tone) 75%,transparent),
    inset 0 1px 0 hsl(0 0% 100% / .5);
  text-shadow:0 1px 0 hsl(0 0% 100% / .35);
}
.stage[data-style="burn"] .key:hover{
  filter:brightness(1.12) saturate(1.15);
  box-shadow:
    0 0 0 1px hsl(0 0% 0% / .35),
    0 4px 0 color-mix(in oklab,var(--tone) 55%,black 30%),
    0 14px 30px -8px color-mix(in oklab,var(--tone) 95%,transparent),
    0 0 26px color-mix(in oklab,var(--tone) 60%,transparent),
    inset 0 1px 0 hsl(0 0% 100% / .5);
}
.stage[data-style="burn"] .key:active,.stage[data-style="burn"] .key.down{
  transform:translateY(4px) scale(.96);
  filter:brightness(1.35);
  box-shadow:0 0 0 1px hsl(0 0% 0% / .35),0 0 0 color-mix(in oklab,var(--tone) 55%,black 30%),0 4px 10px -6px color-mix(in oklab,var(--tone) 90%,transparent),inset 0 2px 8px hsl(0 0% 0% / .35);
}
.stage[data-style="burn"] .key[data-r="1"]{--tone:hsl(6 90% 58%)}
.stage[data-style="burn"] .key[data-r="2"]{--tone:hsl(30 95% 55%)}
.stage[data-style="burn"] .key[data-r="3"]{--tone:hsl(100 80% 52%)}
.stage[data-style="burn"] .key[data-r="4"]{--tone:hsl(178 90% 50%)}
.stage[data-style="burn"] .fnum{
  font-size:42px;font-weight:900;font-family:var(--sans);
  background:linear-gradient(180deg,hsl(48 100% 85%),hsl(38 100% 62%) 55%,hsl(20 95% 52%));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px hsl(32 100% 55% / .9)) drop-shadow(0 2px 0 hsl(18 90% 40% / .6));
  animation:fnumIn .45s var(--ease-card) both,flameFlicker .18s steps(2) infinite;
}
@keyframes flameFlicker{0%,100%{transform:translate(-50%,-50%) scale(1) rotate(-.5deg)}50%{transform:translate(-50%,-52%) scale(1.015) rotate(.6deg)}}
.stage[data-style="burn"] .fsub{color:hsl(350 90% 70%);letter-spacing:.32em;font-weight:900}
.stage[data-style="burn"] .mstamp{
  background:linear-gradient(120deg,hsl(350 90% 55%),hsl(28 95% 55%));color:#fff;
  border:1px solid hsl(48 100% 75%);letter-spacing:.28em;text-transform:uppercase;
  box-shadow:0 0 34px hsl(350 95% 55% / .7),0 0 60px hsl(30 100% 55% / .4);
}
.stage[data-style="burn"] .glowveil{background:radial-gradient(130% 100% at 50% 120%,hsl(30 100% 58% / .3),transparent 60%)}
.stage[data-style="burn"].fever{box-shadow:0 0 0 2px hsl(350 95% 60% / .55),0 0 46px -6px hsl(30 100% 55% / .55),inset 0 0 60px -20px hsl(38 100% 60% / .35);animation:feverRing 1.2s ease-in-out infinite}
@keyframes feverRing{0%,100%{box-shadow:0 0 0 2px hsl(350 95% 60% / .55),0 0 40px -6px hsl(30 100% 55% / .5),inset 0 0 55px -20px hsl(38 100% 60% / .3)}50%{box-shadow:0 0 0 3px hsl(46 100% 65% / .75),0 0 70px -6px hsl(36 100% 60% / .7),inset 0 0 75px -18px hsl(40 100% 65% / .4)}}
.stage[data-style="burn"] .crit{position:absolute;font:900 15px/1 var(--mono);color:hsl(48 100% 80%);
  text-shadow:0 0 14px hsl(40 100% 60%);animation:critUp .8s var(--ease-expo) both;pointer-events:none}
@keyframes critUp{0%{opacity:0;transform:translateY(12px) scale(.7)}25%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-30px) scale(1)}}

/* =====================================================================
   皮肤 C · 玻璃极光（冷冽深色 + 磨砂玻璃卡 + 光边跟随 + 棱镜碎屑）
   ===================================================================== */
.stage[data-style="glass"]{
  background:linear-gradient(180deg,hsl(215 35% 8%),hsl(230 30% 6%));
  color:rgb(228,236,246);border-color:hsl(200 60% 70% / .14);overflow:hidden;
}
.stage[data-style="glass"] .aur{position:absolute;border-radius:50%;filter:blur(46px);z-index:0;pointer-events:none;opacity:.5;mix-blend-mode:screen}
.stage[data-style="glass"] .aur.a1{width:340px;height:220px;left:-12%;top:-24%;background:radial-gradient(circle,hsl(185 80% 45% / .7),transparent 70%);animation:aurDrift1 11s ease-in-out infinite}
.stage[data-style="glass"] .aur.a2{width:300px;height:260px;right:-10%;top:8%;background:radial-gradient(circle,hsl(265 70% 55% / .6),transparent 70%);animation:aurDrift2 13s ease-in-out infinite}
.stage[data-style="glass"] .aur.a3{width:420px;height:200px;left:22%;bottom:-26%;background:radial-gradient(circle,hsl(205 85% 50% / .5),transparent 70%);animation:aurDrift3 9s ease-in-out infinite}
@keyframes aurDrift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(46px,30px) scale(1.15)}}
@keyframes aurDrift2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-40px,44px) scale(.92)}}
@keyframes aurDrift3{0%,100%{transform:translate(0,0)}50%{transform:translate(36px,-26px) scale(1.1)}}
.stage[data-style="glass"] .stg-name em{background:hsl(200 70% 70% / .12);color:hsl(185 80% 72%)}
.stage[data-style="glass"] .face{
  background:linear-gradient(150deg,hsl(210 40% 90% / .1),hsl(230 40% 30% / .08));
  border:1px solid hsl(200 70% 80% / .22);
  box-shadow:inset 0 1px 0 hsl(0 0% 100% / .18),0 20px 50px -18px hsl(220 60% 10% / .8);
  backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);
}
.stage[data-style="glass"] .face::before{ /* 光边跟随（--mx/--my 由 JS 更新） */
  content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  background:radial-gradient(240px 180px at var(--mx,50%) var(--my,50%),hsl(185 90% 70% / .32),transparent 65%);
  opacity:0;transition:opacity .25s;
}
.stage[data-style="glass"] .face:hover::before,.stage[data-style="glass"] .card:hover .face::before{opacity:1}
.stage[data-style="glass"] .face.back{
  border-color:hsl(265 60% 75% / .3);
  background:linear-gradient(150deg,hsl(260 45% 70% / .12),hsl(210 45% 40% / .08));
}
.stage[data-style="glass"] .rail .seg{background:hsl(205 50% 80% / .08);border:1px solid hsl(200 60% 75% / .12)}
.stage[data-style="glass"] .rail .seg i{background:linear-gradient(90deg,hsl(185 85% 55%),hsl(220 80% 65%),hsl(265 75% 68%));box-shadow:0 0 14px hsl(200 90% 60% / .7)}
.stage[data-style="glass"] .xpchip{color:hsl(185 80% 72%);border-color:hsl(200 60% 75% / .2);background:hsl(210 50% 70% / .06)}
.stage[data-style="glass"] .key{
  --tone:hsl(185 85% 55%);color:rgb(235,242,250);font-weight:700;
  border:1px solid color-mix(in oklab,var(--tone) 45%,transparent);
  background:linear-gradient(160deg,hsl(0 0% 100% / .14),hsl(215 45% 30% / .12) 55%),
    color-mix(in oklab,var(--tone) 12%,hsl(220 40% 12%));
  box-shadow:inset 0 1px 0 hsl(0 0% 100% / .22),0 10px 24px -12px hsl(0 0% 0% / .7);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.stage[data-style="glass"] .key:hover{
  transform:translateY(-2px);
  border-color:color-mix(in oklab,var(--tone) 80%,transparent);
  box-shadow:inset 0 1px 0 hsl(0 0% 100% / .3),0 0 0 1px color-mix(in oklab,var(--tone) 30%,transparent),0 0 24px -4px color-mix(in oklab,var(--tone) 70%,transparent),0 14px 30px -12px hsl(0 0% 0% / .8);
}
.stage[data-style="glass"] .key:active,.stage[data-style="glass"] .key.down{transform:translateY(2px) scale(.97)}
.stage[data-style="glass"] .key::after{ /* 点击涟漪 */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at 50% 60%,color-mix(in oklab,var(--tone) 45%,transparent),transparent 60%);
  opacity:0;transform:scale(.4);
}
.stage[data-style="glass"] .key.rip::after{animation:glassRip .5s var(--ease-expo) forwards}
@keyframes glassRip{0%{opacity:.9;transform:scale(.35)}100%{opacity:0;transform:scale(1.35)}}
.stage[data-style="glass"] .key[data-r="1"]{--tone:hsl(350 75% 62%)}
.stage[data-style="glass"] .key[data-r="2"]{--tone:hsl(40 90% 60%)}
.stage[data-style="glass"] .key[data-r="3"]{--tone:hsl(155 70% 52%)}
.stage[data-style="glass"] .key[data-r="4"]{--tone:hsl(200 90% 60%)}
.stage[data-style="glass"] .fnum{
  font-size:38px;font-weight:300;font-family:var(--mono);letter-spacing:-.03em;color:hsl(190 90% 80%);
  text-shadow:0 0 26px hsl(195 95% 65% / .8),0 0 60px hsl(250 90% 70% / .4);
}
.stage[data-style="glass"] .fsub{color:hsl(250 70% 80%);letter-spacing:.5em;font-weight:300}
.stage[data-style="glass"] .mstamp{
  background:hsl(210 50% 20% / .4);color:hsl(185 90% 78%);
  border:1px solid hsl(185 85% 65% / .5);border-radius:12px;backdrop-filter:blur(6px);
  box-shadow:0 0 30px hsl(200 95% 60% / .45),inset 0 1px 0 hsl(0 0% 100% / .2);
}
.stage[data-style="glass"] .glowveil{background:radial-gradient(130% 100% at 50% 120%,hsl(195 90% 60% / .16),transparent 60%)}
.stage[data-style="glass"].fever{box-shadow:0 0 0 1px hsl(185 90% 65% / .5),0 0 60px -10px hsl(210 95% 60% / .5)}


/* =====================================================================
   皮肤 D · 水墨写意（宣纸书房 + 墨晕翻卡 + 飞白粒子 + 题字落款）
   ===================================================================== */
.stage[data-style="ink"]{
  background:
    radial-gradient(90% 55% at 82% 108%,hsl(210 14% 55% / .18),transparent 60%),
    radial-gradient(70% 45% at 8% 110%,hsl(210 12% 60% / .14),transparent 65%),
    repeating-linear-gradient(0deg,hsl(36 30% 30% / .018) 0 2px,transparent 2px 5px),
    linear-gradient(170deg,hsl(42 32% 92%),hsl(36 25% 86%) 70%,hsl(30 20% 82%));
  color:hsl(215 25% 16%);border-color:hsl(210 15% 40% / .22);
}
.stage[data-style="ink"] .stg-name{font-family:var(--kai);font-weight:900;letter-spacing:.1em}
.stage[data-style="ink"] .stg-name em{background:hsl(215 20% 25% / .08);color:hsl(215 18% 38%)}
.stage[data-style="ink"] .face{
  font-family:var(--serif);
  background:
    radial-gradient(140% 100% at 0% 0%,hsl(0 0% 100% / .5),transparent 50%),
    linear-gradient(165deg,hsl(45 40% 96%),hsl(38 30% 91%));
  border:1px solid hsl(215 15% 30% / .25);
  box-shadow:0 2px 4px hsl(215 20% 30% / .1),0 16px 34px -18px hsl(215 25% 25% / .3);
}
.stage[data-style="ink"] .face.front{border-left:3px solid hsl(215 25% 22% / .5)}
.stage[data-style="ink"] .face.back{border-left:3px solid hsl(14 65% 45% / .6)}
.stage[data-style="ink"] .rail .seg{background:hsl(215 20% 30% / .12);border-radius:4px}
.stage[data-style="ink"] .rail .seg i{background:linear-gradient(90deg,hsl(215 25% 25%),hsl(215 20% 35%));box-shadow:0 0 10px hsl(215 30% 30% / .5)}
.stage[data-style="ink"] .rail .seg.on.mis i{background:linear-gradient(90deg,hsl(14 60% 45%),hsl(14 55% 40%))}
.stage[data-style="ink"] .xpchip{background:hsl(215 20% 25% / .06);border-color:hsl(215 15% 40% / .2);color:hsl(215 25% 22%);font-family:var(--kai);font-size:13px;font-weight:700}
.stage[data-style="ink"] .key{
  --tone:hsl(215 20% 25%);
  font-family:var(--kai);font-weight:900;font-size:15px;letter-spacing:.1em;
  color:hsl(42 40% 96%);border:1px solid hsl(215 25% 20% / .5);border-radius:8px;
  background:
    radial-gradient(90% 120% at 20% 0%,hsl(0 0% 100% / .18),transparent 45%),
    var(--tone);
  box-shadow:0 3px 0 hsl(215 30% 12% / .55),0 10px 18px -8px hsl(215 30% 20% / .5);
}
.stage[data-style="ink"] .key .sub{opacity:.8}
.stage[data-style="ink"] .key .kh{color:hsl(42 60% 90%);opacity:.6}
.stage[data-style="ink"] .key:hover{transform:translateY(-2px) rotate(-.8deg);box-shadow:0 5px 0 hsl(215 30% 12% / .55),0 16px 26px -10px hsl(215 30% 20% / .55),0 0 0 1px var(--tone)}
.stage[data-style="ink"] .key:active,.stage[data-style="ink"] .key.down{transform:translateY(3px) scale(.97);box-shadow:0 0 0 hsl(215 30% 12% / .5),inset 0 2px 8px hsl(215 40% 8% / .45)}
.stage[data-style="ink"] .key[data-r="1"]{--tone:hsl(215 18% 22%)}
.stage[data-style="ink"] .key[data-r="2"]{--tone:hsl(36 72% 42%)}
.stage[data-style="ink"] .key[data-r="3"]{--tone:hsl(160 35% 32%)}
.stage[data-style="ink"] .key[data-r="4"]{--tone:hsl(14 62% 44%)}
.stage[data-style="ink"] .fnum{font-family:var(--kai);font-size:36px;color:hsl(215 30% 18%);text-shadow:0 0 18px hsl(215 25% 30% / .35)}
.stage[data-style="ink"] .fsub{font-family:var(--kai);color:hsl(215 20% 30%);letter-spacing:.4em}
.stage[data-style="ink"] .mstamp{
  font-family:var(--kai);letter-spacing:.4em;background:hsl(14 62% 42%);color:hsl(42 80% 96%);
  border:2px solid hsl(42 70% 92% / .55);border-radius:6px;
  box-shadow:0 8px 26px -10px hsl(14 60% 35% / .7),inset 0 0 0 1px hsl(14 50% 30%);
}
.stage[data-style="ink"] .glowveil{background:radial-gradient(120% 90% at 50% 120%,hsl(215 30% 40% / .14),transparent 62%)}
.ink-reveal{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.ink-hanzi{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  font:900 130px/1 var(--kai);color:hsl(215 30% 18% / .09);pointer-events:none;z-index:1;
  animation:hanziFade 1.6s ease forwards}
@keyframes hanziFade{0%{opacity:0;transform:translate(-50%,-50%) scale(.86)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-54%) scale(1.06)}}
.brush-slash{position:absolute;left:8%;right:8%;top:52%;height:3px;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,transparent,hsl(215 30% 15% / .8) 18%,hsl(215 30% 15% / .9) 60%,transparent);
  border-radius:3px;transform-origin:left;animation:slashGo .5s var(--ease-expo) forwards}
@keyframes slashGo{0%{transform:scaleX(0) rotate(-1deg);opacity:0}30%{opacity:1}100%{transform:scaleX(1) rotate(-1deg);opacity:0}}

/* 卡背印章（纸墨主题用） */
.card .stamp{position:absolute;right:12px;bottom:12px;z-index:3;
  min-width:46px;min-height:46px;padding:6px 4px;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;writing-mode:vertical-rl;
  font:900 15px/1.15 var(--serif);letter-spacing:.08em;color:hsl(40 85% 96%);
  box-shadow:0 5px 16px -6px hsl(6 60% 30% / .55),inset 0 0 0 1.5px hsl(40 80% 92% / .4);
  transform:rotate(-3deg) scale(0);opacity:0}
.card .stamp.in{animation:stampIn .5s var(--ease-card) forwards}
@keyframes stampIn{0%{transform:rotate(-14deg) scale(1.7);opacity:0}55%{transform:rotate(-3deg) scale(.94);opacity:1}75%{transform:rotate(-2deg) scale(1.03)}100%{transform:rotate(-3deg) scale(1);opacity:1}}
.card .stamp small{font-size:8px;letter-spacing:.1em;opacity:.85}

/* =====================================================================
   决策看板（右栏 + 底部实时条）
   ===================================================================== */
aside#rail{
  position:sticky;top:56px;align-self:start;max-height:calc(100vh - 56px);overflow:auto;
  border-left:1px solid var(--line);background:linear-gradient(180deg,hsl(30 18% 8% / .96),hsl(30 18% 7% / .99));
  backdrop-filter:blur(10px);padding:16px 16px 90px;font-size:12.5px;
}
aside#rail h2{font-size:13px;letter-spacing:.22em;color:hsl(44 80% 74%);margin-bottom:10px;display:flex;align-items:center;gap:8px}
aside#rail h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,hsl(44 80% 60% / .4),transparent)}
.dsec{margin-bottom:16px;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:hsl(40 20% 100% / .02)}
.dsec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;letter-spacing:.06em;color:var(--fg)}
.dsec>summary::-webkit-details-marker{display:none}
.dsec>summary .n{font:700 10px/1 var(--mono);color:hsl(44 90% 70%);background:hsl(40 90% 55% / .12);padding:3px 6px;border-radius:5px}
.dsec>summary .cur{margin-left:auto;font-weight:600;font-size:10.5px;color:var(--dim);max-width:56%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsec>summary:hover .n{background:hsl(40 90% 55% / .25)}
.dsec[open]>summary{margin-bottom:9px}
.dsec .body{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:10px;cursor:pointer;
  border:1px solid transparent;background:hsl(40 20% 100% / .03);
  transition:all .15s var(--ease-spring);
}
.opt:hover{border-color:hsl(44 70% 65% / .3);background:hsl(40 90% 55% / .07);transform:translateX(2px)}
.opt input{accent-color:hsl(40 90% 55%);margin-top:2px;cursor:pointer}
.opt .tt{font-weight:700;font-size:12px;line-height:1.35}
.opt .dd{font-size:10.5px;color:var(--dim);line-height:1.45;margin-top:1px}
.opt .rec{font-size:9px;font-weight:800;color:hsl(44 100% 72%);background:hsl(40 90% 55% / .15);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
.opt:has(input:checked){border-color:hsl(44 90% 62% / .55);background:hsl(40 90% 55% / .1);box-shadow:0 4px 14px -6px hsl(40 90% 50% / .5)}
.opt:has(input:checked) .tt{color:hsl(46 100% 82%)}
.srow{display:flex;align-items:center;gap:10px;padding:6px 9px}
.srow label{flex:1;font-weight:600;font-size:12px}
.srow output{font:700 11px/1 var(--mono);color:hsl(44 90% 70%);min-width:52px;text-align:right}
input[type=range]{flex:1.4;appearance:none;height:4px;border-radius:3px;background:linear-gradient(90deg,hsl(40 90% 55% / .7) var(--fill,50%),hsl(40 20% 100% / .12) var(--fill,50%));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;background:hsl(44 100% 78%);border:2px solid hsl(30 70% 35%);box-shadow:0 0 0 4px hsl(40 90% 55% / .18),0 2px 6px #000;transition:transform .12s var(--ease-spring)}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;
  border:1px solid var(--line);background:hsl(40 20% 100% / .04);color:var(--dim);transition:all .15s var(--ease-spring);cursor:pointer}
.chip:hover span{color:var(--fg);border-color:hsl(44 70% 65% / .4);transform:translateY(-1px)}
.chip:has(input:checked) span{color:hsl(46 100% 85%);background:hsl(40 90% 55% / .2);border-color:hsl(44 90% 62% / .6);box-shadow:0 0 14px -2px hsl(40 90% 55% / .5)}
.chip:has(input:checked) span::before{content:"✓ ";font-size:9px}
textarea#notes{width:100%;min-height:64px;resize:vertical;border-radius:10px;border:1px solid var(--line);
  background:hsl(40 20% 100% / .04);color:var(--fg);padding:9px;font-size:12px;line-height:1.5}
textarea#notes:focus{outline:none;border-color:hsl(44 90% 62% / .5);box-shadow:0 0 0 3px hsl(40 90% 55% / .12)}

/* 底部实时决策条 */
#livebar{
  position:fixed;left:0;right:372px;bottom:0;z-index:42;
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:linear-gradient(180deg,hsl(30 20% 8% / .88),hsl(30 22% 6% / .97));
  border-top:1px solid hsl(44 80% 60% / .25);backdrop-filter:blur(12px);
  box-shadow:0 -14px 34px -18px #000;
}
@media (max-width:1180px){#livebar{right:0;flex-wrap:wrap}}
#liveChips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;overflow:hidden;max-height:54px}
.lchip{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:7px;white-space:nowrap;
  background:hsl(40 20% 100% / .06);border:1px solid var(--line);color:var(--dim)}
.lchip b{color:hsl(44 95% 75%);font-weight:800}
.lchip.flash{animation:lchipFlash .5s var(--ease-spring)}
@keyframes lchipFlash{0%{background:hsl(40 90% 55% / .4);transform:scale(1.08)}100%{background:hsl(40 20% 100% / .06);transform:none}}
#copyBtn{
  padding:9px 16px;border-radius:11px;font-weight:800;font-size:12.5px;letter-spacing:.04em;color:hsl(30 60% 12%);
  background:linear-gradient(120deg,hsl(46 100% 76%),hsl(36 92% 58%));
  box-shadow:0 4px 0 hsl(30 70% 34%),0 10px 26px -8px hsl(38 95% 55% / .65);
  transition:all .13s var(--ease-spring);
}
#copyBtn:hover{transform:translateY(-2px);box-shadow:0 6px 0 hsl(30 70% 34%),0 16px 32px -8px hsl(38 95% 55% / .8)}
#copyBtn:active{transform:translateY(2px);box-shadow:0 1px 0 hsl(30 70% 34%),0 4px 12px -6px hsl(38 95% 55% / .6)}
#resetBtn{font-size:11px;color:var(--dim);padding:8px 10px;border-radius:9px;border:1px solid var(--line)}
#resetBtn:hover{color:var(--fg);border-color:hsl(44 70% 65% / .4)}

/* =====================================================================
   全屏结算演出 / 闪光 / 提示
   ===================================================================== */
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
#flash{position:fixed;inset:0;z-index:61;pointer-events:none;opacity:0;background:var(--fc,#fff)}
#cele{position:fixed;inset:0;z-index:70;display:none;place-items:center}
#cele.on{display:grid}
#cele .veil{position:absolute;inset:0;background:var(--celebg,rgb(10 8 6 / .78));backdrop-filter:blur(6px);animation:celeVeil .5s ease forwards;opacity:0}
@keyframes celeVeil{to{opacity:1}}
#cele .panel{
  position:relative;z-index:2;text-align:center;padding:34px 44px;border-radius:22px;
  animation:panelIn .7s .15s var(--ease-card) both;min-width:min(430px,88vw);
}
@keyframes panelIn{0%{opacity:0;transform:translateY(40px) scale(.9)}100%{opacity:1;transform:none}}
#cele .banner{font-size:30px;font-weight:900;letter-spacing:.18em;margin-bottom:6px;
  background:linear-gradient(110deg,var(--b1,hsl(40 96% 70%)),var(--b2,hsl(48 100% 88%)) 45%,var(--b1,hsl(34 94% 62%)));
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px var(--bs,hsl(40 96% 60% / .55)))}
#cele .copy{font-size:13px;opacity:.75;letter-spacing:.14em;margin-bottom:20px}
#cele .stats{display:grid;grid-template-columns:repeat(3,auto);gap:14px 30px;justify-content:center;margin-bottom:22px}
#cele .stat b{display:block;font:800 26px/1.1 var(--mono)}
#cele .stat span{font-size:10.5px;letter-spacing:.22em;opacity:.6}
#cele .row{display:flex;gap:10px;justify-content:center}
#cele .row button{padding:10px 20px;border-radius:11px;font-weight:800;font-size:12.5px;letter-spacing:.06em;
  border:1px solid hsl(0 0% 100% / .25);background:hsl(0 0% 100% / .08);color:#fff;
  transition:all .14s var(--ease-spring)}
#cele .row button:hover{transform:translateY(-2px);background:hsl(0 0% 100% / .16)}
#cele .row button.primary{background:linear-gradient(120deg,hsl(46 100% 70%),hsl(36 92% 54%));color:hsl(30 60% 10%);border-color:transparent;box-shadow:0 6px 20px -6px hsl(38 95% 55% / .7)}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(24px);z-index:90;opacity:0;
  padding:11px 20px;border-radius:12px;font-size:12.5px;font-weight:700;color:#14100b;
  background:linear-gradient(120deg,hsl(46 100% 80%),hsl(38 95% 62%));box-shadow:0 12px 30px -10px #000c;
  transition:all .35s var(--ease-card);pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.reduced .fnum,.reduced .fsub,.reduced .mstamp,.reduced .stamp{animation-duration:.01s !important}
.reduced .card{transition:none !important}
.reduced .stage[data-style="burn"]::before,.reduced .stage[data-style="glass"] .aur{animation:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#332b22;border-radius:6px;border:2px solid #14110d}
::-webkit-scrollbar-track{background:#14110d}
</style>
</head>
<body>


<header class="top">
  <div class="logo">
    <h1>翻卡 × 评分 · 动效决策沙盒</h1>
    <small>FLIP &amp; RATING MOTION LAB v3</small>
  </div>
  <div class="hint">
    <span><kbd>Space</kbd> 翻卡</span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 评分</span>
    <span><kbd>U</kbd> 撤销</span><span><kbd>C</kbd> 结算</span><span><kbd>R</kbd> 重置</span>
    <span style="opacity:.75">悬停某个舞台即接管键盘 · 点 ⌨ 可锁定</span>
  </div>
  <div class="spacer"></div>
  <button class="tbtn" id="syncBtn" aria-pressed="false" title="打开后，键盘操作同时驱动全部舞台，适合横向对比手感"><span class="ic">🔁</span>同步对比</button>
  <button class="tbtn" id="sndBtn" aria-pressed="true" title="WebAudio 合成音效开关"><span class="ic">🔊</span>音效</button>
  <button class="tbtn" id="vibBtn" aria-pressed="true" title="移动端振动 API（桌面浏览器大多无效）"><span class="ic">📳</span>振动</button>
  <button class="tbtn" id="redBtn" aria-pressed="false" title="减弱动效：关闭粒子/震屏/大幅动画"><span class="ic">🍃</span>减动效</button>
  <button class="tbtn" id="railToggle" aria-pressed="false"><span class="ic">📋</span>决策板</button>
</header>

<div class="layout">
<main id="stages" aria-label="五个可交互舞台"></main>

<aside id="rail">
  <h2>决策看板 DECISION BOARD</h2>

  <details class="dsec" open>
    <summary><span class="n">1</span>主风格基调<span class="cur" data-cur="style"></span></summary>
    <div class="body">
      <label class="opt"><input type="radio" name="style" value="base"><div><div class="tt">基准 · 线上现状</div><div class="dd">暖炭台灯 + 弹性翻卡 + 金尘磁吸 + 编钟音阶。对照组。</div></div></label>
      <label class="opt"><input type="radio" name="style" value="paper" checked><div><div class="tt">A 纸墨金章 · 匠心高级感<span class="rec">推荐</span></div><div class="dd">信笺翻面 + 印章键帽 + 落款盖章 + 竹简进度。耐看、有质感。</div></div></label>
      <label class="opt"><input type="radio" name="style" value="burn"><div><div class="tt">B 暖灯燃系 · 强游戏化<span class="rec">推荐</span></div><div class="dd">火焰连击数 + Fever 光环 + 击发后坐 + 烟花结算。爽感最猛。</div></div></label>
      <label class="opt"><input type="radio" name="style" value="glass"><div><div class="tt">C 玻璃极光 · 冷冽通透</div><div class="dd">磨砂玻璃卡 + 光边跟随 + 棱镜碎屑 + 极光幕布结算。</div></div></label>
      <label class="opt"><input type="radio" name="style" value="ink"><div><div class="tt">D 水墨写意 · 国风书房</div><div class="dd">墨晕揭卡 + 飞白墨点 + 行草连击 + 题字落款结算。个性最强。</div></div></label>
    </div>
  </details>

  <details class="dsec">
    <summary><span class="n">2</span>翻卡手感<span class="cur" data-cur="flip"></span></summary>
    <div class="body">
      <div class="srow"><label>曲线</label></div>
      <label class="opt"><input type="radio" name="flipCurve" value="style" checked><div><div class="tt">跟随主风格预设<span class="rec">推荐</span></div><div class="dd">基准/纸墨=弹性两段翻，燃系=320ms 疾翻残影，玻璃=620ms 转轴扫光，水墨=墨晕揭幕。</div></div></label>
      <label class="opt"><input type="radio" name="flipCurve" value="custom"><div><div class="tt">用下方自定义参数</div><div class="dd">统一曲线覆盖所有舞台，便于单独调时长/过冲。</div></div></label>
      <div class="srow"><label>时长</label><input type="range" id="flipMs" min="200" max="900" step="20" value="560"><output data-out="flipMs">560ms</output></div>
      <div class="srow"><label>落定过冲</label><input type="range" id="overPct" min="0" max="150" step="5" value="100"><output data-out="overPct">100%</output></div>
      <label class="opt"><input type="checkbox" id="tilt3d" checked><div><div class="tt">卡片 3D 倾斜跟随鼠标<span class="rec">推荐</span></div><div class="dd">未翻面时按 pointer 位置透视倾斜，线上 tactile.css 同款手感增强。</div></div></label>
      <label class="opt"><input type="checkbox" id="flipDust" checked><div><div class="tt">落定金尘飞入翻卡计数</div><div class="dd">线上 flip.land 复刻：每次落定 5 粒金尘 + 计数 bump。</div></div></label>
    </div>
  </details>

  <details class="dsec">
    <summary><span class="n">3</span>评分反馈<span class="cur" data-cur="rate"></span></summary>
    <div class="body">
      <label class="opt"><input type="radio" name="keyFeel" value="style" checked><div><div class="tt">键帽触感跟随主风格<span class="rec">推荐</span></div><div class="dd">基准=机械下沉，纸墨=盖章砸下，燃系=击发后坐，玻璃=涟漪，水墨=狼毫点按。</div></div></label>
      <label class="opt"><input type="radio" name="keyFeel" value="cap"><div><div class="tt">统一机械键帽下沉</div></div></label>
      <label class="opt"><input type="radio" name="react" value="style" checked><div><div class="tt">卡片反应动作（sink/wobble/lift/fling 四式）<span class="rec">推荐</span></div><div class="dd">忘记下沉、困难摇晃、记得上浮、轻松甩出——线上同款再按风格加料。</div></div></label>
      <label class="opt"><input type="radio" name="react" value="light"><div><div class="tt">只闪不动（仅内发光，卡片不位移）</div></div></label>
      <label class="opt"><input type="checkbox" id="rimFlash" checked><div><div class="tt">评分色描边闪光<span class="rec">推荐</span></div></div></label>
      <label class="opt"><input type="checkbox" id="magFly" checked><div><div class="tt">粒子磁吸入进度轨（贝塞尔弧光 + 落点 bump）<span class="rec">推荐</span></div></div></label>
      <label class="opt"><input type="checkbox" id="shakeOn" checked><div><div class="tt">评分震屏（强度随评分与连击浮动）<span class="rec">推荐</span></div></div></label>
      <div class="srow"><label>震屏强度</label><input type="range" id="shakePct" min="0" max="150" step="5" value="100"><output data-out="shakePct">100%</output></div>
      <div class="srow"><label>粒子浓度</label><input type="range" id="densPct" min="30" max="200" step="10" value="100"><output data-out="densPct">100%</output></div>
    </div>
  </details>

  <details class="dsec">
    <summary><span class="n">4</span>连击系统<span class="cur" data-cur="combo"></span></summary>
    <div class="body">
      <label class="opt"><input type="checkbox" id="comboNum" checked><div><div class="tt">连击数字飘字<span class="rec">推荐</span></div><div class="dd">≥2 连击出现，风格各异：金章=朱批签、燃系=火焰数、极光=细体光字、水墨=行草。</div></div></label>
      <label class="opt"><input type="checkbox" id="feverOn" checked><div><div class="tt">Fever 狂热阶段（5/10/20 光环与暴击跳字）<span class="rec">推荐</span></div></div></label>
      <label class="opt"><input type="checkbox" id="mileStamp" checked><div><div class="tt">里程碑爆发 + 「连击 ×N」印章</div></div></label>
      <div class="srow"><label>里程碑档位</label></div>
      <div class="chips">
        <label class="chip"><input type="checkbox" name="mile" value="4" checked><span>4</span></label>
        <label class="chip"><input type="checkbox" name="mile" value="8" checked><span>8</span></label>
        <label class="chip"><input type="checkbox" name="mile" value="12" checked><span>12</span></label>
        <label class="chip"><input type="checkbox" name="mile" value="20"><span>20</span></label>
        <label class="chip"><input type="checkbox" name="mile" value="30"><span>30</span></label>
      </div>
      <label class="opt"><input type="radio" name="breakMode" value="quiet" checked><div><div class="tt">断连静默归零<span class="rec">推荐</span></div><div class="dd">忘记/困难不闪红、不出警示，情绪只留正向。</div></div></label>
      <label class="opt"><input type="radio" name="breakMode" value="fade"><div><div class="tt">断连淡出提示（灰字「连击中断」）</div></div></label>
      <label class="opt"><input type="checkbox" id="surpriseOn" checked><div><div class="tt">里程碑彩蛋文案（起势/热起来/破墙…线上同款）</div></div></label>
      <label class="opt"><input type="checkbox" id="xpRoll" checked><div><div class="tt">XP 数字滚动跳动<span class="rec">推荐</span></div></div></label>
    </div>
  </details>

  <details class="dsec">
    <summary><span class="n">5</span>回合结算<span class="cur" data-cur="settle"></span></summary>
    <div class="body">
      <label class="opt"><input type="radio" name="settleTrig" value="both" checked><div><div class="tt">自动 + 手动按钮双触发<span class="rec">推荐</span></div><div class="dd">打完 8 张自动放，也可随时按 C/按钮预览。</div></div></label>
      <label class="opt"><input type="radio" name="settleTrig" value="auto"><div><div class="tt">仅打完自动</div></div></label>
      <label class="opt"><input type="radio" name="settleTrig" value="manual"><div><div class="tt">仅手动（日常安静，想庆祝再按）</div></div></label>
      <div class="srow"><label>演出强度</label><input type="range" id="celePct" min="40" max="160" step="10" value="100"><output data-out="celePct">100%</output></div>
      <label class="opt"><input type="checkbox" id="celeStat" checked><div><div class="tt">结算数据面板（张数/最高连击/XP 滚动计数）<span class="rec">推荐</span></div></div></label>
      <label class="opt"><input type="checkbox" id="celeShake" checked><div><div class="tt">结算全屏镜头震动</div></div></label>
    </div>
  </details>

  <details class="dsec">
    <summary><span class="n">6</span>音效（WebAudio 合成）<span class="cur" data-cur="snd"></span></summary>
    <div class="body">
      <label class="opt"><input type="radio" name="sndScope" value="all" checked><div><div class="tt">全事件：翻卡/评分/里程碑/结算<span class="rec">推荐先试听</span></div></div></label>
      <label class="opt"><input type="radio" name="sndScope" value="strong"><div><div class="tt">评分+结算响，翻卡安静</div></div></label>
      <label class="opt"><input type="radio" name="sndScope" value="mile"><div><div class="tt">仅里程碑/结算响（线上保守向）</div></div></label>
      <div class="srow"><label>音量</label><input type="range" id="volPct" min="0" max="100" step="5" value="60"><output data-out="volPct">60%</output></div>
      <label class="opt"><input type="checkbox" id="sndStyle" checked><div><div class="tt">音色跟随主风格<span class="rec">推荐</span></div><div class="dd">基准=金石编钟，纸墨=木鱼纸声，燃系=街机方波，玻璃=正弦风铃，水墨=古琴泛音。</div></div></label>
    </div>
  </details>

  <details class="dsec">
    <summary><span class="n">7</span>振动与全局<span class="cur" data-cur="glob"></span></summary>
    <div class="body">
      <label class="opt"><input type="radio" name="vibMode" value="grade" checked><div><div class="tt">振动随评分分级<span class="rec">推荐</span></div><div class="dd">忘记 10ms → 轻松 35ms 双脉冲；里程碑长脉冲。桌面端无效，供移动 PWA 参考。</div></div></label>
      <label class="opt"><input type="radio" name="vibMode" value="flat"><div><div class="tt">统一轻振 15ms</div></div></label>
      <div class="srow"><label>全局效果强度</label><input type="range" id="intPct" min="30" max="150" step="5" value="100"><output data-out="intPct">100%</output></div>
    </div>
  </details>

  <details class="dsec">
    <summary><span class="n">8</span>备注（想额外说什么 / 不喜欢的点）</summary>
    <div class="body"><textarea id="notes" placeholder="例：燃系结算再炸一点；纸墨的盖章角度换成-6deg；水墨的墨晕揭幕有点慢……"></textarea></div>
  </details>
</aside>
</div>

<div id="livebar">
  <div id="liveChips"></div>
  <button id="resetBtn" title="恢复默认决策">↺ 默认</button>
  <button id="copyBtn">📋 一键复制我的选择</button>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>
<div id="cele" role="dialog" aria-modal="true" aria-label="回合结算">
  <div class="veil"></div>
  <div class="panel" id="celePanel"></div>
</div>
<div id="toast"></div>


<style>
/* ============ 补丁样式：持久翻面态 / 倾斜 / 水墨揭幕 / 结算主题 ============ */
.card{transition:transform var(--flip-ms,560ms) var(--ease-spring),box-shadow .3s}
.card.flipped{transform:rotateX(180deg)}
.stage[data-style="glass"] .card.flipped{transform:rotateY(180deg)}

<script>
/* =====================================================================
   核心工具 + 粒子引擎（Canvas2D，全局单例，含形状：光点/纸屑/星芒/

"use strict";
const $ = (s, p) => (p || document).querySelector(s);

const fxCanvas = $("#fx");

function fxResize() {

const parts = [];
function spawn(o) {

    x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: .985, life: 0, max: 1, size: 3,
    c: [40, 96, 62], shape: "dot", rot: 0, vr: 0, flip: 0, vflip: 0,
    add: false, a: 1, sway: 0, phase: Math.random() * TAU, twinkle: false,

function stepParticle(p, f, dt) {

      g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
      const len = p.size * (2.2 + Math.abs(Math.cos(p.flip)));

      gr.addColorStop(0, hsla(p.c, 0)); gr.addColorStop(.5, hsla(p.c, a, 22)); gr.addColorStop(1, hsla(p.c, 0));
      g.fillStyle = gr; g.beginPath();

        g.stroke();

      const r = p.size * 3;
      const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      gr.addColorStop(0, hsla(p.c, a, 30)); gr.addColorStop(.4, hsla(p.c, a * .7)); gr.addColorStop(1, hsla(p.c, 0));

  }

}
let lastT = performance.now();
function fxLoop(t) {
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  fxc.clearRect(0, 0, VW * DPR, VH * DPR);
  fxc.save(); fxc.scale(DPR, DPR);

    stepParticle(p, f, dt);

/* ---- 高层发射器 ---- */
function burst(x, y, o) { // 通用径向爆发
  const { count = 14, colors = [[40, 96, 62]], speed = 3, spread = TAU, dir = -Math.PI / 2,
    g = .1, drag = .94, size = 2.4, life = .9, shape = "dot", add = false, twinkle = false, sway = 0 } = o || {};
  for (let i = 0; i < count; i++) {
    const an = dir + rf(-spread / 2, spread / 2);
    const sp = speed * rf(.4, 1.3);
    spawn({ x: x + rf(-3, 3), y: y + rf(-3, 3), vx: Math.cos(an) * sp, vy: Math.sin(an) * sp,
      g, drag, size: size * rf(.6, 1.5), c: pick(colors), shape, add, twinkle, sway,
      rot: rf(0, TAU), vr: rf(-.22, .22), flip: rf(0, TAU), vflip: shape === "flake" ? rf(.1, .3) : 0,
      max: life * rf(.7, 1.35), life: 0 });
  }
}
function ringWave(x, y, { color = [40, 96, 62], r0 = 12, r1 = 130, size = 4, life = .7, add = true } = {}) {
  spawn({ x, y, shape: "ring", c: color, r0, r1, size, max: life, add });
}
function pillar(x, y, { count = 10, color = [40, 96, 62], power = 1 } = {}) {
  for (let i = 0; i < count; i++) spawn({ x: x + rf(-7, 7), y, vy: rf(-7, -3.5) * power, drag: .93,
    shape: "glow", add: true, size: rf(1, 1.9), c: color, max: rf(.5, .85), delay: i * .02 });
}
function flyCollect(from, to, { count = 8, color = [40, 96, 62], glow = true, arrive = null, power = 1 } = {}) {
  const pts = [];
  for (let i = 0; i < count; i++) {
    const t = i / Math.max(1, count - 1);
    const bx = from.x + (to.x - from.x) * t + rf(-9, 9);
    const by = from.y - Math.sin(t * Math.PI) * 26 * power + rf(-6, 6);
    pts.push([bx, by]);

  for (let i = 0; i < count; i++) {
    const [bx, by] = pts[i];
    const first = i === 0;
    spawn({ x: bx, y: by, shape: glow ? "glow" : "dot", add: glow,
      size: rf(.9, 1.7), c: color, max: rf(.55, .8), delay: i * .028,
      home: () => to, homeAfter: .001, homeK: .04,
      vx: rf(-2, 2), vy: rf(-3, -.5), g: .06, drag: .9,

    x: rf(rect.x0, rect.x1), y: rf(rect.y0, rect.y1) - 40,
    vx: rf(-1.2, 1.2), vy: rf(1, 3.4), g, drag: .985, sway: rf(3, 6),

    x: rf(-VW * .15, VW * .8), y: rf(-90, VH * .3),
    vx: 8.4, vy: 10.2, drag: .996, shape: "comet", add: true,
    size: rf(1.5, 2.9), c: pick(colors), trail: 13, shed: .3,

const flashEl = $("#flash");

    { transform: `translate3d(${-a * .5}px,${a * .25}px,0)` },
    { transform: `translate3d(${a * .3}px,0,0)` },

/* =====================================================================

   ===================================================================== */
const DEC = {
  style: "paper", flipCurve: "style", flipMs: 560, overPct: 100, tilt3d: true, flipDust: true,
  keyFeel: "style", react: "style", rimFlash: true, magFly: true, shakeOn: true,
  shakePct: 100, densPct: 100,
  comboNum: true, feverOn: true, mileStamp: true, miles: [4, 8, 12], breakMode: "quiet",
  surpriseOn: true, xpRoll: true,
  settleTrig: "both", celePct: 100, celeStat: true, celeShake: true,
  sndScope: "all", vol: .6, sndStyle: true, soundOn: true,
  vibMode: "grade", vibOn: true,

const STYLE_OF = () => DEC.style;

const SFX = {
  ctx: null, master: null, nbuf: null,

    const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("✓ 已复制(兼容模式) · 粘贴发回对话即可"); }
    catch (e2) { window.prompt("复制失败，请手动全选复制：", text); }
    ta.remove();
  }
};

/* ---- 初始化 ---- */
["base", "paper", "burn", "glass", "ink"].forEach((id) => stages.push(Stage(id)));
if (RED.on) { aria(redBtn, true); document.body.classList.add("reduced"); }
collect(); refreshArmed();
setTimeout(() => toast("悬停任一舞台 → Space 翻卡 → 1/2/3/4 评分 · 右侧看板选你的口味 · 底部一键复制"), 500);
</script>
</body>
