<title>排版试衣间</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&family=Nunito:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
:root{
  --bg:hsl(38 46% 95%);--surface:hsl(43 100% 99%);--ink:hsl(24 26% 14%);--muted:hsl(26 14% 42%);--line:hsl(32 32% 86%);
  --primary:hsl(28 80% 51%);--primary-soft:hsl(33 90% 92%);--primary-ink:hsl(24 78% 34%);
  --paper:hsl(40 60% 96%);--card:hsl(43 100% 99%);--p-ink:hsl(24 30% 16%);--p-soft:hsl(24 16% 30%);--pline:hsl(32 30% 82%);
  --rule:hsl(28 70% 55% / .22);
  --sys:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  --serif:"Source Serif 4","Noto Serif SC","Songti SC",serif;
  --round:"Nunito","Noto Sans SC",sans-serif;
  --kai:"LXGW WenKai","KaiTi","STKaiti",serif;
  --f-root:var(--sys);--f-branch:var(--sys);--f-leaf:var(--sys);
  --w-root:650;--w-branch:500;--w-leaf:400;--track:0em;
  --s-root:16px;--s-branch:14.5px;--s-leaf:13.5px;--lh:1.55;
}
[data-font=sys]{--f-root:var(--sys);--f-branch:var(--sys);--f-leaf:var(--sys);--w-root:650;--w-branch:500;--w-leaf:400;--track:0em}
[data-font=scroll]{--f-root:var(--serif);--f-branch:var(--serif);--f-leaf:"Noto Sans SC",var(--sys);--w-root:700;--w-branch:600;--w-leaf:400;--track:.01em}
[data-font=round]{--f-root:var(--round);--f-branch:var(--round);--f-leaf:var(--round);--w-root:800;--w-branch:700;--w-leaf:500;--track:.005em}
[data-font=hand]{--f-root:var(--kai);--f-branch:var(--kai);--f-leaf:var(--kai);--w-root:700;--w-branch:700;--w-leaf:400;--track:.02em}
[data-font=mix]{--f-root:"Noto Serif SC",serif;--f-branch:"Noto Serif SC",serif;--f-leaf:var(--kai);--w-root:700;--w-branch:600;--w-leaf:400;--track:.015em}
[data-size=old]{--s-root:14px;--s-branch:13px;--s-leaf:12.5px}
[data-size=std]{--s-root:16px;--s-branch:14.5px;--s-leaf:13.5px}
[data-size=lg]{--s-root:17px;--s-branch:15.5px;--s-leaf:14.5px}
[data-lh=tight]{--lh:1.36}[data-lh=mid]{--lh:1.55}[data-lh=airy]{--lh:1.72}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sys)}
header{padding:28px 32px 8px;max-width:1320px;margin:auto}
h1{font:900 26px/1.2 "Noto Serif SC",serif;margin:0 0 6px;letter-spacing:.02em}
header p{margin:0;color:var(--muted);max-width:74ch}
main{max-width:1320px;margin:auto;padding:12px 32px 48px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr;padding:12px 14px 40px}header{padding:20px 14px 4px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 1px 0 hsl(30 30% 82%/.7),0 18px 40px -26px hsl(24 40% 20%/.35)}
aside.panel{position:sticky;top:12px;display:grid;gap:14px}
.grp h3{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--primary)}
.chip[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 3px 0 hsl(24 70% 38%);translate:0 -1px}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.readout{border-radius:12px;padding:10px 12px;font-size:12.5px;background:hsl(104 44% 50%/.12);color:hsl(104 50% 26%);border:1px solid hsl(104 44% 50%/.3)}
.readout.bad{background:hsl(8 76% 62%/.12);color:hsl(8 60% 38%);border-color:hsl(8 76% 62%/.35)}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.summary{font:12px/1.6 ui-monospace,Consolas,monospace;background:var(--paper);border:1px dashed var(--pline);border-radius:10px;padding:8px 10px;white-space:pre-wrap}
.btn{border:0;background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 12px;font:inherit;font-size:12.5px;cursor:pointer}
/* —— 画布：暖纸 + 点阵 —— */
.stage{position:relative;overflow:auto;border-radius:18px;border:1px solid var(--pline);
  background:radial-gradient(hsl(30 30% 70%/.28) 1px,transparent 1.2px) 0 0/22px 22px,radial-gradient(120% 90% at 20% 0%,hsl(40 100% 98%),var(--paper));
  box-shadow:inset 0 1px 0 #fff,0 18px 40px -28px hsl(24 40% 20%/.4);padding:36px 40px;min-height:520px}
.map{position:relative;display:flex;align-items:center;gap:56px;width:max-content}
.col{display:flex;flex-direction:column;gap:26px}
.bgrp{display:flex;align-items:center;gap:40px}
.leaves{display:flex;flex-direction:column;gap:14px}
svg.links{position:absolute;inset:0;overflow:visible;pointer-events:none}
svg.links path{fill:none;stroke-width:1.6;stroke-linecap:round;opacity:.9}
/* —— 卡片：尺寸在所有模式下完全一致 —— */
.card{position:relative;border-radius:14px;border:1px solid var(--pline);background:var(--card);color:var(--p-ink);
  box-shadow:0 1px 0 hsl(43 100% 100%/.9) inset,0 1px 2px hsl(24 40% 22%/.07),0 6px 16px -8px hsl(24 50% 26%/.16);
  transition:box-shadow .25s cubic-bezier(.16,1,.3,1),background-color .2s,border-color .2s}
.card.root{padding:12px 18px;max-width:15em;text-align:center;font:var(--w-root) var(--s-root)/var(--lh) var(--f-root);
  background:radial-gradient(120% 140% at 0% 0%,hsl(38 100% 90%/.9),transparent 60%),linear-gradient(160deg,hsl(40 100% 97%),hsl(34 78% 92%));
  border-color:hsl(32 40% 74%);box-shadow:0 1px 0 #fff inset,0 2px 4px hsl(24 50% 22%/.08),0 14px 30px -12px hsl(28 70% 36%/.32)}
.card.branch{padding:9px 14px 9px 16px;max-width:13em;font:var(--w-branch) var(--s-branch)/var(--lh) var(--f-branch)}
.card.branch::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--bc)}
.card.leaf{padding:8px 12px;width:fit-content;min-width:5em;max-width:17.5em;font:var(--w-leaf) var(--s-leaf)/var(--lh) var(--f-leaf);color:var(--p-soft)}
.txt{position:relative;display:block;letter-spacing:var(--track);text-wrap:pretty;overflow-wrap:break-word;word-break:normal;
  line-break:strict;hanging-punctuation:allow-end;text-autospace:normal;font-kerning:normal;font-variant-numeric:proportional-nums}
.card.root .txt{text-wrap:balance}
/* —— 重点高亮：4 种笔触，全部不占额外宽度 —— */
mark{color:inherit;background:none;border-radius:0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
[data-hl=block] mark{background:#fef08c;border-radius:2px;padding:0 .1em}
[data-hl=block] .card mark{padding:0;box-shadow:.1em 0 0 #fef08c,-.1em 0 0 #fef08c}
[data-hl=marker] mark{background:linear-gradient(104deg,hsl(50 100% 70%/0) .4%,hsl(50 100% 68%/.85) 2.2%,hsl(48 100% 70%/.55) 60%,hsl(46 100% 68%/.8) 96%,hsl(46 100% 70%/0) 99%) 0 62%/100% 58% no-repeat}
[data-hl=under] mark{background:linear-gradient(transparent 58%,hsl(46 100% 64%/.75) 58%,hsl(42 100% 62%/.65) 92%,transparent 92%)}
[data-hl=ink] mark{color:hsl(22 78% 36%);font-weight:inherit;text-decoration:underline 1.5px hsl(28 90% 55%/.55);text-underline-offset:.22em;text-decoration-skip-ink:auto}
.card.branch mark,.card.root mark{font-weight:inherit}
/* —— 英语模式：虚线下划线 + 内阴影悬停，零宽度变化 —— */
.w{border-radius:3px;transition:background-color .15s,box-shadow .15s,text-decoration-color .2s}
[data-mode=english] .w{cursor:pointer;text-decoration:underline dotted 1.5px hsl(28 60% 50%/.55);text-underline-offset:.24em;animation:ul-in .35s ease both}
[data-mode=english] .w:hover{background:hsl(33 90% 88%/.8);box-shadow:0 0 0 2px hsl(33 90% 88%/.8);text-decoration-color:var(--primary)}
[data-mode=english] .w.on{background:hsl(28 80% 51%/.18);box-shadow:0 0 0 2px hsl(28 80% 51%/.18);text-decoration-style:solid;text-decoration-color:var(--primary)}
@keyframes ul-in{from{text-decoration-color:transparent}}
[data-legacy=true][data-mode=english] .w{padding:0 2px}
/* —— 文字模式：信纸横格对齐行高 + 可选中 —— */
.card .txt::before{content:"";position:absolute;inset:0 -4px;pointer-events:none;opacity:0;transition:opacity .3s;
  background:repeating-linear-gradient(to bottom,transparent 0 calc(1lh - 1px),var(--rule) calc(1lh - 1px) 1lh)}
[data-mode=text] .card .txt::before{opacity:1}
[data-mode=text] .card{cursor:text;user-select:text}
[data-mode=text] .card .txt::selection,[data-mode=text] .card .txt *::selection{background:hsl(28 90% 60%/.3)}
[data-mode=text] .card.leaf{background-color:hsl(45 100% 98.5%)}
/* —— 翻卡待回忆：文字照常排版但隐藏，封面盖在同一尺寸上 —— */
.cover{position:absolute;inset:-1px;border-radius:inherit;display:grid;place-items:center;pointer-events:none;
  background:repeating-linear-gradient(135deg,hsl(32 90% 60%/.1) 0 6px,transparent 6px 12px),radial-gradient(120% 140% at 0% 0%,hsl(40 100% 94%),transparent 60%),linear-gradient(160deg,hsl(38 92% 90%),hsl(30 80% 82%));
  border:1px solid hsl(30 70% 62%/.7);color:hsl(26 60% 38%/.7);font:600 12px/1 var(--sys);letter-spacing:.2em;
  opacity:0;transform:perspective(600px) rotateX(-90deg);transform-origin:50% 50%;transition:transform .45s cubic-bezier(.34,1.4,.64,1),opacity .2s}
.cover::after{content:"";position:absolute;inset:3px;border:1px dashed hsl(28 70% 48%/.38);border-radius:11px}
[data-mode=conceal] .map .card.leaf .cover{opacity:1;transform:none}
[data-mode=conceal] .map .card.leaf .txt{visibility:hidden}
[data-mode=conceal] .map .card.leaf.peek .cover{opacity:0;transform:perspective(600px) rotateX(90deg)}
[data-mode=conceal] .map .card.leaf.peek .txt{visibility:visible}
[data-mode=conceal] .map .card.leaf{cursor:pointer}
/* —— 就地编辑：同一张纸亮起来，边框改用内阴影，不改尺寸 —— */
[data-mode=edit] .card.editing{background:hsl(40 100% 97%);border-color:var(--primary);
  box-shadow:0 0 0 1px var(--primary),0 0 0 5px hsl(28 80% 51%/.16),0 14px 30px -12px hsl(28 70% 40%/.45)}
[data-mode=edit] .card.editing .txt{outline:none;caret-color:var(--primary);cursor:text}
[data-mode=edit] .card.editing .txt::selection,[data-mode=edit] .card.editing .txt *::selection{background:hsl(28 90% 60%/.3)}
[data-legacy=true][data-mode=edit] .card.editing{border-width:2.5px;padding:10px 14px}
.etool{position:absolute;left:50%;bottom:calc(100% + 8px);translate:-50% 0;display:none;gap:4px;white-space:nowrap;
  background:var(--card);border:1px solid hsl(28 80% 51%/.3);border-radius:999px;padding:4px;box-shadow:0 10px 24px -12px hsl(24 50% 26%/.4);
  font:500 11.5px/1 var(--sys);animation:pop .26s cubic-bezier(.34,1.56,.64,1) both}
[data-mode=edit] .card.editing .etool{display:flex}
.etool span{padding:6px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary-ink)}
.etool span.k{background:none;color:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.92)}}
/* —— 调试：显示真实尺寸框 —— */
[data-boxes=true] .card{outline:1px dashed hsl(200 80% 50%/.7);outline-offset:0}
[data-boxes=true] .txt{background:hsl(200 80% 60%/.08)}
.pop{position:fixed;z-index:50;width:250px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  box-shadow:0 18px 40px -18px hsl(24 40% 20%/.45);font-size:12.5px;animation:pop .22s cubic-bezier(.34,1.56,.64,1) both}
.pop b{font:700 16px/1.2 "Source Serif 4",serif}
.pop .ph{color:var(--muted);margin-left:6px;font-family:ui-monospace,Consolas,monospace}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.cmp .panel{padding:12px;cursor:pointer;display:grid;gap:10px;background:var(--paper);transition:border-color .15s,translate .15s}
.cmp .panel:hover{translate:0 -2px}
.cmp .panel.sel{border-color:var(--primary);box-shadow:0 0 0 3px hsl(28 80% 51%/.2)}
.cmp h4{margin:0;font-size:12px;color:var(--muted);font-weight:600}
.cmp .card.leaf{max-width:none;width:auto}
section h2{font:700 15px/1.3 var(--sys);margin:22px 0 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header>
  <h1>排版试衣间</h1>
  <p>同一张脑图，挑字体、字号、行高和重点笔触。切换「翻卡 / 英语 / 文字 / 编辑」模式时，右上角会实时量每张卡片的尺寸，目标是 0 张位移。勾「模拟旧版抖动」能看到现在产品里的跳动。快捷键 1–5 切模式。</p>
</header>
<main>
  <aside class="panel" id="controls"></aside>
  <div>
    <div class="stage" id="stage"><div class="map" id="map"></div></div>
    <section><h2>五套字体并排（点一下选中）</h2><div class="cmp" id="cmp"></div></section>
  </div>
</main>
<script>
const S={font:'scroll',size:'std',lh:'mid',hl:'marker',mode:'review',legacy:false,boxes:false};
const FONTS={sys:['现状 · 系统黑体','雅黑 / 苹方，零体积；两台 Windows 和 iPhone 字形不同'],
  scroll:['书卷 · 宋标题 + 黑正文','标题用思源宋体，正文用思源黑体；像教材，层级最清楚'],
  round:['圆润 · Nunito + 黑体','英文圆体、中文黑体加粗；接近 Duolingo，轻快'],
  hand:['手抄 · 霞鹜文楷','整张卡都是楷体；像手抄的记忆卡，最有温度，也最慢读'],
  mix:['书卷手抄 · 宋标题 + 楷正文','标题用思源宋体，知识点用文楷；庄重又有手写温度']};
const BC=['hsl(28 80% 52%)','hsl(150 40% 42%)','hsl(210 55% 52%)'];
const DATA={root:'细胞呼吸 Cellular Respiration',branches:[
  {t:'有氧呼吸 aerobic',leaves:['糖酵解在[[细胞质基质]]进行，1 分子葡萄糖 → 2 分子丙酮酸，净生成 2 ATP',
    '三羧酸循环（Krebs cycle）发生在[[线粒体基质]]，产生 CO₂ 和 NADH',
    '电子传递链位于[[线粒体内膜]]：O₂ 是最终电子受体，合成大量 ATP（约 34 个）']},
  {t:'无氧呼吸 anaerobic',leaves:['乳酸发酵：丙酮酸 → [[乳酸]]，肌肉剧烈运动时出现',
    '酒精发酵：酵母菌把丙酮酸转成[[乙醇和 CO₂]]']},
  {t:'英语词汇 Vocabulary',leaves:['mitochondria is the [[powerhouse]] of the cell',
    'oxidative phosphorylation couples [[electron transport]] to ATP synthesis']}]};
const $=(q,r=document)=>r.querySelector(q),$$=(q,r=document)=>[...r.querySelectorAll(q)];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function rich(src){
  if(S.legacy&&S.mode==='english')src=src.replace(/\[\[|\]\]/g,'');
  return src.split(/(\[\[.*?\]\])/).map(part=>{
    const m=part.startsWith('[[');const t=m?part.slice(2,-2):part;
    const body=t.split(/([A-Za-z][A-Za-z'-]*)/).map((x,i)=>i%2?`<span class="w">${esc(x)}</span>`:esc(x)).join('');
    return m?`<mark>${body}</mark>`:body;}).join('');
}
function card(role,text,id,bc){
  const editing=S.mode==='edit'&&id==='l0-1';
  return `<div class="card ${role}${editing?' editing':''}" data-id="${id}" style="--bc:${bc||'transparent'}">`+
    (editing?`<div class="etool"><span>🖍 黄色底色</span><span>✂ 拖出</span><span class="k">Enter 完成 · Esc 取消</span></div>`:'')+
    `<span class="txt"${editing?' contenteditable="true" spellcheck="false"':''}>${rich(text)}</span>`+
    (role==='leaf'?`<span class="cover">待 回 忆</span>`:'')+`</div>`;
}
function render(){
  let h=`<svg class="links" id="links"></svg><div>${card('root',DATA.root,'r')}</div><div class="col">`;
  DATA.branches.forEach((b,i)=>{
    h+=`<div class="bgrp"><div>${card('branch',b.t,'b'+i,BC[i])}</div><div class="leaves">`;
    b.leaves.forEach((l,j)=>h+=card('leaf',l,`l${i}-${j}`,BC[i]));
    h+=`</div></div>`;});
  $('#map').innerHTML=h+'</div>';
  requestAnimationFrame(links);
}
function links(){
  const map=$('#map'),o=map.getBoundingClientRect(),svg=$('#links');if(!svg)return;
  const R=el=>{const r=el.getBoundingClientRect();return{x:r.left-o.left,y:r.top-o.top,w:r.width,h:r.height}};
  const root=R($('[data-id=r]'));let p='';
  DATA.branches.forEach((b,i)=>{
    const br=R($(`[data-id=b${i}]`));p+=seg(root,br,BC[i]);
    b.leaves.forEach((_,j)=>p+=seg(br,R($(`[data-id="l${i}-${j}"]`)),BC[i]));});
  svg.setAttribute('width',map.scrollWidth);svg.setAttribute('height',map.scrollHeight);svg.innerHTML=p;
}
function seg(a,b,c){const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,dx=(x2-x1)*.5;
  return `<path stroke="${c}" d="M${x1} ${y1}C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}"/>`}
function sizes(){const m={};$$('#map .card').forEach(c=>m[c.dataset.id]=[c.offsetWidth,c.offsetHeight]);return m}
function update(){
  const b=document.body.dataset;
  Object.assign(b,{font:S.font,size:S.size,lh:S.lh,hl:S.hl,legacy:S.legacy,boxes:S.boxes});
  const mode=S.mode;S.mode='review';b.mode='review';render();const base=sizes();
  S.mode=mode;b.mode=mode;render();const now=sizes();
  let moved=0,maxd=0;
  for(const id in base){const d=Math.max(Math.abs(base[id][0]-now[id][0]),Math.abs(base[id][1]-now[id][1]));if(d>0.5){moved++;maxd=Math.max(maxd,d)}}
  const r=$('#readout');
  r.className='readout'+(moved?' bad':'');
  r.textContent=mode==='review'?`基准：${Object.keys(base).length} 张卡片已测量，切到其他模式看位移`
    :moved?`「${modeName(mode)}」有 ${moved} 张卡片变了尺寸，最大 ${maxd.toFixed(1)}px，整张图会跟着重排`
    :`「${modeName(mode)}」0 张卡片位移，排版纹丝不动`;
  $$('#controls .chip').forEach(c=>c.setAttribute('aria-pressed',S[c.dataset.k]===c.dataset.v));
  $$('#cmp .panel').forEach(p=>p.classList.toggle('sel',p.dataset.font===S.font));
  $('#sum').textContent=summary();
  closePop();
}
const MODES={review:'复习',conceal:'翻卡待回忆',english:'英语',text:'文字',edit:'编辑'};
const modeName=m=>MODES[m];
let pop=null;
function closePop(){pop?.remove();pop=null;$$('.w.on').forEach(w=>w.classList.remove('on'))}
function openPop(w){
  closePop();w.classList.add('on');
  const r=w.getBoundingClientRect();pop=document.createElement('div');pop.className='pop';
  pop.innerHTML=`<b>${esc(w.textContent)}</b><span class="ph">/ demo /</span><div class="note" style="margin-top:6px">查词面板位置演示：弹层浮在卡片外，单词只加底色和实线下划线，不改变任何排版。</div>`;
  document.body.append(pop);
  const x=Math.min(innerWidth-262,Math.max(12,r.left+r.width/2-125));
  const y=r.bottom+10+110>innerHeight?r.top-pop.offsetHeight-10:r.bottom+10;
  Object.assign(pop.style,{left:x+'px',top:y+'px'});
}
const CTRL=[
  ['font','字体',Object.fromEntries(Object.entries(FONTS).map(([k,v])=>[k,v[0].split(' · ')[0]]))],
  ['size','字号（根/分支/叶）',{old:'现状 14/13/12.5',std:'标准 16/14.5/13.5',lg:'大 17/15.5/14.5'}],
  ['lh','行高',{tight:'紧 1.36',mid:'适中 1.55',airy:'松 1.72'}],
  ['hl','重点笔触',{block:'现状色块',marker:'荧光笔',under:'半高底线',ink:'琥珀墨字'}],
  ['mode','模式（1–5）',MODES]];
function controls(){
  $('#controls').innerHTML=CTRL.map(([k,label,opts])=>`<div class="grp"><h3>${label}</h3><div class="chips">`+
    Object.entries(opts).map(([v,t])=>`<button class="chip" data-k="${k}" data-v="${v}">${t}</button>`).join('')+`</div></div>`).join('')+
    `<div class="note" id="fontnote"></div>
    <div class="readout" id="readout"></div>
    <label class="toggle"><input type="checkbox" id="legacy"> 模拟旧版抖动（英语加内边距、编辑加粗边框、英语丢高亮）</label>
    <label class="toggle"><input type="checkbox" id="boxes"> 显示真实尺寸框</label>
    <label class="toggle"><input type="checkbox" id="cycle"> 自动轮播模式（看有没有跳动）</label>
    <div class="grp"><h3>我的选择</h3><div class="summary" id="sum"></div></div>
    <button class="btn" id="copy">复制我的选择</button>`;
}
function summary(){
  return `字体：${FONTS[S.font][0]}\n字号：${CTRL[1][2][S.size]}\n行高：${CTRL[2][2][S.lh]}\n重点：${CTRL[3][2][S.hl]}`;
}
function compare(){
  $('#cmp').innerHTML=Object.entries(FONTS).map(([k,[name]])=>`<div class="panel" data-font="${k}">
    <h4>${name}</h4>
    <div class="card root"><span class="txt">${rich(DATA.root)}</span></div>
    <div class="card leaf"><span class="txt">${rich(DATA.branches[0].leaves[2])}</span></div>
    <div class="card leaf"><span class="txt">${rich(DATA.branches[2].leaves[0])}</span></div></div>`).join('');
}
function fontNote(){$('#fontnote').textContent=FONTS[S.font][1]}
let cycleTimer=0;
document.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){S[chip.dataset.k]=chip.dataset.v;update();fontNote();return}
  const panel=e.target.closest('#cmp .panel');
  if(panel){S.font=panel.dataset.font;update();fontNote();return}
  const w=e.target.closest('#map .w');
  if(w&&S.mode==='english'){e.stopPropagation();w.classList.contains('on')?closePop():openPop(w);return}
  const leaf=e.target.closest('#map .card.leaf');
  if(leaf&&S.mode==='conceal'){leaf.classList.toggle('peek');return}
  if(e.target.id==='copy'){navigator.clipboard?.writeText(summary());e.target.textContent='已复制';setTimeout(()=>e.target.textContent='复制我的选择',1200);return}
  if(!e.target.closest('.pop'))closePop();
});
document.addEventListener('change',e=>{
  if(e.target.id==='legacy'){S.legacy=e.target.checked;update()}
  if(e.target.id==='boxes'){S.boxes=e.target.checked;update()}
  if(e.target.id==='cycle'){
    clearInterval(cycleTimer);
    if(e.target.checked){const order=Object.keys(MODES);cycleTimer=setInterval(()=>{S.mode=order[(order.indexOf(S.mode)+1)%order.length];update()},1400)}
  }
});
document.addEventListener('keydown',e=>{
  if(e.target.isContentEditable)return;
  const i=Number(e.key)-1,order=Object.keys(MODES);
  if(i>=0&&i<order.length){S.mode=order[i];update()}
  if(e.key==='Escape')closePop();
});
controls();compare();fontNote();update();
document.fonts?.ready.then(()=>{update();compare()});
addEventListener('resize',()=>requestAnimationFrame(links));
</script>
