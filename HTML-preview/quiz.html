<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>记忆测验 · 果冻答题</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d1017;
    font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    color: #eef3ff;
  }

  /* ========== 背景（与导图页同源） ========== */
  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 60% 50% at 25% 15%, rgba(64,82,130,0.35), transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 85%, rgba(90,60,140,0.28), transparent 70%),
      linear-gradient(180deg, #141a26 0%, #0d1017 100%);
  }

  #stage::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(120,140,200,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,140,200,0.045) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 45%, #000 30%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 45%, #000 30%, transparent 90%);
  }

  /* ========== 顶部进度 ========== */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 22px 26px 0;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 100;
  }

  #hudTitle {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.6px;
    color: #a6b3d9;
    white-space: nowrap;
  }

  #barWrap {
    flex: 1;
    height: 6px;
    border-radius: 4px;
    background: rgba(90,105,150,0.28);
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(140,160,220,0.12) inset;
  }
  #bar {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, #6d84d8, #9db4ff);
    box-shadow: 0 0 12px rgba(150,180,255,0.6);
    transition: width 0.5s cubic-bezier(0.34,1.2,0.5,1);
  }

  #hudStat {
    font-size: 13px;
    font-weight: 700;
    color: #cfd9f5;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #hudStat b { color: #7fe0a0; }
  #hudStat i { color: #ff8a8a; font-style: normal; }

  /* ========== 题目卡片 ========== */
  #cardStage {
    position: relative;
    width: min(680px, 92vw);
    z-index: 10;
    perspective: 1400px;
  }

  .qcard {
    position: relative;
    width: 100%;
    border-radius: 26px;
    padding: 34px 34px 30px;
    background: linear-gradient(180deg, #2c3346 0%, #232936 100%);
    border: 1px solid rgba(150,170,230,0.2);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.07) inset,
      0 30px 60px -24px rgba(0,0,0,0.9),
      0 0 40px rgba(120,150,255,0.1);
    will-change: transform, opacity;
    transform-origin: 50% 50%;
  }

  /* 题卡进场：从远处弹入，带轻微过冲 */
  .qcard.enter {
    animation: cardEnter 520ms cubic-bezier(0.22,1.4,0.42,1) both;
  }
  @keyframes cardEnter {
    0%   { opacity: 0; transform: translateY(26px) scale(0.92); }
    60%  { opacity: 1; transform: translateY(-4px) scale(1.015); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 答对整体回弹，答错横向摇头 */
  .qcard.correct {
    animation: cardCorrect 560ms cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes cardCorrect {
    0%   { transform: translateY(0) scale(1); }
    26%  { transform: translateY(-8px) scale(1.028); }
    54%  { transform: translateY(2px) scale(0.994); }
    100% { transform: translateY(0) scale(1); }
  }
  .qcard.wrong {
    animation: cardWrong 520ms cubic-bezier(0.36,0.07,0.19,0.97) both;
  }
  @keyframes cardWrong {
    0%   { transform: translateX(0) rotate(0deg); }
    14%  { transform: translateX(-11px) rotate(-1.1deg); }
    32%  { transform: translateX(9px) rotate(0.9deg); }
    50%  { transform: translateX(-6px) rotate(-0.6deg); }
    70%  { transform: translateX(4px) rotate(0.4deg); }
    100% { transform: translateX(0) rotate(0deg); }
  }

  /* 卡片飞出（进入下一题） */
  .qcard.leave {
    animation: cardLeave 300ms cubic-bezier(0.55,0.06,0.68,0.19) both;
    pointer-events: none;
  }
  @keyframes cardLeave {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-34px) scale(0.94); }
  }

  /* 题卡边框随判定染色 */
  .qcard.correct { border-color: rgba(127,224,160,0.6); }
  .qcard.wrong   { border-color: rgba(255,138,138,0.6); }

  .qmeta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .qtag {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: #8fa2cc;
    background: rgba(120,145,215,0.14);
    border: 1px solid rgba(143,162,204,0.22);
    padding: 5px 12px;
    border-radius: 30px;
  }
  .qidx {
    font-size: 12.5px;
    font-weight: 600;
    color: #7c88ab;
    font-variant-numeric: tabular-nums;
  }

  .qtext {
    font-size: clamp(19px, 3.4vw, 25px);
    font-weight: 700;
    line-height: 1.45;
    letter-spacing: 0.2px;
    color: #ffffff;
    margin-bottom: 26px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }

  /* ========== 选项 ========== */
  #options {
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .opt {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 15px 18px;
    border-radius: 16px;
    background: linear-gradient(180deg, #333b52 0%, #2b3145 100%);
    border: 1px solid rgba(150,170,230,0.16);
    color: #dbe4fb;
    font-size: 15.5px;
    font-weight: 600;
    line-height: 1.35;
    text-align: left;
    font-family: inherit;
    cursor: pointer;
    opacity: 0;
    transform: translateY(14px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 10px 20px -12px rgba(0,0,0,0.8);
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1),
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.24s ease,
                opacity 0.3s ease;
    will-change: transform;
  }
  /* 逐条错峰入场 */
  .opt.shown {
    opacity: 1;
    transform: translateY(0);
  }

  .opt .key {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    font-size: 12.5px;
    font-weight: 800;
    color: #b8c7e0;
    background: rgba(140,165,230,0.16);
    border: 1px solid rgba(160,185,255,0.24);
    transition: all 0.2s ease;
  }
  .opt .label { flex: 1; }

  .opt:not(:disabled):hover {
    transform: translateY(-2px) scale(1.012);
    background: linear-gradient(180deg, #3d4765 0%, #333b52 100%);
    border-color: rgba(160,185,255,0.45);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.1) inset,
      0 18px 30px -14px rgba(0,0,0,0.9),
      0 0 26px rgba(120,155,255,0.34);
  }
  .opt:not(:disabled):active {
    transform: scale(0.975);
    transition-duration: 0.08s;
  }

  .opt:disabled { cursor: default; }

  /* 选定瞬间的按下感 */
  .opt.pressing {
    transform: scale(0.972);
    transition-duration: 0.08s;
  }

  /* ---- 判定：正确 ---- */
  .opt.correct {
    background: linear-gradient(180deg, #2f6b4c 0%, #275a41 100%);
    border-color: rgba(127,224,160,0.7);
    color: #ffffff;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.14) inset,
      0 0 28px rgba(127,224,160,0.45),
      0 12px 26px -12px rgba(0,0,0,0.8);
    animation: optPop 520ms cubic-bezier(0.34,1.56,0.64,1);
  }
  .opt.correct .key {
    background: rgba(127,224,160,0.32);
    border-color: rgba(127,224,160,0.8);
    color: #eafff2;
  }
  @keyframes optPop {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.045); }
    60%  { transform: scale(0.988); }
    100% { transform: scale(1); }
  }

  /* ---- 判定：错误 ---- */
  .opt.wrong {
    background: linear-gradient(180deg, #6e3540 0%, #5a2b35 100%);
    border-color: rgba(255,138,138,0.7);
    color: #ffffff;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.1) inset,
      0 0 26px rgba(255,120,120,0.4),
      0 12px 26px -12px rgba(0,0,0,0.8);
    animation: optShake 420ms cubic-bezier(0.36,0.07,0.19,0.97);
  }
  .opt.wrong .key {
    background: rgba(255,138,138,0.3);
    border-color: rgba(255,138,138,0.8);
    color: #fff0f0;
  }
  @keyframes optShake {
    0%   { transform: translateX(0); }
    18%  { transform: translateX(-7px); }
    42%  { transform: translateX(6px); }
    66%  { transform: translateX(-3px); }
    100% { transform: translateX(0); }
  }

  /* ---- 未选中但需揭示的正确项 ---- */
  .opt.reveal {
    border-color: rgba(127,224,160,0.5);
    background: linear-gradient(180deg, #2c4a3c 0%, #263c33 100%);
    box-shadow:
      0 0 20px rgba(127,224,160,0.25),
      0 10px 22px -14px rgba(0,0,0,0.8);
    animation: revealGlow 900ms ease-out;
  }
  @keyframes revealGlow {
    0%   { box-shadow: 0 0 0 rgba(127,224,160,0); }
    35%  { box-shadow: 0 0 30px rgba(127,224,160,0.7); }
    100% { box-shadow: 0 0 20px rgba(127,224,160,0.25); }
  }

  /* ---- 判定后压暗未选中项 ---- */
  .opt.dimmed {
    opacity: 0.34;
    filter: saturate(0.5);
  }

  /* ========== 解析条 ========== */
  #explain {
    margin-top: 18px;
    padding: 15px 17px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    color: #c3cee8;
    background: rgba(120,145,215,0.1);
    border: 1px solid rgba(143,162,204,0.2);
    border-left: 3px solid #8fa2cc;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    padding-top: 0; padding-bottom: 0;
    transition: max-height 0.36s cubic-bezier(0.34,1.2,0.5,1),
                opacity 0.28s ease,
                padding 0.36s ease,
                margin 0.36s ease;
  }
  #explain.show {
    max-height: 260px;
    opacity: 1;
    padding-top: 15px;
    padding-bottom: 15px;
  }
  #explain.ok  { border-left-color: #7fe0a0; }
  #explain.bad { border-left-color: #ff8a8a; }
  #explain b { color: #ffffff; }

  /* ========== 底部按钮 ========== */
  #actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 22px;
    min-height: 44px;
  }

  .btn {
    border: none;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.4px;
    padding: 11px 30px;
    border-radius: 40px;
    cursor: pointer;
    background: linear-gradient(180deg, #5b6f9e 0%, #4a5578 100%);
    color: #ffffff;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.16) inset,
      0 12px 24px -12px rgba(0,0,0,0.85),
      0 0 0 1px rgba(160,180,255,0.22);
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1),
                box-shadow 0.22s ease,
                filter 0.2s ease;
  }
  .btn:hover {
    transform: translateY(-2px) scale(1.035);
    filter: brightness(1.1);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.2) inset,
      0 18px 30px -14px rgba(0,0,0,0.9),
      0 0 30px rgba(120,155,255,0.5);
  }
  .btn:active {
    transform: scale(0.95);
    transition-duration: 0.08s;
  }
  .btn.ghost {
    background: transparent;
    color: #a6b3d9;
    box-shadow: 0 0 0 1px rgba(143,162,204,0.3);
  }
  .btn.ghost:hover { background: rgba(255,255,255,0.06); color: #ffffff; }
  .btn.hidden { display: none; }

  /* ========== 结算页 ========== */
  #result {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 500;
    background: rgba(13,16,23,0.9);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #result.show { display: flex; animation: fadeIn 0.4s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #scoreRing {
    width: 190px; height: 190px;
    position: relative;
    margin-bottom: 6px;
  }
  #scoreRing svg { transform: rotate(-90deg); }
  #ringBg { stroke: rgba(90,105,150,0.28); }
  #ringFg {
    stroke: url(#ringGrad);
    stroke-linecap: round;
    transition: stroke-dashoffset 1.1s cubic-bezier(0.22,1.2,0.36,1);
  }
  #scoreText {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #scoreNum {
    font-size: 46px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 30px rgba(140,170,255,0.55);
  }
  #scorePct { font-size: 13px; font-weight: 600; color: #8fa2cc; margin-top: 2px; }

  #resultTitle {
    font-size: 24px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.4px;
  }
  #resultSub { font-size: 14px; color: #a6b3d9; }

  #reviewHead {
    width: min(600px, 90vw);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: #7c88ab;
    text-transform: uppercase;
    margin-top: 6px;
    display: flex;
    justify-content: space-between;
  }
  #reviewList {
    width: min(600px, 90vw);
    max-height: 34vh;
    overflow-y: auto;
    margin: 14px 0 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 4px;
    /* 上下渐隐，暗示列表可滚动而不是被截断 */
    mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 18px), transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 18px), transparent 100%);
  }
  #reviewList::-webkit-scrollbar { width: 6px; }
  #reviewList::-webkit-scrollbar-thumb {
    background: rgba(143,162,204,0.32);
    border-radius: 3px;
  }
  .revItem {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 11px 14px;
    border-radius: 12px;
    background: rgba(38,45,62,0.8);
    border: 1px solid rgba(143,162,204,0.18);
    font-size: 13.5px;
    line-height: 1.5;
    color: #c3cee8;
    text-align: left;
  }
  .revItem .mark {
    flex: 0 0 auto;
    width: 20px; height: 20px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 800;
    margin-top: 1px;
  }
  .revItem.ok  .mark { background: rgba(127,224,160,0.24); color: #7fe0a0; }
  .revItem.bad .mark { background: rgba(255,138,138,0.24); color: #ff8a8a; }
  .revItem .q { color: #eef3ff; font-weight: 600; }
  .revItem .a { color: #8fa2cc; font-size: 12.5px; margin-top: 3px; }
  .revItem .a em { color: #7fe0a0; font-style: normal; font-weight: 600; }

  /* ========== 反馈数字 / 连击 ========== */
  .float-text {
    position: fixed;
    pointer-events: none;
    font-weight: 800;
    font-size: 20px;
    z-index: 3000;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    animation: floatUp 900ms cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(0.7); }
    18%  { opacity: 1; transform: translate(-50%, -14px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -74px) scale(1); }
  }

  #combo {
    position: fixed;
    top: 74px;
    left: 50%;
    transform: translateX(-50%) scale(0.7);
    opacity: 0;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #ffd98a;
    text-shadow: 0 0 18px rgba(255,200,80,0.7);
    pointer-events: none;
    z-index: 400;
    transition: opacity 0.24s ease, transform 0.34s cubic-bezier(0.34,1.56,0.64,1);
  }
  #combo.show { opacity: 1; transform: translateX(-50%) scale(1); }
  /* 连击被打断：闪一下红然后收起，而不是无声消失 */
  #combo.break {
    color: #ff8a8a;
    text-shadow: 0 0 18px rgba(255,120,120,0.8);
    transform: translateX(-50%) scale(0.86);
    transition: opacity 0.24s ease, transform 0.2s ease, color 0.2s ease;
  }

  /* 全屏判定闪光 */
  .flash {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 3000;
    animation: flashOut 620ms ease-out forwards;
  }
  @keyframes flashOut {
    0%   { opacity: 0; }
    16%  { opacity: 0.5; }
    100% { opacity: 0; }
  }

  /* 粒子 */
  .particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2500;
    animation: pFly 620ms cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes pFly {
    0%   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3); }
  }

  /* 涟漪环 */
  .ripple {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2400;
    border: 2px solid rgba(160,190,255,0.7);
    animation: rippleOut 520ms cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes rippleOut {
    0%   { opacity: 0.85; transform: translate(-50%,-50%) scale(0.3); }
    100% { opacity: 0;    transform: translate(-50%,-50%) scale(1.8); }
  }

  /* 震动 */
  #stage.shake-sm { animation: shakeSm 240ms cubic-bezier(0.36,0.07,0.19,0.97); }
  #stage.shake-md { animation: shakeMd 300ms cubic-bezier(0.36,0.07,0.19,0.97); }
  @keyframes shakeSm {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-3px, 1px); }
    50% { transform: translate(3px, -1px); }
    75% { transform: translate(-2px, 0); }
  }
  @keyframes shakeMd {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-7px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(3px, -1px); }
  }

  /* ========== 起始页 ========== */
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 600;
    background: rgba(13,16,23,0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  #start.hide { display: none; }
  #startTitle {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(180deg, #ffffff 0%, #9db4ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #startSub {
    font-size: 14.5px;
    color: #a6b3d9;
    margin-bottom: 14px;
    letter-spacing: 0.3px;
  }
  #startMeta { font-size: 13px; color: #7c88ab; margin-top: 6px; }

  /* 无障碍：尊重系统减弱动效设置 */
  @media (prefers-reduced-motion: reduce) {
    .qcard, .opt, .btn, .particle, .ripple, .float-text, #combo, .flash,
    #stage {
      animation: none !important;
      transition-duration: 0.01ms !important;
    }
    .opt { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="hud">
    <span id="hudTitle">记忆测验</span>
    <div id="barWrap"><div id="bar"></div></div>
    <span id="hudStat">对 <b id="okNum">0</b> · 错 <i id="badNum">0</i></span>
  </div>

  <div id="combo"></div>

  <div id="cardStage">
    <div class="qcard" id="qcard">
      <div class="qmeta">
        <span class="qtag" id="qtag">工作记忆</span>
        <span class="qidx" id="qidx">1 / 10</span>
      </div>
      <div class="qtext" id="qtext">准备开始</div>
      <div id="options"></div>
      <div id="explain"></div>
      <div id="actions"></div>
    </div>
  </div>

  <div id="start">
    <div id="startTitle">记忆测验</div>
    <div id="startSub">共 10 题 · 单选 · 答错会给出解析</div>
    <button class="btn" id="startBtn">开始答题</button>
    <div id="startMeta">键盘 1-4 选项 · Enter 下一题</div>
  </div>

  <div id="result">
    <div id="scoreRing">
      <svg width="190" height="190">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#7fe0a0"/>
            <stop offset="100%" stop-color="#9db4ff"/>
          </linearGradient>
        </defs>
        <circle id="ringBg" cx="95" cy="95" r="82" fill="none" stroke-width="11"/>
        <circle id="ringFg" cx="95" cy="95" r="82" fill="none" stroke-width="11"
                stroke-dasharray="515" stroke-dashoffset="515"/>
      </svg>
      <div id="scoreText">
        <span id="scoreNum">0</span>
        <span id="scorePct">正确率</span>
      </div>
    </div>
    <div id="resultTitle">完成！</div>
    <div id="resultSub"></div>
    <div id="reviewHead">逐题复盘</div>
    <div id="reviewList"></div>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button class="btn" id="againBtn">再来一轮</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
   * 0. GameFeel Tokens（与导图页保持一致的观感参数）
   * ========================================================= */
  const GF = {
    easing: {
      hover:   'cubic-bezier(0.34,1.56,0.64,1)',
      press:   'cubic-bezier(0.55,0.06,0.68,0.19)',
      release: 'cubic-bezier(0.22,1.61,0.36,1)',
      settle:  'cubic-bezier(0.16,1,0.3,1)'
    },
    duration: { hover: 180, press: 80, enter: 520, settle: 280, cooldown: 260 },
    tiers: {
      small: { particles: 9,  ring: true,  shake: 'shake-sm', sound: 0.6 },
      medium:{ particles: 15, ring: true,  shake: 'shake-sm', sound: 0.8 },
      large: { particles: 22, ring: true,  shake: 'shake-md', sound: 1.0 }
    }
  };

  const rand = (min, max) => min + Math.random() * (max - min);

  /* =========================================================
   * 1. 题库
   * ========================================================= */
  const QUESTIONS = [
    {
      tag: '工作记忆',
      q: '工作记忆的容量通常被认为是有限的，其经典估计值约为多少？',
      options: ['3～4 个组块', '7±2 个组块', '12～15 个组块', '没有上限'],
      answer: 1,
      explain: 'Miller (1956) 提出 <b>7±2</b> 组块。注意区分：更晚的 Cowan (2001) 认为纯粹的短时存储核心容量约 <b>4 个组块</b>，两者并不矛盾——7±2 包含了复述与组块化策略的贡献。'
    },
    {
      tag: '工作记忆',
      q: 'Baddeley 工作记忆模型中，负责临时保持和处理言语信息的子系统是？',
      options: ['视空间模板', '语音环路', '中央执行系统', '情景缓冲器'],
      answer: 1,
      explain: '四个成分中：<b>语音环路</b>处理言语声学信息，<b>视空间模板</b>处理视觉空间信息，<b>中央执行系统</b>负责注意控制与协调，<b>情景缓冲器</b>负责多模态信息的整合与绑定。'
    },
    {
      tag: '长期记忆',
      q: '下列哪一项属于内隐记忆（程序性记忆）的典型例子？',
      options: ['记住昨天午饭吃了什么', '说出中国的首都', '熟练地骑自行车', '回忆一次面试的细节'],
      answer: 2,
      explain: '内隐记忆是<b>无需意识提取</b>就能影响行为的记忆，<b>骑自行车</b>是典型运动技能。其余三项分别属于情景记忆（昨天午饭、面试细节）和语义记忆（首都）。'
    },
    {
      tag: '长期记忆',
      q: '"记住昨天在咖啡馆遇见老朋友" 这段经历属于哪类记忆？',
      options: ['语义记忆', '程序记忆', '情景记忆', '工作记忆'],
      answer: 2,
      explain: '<b>情景记忆</b>（episodic memory）储存带有时空背景的个人经历，是 Tulving 划分的陈述性记忆之一；<b>语义记忆</b>储存与时空无关的一般事实。'
    },
    {
      tag: '提取练习',
      q: '相比反复重读材料，主动进行提取练习（测试效应）对长期保持的效果是？',
      options: ['更差，因为会混淆', '差不多，只是更有趣', '更好，且保持更持久', '只对选择题更好'],
      answer: 2,
      explain: 'Roediger & Karpicke (2006) 的经典研究显示，提取练习在<b>即时测验</b>中优势不明显，但在<b>一周后的延迟测验</b>中显著优于重复阅读。提取本身会强化记忆痕迹，这就是"测试效应"。'
    },
    {
      tag: '提取练习',
      q: '间隔重复（spaced repetition）相比集中学习，主要优势在于？',
      options: ['总学习时间更短', '利用遗忘曲线在临界点复习，保持更牢', '单次记忆强度更高', '不需要理解材料'],
      answer: 1,
      explain: '间隔重复的核心是<b>在即将遗忘的临界点复习</b>，每次成功提取都能拉长下次的遗忘间隔，从而以更少的总复习次数获得更高的长期保持率。这是 Anki 等工具的理论基础。'
    },
    {
      tag: '记忆策略',
      q: '把要记的数字串 "1973-0821" 记成"1973 年 8 月 21 日"，用的是什么策略？',
      options: ['复述', '组块化', '心理旋转', '首字母法'],
      answer: 1,
      explain: '<b>组块化</b>（chunking）把零散信息组合成有意义的更大单元，从而突破短时记忆的容量限制。这里借用了已知的日期结构作为组块框架。'
    },
    {
      tag: '记忆策略',
      q: '记忆宫殿法（method of loci）主要依赖哪种能力来编码信息？',
      options: ['语音编码', '视觉空间想象', '运动程序', '情绪唤起'],
      answer: 1,
      explain: '记忆宫殿把待记项目<b>逐个安置在熟悉的视觉空间路线上</b>，提取时沿路线"走"一遍。它高效的原因是同时利用了空间记忆的稳固性与多感官的生动编码。'
    },
    {
      tag: '遗忘',
      q: '关于遗忘曲线，下列描述正确的是？',
      options: ['遗忘速度全程恒定', '遗忘先快后慢，初期急剧下降', '遗忘先慢后快', '遗忘与时间无关'],
      answer: 1,
      explain: 'Ebbinghaus 的遗忘曲线显示，遗忘在<b>学习后的最初几小时到一天内最剧烈</b>，随后逐渐平缓。所以早期的一次复习性价比最高。'
    },
    {
      tag: '遗忘',
      q: '"舌尖现象"（tip-of-the-tongue）最能说明遗忘的哪种机制？',
      options: ['痕迹完全消失', '提取失败而非存储丧失', '编码从未发生', '感觉记忆衰退'],
      answer: 1,
      explain: '舌尖现象中你能确定"知道这个词"，甚至能说出首字母，说明<b>记忆痕迹仍在，只是暂时提取不出来</b>——遗忘常常是检索线索的问题，而非存储本身的丢失。'
    }
  ];

  /* =========================================================
   * 2. 状态
   * ========================================================= */
  const S = {
    idx: 0,            // 当前题序
    ok: 0,             // 答对
    bad: 0,            // 答错
    combo: 0,          // 连击
    maxCombo: 0,
    locked: false,     // 判定锁定，防连点
    picked: -1,        // 已选下标
    records: [],       // 每题结果，供结算页复盘
    running: false
  };

  /* =========================================================
   * 3. DOM
   * ========================================================= */
  const $ = (id) => document.getElementById(id);
  const stage    = $('stage');
  const qcard    = $('qcard');
  const qtag     = $('qtag');
  const qidx     = $('qidx');
  const qtext    = $('qtext');
  const optionsEl= $('options');
  const explainEl= $('explain');
  const actionsEl= $('actions');
  const bar      = $('bar');
  const okNum    = $('okNum');
  const badNum   = $('badNum');
  const comboEl  = $('combo');
  const startEl  = $('start');
  const resultEl = $('result');

  /* =========================================================
   * 4. 音效引擎（多层 WebAudio 合成，与导图页同构）
   * ========================================================= */
  let audioCtx = null;

  const BUS = { master: null, dry: null, wet: null, verb: null, comp: null };

  function buildImpulse(ctx, seconds, decay) {
    const rate = ctx.sampleRate;
    const len = Math.max(1, Math.floor(rate * seconds));
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return;
    }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    audioCtx = ctx;

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 24;
    comp.ratio.value = 5;
    comp.attack.value = 0.004;
    comp.release.value = 0.16;
    comp.connect(ctx.destination);

    const master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(comp);

    const dry = ctx.createGain();
    dry.gain.value = 0.82;
    dry.connect(master);

    const verb = ctx.createConvolver();
    verb.buffer = buildImpulse(ctx, 1.6, 2.6);

    const damp = ctx.createBiquadFilter();
    damp.type = 'lowpass';
    damp.frequency.value = 3200;
    damp.connect(verb);

    const wet = ctx.createGain();
    wet.gain.value = 0.24;
    verb.connect(wet);
    wet.connect(master);

    BUS.comp = comp; BUS.master = master; BUS.dry = dry;
    BUS.wet = damp;  BUS.verb = verb;

    ctx.onstatechange = () => {
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    };
  }

  const soundGuard = new Map();
  function allowSound(type) {
    const now = performance.now();
    const last = soundGuard.get(type) || 0;
    soundGuard.set(type, now);
    return (now - last) < 45 ? 0.55 : 1;
  }

  function tone(opt) {
    const ctx = audioCtx;
    const t0 = opt.at;
    const o = ctx.createOscillator();
    o.type = opt.type || 'sine';
    o.frequency.setValueAtTime(opt.f0, t0);
    if (opt.f1 != null) {
      o.frequency.exponentialRampToValueAtTime(Math.max(1, opt.f1), t0 + (opt.sweep || opt.dur));
    }

    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(opt.peak, t0 + (opt.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + opt.dur);

    let node = o;
    if (opt.filter) {
      const f = ctx.createBiquadFilter();
      f.type = opt.filter.type;
      f.frequency.setValueAtTime(opt.filter.f0, t0);
      if (opt.filter.f1 != null) {
        f.frequency.exponentialRampToValueAtTime(opt.filter.f1, t0 + opt.dur);
      }
      if (opt.filter.q != null) f.Q.value = opt.filter.q;
      node.connect(f);
      node = f;
    }

    node.connect(g);
    let tail = g;
    if (opt.pan != null && ctx.createStereoPanner) {
      const p = ctx.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, opt.pan));
      tail.connect(p);
      tail = p;
    }

    tail.connect(opt.bus || BUS.dry);
    if (opt.wetMix) {
      const wg = ctx.createGain();
      wg.gain.value = opt.wetMix;
      tail.connect(wg);
      wg.connect(BUS.wet);
    }

    o.start(t0);
    o.stop(t0 + opt.dur + 0.02);
    return o;
  }

  function noiseHit(opt) {
    const ctx = audioCtx;
    const t0 = opt.at;
    const len = Math.max(1, Math.floor(ctx.sampleRate * opt.dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, opt.decay || 3);
    }
    const s = ctx.createBufferSource();
    s.buffer = buf;

    const f = ctx.createBiquadFilter();
    f.type = opt.filter || 'bandpass';
    f.frequency.setValueAtTime(opt.f0, t0);
    if (opt.f1 != null) f.frequency.exponentialRampToValueAtTime(opt.f1, t0 + opt.dur);
    f.Q.value = opt.q != null ? opt.q : 1.2;

    const g = ctx.createGain();
    g.gain.setValueAtTime(opt.peak, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + opt.dur);

    s.connect(f); f.connect(g);
    g.connect(opt.bus || BUS.dry);
    if (opt.wetMix) {
      const wg = ctx.createGain();
      wg.gain.value = opt.wetMix;
      g.connect(wg);
      wg.connect(BUS.wet);
    }

    s.start(t0);
    s.stop(t0 + opt.dur + 0.02);
  }

  function playSound(type, volume = 1) {
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});

    const vol = volume * allowSound(type);
    const t = audioCtx.currentTime;
    const wet = BUS.wet ? 1 : 0;

    switch (type) {
      /* 悬停：极轻高频点触 */
      case 'hoverTick': {
        tone({ at: t, type: 'sine', f0: 1850, f1: 1420,
               dur: 0.055, attack: 0.003, peak: 0.012 * vol, pan: rand(-0.22, 0.22) });
        noiseHit({ at: t, dur: 0.03, f0: 5200, f1: 3400, q: 0.9,
                   peak: 0.0045 * vol, decay: 5 });
        break;
      }

      /* 选项按下 */
      case 'tapLight': {
        tone({ at: t, type: 'sine', f0: 150, f1: 92,
               dur: 0.11, attack: 0.004, peak: 0.05 * vol });
        tone({ at: t, type: 'triangle', f0: 430, f1: 178,
               dur: 0.085, attack: 0.003, peak: 0.058 * vol });
        tone({ at: t, type: 'sine', f0: 1320, f1: 980,
               dur: 0.05, attack: 0.002, peak: 0.016 * vol, pan: rand(-0.15, 0.15) });
        noiseHit({ at: t, dur: 0.024, f0: 2600, f1: 1500, q: 1.1,
                   peak: 0.014 * vol, decay: 4 });
        break;
      }

      /* 答对：明亮上行大三度 + 五度，带混响尾巴 */
      case 'correct': {
        tone({ at: t, type: 'sine', f0: 523.25, f1: 783.99,
               dur: 0.16, attack: 0.006, peak: 0.062 * vol, wetMix: wet * 0.34 });
        tone({ at: t + 0.06, type: 'sine', f0: 783.99, f1: 1046.50,
               dur: 0.24, attack: 0.006, peak: 0.055 * vol, wetMix: wet * 0.4 });
        tone({ at: t + 0.06, type: 'sine', f0: 1046.50, f1: 1567.98,
               dur: 0.2, attack: 0.005, peak: 0.019 * vol, pan: 0.2 });
        tone({ at: t, type: 'sine', f0: 130.81, f1: 196.00,
               dur: 0.22, attack: 0.006, peak: 0.05 * vol });
        noiseHit({ at: t + 0.02, dur: 0.14, f0: 3200, f1: 6200, q: 0.8,
                   peak: 0.012 * vol, decay: 4, wetMix: wet * 0.3 });
        break;
      }

      /* 答错：下行的钝感 + 低频撞击 */
      case 'wrong': {
        tone({ at: t, type: 'sawtooth', f0: 300, f1: 118,
               dur: 0.24, attack: 0.006, peak: 0.05 * vol,
               filter: { type: 'lowpass', f0: 1600, f1: 420, q: 1.2 } });
        tone({ at: t, type: 'sine', f0: 148, f1: 74,
               dur: 0.3, attack: 0.007, peak: 0.062 * vol });
        tone({ at: t + 0.045, type: 'triangle', f0: 208, f1: 155,
               dur: 0.2, attack: 0.006, peak: 0.028 * vol, pan: -0.14 });
        noiseHit({ at: t, dur: 0.1, f0: 900, f1: 220, q: 1.0,
                   peak: 0.02 * vol, decay: 4 });
        break;
      }

      /* 翻到下一题：轻快上行 */
      case 'advance': {
        tone({ at: t, type: 'sine', f0: 380, f1: 900,
               dur: 0.16, attack: 0.005, peak: 0.045 * vol, wetMix: wet * 0.28 });
        tone({ at: t + 0.03, type: 'sine', f0: 760, f1: 1520,
               dur: 0.13, attack: 0.004, peak: 0.016 * vol, pan: 0.16 });
        noiseHit({ at: t, dur: 0.11, f0: 1100, f1: 3400, q: 0.9,
                   peak: 0.009 * vol, decay: 4, wetMix: wet * 0.24 });
        break;
      }

      /* 连击升级：音高随连击数上行 */
      case 'combo': {
        const step = Math.min(7, S.combo);
        const base = 659.25 * Math.pow(2, step / 12);
        tone({ at: t, type: 'sine', f0: base, f1: base * 1.5,
               dur: 0.18, attack: 0.005, peak: 0.04 * vol, wetMix: wet * 0.42 });
        tone({ at: t, type: 'sine', f0: base * 2, f1: base * 3,
               dur: 0.12, attack: 0.004, peak: 0.014 * vol, pan: 0.22 });
        break;
      }

      /* 结算：C 大三和弦铺开 */
      case 'finish': {
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
          tone({ at: t + i * 0.075, type: 'sine', f0: f, f1: f * 1.003,
                 dur: 0.75, attack: 0.01, peak: 0.05 * vol,
                 pan: (i - 1.5) * 0.2, wetMix: wet * 0.55 });
        });
        tone({ at: t, type: 'sine', f0: 130.81, f1: 130.81,
               dur: 0.9, attack: 0.012, peak: 0.055 * vol });
        noiseHit({ at: t + 0.02, dur: 0.3, f0: 1400, f1: 5200, q: 0.7,
                   peak: 0.011 * vol, decay: 3, wetMix: wet * 0.5 });
        break;
      }
    }
  }

  /* =========================================================
   * 5. 视觉反馈工具
   * ========================================================= */
  function spawnParticlesAt(x, y, count, color) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = rand(4, 9);
      const ang  = rand(0, Math.PI * 2);
      const dist = rand(38, 96);
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = x + 'px';
      p.style.top  = y + 'px';
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      p.style.background = `radial-gradient(circle, #fff 0%, ${color} 55%, transparent 78%)`;
      p.style.boxShadow = `0 0 10px ${color}`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 660);
    }
  }

  function spawnRing(x, y, size, color) {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.width = size + 'px';
    r.style.height = size + 'px';
    r.style.left = x + 'px';
    r.style.top  = y + 'px';
    r.style.borderColor = color;
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 560);
  }

  function floatTextAt(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    el.style.color = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 940);
  }

  function flashScreen(color) {
    const f = document.createElement('div');
    f.className = 'flash';
    f.style.background = `radial-gradient(ellipse at center, ${color} 0%, transparent 72%)`;
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 660);
  }

  function shakeStage(kind) {
    if (!kind) return;
    stage.classList.remove('shake-sm', 'shake-md');
    void stage.offsetWidth;
    stage.classList.add(kind);
    setTimeout(() => stage.classList.remove(kind), 340);
  }

  /* 取元素中心坐标 */
  function centerOf(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  /* =========================================================
   * 6. 渲染
   * ========================================================= */
  function currentQuestion() {
    return QUESTIONS[S.idx];
  }

  function updateHud() {
    const total = QUESTIONS.length;
    okNum.textContent  = S.ok;
    badNum.textContent = S.bad;
    bar.style.width = ((S.idx) / total * 100) + '%';
  }

  function renderQuestion() {
    const q = currentQuestion();
    S.locked = false;
    S.picked = -1;

    qtag.textContent = q.tag;
    qidx.textContent = `${S.idx + 1} / ${QUESTIONS.length}`;
    qtext.textContent = q.q;

    /* 新题开始，连击提示一律收起（中断状态也清掉） */
    comboEl.classList.remove('show', 'break');

    /* 解析条收起 */
    explainEl.className = '';
    explainEl.innerHTML = '';

    /* 选项 */
    optionsEl.innerHTML = '';
    q.options.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.type = 'button';
      btn.dataset.i = i;
      btn.innerHTML = `<span class="key">${i + 1}</span><span class="label"></span>`;
      btn.querySelector('.label').textContent = text;

      btn.addEventListener('mouseenter', () => {
        if (!S.locked) playSound('hoverTick', 0.7);
      });
      btn.addEventListener('click', () => pick(i, btn));
      optionsEl.appendChild(btn);

      /* 逐条错峰入场 */
      setTimeout(() => btn.classList.add('shown'), 60 + i * 55);
    });

    /* 题卡进场动画 */
    qcard.classList.remove('correct', 'wrong', 'leave', 'enter');
    void qcard.offsetWidth;
    qcard.classList.add('enter');

    actionsEl.innerHTML = '';
    updateHud();
  }

  /* =========================================================
   * 7. 判定与打分
   * ========================================================= */
  function pick(i, btn) {
    if (S.locked) return;
    S.locked = true;
    S.picked = i;

    const q = currentQuestion();
    const correct = (i === q.answer);
    const optEls = [...optionsEl.querySelectorAll('.opt')];

    /* 按下反馈 */
    btn.classList.add('pressing');
    playSound('tapLight', 0.85);
    setTimeout(() => btn.classList.remove('pressing'), 130);

    /* 禁用全部选项 */
    optEls.forEach((o) => { o.disabled = true; });

    if (correct) {
      S.ok++;
      S.combo++;
      S.maxCombo = Math.max(S.maxCombo, S.combo);
    } else {
      S.bad++;
      S.combo = 0;
    }

    /* 记录 */
    S.records.push({
      idx: S.idx,
      tag: q.tag,
      q: q.q,
      picked: i,
      answer: q.answer,
      correct
    });

    /* 判定分级：连击高时给更重的反馈 */
    const tier = correct
      ? (S.combo >= 3 ? GF.tiers.large : (S.combo >= 2 ? GF.tiers.medium : GF.tiers.small))
      : GF.tiers.medium;

    /* 延时一点再揭示，让"按下"的质感先落地 */
    setTimeout(() => {
      if (correct) {
        btn.classList.add('correct');
        optEls.forEach((o) => { if (o !== btn) o.classList.add('dimmed'); });

        qcard.classList.add('correct');
        flashScreen('rgba(127,224,160,0.55)');

        const c = centerOf(btn);
        spawnParticlesAt(c.x, c.y, tier.particles, '#7fe0a0');
        if (tier.ring) spawnRing(c.x, c.y, 120, 'rgba(127,224,160,0.8)');

        const gain = 10 + Math.min(5, S.combo) * 2;
        floatTextAt(c.x, c.y - 20, `+${gain}`, '#7fe0a0');

        playSound('correct', tier.sound);

        if (S.combo >= 2) {
          comboEl.textContent = `${S.combo} 连击`;
          comboEl.classList.add('show');
          playSound('combo', 0.8);
        }
      } else {
        btn.classList.add('wrong');
        /* 揭示正确项 */
        const rightBtn = optEls[q.answer];
        if (rightBtn) rightBtn.classList.add('reveal');
        optEls.forEach((o) => { if (o !== btn && o !== rightBtn) o.classList.add('dimmed'); });

        qcard.classList.add('wrong');
        flashScreen('rgba(255,90,90,0.42)');
        shakeStage(tier.shake);

        const c = centerOf(btn);
        spawnParticlesAt(c.x, c.y, tier.particles, '#ff8a8a');
        floatTextAt(c.x, c.y - 20, '✕', '#ff8a8a');

        /* 连击中断：立刻收起连击提示，否则会残留上一轮的计数 */
        if (comboEl.classList.contains('show')) {
          comboEl.classList.add('break');
          setTimeout(() => {
            comboEl.classList.remove('show', 'break');
          }, 260);
        }

        playSound('wrong', tier.sound);
      }

      updateHud();

      /* 解析 */
      const rightText = q.options[q.answer];
      explainEl.innerHTML = correct
        ? `<b>回答正确。</b>${q.explain}`
        : `<b>正确答案：${escapeHtml(rightText)}</b><br>${q.explain}`;
      explainEl.classList.add('show', correct ? 'ok' : 'bad');

      /* 下一题按钮 */
      actionsEl.innerHTML = '';
      const last = (S.idx === QUESTIONS.length - 1);
      const next = document.createElement('button');
      next.className = 'btn';
      next.type = 'button';
      next.textContent = last ? '查看结果' : '下一题';
      next.addEventListener('click', advance);
      actionsEl.appendChild(next);
      next.focus({ preventScroll: true });
    }, 170);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (m) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
    ));
  }

  function advance() {
    if (S.idx >= QUESTIONS.length - 1) { showResult(); return; }

    playSound('advance', 0.8);
    comboEl.classList.remove('show');

    qcard.classList.remove('enter', 'correct', 'wrong');
    qcard.classList.add('leave');

    setTimeout(() => {
      qcard.classList.remove('leave');
      S.idx++;
      renderQuestion();
    }, 300);
  }

  /* =========================================================
   * 8. 结算
   * ========================================================= */
  let ringAnimated = false;

  function showResult() {
    S.running = false;
    const total = QUESTIONS.length;
    const pct = Math.round(S.ok / total * 100);

    bar.style.width = '100%';
    playSound('finish', 1.0);
    flashScreen('rgba(160,190,255,0.5)');

    $('resultTitle').textContent =
      pct === 100 ? '全对！' : (pct >= 80 ? '非常不错' : (pct >= 60 ? '继续加油' : '需要再练'));
    $('resultSub').textContent =
      `共 ${total} 题 · 对 ${S.ok} · 错 ${S.bad} · 最高连击 ${S.maxCombo}`;

    /* 复盘列表 */
    const list = $('reviewList');
    list.innerHTML = '';
    $('reviewHead').innerHTML =
      `<span>逐题复盘</span><span>${S.records.length} 题 · 向下滚动查看全部</span>`;
    S.records.forEach((r) => {
      const item = document.createElement('div');
      item.className = 'revItem ' + (r.correct ? 'ok' : 'bad');
      item.innerHTML =
        `<span class="mark">${r.correct ? '✓' : '✕'}</span>` +
        `<span><span class="q">${escapeHtml(r.q)}</span>` +
        `<div class="a">${r.correct
            ? '你的答案：<em>' + escapeHtml(QUESTIONS[r.idx].options[r.picked]) + '</em>'
            : '你选了 ' + escapeHtml(QUESTIONS[r.idx].options[r.picked]) +
              ' · 正确：<em>' + escapeHtml(QUESTIONS[r.idx].options[r.answer]) + '</em>'}</div>` +
        `</span>`;
      list.appendChild(item);
    });

    resultEl.classList.add('show');

    /* 环形进度动画 */
    const C = 2 * Math.PI * 82;
    const ringFg = $('ringFg');
    ringFg.setAttribute('stroke-dasharray', C.toFixed(1));
    ringFg.setAttribute('stroke-dashoffset', C.toFixed(1));

    const numEl = $('scoreNum');
    numEl.textContent = '0';

    setTimeout(() => {
      ringFg.setAttribute('stroke-dashoffset', (C * (1 - pct / 100)).toFixed(1));

      /* 数字滚动 */
      const dur = 900;
      const t0 = performance.now();
      const tick = () => {
        const raw = Math.min(1, (performance.now() - t0) / dur);
        /* 缓出 */
        const e = 1 - Math.pow(1 - raw, 3);
        numEl.textContent = Math.round(pct * e) + '%';
        if (raw < 1) requestAnimationFrame(tick);
      };
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(tick);
      else numEl.textContent = pct + '%';
    }, 120);

    ringAnimated = true;
  }

  function restart() {
    S.idx = 0; S.ok = 0; S.bad = 0; S.combo = 0; S.maxCombo = 0;
    S.locked = false; S.picked = -1; S.records = []; S.running = true;

    resultEl.classList.remove('show');
    comboEl.classList.remove('show');
    okNum.textContent = '0';
    badNum.textContent = '0';
    bar.style.width = '0%';

    renderQuestion();
  }

  /* =========================================================
   * 9. 键盘
   * ========================================================= */
  document.addEventListener('keydown', (e) => {
    if (!S.running) return;

    const k = e.key;
    if (k >= '1' && k <= '4') {
      const i = parseInt(k, 10) - 1;
      const btn = optionsEl.querySelector(`.opt[data-i="${i}"]`);
      if (btn && !S.locked) pick(i, btn);
    } else if (k === 'Enter' || k === ' ') {
      if (S.locked) {
        const btn = actionsEl.querySelector('.btn');
        if (btn) { e.preventDefault(); advance(); }
      }
    }
  });

  /* =========================================================
   * 10. 启动
   * ========================================================= */
  $('startBtn').addEventListener('click', () => {
    initAudio();
    playSound('advance', 0.8);
    startEl.classList.add('hide');
    restart();
  });

  $('againBtn').addEventListener('click', () => {
    playSound('advance', 0.8);
    restart();
  });

  /* 全局首次交互解锁音频 */
  document.addEventListener('pointerdown', () => initAudio(), { once: true });

  updateHud();
})();
</script>
</body>
</html>
