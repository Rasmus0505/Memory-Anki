<title>粒子试衣间</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:hsl(38 56% 96%);--surface:hsl(43 100% 99%);--ink:hsl(24 26% 14%);--muted:hsl(26 14% 40%);--line:hsl(32 32% 86%);
  --primary:hsl(28 80% 51%);--primary-soft:hsl(33 90% 92%);--primary-ink:hsl(24 78% 36%);
  --again:hsl(8 76% 62%);--hard:hsl(38 92% 55%);--good:hsl(104 44% 50%);--easy:hsl(190 56% 50%);
  --stage:hsl(24 16% 8%);--stage-raised:hsl(24 14% 13%);--stage-line:hsl(34 30% 80% / .13);--stage-ink:hsl(38 40% 93%);--stage-muted:hsl(32 14% 64%);--glow:hsl(32 94% 60%);
  --paper:hsl(40 58% 94%);--paper-ink:hsl(24 30% 18%);--paper-line:hsl(32 30% 78%);
  --shadow:0 1px 0 hsl(30 30% 82% / .7),0 18px 40px -26px hsl(24 40% 20% / .4);
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:hsl(24 14% 6%);--surface:hsl(24 14% 10%);--ink:hsl(38 32% 92%);--muted:hsl(32 14% 64%);--line:hsl(28 12% 20%);
  --primary:hsl(32 92% 60%);--primary-soft:hsl(30 50% 15%);--primary-ink:hsl(34 96% 70%);
  --shadow:0 1px 0 hsl(30 20% 16% / .8),0 18px 40px -24px hsl(0 0% 0% / .8);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:hsl(24 14% 6%);--surface:hsl(24 14% 10%);--ink:hsl(38 32% 92%);--muted:hsl(32 14% 64%);--line:hsl(28 12% 20%);
  --primary:hsl(32 92% 60%);--primary-soft:hsl(30 50% 15%);--primary-ink:hsl(34 96% 70%);
  --shadow:0 1px 0 hsl(30 20% 16% / .8),0 18px 40px -24px hsl(0 0% 0% / .8);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;padding-inline:20px;padding-block:0 180px}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;display:grid;gap:72px}
.intro{padding-block:56px 0;display:grid;gap:14px;max-width:760px}
.eyebrow{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--primary-ink)}
h1{font:900 clamp(36px,6vw,60px)/1.08 var(--serif);text-wrap:balance;letter-spacing:.02em}
.lede{color:var(--muted);font-size:16px;max-width:60ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--primary-soft);color:var(--primary-ink);font-size:14px}
.q{display:grid;gap:22px}
.q-head{display:grid;gap:6px;max-width:68ch}
h2{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 12px;font:700 27px/1.25 var(--serif);text-wrap:balance}
.qn{font:600 12px var(--mono);letter-spacing:.06em;color:var(--primary-ink);border:1px solid currentColor;border-radius:99px;padding:2px 10px;transform:translateY(-4px)}
.q-head p{color:var(--muted)}
.q-head .note{font-size:13px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.opt{display:grid;grid-template-rows:auto auto 1fr;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.opt:has(input:checked){border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklab,var(--primary) 22%,transparent),var(--shadow)}
.opt-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.opt h3{font:700 19px/1.3 var(--serif);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.opt-letter{font:600 13px var(--mono);color:var(--muted)}
.rec{font:600 11px var(--sans);letter-spacing:.06em;color:var(--primary-ink);background:var(--primary-soft);border-radius:99px;padding:2px 8px}
.opt-desc{color:var(--muted);font-size:14px;line-height:1.6}
.pick{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1.5px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);user-select:none;transition:all .15s}
.pick input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pick::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}
.pick:has(input:checked){background:var(--primary);border-color:var(--primary);color:hsl(24 50% 10%)}
.pick:has(input:checked)::before{background:currentColor}
.pick:has(input:focus-visible){outline:2px solid var(--primary);outline-offset:2px}
.pick .on{display:none}.pick:has(input:checked) .on{display:inline}.pick:has(input:checked) .off{display:none}

.stage{position:relative;align-self:end;background:radial-gradient(120% 90% at 50% 0%,hsl(28 30% 15%),var(--stage) 70%);border-radius:16px;padding:14px;display:grid;gap:12px;color:var(--stage-ink);outline:2px solid transparent;outline-offset:3px;transition:outline-color .2s;isolation:isolate}
.stage.is-active{outline-color:color-mix(in oklab,var(--primary) 55%,transparent)}
.hud{display:flex;align-items:center;gap:10px;font:500 12px var(--mono);color:var(--stage-muted)}
.combo{min-width:62px;padding:2px 8px;border-radius:99px;background:hsl(30 20% 100% / .06);text-align:center;transition:color .2s,background .2s}
.combo.hot{color:hsl(36 96% 70%);background:hsl(32 90% 50% / .18)}
.rail{position:relative;flex:1;height:8px;border-radius:99px;background:hsl(30 20% 100% / .08);overflow:visible}
.rail-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:linear-gradient(90deg,hsl(28 86% 50%),hsl(40 96% 64%));box-shadow:0 0 14px -2px hsl(36 96% 60% / .7);transition:width .32s cubic-bezier(.2,1.3,.4,1)}
.rail.hit .rail-fill{animation:railhit .42s ease-out}
@keyframes railhit{30%{filter:brightness(1.8) saturate(1.3);box-shadow:0 0 22px 2px hsl(40 96% 64% / .9)}}
.count{min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.card{position:relative;background:var(--stage-raised);border:1px solid var(--stage-line);border-radius:14px;padding:16px 16px 18px;display:grid;gap:6px;min-height:118px;box-shadow:0 20px 40px -24px #000}
.kicker{font-size:12px;color:var(--stage-muted);display:flex;gap:8px;align-items:center}
.stars{color:hsl(40 96% 62%);letter-spacing:1px}
.prompt{font:700 17px/1.45 var(--serif);text-wrap:balance}
.answer{font-size:13px;color:var(--stage-muted)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{--tone:var(--good);position:relative;appearance:none;border:0;cursor:pointer;font:700 14px var(--sans);color:hsl(24 40% 10%);border-radius:12px;padding:10px 4px 8px;background:var(--tone);box-shadow:0 5px 0 color-mix(in oklab,var(--tone) 55%,#000),0 8px 14px -6px #000;transition:transform .08s,box-shadow .08s;display:grid;gap:1px;justify-items:center}
.key small{font:600 10px var(--mono);opacity:.62}
.key:active,.key.down{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in oklab,var(--tone) 55%,#000),0 3px 8px -4px #000}
.key[data-r="1"]{--tone:var(--again)}.key[data-r="2"]{--tone:var(--hard)}.key[data-r="3"]{--tone:var(--good)}.key[data-r="4"]{--tone:var(--easy)}
.tag{position:absolute;right:14px;top:12px;font:600 12px var(--sans);padding:3px 10px;border-radius:99px;background:hsl(30 20% 100% / .1);color:var(--stage-ink);pointer-events:none;animation:tag 1.3s cubic-bezier(.2,1,.3,1) forwards}
@keyframes tag{0%{opacity:0;transform:translateY(10px) scale(.9)}18%{opacity:1;transform:translateY(0) scale(1.04)}30%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.combo-pop{position:absolute;left:50%;top:40%;font:900 26px var(--serif);color:hsl(40 96% 66%);text-shadow:0 0 18px hsl(32 96% 55% / .8);pointer-events:none;white-space:nowrap;animation:cpop 1.1s cubic-bezier(.2,1.4,.4,1) forwards;z-index:3}
@keyframes cpop{0%{opacity:0;transform:translate(-50%,10px) scale(.5)}25%{opacity:1;transform:translate(-50%,0) scale(1.15)}70%{opacity:1;transform:translate(-50%,-8px) scale(1)}100%{opacity:0;transform:translate(-50%,-22px) scale(.96)}}
.stage-foot{font-size:12px;color:var(--stage-muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stage-foot b{color:var(--stage-ink);font-weight:600}
.map{position:relative;align-self:end;height:260px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 1px 1px,hsl(30 30% 60% / .22) 1px,transparent 1.2px) 0 0/18px 18px,var(--paper);color:var(--paper-ink);box-shadow:inset 0 0 0 1px var(--paper-line);isolation:isolate}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map .guide{fill:none;stroke:hsl(30 26% 60% / .5);stroke-width:1.5;stroke-dasharray:3 5}
.map .edge{fill:none;stroke:hsl(24 40% 26%);stroke-width:2.2;stroke-linecap:round;transition:stroke-dashoffset .55s cubic-bezier(.3,.8,.3,1)}
.node{position:absolute;transform:translate(-50%,-50%);width:36%;height:38px;perspective:600px;border:0;padding:0;background:none;cursor:pointer;font:inherit;color:inherit}
.node.root{width:24%;height:46px;cursor:default}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .56s cubic-bezier(.3,1.5,.5,1)}
.node.open .flip{transform:rotateX(180deg)}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:10px;backface-visibility:hidden;font-size:13px;font-weight:600;padding-inline:6px;text-align:center;line-height:1.2}
.face.front{background:repeating-linear-gradient(135deg,hsl(36 40% 88%) 0 6px,hsl(36 36% 84%) 6px 12px);border:1.5px dashed hsl(30 30% 62%);color:hsl(28 30% 45%);font:700 16px var(--mono)}
.face.back{transform:rotateX(180deg);background:hsl(43 100% 99%);border:1.5px solid hsl(28 60% 50%);box-shadow:0 8px 16px -8px hsl(24 50% 20% / .5)}
.node.root .face{background:hsl(28 80% 51%);color:#fff;border:0;font:700 15px var(--serif);box-shadow:0 8px 18px -8px hsl(24 70% 30% / .7);transform:none}
.map-bar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:hsl(26 20% 40%);z-index:2}
.pbtn{appearance:none;border:1.5px solid hsl(28 40% 70%);background:hsl(43 100% 99%);color:hsl(24 40% 22%);border-radius:99px;padding:5px 12px;font:600 12px var(--sans);cursor:pointer}
.pbtn:hover{border-color:hsl(28 80% 51%)}
.round{align-self:end;min-height:200px;place-content:center;justify-items:center;text-align:center;gap:14px}
.round .big{font:900 30px var(--serif);color:hsl(40 96% 66%)}
.sbtn{appearance:none;border:0;border-radius:12px;padding:10px 18px;font:700 14px var(--sans);cursor:pointer;background:var(--glow);color:hsl(24 50% 10%);box-shadow:0 4px 0 hsl(28 70% 34%),0 10px 20px -10px #000;transition:transform .08s,box-shadow .08s}
.sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 hsl(28 70% 34%)}
.veil{position:fixed;inset:0;z-index:40;background:radial-gradient(80% 70% at 50% 45%,hsl(26 30% 12% / .82),hsl(24 20% 4% / .94));opacity:0;pointer-events:none;transition:opacity .45s}
.veil.on{opacity:1;pointer-events:auto}
.reward{position:fixed;left:50%;top:50%;z-index:41;width:min(380px,calc(100vw - 40px));transform:translate(-50%,-46%) scale(.92);opacity:0;pointer-events:none;transition:opacity .4s,transform .6s cubic-bezier(.2,1.4,.4,1);background:var(--stage-raised);color:var(--stage-ink);border:1px solid var(--stage-line);border-radius:22px;padding:22px;display:grid;gap:14px;text-align:center;box-shadow:0 30px 80px -30px #000,0 0 0 1px hsl(36 90% 60% / .18)}
.reward.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.reward h3{font:900 26px var(--serif);color:hsl(40 96% 68%)}
.reward .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--stage-muted)}
.reward .stats b{display:block;font:700 20px var(--mono);color:var(--stage-ink);font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cells i{aspect-ratio:1;border-radius:6px;background:hsl(30 20% 100% / .06);transition:background .3s,box-shadow .3s,transform .3s}
.cells i.lit{background:hsl(38 96% 60%);box-shadow:0 0 14px hsl(36 96% 60% / .8);transform:scale(1.06)}
.reward small{color:var(--stage-muted);font-size:12px}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.scope{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.chk{position:relative;display:grid;gap:6px;align-content:start;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px 14px 44px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .2s}
.chk input{position:absolute;left:14px;top:17px;width:18px;height:18px;margin:0;accent-color:var(--primary)}
.chk:has(input:checked){border-color:var(--primary)}
.chk b{font:700 16px var(--serif)}
.chk span{font-size:13px;color:var(--muted);line-height:1.55}
.notes{display:grid;gap:8px;max-width:760px}
.notes label{font-weight:600;font-size:14px}
.notes textarea{width:100%;min-height:84px;resize:vertical;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 14px;font:inherit}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in oklab,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tray-in{max-width:1180px;margin-inline:auto;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--primary-soft);color:var(--primary-ink);white-space:nowrap}
.chip em{font-style:normal;font:600 11px var(--mono);opacity:.75;margin-right:4px}
.perf{font:500 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.copy{appearance:none;border:0;border-radius:12px;padding:9px 16px;background:var(--primary);color:hsl(24 50% 10%);font:700 14px var(--sans);cursor:pointer;box-shadow:0 3px 0 color-mix(in oklab,var(--primary) 60%,#000)}
.copy:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in oklab,var(--primary) 60%,#000)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,10px);opacity:0;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;pointer-events:none;transition:opacity .2s,transform .3s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:980px){.opts{grid-template-columns:1fr 1fr}.scope{grid-template-columns:1fr 1fr}}
@media (max-width:640px){body{padding-inline:16px}.opts,.scope{grid-template-columns:1fr}.wrap{gap:56px}h2{font-size:23px}.perf{display:none}.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.tray-in{flex-wrap:nowrap}}
@media (prefers-reduced-motion:reduce){.tag,.combo-pop{animation-duration:.01s}.flip,.rail-fill,.edge{transition-duration:.01s}}
</style>

<div class="wrap">
  <header class="intro">
    <div class="eyebrow">Memory Anki · 视觉升级 · 选型</div>
    <h1>粒子试衣间</h1>
    <p class="lede">每个选项都能直接玩。点键帽评分，或者把鼠标放在某个舞台上按 1–4。攒满 20 张会播放你在第 5 题选的轮次庆典。选完点右下角“复制选择”，粘贴回终端给我就行。</p>
    <div class="legend">
      <span><i style="background:var(--again)"></i>1 忘记</span>
      <span><i style="background:var(--hard)"></i>2 模糊</span>
      <span><i style="background:var(--good)"></i>3 记得</span>
      <span><i style="background:var(--easy)"></i>4 简单</span>
    </div>
    <div class="rm" id="rm" hidden>系统开启了“减少动态效果”，粒子默认不播放。<button class="pbtn" id="rmOn" type="button">仍然播放演示</button></div>
  </header>
  <main class="wrap" id="qs"></main>
</div>

<div class="tray" role="region" aria-label="当前选择">
  <div class="tray-in">
    <div class="chips" id="chips"></div>
    <span class="perf" id="perf">粒子 0</span>
    <button class="copy" id="copy" type="button">复制选择</button>
  </div>
</div>
<div class="veil" id="veil"></div>
<div class="reward" id="reward" role="status" aria-live="polite">
  <h3>本轮完成</h3>
  <div class="stats"><div><b>20</b>张卡</div><div><b>85%</b>记得率</div><div><b>+6</b>知识点点亮</div></div>
  <div class="cells" id="cells"></div>
  <small>距离考试目标又近了一格 · 马原 · 实践观</small>
</div>
<div class="toast" id="toast"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<script>
const Q = [
  {id:'style',n:'1/6',kind:'rate',title:'粒子长什么样',desc:'决定整套粒子的材质、颜色和混合方式。三个舞台里只有风格不同，去向和强度跟随你在第 2、3 题的选择。',note:'提示：在同一个舞台上连按“记得”5 次，能看到连击里程碑。',opts:[
    {v:'layered',t:'分层混合',rec:1,d:'日常评分用纸屑、墨点、金粉，安静温暖。连击 5/10/20 和整轮完成才升级成发光金粒子和光晕，情绪逐级走高。'},
    {v:'paper',t:'纸墨金粉',d:'全程只用宣纸碎片、墨滴晕染、金箔粉尘，和暖纸画布、记忆宫殿一个气质。最安静，里程碑也不发光。'},
    {v:'glow',t:'游戏光粒',d:'发光能量球、叠加混合、长拖尾，接近手游的打击感。最炫，和暖纸风格反差也最大。'}]},
  {id:'dest',n:'2/6',kind:'rate',title:'评分后粒子往哪去',desc:'看粒子是否飞向顶部进度条。飞入时落点会闪一下再 +1，每次评分都有“收集”的手感。',opts:[
    {v:'fly',t:'飞入进度',rec:1,d:'键帽爆开后，一部分粒子沿弧线飞进进度条，落点闪亮。四种评分都会飞，忘记和模糊飞得少、飞得暗。'},
    {v:'split',t:'按评分区分',d:'只有记得和简单的粒子飞进进度条。忘记和模糊只在原地轻轻反馈（墨滴下沉），不给遗忘做收集。'},
    {v:'burst',t:'原地爆散',d:'只在键帽上方爆开再消散，视线不离开卡片。进度条直接涨，最简单。'}]},
  {id:'power',n:'3/6',kind:'rate',title:'反馈要多强',desc:'三种强度的差别在连续评分时最明显。所有方案里忘记都不闪红、不扣分，连击中断只是悄悄归零。',opts:[
    {v:'ramp',t:'随评分和连击递增',rec:1,d:'忘记最轻，简单最重。连击越长粒子越多越亮，5/10/20 连击有一次里程碑爆发，但不遮挡卡片。'},

/* ---------- 评分舞台 ---------- */
const sel = (id) => document.querySelector(`input[name="${id}"]:checked`)?.value

function rate(stage, r) {

  if (cfg.power === 'ramp' && good) n *= 1 + Math.min(st.combo, 20) * 0.06

function layoutEdges(map) {
